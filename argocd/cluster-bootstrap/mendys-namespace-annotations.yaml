# Set fuzeinfra.io/owner-repo on mendys namespaces so grafana-crit-fix.yml
# routes error-log alerts to the owning repo (izzywdev/MendysRobotics) rather
# than falling back to izzywdev/FuzeInfra (issue #250).
#
# Applied idempotently by apply-cluster-config.yml (kubectl apply) on push to
# argocd/cluster-bootstrap/**. kubectl 3-way merge adds the annotation without
# disturbing other labels or annotations already on the namespace.
#
# Both namespaces are owned by MendysRobotics (mendys-prod = the main platform
# and marketplace; mendys-wp = the WordPress site). A single annotation covers
# both because crit-log routing targets the repo that can action the alert, and
# the MendysRobotics repo owns the on-call runbooks for both workloads.
---
apiVersion: v1
kind: Namespace
metadata:
  name: mendys-prod
  annotations:
    fuzeinfra.io/owner-repo: izzywdev/MendysRobotics
---
apiVersion: v1
kind: Namespace
metadata:
  name: mendys-wp
  annotations:
    fuzeinfra.io/owner-repo: izzywdev/MendysRobotics
