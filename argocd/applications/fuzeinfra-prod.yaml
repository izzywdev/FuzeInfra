# ArgoCD Application — Contabo production server (k3s)
# Applied by terraform/contabo/provisioning.tf during `terraform apply`.
# ArgoCD auto-syncs helm/fuzeinfra from the main branch whenever it changes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fuzeinfra-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: fuzeinfra
  source:
    repoURL: https://github.com/izzywdev/FuzeInfra.git
    targetRevision: main
    path: helm/fuzeinfra
    helm:
      # Pin the Helm release name to "fuzeinfra" (not the default app name
      # "fuzeinfra-prod"). The chart's selectorLabels now derive instance from
      # {{ .Release.Name }}; the LIVE StatefulSets carry instance=fuzeinfra (the
      # old hardcoded value) and that label is IMMUTABLE, so the release name MUST
      # render "fuzeinfra" to keep this a no-op. Verified: helm template with
      # release "fuzeinfra" is byte-identical to the previous output.
      releaseName: fuzeinfra
      valueFiles:
        - values-contabo.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: fuzeinfra
  # PROTECT AGAINST DATA LOSS (2026-07-24 incident): the live DB StatefulSets carry
  # volumeClaimTemplates.storageClassName=local-path (from global.storageClass) but
  # their PVCs were migrated to Longhorn. Without this, an Argo recreate of the STS
  # (immutable VCT) can drop a fresh blank local-path PVC + prune the Longhorn one,
  # destroying the DB data. Ignoring the VCT keeps Argo from ever touching storage.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Annotate the Argo-created `fuzeinfra` namespace so CRIT-log alerts from
    # infra services resolve to this repo explicitly (grafana-crit-fix.yml reads
    # fuzeinfra.io/owner-repo off the emitting namespace to pick the issue repo).
    managedNamespaceMetadata:
      annotations:
        fuzeinfra.io/owner-repo: izzywdev/FuzeInfra
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Makes ignoreDifferences apply to the SYNC, not just the diff. Without it
      # Argo hides .spec.volumeClaimTemplates from the diff (so the app reports
      # Synced) but STILL sends it in the server-side apply, and the API server
      # rejects every StatefulSet with:
      #   updates to statefulset spec for fields other than 'replicas',
      #   'ordinals', 'template', ... are forbidden
      # That failed the sync for all 10 stateful services (postgres, mongodb,
      # neo4j, kafka, elasticsearch, redis, rabbitmq, loki, alertmanager,
      # chromadb) and left the app permanently Degraded while claiming Synced.
      # volumeClaimTemplates is immutable, so changing a StatefulSet's
      # storageClass still requires recreating it deliberately.
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
