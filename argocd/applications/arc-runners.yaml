      # delete every runner set at once and take all repos' CI down. Flip to
      # true once a clean sync has been observed for all 8.
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
---
# -----------------------------------------------------------------------------
# fuzesdlc set  ->  workflows now target it with `runs-on: fuze-runner`
#
# Uniform-runner convention (FuzeSDLC governance/ci-runners.md): the job-matching
# key `runnerScaleSetName` is the family-wide constant `fuze-runner`, while the
# Helm `releaseName` (fuzesdlc) and `githubConfigUrl` (izzywdev/FuzeSDLC) stay
# repo-scoped — on a personal account each set is repo-scoped, so many sets can
# share the name `fuze-runner` without colliding. releaseName is left UNCHANGED so
# this is an in-place rename of the existing set, not a second set (no orphan, no
# added capacity pressure on the shared CI node).
#
# FuzeSDLC's consuming side is already flipped: .fuze/manifest.json declares
# `ci.runner: fuze-runner` and every workflow uses `runs-on: fuze-runner`. Until
# this rename lands the set was still registered as `fuzesdlc`, so every FuzeSDLC
# job queued forever behind idle runners — the exact "flip the manifest and the
# set rename together" hazard the doc describes.
# Priority: FuzeSDLC#115 (v1.8.0 baseline release) is blocked on this set.
#
# CORRECTION (2026-09-06), live-verified: the "no orphan" claim above was WRONG.
# The chart names the AutoscalingRunnerSet k8s object after `runnerScaleSetName`,
# not after the Helm releaseName — so changing runnerScaleSetName fuzesdlc ->
# fuze-runner made Argo render a NEW object named `fuze-runner` while the OLD
# object named `fuzesdlc` (runner-scale-set-id "1", created 2026-08-19) simply
# stopped being part of desired state. Because this Application's `prune` was
# `false` (see below), Argo never deleted it. Confirmed live via cluster-query:
#   kubectl -n arc-runners get autoscalingrunnersets
#     -> BOTH `fuzesdlc` and `fuze-runner` exist, both spec.githubConfigUrl
#        https://github.com/izzywdev/FuzeSDLC, both phase: Running
#   kubectl -n arc-systems get pods
#     -> BOTH `fuzesdlc-<hash>-listener` and `fuze-runner-<hash>-listener` are
#        1/1 Running right now — two live listeners polling GitHub for the same
#        repo, one of them (`fuzesdlc`) orphaned and unreferenced (no workflow
#        anywhere in the family uses `runs-on: fuzesdlc` any more — confirmed via
#        `gh search code`). Its pod spec is also stale: it predates the
#        2026-08-31 node-affinity fix (elastic-pool scheduling), so it still
#        carries the old single-value `nodeSelector: fuzeinfra.io/pool: ci`.
# This IS the "fuze-runner and fuzesdlc both map to FuzeSDLC" duplicate-mapping
# reported for this file — not two competing manifest declarations (there is
# only ever one Application here), but one un-pruned leftover from an in-place
# rename. Fix: flip `prune: true` for THIS Application only (scoped to this one
# block, not the fleet-wide default) so Argo removes the orphaned `fuzesdlc`
# object through its own finalizer-driven GitHub deregistration — the sanctioned
# ARC cleanup path — on next sync. Nothing currently depends on it, so this is
# not the disruptive half of this PR (see the `staging` block above for that).
# -----------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runners-fuzesdlc
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: arc-runners
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: fuzeinfra
  sources:
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: "0.14.2"
      helm:
        releaseName: fuzesdlc
        valueFiles:
          - $values/runners/arc/runner-scale-set-values.yaml
        parameters:
          - name: githubConfigUrl
            value: "https://github.com/izzywdev/FuzeSDLC"
          - name: runnerScaleSetName
            value: "fuze-runner"
          - name: maxRunners
            value: "5"
          - name: minRunners
            value: "0"
    - repoURL: https://github.com/izzywdev/FuzeInfra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  ignoreDifferences:
    - group: actions.github.com
      kind: EphemeralRunnerSet
      jsonPointers:
        - /spec/replicas
        - /spec/patchID
  syncPolicy:
    automated:
      selfHeal: true
      # prune TRUE here ONLY (every other Application in this file keeps prune:
      # false — this is a scoped, single-Application exception, not a fleet-wide
      # flip). Desired state for this Application is now exactly one rendered
      # AutoscalingRunnerSet named `fuze-runner`; the live orphaned `fuzesdlc`
      # object (see the audit comment above) is not in that render, so this
      # sync will prune it — the sanctioned, finalizer-driven ARC cleanup path
      # (GitHub deregistration + object deletion), not a manual kubectl delete.
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
---
