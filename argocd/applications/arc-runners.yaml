# =============================================================================
# ARC runner scale sets — GitOps
#
# WHY THIS EXISTS
# ---------------
# Scale sets are CLUSTER objects in the shared `arc-runners` namespace, NOT
# per-repo config. Previously each consumer repo ran its own `arc-register.yml`
# workflow, which imperatively `helm upgrade`d this cluster. With no single
# source of truth the live sets silently drifted from Git, and fixing them had
# to be done 8 times by hand against prod.
#
# Now every set is an Argo Application over ONE shared values file
# (runners/arc/runner-scale-set-values.yaml). Common settings — runner image,
# resources, node pinning, containerMode — are edited THERE ONCE and Argo rolls
# them to all sets. Only 4 per-set parameters differ below. Onboarding repo #21
# is a new block here, not a workflow run against prod.
#
# ⚠ BECAUSE Argo will now ACTUALLY apply that file, anything set in it reaches
# all 8 sets at once — read it in full before merging, not just this diff.
# In particular containerMode.dind is ON there, and it ONLY works alongside the
# explicit `command: ["/home/runner/run.sh"]` on the runner container. Enabling
# dind without that command leaves every runner registered-but-never-online with
# all jobs queued (measured 2026-07-27; fix verified on fuzepicker).
#
# PREREQUISITE (this is the bug that made the previous single Application a
# silent no-op since 2026-07-08):
#   The `fuzeinfra` AppProject must allow BOTH the arc-runners namespace and the
#   OCI chart repo, or Argo rejects these with InvalidSpecError and NEVER syncs.
#   See argocd/projects/fuzeinfra.yaml. Verify with:
#     kubectl -n argocd get application -l app.kubernetes.io/part-of=arc-runners
#   and check the SYNC column (add -o wide for detail).
#   `sync=Unknown` with an empty revision means the project still rejects it.
#
# WHY NOT AN ApplicationSet:
#   An ApplicationSet list-generator would remove the repetition below, but the
#   `applicationsets.argoproj.io` CRD is NOT installed on this cluster (the
#   argocd-applicationset-controller Deployment is running with nothing to
#   watch). Install that CRD and this file collapses to a single generator.
#
# WHY minRunners IS PASSED EXPLICITLY:
#   The chart does `gt .Values.minRunners .Values.maxRunners`. A helm --set
#   value is a different numeric type than one parsed from the values YAML, so
#   overriding ONLY maxRunners fails to render with
#   "error calling gt: incompatible types for comparison". Passing BOTH through
#   parameters keeps them the same type. Verified by helm template.
#
# The ARC *controller* is bootstrapped separately (runners/arc/install.sh);
# only the runner scale sets are managed here.
# =============================================================================
---
# -----------------------------------------------------------------------------
# staging  ->  workflows target it with `runs-on: staging`
#
# NAMING-DRIFT AUDIT (2026-09-06, FuzeInfra issue tracking this file's naming
# convention — see the fuzesdlc block below for the sibling finding):
#
# CONFIRMED: this set's githubConfigUrl is izzywdev/FuzeInfra, not a repo named
# "staging" — live-verified via cluster-query (`autoscalingrunnerset.actions.
# github.com/staging`, 1 current runner, spec.githubConfigUrl=FuzeInfra) and the
# listener pod `staging-<hash>-listener` in arc-systems. Every OTHER set in this
# file (20 of 21) is named after the repo it serves (fuzehub, fuzesales, ...),
# so "staging" is the one name here that does not identify its repo — exactly
# the convention violation flagged.
#
# WHY IT IS NAMED THIS AND WHY IT IS NOT A QUICK FIX: this is not a mistaken
# one-off — it is FuzeInfra's own dedicated, always-on CI pool, and the FIRST
# ARC runner this fleet ever created (commit cc6b693, "org-level ARC staging
# runner for izzywdev"), predating the per-repo-name convention entirely. It
# was later deliberately adopted as FuzeInfra's own CI pool name in issue #236
# / runners/arc/WORKFLOW-MIGRATION.md ("Migrating FuzeInfra workflows off
# ubuntu-latest -> self-hosted staging"). `runs-on: staging` is hardcoded today
# in ~35 FuzeInfra workflow files, including cluster-critical ones: deploy-prod,
# cluster-query, infra-request-handler, infra-request-apply-on-approve,
# argo-outofsync-autofix, helm-validate, governance-nightly, nightly-integration
# (full list: `git grep -l 'runs-on: staging' -- '*.yml'`). Renaming the
# `runnerScaleSetName` parameter here WITHOUT renaming every one of those
# `runs-on:` lines in the same merge queues every one of them forever the
# moment Argo syncs — exactly the hazard the fuzesdlc block below hit for a
# single repo; here the blast radius is FuzeInfra's own deploy/CI pipeline.
#
# TARGET NAME: FuzeSDLC's governance/ci-runners.md already establishes the
# family's target naming convention as the uniform constant `fuze-runner` (see
# the fuzesdlc block below, which has already migrated). Renaming `staging` to
# match its own repo name (`fuzeinfra`) would fix the immediate violation but
# create a second name that would just need renaming again once the rest of
# the fleet uniforms on `fuze-runner` — so `fuze-runner` is the recommended
# target, not `fuzeinfra`. On a personal account each set is repo-scoped by
# `githubConfigUrl`, so FuzeInfra's `fuze-runner` set cannot collide with
# FuzeSDLC's `fuze-runner` set even though the job-matching string is identical.
#
# NOT DONE HERE, ON PURPOSE: this session observed real queue congestion on
# this exact pool tonight (multiple dispatches queued for minutes before
# clearing). Cutting it over requires one atomic PR that changes this
# `runnerScaleSetName` parameter AND every `runs-on: staging` line across ~35
# workflow files in the SAME merge, during a coordinated low-traffic window —
# not a quiet single-file change under active load. See the tracking issue
# opened alongside this PR for the full file list and cutover checklist.
# -----------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runners-staging
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: arc-runners
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: fuzeinfra
  # Multi-source: OCI chart + git values file (ArgoCD >= 2.6). The $values ref
  # lets valueFiles reference the git source by alias.
  sources:
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: "0.14.2"
      helm:
        releaseName: staging
        valueFiles:
          - $values/runners/arc/runner-scale-set-values.yaml
        parameters:
          - name: githubConfigUrl
            value: "https://github.com/izzywdev/FuzeInfra"
          - name: runnerScaleSetName
            value: "staging"
          - name: maxRunners
            value: "5"
          - name: minRunners
            value: "0"
    - repoURL: https://github.com/izzywdev/FuzeInfra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  # Argo must not revert EphemeralRunnerSet replicas/patchID — the ARC listener
  # owns those and patches them at runtime. selfHeal reverting them makes the
  # listener loop forever without runners ever completing a job.
  ignoreDifferences:
    - group: actions.github.com
      kind: EphemeralRunnerSet
      jsonPointers:
        - /spec/replicas
        - /spec/patchID
  syncPolicy:
    automated:
      selfHeal: true
      # prune INTENTIONALLY false for the initial adoption: these sets already
      # exist as imperative `helm install` releases, and Argo adopts the live
      # objects via ServerSideApply. Pruning during that first reconcile could
      # delete every runner set at once and take all repos' CI down. Flip to
      # true once a clean sync has been observed for all 8.
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
---
