# -----------------------------------------------------------------------------
# fuzepicker  ->  workflows target it with `runs-on: fuzepicker`
# PARKED at 0 on purpose: the set stays defined and in sync but spawns no
# runners. Set to "3" to re-enable.
# -----------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
