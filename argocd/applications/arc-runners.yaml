    server: https://kubernetes.default.svc
    namespace: arc-runners
  ignoreDifferences:
    - group: actions.github.com
      kind: EphemeralRunnerSet
      jsonPointers:
        - /spec/replicas
        - /spec/patchID
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
