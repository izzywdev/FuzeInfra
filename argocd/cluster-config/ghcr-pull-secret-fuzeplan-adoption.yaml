# Adopt the pre-existing FuzePlan GHCR credential so the SealedSecret controller
# may replace it with the GitOps-managed credential.  Deliberately no data: this
# applies only controller ownership metadata and never stores a registry token.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: fuzeplan
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
