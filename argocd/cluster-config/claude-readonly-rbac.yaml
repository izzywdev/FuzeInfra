---
apiVersion: v1
kind: Namespace
metadata:
  name: claude-ops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-readonly
  namespace: claude-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-readonly
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - namespaces
      - services
      - endpoints
      - persistentvolumes
      - persistentvolumeclaims
      - events
      - componentstatuses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - statefulsets
      - replicasets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-readonly
subjects:
  - kind: ServiceAccount
    name: claude-readonly
    namespace: claude-ops
---
apiVersion: v1
kind: Secret
metadata:
  name: claude-readonly-token
  namespace: claude-ops
  annotations:
    kubernetes.io/service-account.name: claude-readonly
type: kubernetes.io/service-account-token
