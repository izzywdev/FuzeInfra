apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fuzeexecutive
  namespace: argocd
spec:
  description: FuzeExecutive product (consumer of FuzeInfra) — may deploy ONLY into its own namespace.
  sourceRepos:
    - https://github.com/izzywdev/FuzeExecutive.git
  destinations:
    - namespace: fuzeexecutive
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
