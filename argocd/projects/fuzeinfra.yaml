# Argo CD AppProject scoping FuzeInfra: which repo it may deploy from and where.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fuzeinfra
  namespace: argocd
spec:
  description: FuzeInfra shared infrastructure platform
  sourceRepos:
    - https://github.com/izzywdev/FuzeInfra.git
  destinations:
    - namespace: fuzeinfra
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    # The ARC self-heal watchdog (argocd/applications/arc-selfheal.yaml) manages
    # a CronJob + RBAC in the ARC controller's namespace. Without this entry Argo
    # rejects the Application with InvalidSpecError and never syncs it.
    # NOTE: `arc-runners` is deliberately NOT listed. arc-runners-staging is
    # currently InvalidSpec for exactly that reason; adding it would activate a
    # dormant prune+selfHeal Application against the live scale sets. That is a
    # separate, deliberate change — see runners/README.md.
    - namespace: arc-systems
      server: https://kubernetes.default.svc
  # The chart creates cluster-scoped objects (monitoring ClusterRole/Binding),
  # so cluster resources must be allowed for this project.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
