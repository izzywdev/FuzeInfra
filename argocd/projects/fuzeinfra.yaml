# Argo CD AppProject scoping FuzeInfra: which repo it may deploy from and where.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fuzeinfra
  namespace: argocd
spec:
  description: FuzeInfra shared infrastructure platform
  sourceRepos:
    - https://github.com/izzywdev/FuzeInfra.git
    # OCI Helm registry for the ARC runner scale-set chart. Required by the
    # arc-runner-scale-sets ApplicationSet (multi-source: OCI chart + git values).
    # Without this entry Argo rejects those Applications with
    #   InvalidSpecError: repo ... is not permitted in project 'fuzeinfra'
    - ghcr.io/actions/actions-runner-controller-charts
  destinations:
    - namespace: fuzeinfra
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    # ARC runner scale sets live here (controller watchSingleNamespace=arc-runners).
    # Without this entry Argo rejects them with
    #   InvalidSpecError: destination ... namespace 'arc-runners' do not match
    #   any of the allowed destinations in project 'fuzeinfra'
    - namespace: arc-runners
      server: https://kubernetes.default.svc
    # The ARC self-heal watchdog (argocd/applications/arc-selfheal.yaml) manages
    # a CronJob + RBAC in the ARC controller's namespace. Without this entry Argo
    # rejects that Application with InvalidSpecError and never syncs it.
    - namespace: arc-systems
      server: https://kubernetes.default.svc
    # The custom-hostname API manages a CONSUMER's Ingress, so the chart renders a
    # scoped Role + RoleBinding into that consumer's namespace (see
    # global.routeProfiles in values.yaml). Without this entry the whole
    # fuzeinfra-prod sync fails with
    #   Role/custom-hostname-api-ingress: namespace fuzefront is not permitted
    #   in project 'fuzeinfra'
    # which blocks EVERY other resource in the app, not just these two.
    - namespace: fuzefront
      server: https://kubernetes.default.svc
    # The chart applies a coredns-custom ConfigMap (CoreDNS customization) to
    # kube-system. Without this entry the whole fuzeinfra-prod sync fails with
    #   ConfigMap/coredns-custom: namespace kube-system is not permitted in
    #   project 'fuzeinfra'
    # which blocks EVERY other resource in the app (this froze all prod deploys,
    # FuzeInfra #668).
    - namespace: kube-system
      server: https://kubernetes.default.svc
  # The chart creates cluster-scoped objects (monitoring ClusterRole/Binding),
  # so cluster resources must be allowed for this project.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
