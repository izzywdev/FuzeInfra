apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fuzex
  namespace: argocd
spec:
  description: FuzeX product (consumer of FuzeInfra) — may deploy ONLY into its own namespace.
  sourceRepos:
    - https://github.com/izzywdev/FuzeX.git
  destinations:
    - namespace: fuzex
      server: https://kubernetes.default.svc
  # Namespace is the only cluster-scoped resource these workloads need
  # (CreateNamespace=true sync option). ClusterRole/ClusterRoleBinding/CRD
  # are blocked — consumers must not be able to modify cluster-level security.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
