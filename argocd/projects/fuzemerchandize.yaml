apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fuzemerchandize
  namespace: argocd
spec:
  description: FuzeMerchandize product (consumer of FuzeInfra) — may deploy ONLY into its own namespace.
  sourceRepos:
    - https://github.com/izzywdev/FuzeMerchandize.git
  destinations:
    - namespace: fuzemerchandize
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
