# Argo CD AppProject for the FuzeKeys consumer — OWNED BY FuzeInfra.
#
# ISOLATION BOUNDARY (FuzeInfra#99): consumer apps must NOT be able to deploy into
# FuzeInfra's own `fuzeinfra` namespace. A consumer that grants itself the
# `fuzeinfra` namespace can redeploy a *duplicate* FuzeInfra (split-brain
# Postgres/Kafka, control-plane saturation, cluster-wide 502 — see FuzeInfra#93 /
# FuzeFront#95). This project deliberately does NOT include `fuzeinfra`.
#
# GOVERNANCE RULE: FuzeInfra owns AppProjects (the destination/security boundary);
# consumers only create Applications WITHIN their assigned, restricted project.
# Consumers consume FuzeInfra services via in-cluster service DNS (cross-namespace
# networking) — that needs NO Argo destination into `fuzeinfra`.
#
# NOTE: FuzeKeys previously self-managed its AppProject (no FuzeInfra counterpart).
# This file closes that gap per the governance model. The consumer-side project.yaml
# should be removed from the FuzeKeys repo — it will be overwritten by
# argocd-register if not filtered (see .github/workflows/argocd-register.yml).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fuzekeys
  namespace: argocd
spec:
  description: FuzeKeys product (consumer of FuzeInfra) — may deploy ONLY into its own namespace.
  sourceRepos:
    - https://github.com/izzywdev/FuzeKeys.git
  destinations:
    # The product's workloads.
    - namespace: fuzekeys
      server: https://kubernetes.default.svc
    # The app-of-apps creates child Application objects here.
    - namespace: argocd
      server: https://kubernetes.default.svc
    # NOTE: `fuzeinfra` is deliberately NOT a destination — that is FuzeInfra's
    # namespace. A consumer that needs an infra service consumes it via DNS, it
    # does not deploy into it.
  # Namespace is the only cluster-scoped resource these workloads need
  # (CreateNamespace=true sync option). ClusterRole/ClusterRoleBinding/CRD
  # are blocked — consumers must not be able to modify cluster-level security.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
