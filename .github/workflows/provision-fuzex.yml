name: Provision FuzeX PostgreSQL

# Fixed consumer/namespace/role only. No credentials or command strings accepted
# as inputs, no cluster credentials, and no direct cluster writes.
on:
  workflow_dispatch:
  # The FuzeX consumer can request this fixed, input-free operation using its
  # existing Contents-scoped FUZEINFRA_DISPATCH_TOKEN.  This is deliberately a
  # named capability, not a generic workflow-dispatch relay: no caller payload
  # selects a workflow, ref, command, credential, database, or namespace.
  repository_dispatch:
    types: [provision-fuzex-postgres]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: provision-fuzex-postgres
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Check for existing provisioning
        id: state
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -f deploy/sealed-secrets/fuzex-db-credentials.yaml ]; then
            echo 'Provider ciphertext already exists; do not generate another password.'
            echo 'Use publish-sealed-handoff.yml id=fuzex-postgres to deliver or refresh it.'
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin provision/fuzex-postgres >/dev/null 2>&1; then
            echo 'The provisioning branch already exists; reuse its PR instead of rotating.'
            if [ "$(gh pr list --repo izzywdev/FuzeInfra --head provision/fuzex-postgres --state open --json number --jq 'length')" = 0 ]; then
              gh pr create --repo izzywdev/FuzeInfra --base main --head provision/fuzex-postgres \
                --title 'feat(postgres): provision FuzeX hosted workspace' \
                --body 'Recover the existing ciphertext-only FuzeX provisioning branch. After merge and successful Argo provisioning, dispatch publish-sealed-handoff.yml with id=fuzex-postgres. No new password is generated by this retry.'
            fi
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install sealing tools
        if: steps.state.outputs.exists == 'false'
        run: |
          set -euo pipefail
          version=0.27.1
          archive="kubeseal-${version}-linux-amd64.tar.gz"
          work=$(mktemp -d)
          trap 'rm -f "$work/$archive" "$work/checksums.txt" "$work/kubeseal"; rmdir "$work"' EXIT
          curl -fsSL "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${version}/${archive}" -o "$work/$archive"
          curl -fsSL "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${version}/sealed-secrets_${version}_checksums.txt" -o "$work/checksums.txt"
          (cd "$work" && grep " ${archive}$" checksums.txt | sha256sum -c -)
          tar -xzf "$work/$archive" -C "$work" kubeseal
          sudo install -m0755 "$work/kubeseal" /usr/local/bin/kubeseal
          python3 -m pip install 'PyYAML==6.0.2'

      - name: Seal provider input and enable its allocation
        if: steps.state.outputs.exists == 'false'
        run: |
          set -euo pipefail
          umask 077
          password_file=$(mktemp)
          trap 'rm -f "$password_file"' EXIT
          openssl rand -hex 32 | tr -d '\n' > "$password_file"
          bash scripts/seal-secret.sh fuzeinfra/fuzex-db-credentials \
            "password=@$password_file" --out deploy/sealed-secrets/fuzex-db-credentials.yaml
          python3 scripts/enable-fuzex-provisioning.py

      - name: Open provisioning PR
        if: steps.state.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name 'FuzeInfra Provisioning'
          git config user.email 'provisioning@fuzeinfra'
          git checkout -b provision/fuzex-postgres
          git add deploy/sealed-secrets/fuzex-db-credentials.yaml \
            helm/fuzeinfra/values-contabo.yaml governance/credential-handoff.json
          git commit -m 'feat(postgres): provision FuzeX hosted workspace'
          git push origin provision/fuzex-postgres
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          printf '%s\n\n' \
            'Provisions fuzex_design_frames with its database-owner role fuzex_svc via the existing Argo PostSync Job. The password was generated and sealed inside this run; this PR contains ciphertext only.' \
            'The provider SealedSecret, database allocation and fuzex-postgres handoff are enabled together. No direct cluster mutation occurs in this workflow.' \
            'After merge and successful provisioning, dispatch publish-sealed-handoff.yml with id=fuzex-postgres. Merge its FuzeX PR, then dispatch verify-consumer-credentials.yml with id=fuzex-postgres before enabling the lifecycle tier.' > "$body"
          gh pr create --repo izzywdev/FuzeInfra --base main --head provision/fuzex-postgres \
            --title 'feat(postgres): provision FuzeX hosted workspace' --body-file "$body"
