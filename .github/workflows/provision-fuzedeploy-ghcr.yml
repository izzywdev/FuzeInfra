name: Provision FuzeDeploy GHCR pull secret

# Bootstrap the ghcr-pull imagePullSecret for the fuzedeploy namespace so
# FuzeDeploy pods can pull ghcr.io/izzywdev/* images. Resolves the ghcr-pull half
# of FuzeInfra issue #719 (the fuzedeploy-secrets DB/Mongo/Redis/JWT/GitHub-App
# credential remains operator-only and is out of scope for this workflow).
#
# The workflow copies the approved registry credential that already exists in the
# fuzefront namespace, seals it for the strict scope fuzedeploy/ghcr-pull-secret,
# and commits the ciphertext to argocd/cluster-config/ (applied to the cluster
# by the apply-cluster-config workflow on merge to main).
#
# After this runs and the PR merges, dispatch apply-cluster-config to push the
# sealed secret to the cluster without waiting for a commit to cluster-config.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: provision-fuzedeploy-ghcr
  cancel-in-progress: false

jobs:
  provision:
    runs-on: staging
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Install kubeseal
        run: |
          set -euo pipefail
          version=0.27.1
          curl -fsSL -o /tmp/kubeseal.tgz \
            "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${version}/kubeseal-${version}-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeseal.tgz -C /tmp kubeseal
          sudo install -m0755 /tmp/kubeseal /usr/local/bin/kubeseal

      - name: Configure cluster access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          test -n "$KUBE_CONFIG" || { echo '::error::KUBE_CONFIG is required'; exit 1; }
          kubeconfig=$(mktemp)
          printf '%s' "$KUBE_CONFIG" | base64 -d > "$kubeconfig"
          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      - name: Seal ghcr-pull credential for fuzedeploy namespace
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$GH_TOKEN" || { echo '::error::GH_TOKEN is required'; exit 1; }

          work=$(mktemp -d)
          trap 'rm -rf "$work" "${KUBECONFIG:-}"' EXIT

          # Copy the approved registry credential from the fuzefront namespace —
          # the same izzywdev org credential already in use there.
          dockerconfig_b64=$(kubectl -n fuzefront get secret ghcr-pull \
            -o jsonpath='{.data.\.dockerconfigjson}')
          test -n "$dockerconfig_b64" || {
            echo '::error::ghcr-pull secret not found in fuzefront namespace'
            exit 1
          }
          printf '%s' "$dockerconfig_b64" | base64 -d > "$work/dockerconfigjson"
          unset dockerconfig_b64

          # Seal for strict scope: fuzedeploy/ghcr-pull-secret (the name the
          # FuzeDeploy values reference in imagePullSecrets).
          kubectl create secret generic ghcr-pull-secret -n fuzedeploy \
            --type=kubernetes.io/dockerconfigjson \
            --from-file=".dockerconfigjson=$work/dockerconfigjson" \
            --dry-run=client -o yaml \
            | kubeseal --scope strict --format yaml \
                --cert deploy/sealed-secrets/sealing-cert.pem \
            > argocd/cluster-config/ghcr-pull-secret-fuzedeploy.yaml

          run_id="${{ github.run_id }}"
          branch="provision/fuzedeploy-ghcr-$run_id"
          git config --local --unset-all http.https://github.com/.extraheader || true
          gh auth setup-git
          git config user.name 'FuzeInfra Provisioning'
          git config user.email 'provisioning@fuzeinfra'
          git checkout -b "$branch"
          git add argocd/cluster-config/ghcr-pull-secret-fuzedeploy.yaml
          git commit -m "feat(fuzedeploy): add ghcr-pull SealedSecret for fuzedeploy namespace (#719)"
          git push origin "$branch"
          pr_body="Adds the strict namespace/name-scoped ciphertext for the FuzeDeploy GHCR pull credential (fuzedeploy/ghcr-pull-secret). Sourced from the existing fuzefront/ghcr-pull secret — same org, same images. After merge, dispatch apply-cluster-config. Resolves the ghcr-pull half of #719 (fuzedeploy-secrets still needs operator-held plaintext). No plaintext secret material."
          gh pr create \
            --repo izzywdev/FuzeInfra \
            --base main \
            --head "$branch" \
            --title "feat(fuzedeploy): add ghcr-pull SealedSecret for fuzedeploy namespace" \
            --body "$pr_body"
