name: Hand-off coverage

# Every portal product must have a token delivery path.
#
# Catches the defect found on 2026-08-20: seven repos read the
# fuzefront-registration Secret with NO entry in governance/credential-handoff.json.
# Six already had a sealed manifest committed, hand-sealed once, so they LOOKED
# provisioned -- but a hand-seal works exactly once, and with no registry entry
# nothing can re-seal it. When the token rotated they all went stale at once and
# started failing with a credential that is present and wrong (fuzemarket:
# HTTP 401 {"error":"Invalid token."}).
#
# Runs on PRs that touch the registry or the check, and nightly -- because the gap
# does not open when the registry changes, it opens when a NEW REPO is onboarded
# and nobody adds an entry. A PR-only trigger would never see that.

on:
  pull_request:
    paths:
      - 'governance/credential-handoff.json'
      - 'scripts/check_handoff_coverage.py'
      - 'scripts/__tests__/test_check_handoff_coverage.py'
      - '.github/workflows/gate-handoff-coverage.yml'
  schedule:
    - cron: '41 6 * * *'   # off-peak, off the :00 herd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Every portal product has a delivery path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }

      # SELF-TEST FIRST, mirroring gate-identifier. Asserts the check FAILS on a
      # gap, not merely that it passes on a clean registry. A gate observed only
      # passing proves nothing -- and this one guards a defect whose entire
      # signature was that absence produced no failure.
      - name: Self-test (the check must detect a gap)
        run: python -m unittest discover -s scripts/__tests__ -p 'test_check_handoff_coverage*.py' -v

      - name: Check coverage
        env:
          # Needs to read .fuze/manifest.json from every consumer repo, most of
          # which are private. The built-in GITHUB_TOKEN is scoped to THIS repo and
          # would report a clean scan by seeing nothing -- the exact failure mode
          # fixed in #603, where "Repository not found" meant "wrong token", not
          # "no such repo". GH_TOKEN is the cross-repo token used in 49 places here.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=handoff-coverage::GH_TOKEN is not set. A repo-scoped token cannot read consumer manifests and would report a false all-clear." >&2
            exit 1
          fi
          python scripts/check_handoff_coverage.py --org izzywdev
