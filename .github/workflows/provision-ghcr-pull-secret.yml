name: Provision GHCR pull secret

# Generic, reusable provisioner for a consumer namespace's GHCR imagePullSecret.
#
# WHY THIS REPLACES THE PER-NAMESPACE COPIES
# ------------------------------------------
# This supersedes provision-fuzedeploy-ghcr.yml / provision-fuzeexecutive-ghcr.yml
# / provision-fuzeplan-ghcr.yml, which were three near-identical files that all
# hard-coded the same source:
#
#     kubectl -n fuzefront get secret ghcr-pull
#
# That source is BROKEN. `fuzefront/ghcr-pull` is a dockerconfigjson whose
# `auths` map is EMPTY (`{"auths":{}}`). It is not SealedSecret-owned (no
# ownerReferences), i.e. it was hand-created and later emptied, and nothing
# noticed — fuzefront's own images (fuzefront-backend, fuzefront-frontend,
# fuzeagent-ui, fuzequality-backend, fuze-mcp-gateway) are PUBLIC packages, so
# they keep pulling anonymously and the namespace looks healthy.
#
# The three provisioners faithfully copied that empty credential into consumer
# namespaces. A kubelet handed a dockerconfigjson with no `ghcr.io` entry does
# not error — it silently falls back to ANONYMOUS auth, which is why every
# affected pod reported:
#
#     failed to fetch anonymous token: ... 401 Unauthorized
#
# even though the namespace visibly had a correctly-typed `ghcr-pull-secret`
# with the right `.dockerconfigjson` key and the Deployment referenced it. The
# secret existed, was well-formed, and was worthless. That is the failure mode
# this workflow exists to make impossible.
#
# THE GUARD IS THE POINT
# ----------------------
# The `Validate source credential` step below refuses to seal anything whose
# `auths` map lacks a usable `ghcr.io` entry. Sealing is destructive-by-commit:
# a bad ciphertext merges, Argo applies it, and the namespace is left with a
# secret that LOOKS provisioned. Failing loudly in CI is the only place this is
# cheap to catch.
#
# SOURCE OF TRUTH
# ---------------
# `source_namespace`/`source_secret` default to fuzeplan/ghcr-pull, which is
# verified-good: fuzeplan pulls the PRIVATE package ghcr.io/izzywdev/fuzeplan-backend
# and its pods are Running, so that credential provably authenticates against
# private izzywdev GHCR packages. (mendys-prod/ghcr-pull-secret is an equally
# valid fallback — it pulls the private ghcr.io/izzywdev/mendysrobotics/backend.)
# Do NOT point this back at fuzefront until that secret is repaired.
#
# NO PLAINTEXT LEAVES THE RUNNER: the credential is read from the cluster and
# piped straight into kubeseal on the same runner. It is never logged, never an
# output, and only ciphertext is committed.
#
# After the PR this opens is merged, dispatch `apply-cluster-config` to push the
# sealed secret to the cluster.

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Target consumer namespace (e.g. fuzedeploy, fuzebi, fuzemarket)'
        required: true
        type: string
      secret_name:
        description: 'Name of the imagePullSecret the consumer chart references'
        required: true
        default: 'ghcr-pull-secret'
        type: string
      source_namespace:
        description: 'Namespace holding the known-good registry credential'
        required: true
        default: 'fuzeplan'
        type: string
      source_secret:
        description: 'Name of the known-good registry credential'
        required: true
        default: 'ghcr-pull'
        type: string

permissions:
  contents: read

concurrency:
  group: provision-ghcr-pull-secret-${{ inputs.namespace }}
  cancel-in-progress: false

jobs:
  provision:
    runs-on: staging
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Install kubeseal
        run: |
          set -euo pipefail
          version=0.27.1
          curl -fsSL -o /tmp/kubeseal.tgz \
            "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${version}/kubeseal-${version}-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeseal.tgz -C /tmp kubeseal
          sudo install -m0755 /tmp/kubeseal /usr/local/bin/kubeseal

      - name: Configure cluster access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          test -n "$KUBE_CONFIG" || { echo '::error::KUBE_CONFIG is required'; exit 1; }
          kubeconfig=$(mktemp)
          printf '%s' "$KUBE_CONFIG" | base64 -d > "$kubeconfig"
          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      - name: Validate inputs
        env:
          NS: ${{ inputs.namespace }}
          SECRET_NAME: ${{ inputs.secret_name }}
        run: |
          set -euo pipefail
          # Namespace/name land in a file path and a k8s object name; keep them
          # to the RFC1123 label charset so neither can be smuggled.
          for v in "$NS" "$SECRET_NAME"; do
            printf '%s' "$v" | grep -Eq '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$' || {
              echo "::error::invalid RFC1123 name: $v"; exit 1; }
          done
          kubectl get namespace "$NS" >/dev/null || {
            echo "::error::namespace $NS does not exist on the cluster"; exit 1; }

      - name: Seal registry credential for target namespace
        env:
          NS: ${{ inputs.namespace }}
          SECRET_NAME: ${{ inputs.secret_name }}
          SRC_NS: ${{ inputs.source_namespace }}
          SRC_SECRET: ${{ inputs.source_secret }}
        run: |
          set -euo pipefail
          umask 077

          work=$(mktemp -d)
          trap 'rm -rf "$work" "${KUBECONFIG:-}"' EXIT

          dockerconfig_b64=$(kubectl -n "$SRC_NS" get secret "$SRC_SECRET" \
            -o jsonpath='{.data.\.dockerconfigjson}')
          test -n "$dockerconfig_b64" || {
            echo "::error::$SRC_NS/$SRC_SECRET has no .dockerconfigjson key"
            exit 1
          }
          printf '%s' "$dockerconfig_b64" | base64 -d > "$work/dockerconfigjson"
          unset dockerconfig_b64

          # ---- THE GUARD -------------------------------------------------
          # Refuse to seal a credential that cannot authenticate to ghcr.io.
          # This is exactly what silently shipped an empty credential into the
          # fuzeexecutive namespace. jq only ever reports SHAPE here (key
          # presence / counts) — no credential material is printed.
          hosts=$(jq -r '.auths // {} | keys | length' "$work/dockerconfigjson")
          if [ "$hosts" -eq 0 ]; then
            echo "::error::$SRC_NS/$SRC_SECRET has an EMPTY auths map — refusing to seal a credential that would silently fall back to anonymous pulls. Repair the source secret first."
            exit 1
          fi
          if ! jq -e '.auths | has("ghcr.io")' "$work/dockerconfigjson" >/dev/null; then
            echo "::error::$SRC_NS/$SRC_SECRET has no ghcr.io entry (hosts present: $hosts) — refusing to seal."
            exit 1
          fi
          # A ghcr.io entry is only usable if it actually carries a token: either
          # `auth` (base64 user:token) or a username+password pair.
          if ! jq -e '.auths["ghcr.io"] | ((.auth // "") != "") or (((.username // "") != "") and ((.password // "") != ""))' \
                "$work/dockerconfigjson" >/dev/null; then
            echo "::error::$SRC_NS/$SRC_SECRET ghcr.io entry carries no auth/username+password — refusing to seal."
            exit 1
          fi
          echo "source credential OK: ghcr.io entry present and non-empty"
          # ----------------------------------------------------------------

          out="argocd/cluster-config/ghcr-pull-secret-${NS}.yaml"
          kubectl create secret generic "$SECRET_NAME" -n "$NS" \
            --type=kubernetes.io/dockerconfigjson \
            --from-file=".dockerconfigjson=$work/dockerconfigjson" \
            --dry-run=client -o yaml \
            | kubeseal --scope strict --format yaml \
                --cert deploy/sealed-secrets/sealing-cert.pem \
            > "$out"

          # Sanity-check the ciphertext actually rendered a SealedSecret for the
          # scope we asked for, so a kubeseal failure can't commit an empty file.
          grep -q 'kind: SealedSecret' "$out" || { echo '::error::kubeseal produced no SealedSecret'; exit 1; }
          grep -q "namespace: ${NS}" "$out" || { echo '::error::sealed for the wrong namespace'; exit 1; }
          echo "OUT_FILE=$out" >> "$GITHUB_ENV"

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NS: ${{ inputs.namespace }}
          SECRET_NAME: ${{ inputs.secret_name }}
          SRC_NS: ${{ inputs.source_namespace }}
          SRC_SECRET: ${{ inputs.source_secret }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo '::error::GH_TOKEN is required'; exit 1; }

          branch="provision/${NS}-ghcr-${{ github.run_id }}"
          git config --local --unset-all http.https://github.com/.extraheader || true
          gh auth setup-git
          git config user.name 'FuzeInfra Provisioning'
          git config user.email 'provisioning@fuzeinfra'
          git checkout -b "$branch"
          git add "$OUT_FILE"
          git commit -m "feat(${NS}): seal ghcr pull credential for ${NS}/${SECRET_NAME}"
          git push origin "$branch"
          gh pr create \
            --repo izzywdev/FuzeInfra \
            --base main \
            --head "$branch" \
            --title "feat(${NS}): seal GHCR pull credential for ${NS}/${SECRET_NAME}" \
            --body "Strict namespace/name-scoped ciphertext for \`${NS}/${SECRET_NAME}\`, sourced from the verified-good \`${SRC_NS}/${SRC_SECRET}\` credential (validated non-empty \`auths[\"ghcr.io\"]\` before sealing). After merge, dispatch \`apply-cluster-config\`. No plaintext secret material."
