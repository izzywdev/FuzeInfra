# fuze:managed template=provision-sync.yml baseline=main digest=sha256:813f59d209d1dacc01ad833f0309cebadba3cefb8f37becd574bce3a1d431e56
name: Sync Managed Agents on merge

# Per-repo caller (stamped by sdlc-bootstrap, ONLY for repos that declare `roles` in
# .fuze/manifest.json). Reconciles agent-definition changes into their DEPLOYED
# counterparts (agents + environments + vaults + memory + coordinators) on every merge to
# main that touches a definition, for each provider the fleet is deployed to. Idempotent:
# providers/provision.py only updates a resource when its config actually changed.
#
# Editing a persona (.claude/agents/*.md) changes the agent `system` -> re-synced.
# Editing a role.json (tools/policies/mcp/env) -> re-synced. Adding a role -> created.
# Removals are NOT pruned (archiving an orphaned agent is a separate, deliberate step).
#
# Calls the LOCAL provision.yml (also stamped by the bootstrapper) rather than a cross-repo
# reusable: a `uses:` into a PRIVATE FuzeSDLC fails to RESOLVE unless the hub's Actions
# access setting allows it, and that failure reds the whole run. Local = no such coupling.
#
# Requires MANAGED_AGENTS_API_KEY (Console key with the managed-agents beta) + the MCP
# URLs the role manifests reference. Absent key -> the reusable workflow SKIPS (no fail).

on:
  push:
    branches: [main]
    paths:
      - "agent-templates/roles/**"
      - "agent-templates/environments/**"
      - "agent-templates/vaults/**"
      - "agent-templates/memory/**"
      - "agent-templates/coordinator/**"
      - "agent-templates/providers/**"
      - "agent-templates/sync/**"
      - ".claude/agents/**"

permissions:
  contents: read

jobs:
  sync:
    strategy:
      fail-fast: false
      matrix:
        # Providers the agents are deployed to. Add "openai"/"hermes" once their
        # providers/<name>/adapter.py is implemented (stubs today).
        provider: [anthropic]
    uses: ./.github/workflows/provision.yml
    secrets: inherit
    with:
      provider: ${{ matrix.provider }}
      dry_run: false
