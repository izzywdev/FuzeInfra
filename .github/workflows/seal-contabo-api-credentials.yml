# =============================================================================
# seal-contabo-api-credentials — produce the fuzeinfra/contabo-api-credentials
# SealedSecret from the Contabo API creds ALREADY in GitHub Actions secrets,
# with no plaintext anywhere outside the runner.
#
# The API floating-VIP keepalived DaemonSet (helm/fuzeinfra/templates/
# api-vip-keepalived.yaml) needs the Contabo API creds in-cluster to reassign a
# VIP on failover. Those same four creds already exist as repo secrets (the
# cluster-autoscaler + contabo-check-failover-ip.yml use them). This workflow
# reads them, adds a freshly-generated VRRP shared secret (KEEPALIVED_AUTH_PASS),
# seals everything OFFLINE against the committed public cert via scripts/
# seal-secret.sh (encrypt-only; only the in-cluster controller can decrypt), and
# opens a PR with the ciphertext. The plaintext is written only to shredded temp
# files on the runner and is NEVER printed, logged, or committed.
#
# After merge, Argo's fuzeinfra-sealed-secrets app syncs the SealedSecret ->
# Secret `contabo-api-credentials` that the DaemonSet reads. Run this BEFORE
# flipping apiVip.enabled. Re-running rotates KEEPALIVED_AUTH_PASS (harmless; the
# checksum annotation rolls the pods).
# =============================================================================
name: seal-contabo-api-credentials

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: seal-contabo-api-credentials
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kubeseal
        run: |
          set -euo pipefail
          VER="0.27.1"
          curl -fsSL -o /tmp/ks.tgz \
            "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${VER}/kubeseal-${VER}-linux-amd64.tar.gz"
          tar -xzf /tmp/ks.tgz -C /tmp kubeseal
          sudo install -m0755 /tmp/kubeseal /usr/local/bin/kubeseal
          kubeseal --version

      - name: Seal contabo-api-credentials (offline; plaintext never leaves the runner)
        env:
          CONTABO_CLIENT_ID: ${{ secrets.CONTABO_CLIENT_ID }}
          CONTABO_CLIENT_SECRET: ${{ secrets.CONTABO_CLIENT_SECRET }}
          CONTABO_API_USER: ${{ secrets.CONTABO_API_USER }}
          CONTABO_API_PASSWORD: ${{ secrets.CONTABO_API_PASSWORD }}
          # seal-secret.sh fetches this (falls back to the committed cert if the
          # CF-Access-gated URL is unreachable from CI).
          FUZEINFRA_SEALED_CERT_URL: https://sealed-secrets.prod.fuzefront.com/v1/cert.pem
        run: |
          set -euo pipefail
          for v in CONTABO_CLIENT_ID CONTABO_CLIENT_SECRET CONTABO_API_USER CONTABO_API_PASSWORD; do
            if [ -z "${!v:-}" ]; then echo "::error::secret $v is unset"; exit 1; fi
          done
          umask 077
          d="$(mktemp -d)"
          # Values go to files (never argv — argv is visible to other processes).
          printf '%s' "$CONTABO_CLIENT_ID"     > "$d/cid"
          printf '%s' "$CONTABO_CLIENT_SECRET" > "$d/csec"
          printf '%s' "$CONTABO_API_USER"      > "$d/cuser"
          printf '%s' "$CONTABO_API_PASSWORD"  > "$d/cpass"
          # VRRP shared secret: fresh, alphanumeric, 8 chars (keepalived truncates
          # auth_pass to 8). Same value for all nodes; only authenticates peers.
          openssl rand -hex 4 > "$d/vrrp"
          bash scripts/seal-secret.sh fuzeinfra/contabo-api-credentials \
            CONTABO_CLIENT_ID=@"$d/cid" \
            CONTABO_CLIENT_SECRET=@"$d/csec" \
            CONTABO_API_USER=@"$d/cuser" \
            CONTABO_API_PASSWORD=@"$d/cpass" \
            KEEPALIVED_AUTH_PASS=@"$d/vrrp" \
            --out deploy/sealed-secrets/contabo-api-credentials.yaml
          shred -u "$d"/* 2>/dev/null || rm -f "$d"/*
          rmdir "$d" || true
          # Sanity: the output is ciphertext only (no plaintext leaked).
          if grep -qiE "$(printf '%s' "$CONTABO_CLIENT_ID" | head -c 6)" deploy/sealed-secrets/contabo-api-credentials.yaml; then
            echo "::error::plaintext detected in sealed output — refusing to commit"; exit 1
          fi
          echo "sealed deploy/sealed-secrets/contabo-api-credentials.yaml"

      - name: Open PR with the sealed manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- deploy/sealed-secrets/contabo-api-credentials.yaml; then
            echo "no change to the sealed manifest; nothing to do"; exit 0
          fi
          BR="chore/seal-contabo-api-credentials-${GITHUB_RUN_ID}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add deploy/sealed-secrets/contabo-api-credentials.yaml
          git commit -m "chore(secrets): seal contabo-api-credentials for the API VIP keepalived DaemonSet"
          git push -u origin "$BR"
          gh pr create --fill --base main --head "$BR" \
            --title "chore(secrets): seal contabo-api-credentials (API VIP keepalived)" \
            --body "Sealed \`fuzeinfra/contabo-api-credentials\` (Contabo API creds from repo secrets + a fresh KEEPALIVED_AUTH_PASS), produced offline by seal-contabo-api-credentials.yml. Ciphertext only; Argo's fuzeinfra-sealed-secrets app syncs it into the Secret the API-VIP DaemonSet reads. Merge before flipping apiVip.enabled."
