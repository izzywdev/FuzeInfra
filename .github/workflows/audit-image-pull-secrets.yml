name: audit-image-pull-secrets

# Fleet-wide audit for the three ways an imagePullSecret silently fails.
#
# All three were live in prod simultaneously and held ~22 pods in
# ImagePullBackOff across eight namespaces, because none of them surfaces as a
# config error — the manifests all render, Argo reports Synced, and only the
# kubelet knows:
#
#   1. DANGLING  — a Deployment references an imagePullSecret that does not
#      exist in its namespace. (fuzedeploy referenced `ghcr-pull`; the namespace
#      had no dockerconfigjson secret at all.)
#
#   2. EMPTY AUTHS — the secret EXISTS, is `kubernetes.io/dockerconfigjson`,
#      has the `.dockerconfigjson` key, is owned by a SealedSecret... and its
#      `auths` map is `{}`. The kubelet does not error on this; it falls back to
#      ANONYMOUS auth and reports `failed to fetch anonymous token: 401`, which
#      reads like a credential problem rather than an absent credential.
#      (fuzeexecutive and fuzefront were both in this state.)
#
#   3. NAME MISMATCH — the sealed secret is provisioned under one name and the
#      chart references another (`ghcr-pull` vs `ghcr-pull-secret`), so the
#      credential is present in the namespace but never consulted.
#
# Checks 1-3 are PREDICTIVE: they infer breakage from the SHAPE of the config.
# Shape-clean config can still be red, and on 2026-09-07 it was — 10 pods in
# ImagePullBackOff while all three checks reported clean:
#
#   4. STALE CREDENTIAL — the secret exists, is dockerconfigjson-typed, and its
#      `auths["ghcr.io"].auth` is non-empty, so check 2 prints "ok". The
#      registry still answers 403 Forbidden, because the token behind that
#      credential was revoked / never had read:packages for that specific
#      private package. (`fuzesocial/ghcr-pull`, hand-created 2026-07-05 and
#      never re-provisioned, 403s on `fuzesocial-ui` — a tag that provably
#      exists in GHCR — while every other namespace carries a different,
#      working credential.) No amount of shape inspection can see this; only
#      the registry's answer can.
#
#   5. UNPUSHED TAG — nothing is wrong with the credential at all. The values
#      file pins a tag the release pipeline never built, and the pull fails
#      `not found` / `manifest unknown`. This is a release problem wearing an
#      auth problem's clothes, and it is by far the most common of the five
#      (8 of the 10 pods on 2026-09-07). Reporting it as "image pull failing"
#      sends an operator to rotate a credential that was never broken.
#
# So the last step below stops inferring and reads the GROUND TRUTH: every pod
# actually stuck in ImagePullBackOff/ErrImagePull, with the kubelet's own
# message classified into the category that determines the fix —
# MANIFEST-MISSING (bump/push the tag) vs REGISTRY-AUTH (re-provision the
# secret) vs RATE-LIMIT (Docker Hub anonymous limits) vs NETWORK (node egress).
#
# Read-only. Never prints credential material — only key presence and counts.
# Kubelet pull messages carry image refs and registry status codes, never
# tokens.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: audit-image-pull-secrets
  cancel-in-progress: true

jobs:
  audit:
    runs-on: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Configure cluster access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          test -n "$KUBE_CONFIG" || { echo '::error::KUBE_CONFIG is required'; exit 1; }
          kubeconfig=$(mktemp)
          printf '%s' "$KUBE_CONFIG" | base64 -d > "$kubeconfig"
          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      - name: Audit
        run: |
          set -euo pipefail
          fail=0

          # --- 2. empty / malformed dockerconfigjson secrets ---------------
          echo "== registry credentials with an unusable auths map =="
          while read -r ns name; do
            [ -z "$ns" ] && continue
            cfg=$(kubectl -n "$ns" get secret "$name" -o jsonpath='{.data.\.dockerconfigjson}' 2>/dev/null || true)
            if [ -z "$cfg" ]; then
              echo "::error::$ns/$name is dockerconfigjson-typed but has no .dockerconfigjson key"
              fail=1; continue
            fi
            # Shape only. Never echo the decoded document.
            usable=$(printf '%s' "$cfg" | base64 -d \
              | jq -r '(.auths // {}) as $a
                       | if ($a | keys | length) == 0 then "EMPTY"
                         elif ($a | has("ghcr.io") | not) then "NO_GHCR"
                         elif ($a["ghcr.io"] | ((.auth // "") != "") or (((.username // "") != "") and ((.password // "") != ""))) then "OK"
                         else "NO_TOKEN" end' 2>/dev/null || echo "UNPARSEABLE")
            if [ "$usable" != "OK" ]; then
              echo "::error::$ns/$name is unusable for ghcr.io ($usable) — pods will silently fall back to anonymous pulls"
              fail=1
            else
              echo "ok  $ns/$name"
            fi
          done < <(kubectl get secrets -A \
                     -o jsonpath='{range .items[?(@.type=="kubernetes.io/dockerconfigjson")]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}')

          # --- 1 + 3. dangling references from workloads -------------------
          echo "== imagePullSecrets referenced by a workload but absent from its namespace =="
          while read -r ns kind wl secret; do
            [ -z "$ns" ] && continue
            if ! kubectl -n "$ns" get secret "$secret" >/dev/null 2>&1; then
              echo "::error::$ns $kind/$wl references imagePullSecret '$secret' which does not exist in $ns"
              fail=1
            fi
          done < <(kubectl get deploy,statefulset,daemonset -A -o json \
                    | jq -r '.items[]
                             | . as $i
                             | ($i.spec.template.spec.imagePullSecrets // [])[]
                             | "\($i.metadata.namespace) \($i.kind) \($i.metadata.name) \(.name)"')

          # --- 4 + 5. ground truth: pods the kubelet cannot pull -----------
          # The checks above are inferences from config shape. This one asks the
          # cluster what is actually broken, and classifies the kubelet's own
          # message, because the four categories have completely different
          # fixes and are trivially confused with one another.
          echo "== pods stuck in ImagePullBackOff / ErrImagePull =="
          kubectl get pods -A -o json \
            | jq -r '
                .items[]
                | . as $p
                | (($p.status.containerStatuses // []) + ($p.status.initContainerStatuses // []))[]
                | select(.state.waiting.reason // "" | test("ImagePullBackOff|ErrImagePull|InvalidImageName"))
                | { ns: $p.metadata.namespace,
                    pod: $p.metadata.name,
                    ctr: .name,
                    image: .image,
                    secrets: (($p.spec.imagePullSecrets // []) | map(.name) | join(",") | if . == "" then "<none>" else . end),
                    msg: (.state.waiting.message // "") }
                | .category =
                    (if   (.msg | test("toomanyrequests|rate ?limit"; "i"))                       then "RATE-LIMIT"
                     elif (.msg | test("dial tcp|i/o timeout|no such host|connection refused"; "i")) then "NETWORK"
                     elif (.msg | test("unauthorized|denied|forbidden|401|403"; "i"))             then "REGISTRY-AUTH"
                     elif (.msg | test("not found|manifest unknown|404"; "i"))                    then "MANIFEST-MISSING"
                     else "UNCLASSIFIED" end)
                | "\(.category)\t\(.ns)\t\(.pod)\t\(.ctr)\t\(.image)\t\(.secrets)"' \
            | sort -u > /tmp/pull-failures.tsv || true

          if [ -s /tmp/pull-failures.tsv ]; then
            while IFS=$'\t' read -r category ns pod ctr image secrets; do
              case "$category" in
                MANIFEST-MISSING)
                  hint="tag was never pushed — fix the release/tag-bump in the OWNING repo's values, not the pull secret" ;;
                REGISTRY-AUTH)
                  hint="registry rejected the credential — re-provision via provision-ghcr-pull-secret.yml (namespace=$ns, secret_name=$secrets)" ;;
                RATE-LIMIT)
                  hint="registry rate limit — the pull is anonymous; authenticate it" ;;
                NETWORK)
                  hint="node egress to the registry, not the registry itself" ;;
                *)
                  hint="unrecognised pull error — read the pod's message before acting" ;;
              esac
              echo "::error::[$category] $ns/$pod ($ctr) image=$image pullSecrets=$secrets — $hint"
              fail=1
            done < /tmp/pull-failures.tsv
            echo "-- category counts --"
            cut -f1 /tmp/pull-failures.tsv | sort | uniq -c
          else
            echo "no pods in ImagePullBackOff"
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::image pull secret audit FAILED — see errors above"
            exit 1
          fi
          echo "image pull secret audit clean"
