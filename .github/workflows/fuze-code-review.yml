# fuze:managed template=fuze-code-review.yml baseline=v1 digest=sha256:9f0e847af6a7d09ea93d145948b029da76e2def5d8f4d7ad6f0e2585e2a33b53
name: Fuze Code Review

# THE CANONICAL LLM CODE REVIEW + APPROVAL GATE — now a MANDATORY approve-or-fail check.
#
# WHY THIS EXISTS. Every consuming repo's branch-protection ruleset sets BOTH
# `required_approving_review_count: 1` AND `require_last_push_approval: true`
# (governance/ruleset.json). A bot-authored PR can never satisfy that on its own —
# there is no human in the loop by default — so agent PRs across the fleet sit
# permanently at `mergeable_state: blocked`. The owner's explicit decision is to
# KEEP the review gate (never drop the required-review count to 0) and have CI
# satisfy it instead: GitHub Actions may already approve PRs on this org
# (`can_approve_pull_request_reviews` — verify per-repo with
# `gh api repos/izzywdev/<REPO>/actions/permissions/workflow`).
#
# THE OWNER'S MANDATE (verbatim intent): "fuze-code-review becomes a mandatory check
# UNLESS the failure is a credit outage. If it ran, the conclusion must be APPROVED or
# the CI fails and stops, and fuze-ci-autofix must be triggered in a LOOP with
# code-review until the PR is approved." This workflow implements the approve-or-fail
# half; fuze-ci-autofix.yml implements the bounded loop half.
#
# THIS IS NOT A NEW REVIEW PROMPT. It wraps the SAME review criteria as the
# long-standing `gate-code-review` job in harden-gate.yml (correctness/security
# bugs only; ignore style, naming, tests, perf) and the SAME multi-provider
# fallover chain as every other LLM-driven workflow in this fleet
# (./.github/actions/fuze-code-action — LiteLLM-in-cluster-or-direct-Anthropic,
# then OpenAI, then Gemini, on a classified AVAILABILITY failure only, never on a
# real task failure).
#
# TWO JOBS, ON PURPOSE. The review MACHINERY (a `continue-on-error` LLM step so a
# provider failure can be CLASSIFIED rather than red the job, and `|| true` on the
# diff-gathering that must not abort on an empty diff) lives in a SEPARATE `review`
# job that is deliberately NOT the required context. The DECISIVE job — named
# "Fuze Code Review", the one status context branch protection requires — carries no
# vacuity marker at all: it runs the verdict script and submits the review, and its
# exit code genuinely propagates. That separation is what lets this be honestly
# `can_fail: true` under gate-required-checks C5 (a required job whose body carried a
# `continue-on-error` / `|| true` could not make that claim) while keeping the
# machinery those markers exist for. The verdict itself is decided by
# scripts/fuze_code_review_verdict.py (+ its unit/mutation tests).
#
# THE APPROVE-OR-FAIL CONTRACT (scripts/fuze_code_review_verdict.py `decide()`):
#   PASS — a clean model `approve`; a model `approve` DOWNGRADED to a comment on a
#          PR that touches CI/governance (the check keys on the MODEL verdict, not on
#          which gh command ran — keying it on the downgrade would deadlock every
#          governance PR); a self-modification-guard DEFERRAL; a credit/quota
#          AVAILABILITY OUTAGE (the owner's exception); or an environmental SKIP (no
#          credential / no reviewable diff).
#   FAIL — `request_changes`; a model `comment` verdict on a non-sensitive PR (not an
#          approval — this is what triggers the bounded auto-fix loop); or a genuine
#          ABSTAIN (unparseable / self-contradictory output, or a non-success
#          conclusion that is neither an availability outage nor the deferral).
#          Unparseable is NOT clean; a genuine abstain does NOT trigger a code
#          auto-fix — there is nothing to fix — it blocks and comments for a human.
#
# THE CREDIT-OUTAGE EXCEPTION distinguishes a vendor outage from a real failure using
# fuze-code-action's `availability` output (derived from classify.sh's exit code), NOT
# `conclusion` alone — a task failure and an exhaustion BOTH report conclusion=failure.
# An outage PASSES, so fuze-ci-autofix never fires on it.
#
# SAFETY PROPERTIES PRESERVED VERBATIM from the pre-mandatory version:
#   - `gh pr review --approve` fires ONLY on a schema-valid, self-consistent
#     `"verdict": "approve"` with EMPTY findings on a non-sensitive PR.
#   - A PR touching `.github/workflows/**`, `.github/actions/**`,
#     `workflow-templates/**`, `governance/**`, `scripts/apply_ruleset.sh`, or
#     `scripts/bootstrap/**` is downgraded to a comment-only review even on an
#     otherwise clean verdict — a self-approving change to the approval machinery
#     deserves a human. Enforced against the actual `git diff --name-only` file list,
#     never against anything the model claims about its own diff.
#   - The reviewer LLM is given NO Bash/Write/Edit tools; the diff is embedded in the
#     prompt, so an instruction smuggled inside the diff has no tool to act on.
#   - The verdict contract's sentinel markers carry a per-run random NONCE, drawn
#     AFTER the diff is fixed on disk — a forged sentinel block cannot guess it.
#   - Secrets are never echoed: only fuze-code-action's masked outputs and the model's
#     own (untrusted) response text reach a log line, and neither carries a credential.
#
# WHEN NONE OF LITELLM_FUZE_KEY / ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY
# is configured this workflow SKIPS (check PASSES) — a missing credential is
# environmental, not a defect in the PR under review.
#
# SCOPE: PRs come from branches in THIS repo (agents push claude/**, fuze/** etc.);
# it triggers on `pull_request`, NEVER `pull_request_target` — a fork PR gets a
# read-only GITHUB_TOKEN under plain `pull_request`, so `gh pr review --approve` would
# simply fail there. That is the fail-closed direction.
#
# RUNNER: `runs-on: ubuntu-latest` is the canonical default; the installer re-renders
# it to the repo's declared `ci.runner` (governance/ci-runners.md), exactly like every
# other STAMPED template. FuzeSDLC's own copy additionally routes both jobs through a
# hosted-default `pick-runner` budget-fallback chooser (harden-gate.yml's pattern) so
# this REQUIRED context satisfies the `available` property on a private, budget-
# constrained repo without hardcoding a self-hosted pool (governance/required-checks.md
# §2.2). That chooser is a per-repo adaptation, not shipped in this template, for the
# same reason harden-gate keeps it out of its own template: a `pick-runner` that falls
# back to `fuze-runner` would queue forever on a consumer that has no such pool.

on:
  pull_request:
    # ready_for_review is NOT optional: a bot-opened PR starts as a draft (GitHub
    # does not start workflow runs from GITHUB_TOKEN's own `opened` event), so
    # `opened` never fires for it — only `ready_for_review`, once a human or
    # fuze-auto-pr.yml marks it ready. Same reasoning as harden-gate.yml.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write   # claude-code-action OIDC path — parity with every other fuze-code-action caller

concurrency:
  group: fuze-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The review MACHINERY. Deliberately NOT the required status context: it carries the
  # `continue-on-error` LLM step and the `|| true` diff-gathering that the decisive job
  # below must not, so that job can honestly be `can_fail: true`. Its result is handed
  # to the decisive job via job outputs.
  review:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.context.outputs.ready }}
      reason: ${{ steps.context.outputs.reason }}
      nonce: ${{ steps.prompt.outputs.nonce }}
      sensitive_files: ${{ steps.context.outputs.sensitive_files }}
      conclusion: ${{ steps.review.outputs.conclusion }}
      result-text: ${{ steps.review.outputs.result-text }}
      mode: ${{ steps.review.outputs.mode }}
      vendor: ${{ steps.review.outputs.vendor }}
      availability: ${{ steps.review.outputs.availability }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Gather PR context — diff, changed files, sensitive-path check, credential check
        id: context
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HAS_LITELLM: ${{ secrets.LITELLM_FUZE_KEY != '' }}
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          set -uo pipefail
          git fetch origin "$BASE_REF" --depth=1

          git diff --name-only "origin/$BASE_REF"...HEAD > /tmp/changed_files.txt 2>/dev/null || true

          # Diff to a temp file first: piping straight into `head` makes git die of
          # SIGPIPE (exit 141) when head closes the stream early — the same fix
          # already applied in the gate-code-review job this wraps.
          git diff "origin/$BASE_REF"...HEAD -- ':!*.lock' ':!package-lock.json' \
            > /tmp/fulldiff.txt 2>/dev/null || true
          DIFF=$(head -c 80000 /tmp/fulldiff.txt)

          # The approval machinery and the org governance surface. Matched against
          # the ACTUAL changed-file list — never against anything an LLM claims —
          # because this feeds the self-approval defense in the verdict script.
          SENSITIVE_PATTERN='^(\.github/workflows/|\.github/actions/|workflow-templates/|governance/|scripts/apply_ruleset\.sh$|scripts/bootstrap/)'
          SENSITIVE=$(grep -E "$SENSITIVE_PATTERN" /tmp/changed_files.txt || true)

          READY=true
          REASON=""
          if [ -z "$DIFF" ]; then
            READY=false
            REASON="no reviewable diff (only excluded lockfiles changed, or no changes)"
          elif [ "${HAS_LITELLM:-false}" != "true" ] && [ "${HAS_ANTHROPIC:-false}" != "true" ] \
               && [ "${HAS_OPENAI:-false}" != "true" ] && [ "${HAS_GEMINI:-false}" != "true" ]; then
            READY=false
            REASON="no LLM credential configured (need one of LITELLM_FUZE_KEY, ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY) -- skipping, not failing: this is environmental, not a defect in the PR"
          fi

          # Per-run nonce for the GITHUB_OUTPUT heredoc delimiters below. The diff and
          # changed-file list are attacker-controlled (a PR can put any line in its own
          # diff), so a FIXED delimiter is guessable: a diff containing a bare
          # `FUZE_DIFF_EOF` line could close the heredoc early and inject/override later
          # outputs — including `sensitive_files`, which feeds the self-approval defense in
          # scripts/fuze_code_review_verdict.py. The `prompt` step below already nonces its
          # delimiter for exactly this reason; do the same here so both heredocs use an
          # unguessable, per-run terminator (GitHub's own recommended mitigation).
          NONCE=$(python3 -c 'import secrets; print(secrets.token_hex(16))')

          {
            echo "ready=${READY}"
            echo "reason=${REASON}"
            echo "any_sensitive=$([ -n "$SENSITIVE" ] && echo true || echo false)"
            echo "sensitive_files<<FUZE_SENSITIVE_EOF_${NONCE}"
            echo "$SENSITIVE"
            echo "FUZE_SENSITIVE_EOF_${NONCE}"
            echo "diff<<FUZE_DIFF_EOF_${NONCE}"
            echo "$DIFF"
            echo "FUZE_DIFF_EOF_${NONCE}"
          } >> "$GITHUB_OUTPUT"

      - name: Not reviewing this run
        if: steps.context.outputs.ready != 'true'
        env:
          REASON: ${{ steps.context.outputs.reason }}
        run: echo "::notice title=fuze-code-review::skipping -- ${REASON}"

      - name: Build review prompt (verdict contract with per-run nonce)
        id: prompt
        if: steps.context.outputs.ready == 'true'
        env:
          DIFF: ${{ steps.context.outputs.diff }}
          SENSITIVE_FILES: ${{ steps.context.outputs.sensitive_files }}
        run: |
          set -uo pipefail
          NONCE=$(python3 -c 'import secrets; print(secrets.token_hex(16))')
          echo "nonce=${NONCE}" >> "$GITHUB_OUTPUT"

          PROMPT_FILE="${RUNNER_TEMP}/fuze-code-review-prompt.txt"
          {
            echo "You are an automated code reviewer for a pull request that is otherwise ready to merge."
            echo "Review the diff below for BLOCKING issues only: wrong conditions, null/undefined"
            echo "derefs, missing awaits, off-by-one errors, swallowed errors, injection / secret-leakage"
            echo "/ auth-bypass security bugs, and clear logic bugs that would break the feature. Ignore"
            echo "style, naming, test coverage, and performance -- those are never blocking here."
            echo
            echo "Respond with a short prose summary (1-3 sentences), then on its own lines this exact"
            echo "sentinel-delimited JSON block and NOTHING ELSE after it -- no markdown code fence, no"
            echo "trailing commentary:"
            echo
            echo "===FUZE_REVIEW_VERDICT_JSON:${NONCE}==="
            echo '{"verdict": "approve|request_changes|comment", "summary": "<one-line summary>", "findings": [{"path": "...", "line": <int-or-null>, "description": "..."}]}'
            echo "===END_FUZE_REVIEW_VERDICT_JSON:${NONCE}==="
            echo
            echo 'Rules for the JSON, followed exactly:'
            echo '- "approve" is allowed ONLY when findings is an empty array -- no blocking issues found.'
            echo '- "request_changes" when you found one or more blocking issues -- list every one in findings.'
            echo '- "comment" when you have non-blocking observations, or are not confident enough to approve.'
            echo "- Valid, single-line JSON. Use exactly this nonce in both sentinel lines: ${NONCE}"
            echo '- verdict=approve must always carry findings as an empty array, never omitted.'
            if [ -n "${SENSITIVE_FILES:-}" ]; then
              echo
              echo 'NOTE: this PR touches CI/governance files. Say so explicitly in your summary. Your'
              echo 'verdict here will NOT auto-merge this class of change regardless of outcome -- a human'
              echo 'reviews it -- but your assessment of the change itself is still wanted.'
            fi
            echo
            echo '<diff>'
            printf '%s\n' "$DIFF"
            echo '</diff>'
          } > "$PROMPT_FILE"

          {
            echo "text<<FUZE_PROMPT_EOF_${NONCE}"
            cat "$PROMPT_FILE"
            echo "FUZE_PROMPT_EOF_${NONCE}"
          } >> "$GITHUB_OUTPUT"

      # NO Bash/Write/Edit tools. The entire diff is already embedded in the
      # prompt above, so the reviewer never needs to touch the checkout -- and an
      # instruction smuggled inside the diff has no tool available to act on it.
      # Read/Grep/Glob are harmless here: they can only look, at a checkout that
      # is already fully visible in the diff text.
      #
      # continue-on-error is why this step lives in the NON-required `review` job: the
      # decisive job below must classify a provider failure (availability vs task), and a
      # failed review that red this step would abort before the verdict script runs. It is
      # not vacuity — the DECISIVE step's exit code, in the required job below, genuinely
      # propagates.
      - name: Run automated review
        id: review
        if: steps.context.outputs.ready == 'true'
        continue-on-error: true
        uses: ./.github/actions/fuze-code-action
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          litellm-key: ${{ secrets.LITELLM_FUZE_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # fuze:secret-sourcing CLAUDE_CODE_OAUTH_TOKEN=fleet — distributed by provision-llm-vendor-keys.yml (optional, skipped-by-name when unset); tracked separately from the provision-secrets.yml SRC_ block that FLEET_SOURCED mirrors
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          claude-args: '--allowedTools "Read,Grep,Glob"'
          task-prompt: ${{ steps.prompt.outputs.text }}

  # THE REQUIRED STATUS CONTEXT. `name:` is what GitHub reports and what
  # governance/required-checks.json lists — do NOT change it without updating that
  # policy in lockstep, or the required context stops being emitted and every PR
  # deadlocks at "Expected — waiting for status to be reported" (gate-required-checks C1).
  #
  # `if: always()` so the required context ALWAYS reports even if the `review` job
  # failed — otherwise a crashed review job would skip this one and the required check
  # would never report. A failed/incomplete review reaches the verdict script as an
  # empty `ready` and fails CLOSED (abstain), which is the correct direction.
  #
  # This job's body carries NO vacuity marker: the verdict + submit steps propagate
  # their exit code genuinely, which is what lets governance/required-checks.json claim
  # `can_fail: true` for it honestly (gate-required-checks C5).
  fuze-code-review:
    name: Fuze Code Review
    needs: [review]
    if: always() && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Decide verdict (approve / request_changes / comment / outage / abstain / skip)
        id: verdict
        env:
          FUZE_ACTION_CONCLUSION: ${{ needs.review.outputs.conclusion }}
          FUZE_RESULT_TEXT: ${{ needs.review.outputs.result-text }}
          FUZE_VERDICT_NONCE: ${{ needs.review.outputs.nonce }}
          FUZE_ACTION_MODE: ${{ needs.review.outputs.mode }}
          FUZE_ACTION_VENDOR: ${{ needs.review.outputs.vendor }}
          FUZE_ACTION_AVAILABILITY: ${{ needs.review.outputs.availability }}
          FUZE_REVIEW_READY: ${{ needs.review.outputs.ready }}
          FUZE_SENSITIVE_FILES: ${{ needs.review.outputs.sensitive_files }}
        run: python3 scripts/fuze_code_review_verdict.py

      - name: Submit GitHub review (approve-or-fail; outage/skip pass, non-approve fails)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DECISION: ${{ steps.verdict.outputs.decision }}
          CHECK: ${{ steps.verdict.outputs.check }}
          BODY: ${{ steps.verdict.outputs.body }}
        run: |
          set -uo pipefail
          BODY_FILE="${RUNNER_TEMP}/fuze-code-review-body.md"
          printf '%s\n' "$BODY" > "$BODY_FILE"

          case "$DECISION" in
            approve)
              gh pr review "$PR_NUMBER" --approve --body-file "$BODY_FILE"
              ;;
            request_changes)
              gh pr review "$PR_NUMBER" --request-changes --body-file "$BODY_FILE"
              ;;
            comment)
              gh pr review "$PR_NUMBER" --comment --body-file "$BODY_FILE"
              ;;
            outage)
              gh pr comment "$PR_NUMBER" --body-file "$BODY_FILE"
              ;;
            skip)
              echo "::notice title=fuze-code-review::not reviewed this run (see the review job) -- passing, this is environmental."
              ;;
            abstain)
              gh pr comment "$PR_NUMBER" --body-file "$BODY_FILE"
              ;;
            *)
              echo "::error title=fuze-code-review::unrecognized decision '${DECISION}' from fuze_code_review_verdict.py. Failing closed."
              gh pr comment "$PR_NUMBER" --body-file "$BODY_FILE"
              exit 1
              ;;
          esac

          # THE DECISIVE LINE. `check` is the approve-or-fail verdict from the script
          # (pass|fail). A non-approve conclusion fails the required check and stops the
          # merge; fuze-ci-autofix.yml then runs the bounded review<->fix loop. This exit
          # code genuinely propagates: the decisive step carries no exit-masking shortcut,
          # which is what lets required-checks.json claim can_fail:true honestly (gate C5).
          if [ "$CHECK" = "fail" ]; then
            echo "::error title=fuze-code-review::this run is NOT an approval (decision=${DECISION}). The required check fails and stops; fuze-ci-autofix will attempt a bounded fix loop until the review approves."
            exit 1
          fi
          echo "::notice title=fuze-code-review::check passed (decision=${DECISION})."
