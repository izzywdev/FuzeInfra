# =============================================================================
# argo-outofsync-autofix
# =============================================================================
# Fired by ArgoCD Notifications (argocd-notifications-cm) via repository_dispatch
# when any prod ArgoCD app is UNHEALTHY — OutOfSync, Degraded (ImagePullBackOff /
# CrashLoop), or Unknown (ComparisonError, i.e. manifests won't render). Does
# BOTH halves of the alert:
#   1. Telegram 🔴 with a link to the Argo app (so you can review).
#   2. An auto-fix run — ALWAYS via the canonical `@fuze` mechanism, for VENDOR
#      INDEPENDENCE. This workflow does NOT invoke any single-vendor CLI directly;
#      it opens an idempotent `@fuze` issue in the OWNING repo and lets that repo's
#      `@fuze` handler diagnose + fix through fuze-code-action's multi-provider
#      cascade:
#        - app sourced from THIS repo (FuzeInfra) -> the @fuze issue lands here and
#          is answered by the CLUSTER-CAPABLE handler (fuze-cluster.yml), which holds
#          the prod kubeconfig + kubectl/helm/terraform + destructive-op guard shims
#          and reconciles the chart via a PR (auto-merge -> Argo re-syncs).
#        - app sourced from a CONSUMER repo (e.g. MendysRobotics) -> the @fuze issue
#          lands in the OWNING repo, answered by its unprivileged handler (fuze.yml).
#          FuzeInfra never edits a consumer's chart — that's the delegation boundary.
#      Either way the LLM call runs inside the @fuze handler, never here.
#
# Dedup: concurrency per app, plus one open issue per app per audience. A NEW
# failing revision on an app that already has an open issue is posted as a
# COMMENT on it; the same revision/state is posted once (an HTML marker). The
# earlier design exited silently whenever any matching issue was open — and
# matched `"$APP in:title"`, so an open `fuzefront-sealed` issue also silenced
# `fuzefront`. FuzeFront then failed every sync for six days with no new signal
# (#1278). The Telegram alert is never suppressed: triggers are already oncePer
# a revision or state, so each one is new information.
#
# Content and routing live in scripts/argo_alert.py (tested in
# tests/test_argo_alert.py). The payload reaches it ONLY through an env var —
# never `${{ }}` inside a run: script, which previously let any `'` in an Argo
# message break the step and let a crafted dispatch run shell on this runner.
#
# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
#          GH_TOKEN (PAT owned by a repo OWNER/MEMBER/COLLABORATOR — REQUIRED so the
#          opened issue passes the @fuze handler's trusted-author gate; the default
#          GITHUB_TOKEN authors as a bot and would NOT trigger the handler).
# =============================================================================
name: argo-outofsync-autofix

on:
  repository_dispatch:
    types: [argo-out-of-sync]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: argo-autofix-${{ github.event.client_payload.app }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: staging
    timeout-minutes: 120
    outputs:
      owner_repo: ${{ steps.route.outputs.owner_repo }}
      is_self: ${{ steps.route.outputs.is_self }}
    steps:
      # SECURITY: app is sender-controlled (the dispatch payload). Validate it to
      # a strict k8s-name charset before it reaches an agent holding cluster creds.
      - name: Validate app name
        env:
          APP: ${{ github.event.client_payload.app }}
        run: |
          if ! printf '%s' "$APP" | grep -qE '^[a-z0-9][a-z0-9-]{0,62}$'; then
            echo "::error::Rejected app name: '$APP'"; exit 1
          fi
      # Derive the owning repo (owner/name) from the app's source repoURL so we
      # can route the fix. Validate it too (also sender-controlled).
      - name: Route to owning repo
        id: route
        env:
          REPO_URL: ${{ github.event.client_payload.repo }}
        run: |
          # strip scheme, trailing .git, keep owner/name
          slug=$(printf '%s' "$REPO_URL" | sed -E 's#^https?://[^/]+/##; s#\.git$##')
          if ! printf '%s' "$slug" | grep -qE '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "::warning::Unrecognized repo '$REPO_URL' — defaulting to self"; slug="${{ github.repository }}"
          fi
          echo "owner_repo=$slug" >> "$GITHUB_OUTPUT"
          if [ "$slug" = "${{ github.repository }}" ]; then echo "is_self=true"; else echo "is_self=false"; fi >> "$GITHUB_OUTPUT"

  notify:
    needs: preflight
    runs-on: staging
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: scripts/argo_alert.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: '3.12' }
      - name: Telegram 🔴 alert
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          OWNER_REPO: ${{ needs.preflight.outputs.owner_repo }}
        run: |
          [ -z "$TOKEN" ] && { echo "::warning::TELEGRAM_BOT_TOKEN unset — skipping alert"; exit 0; }
          TEXT=$(python3 scripts/argo_alert.py telegram --owner-repo "$OWNER_REPO")
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=${TEXT}" \
            --data "disable_web_page_preview=true" >/dev/null && echo "telegram sent" || echo "::warning::telegram send failed"

  # ---- Delegate to the OWNING repo's @fuze handler (self OR consumer) --------
  # One path for both: an `@fuze` issue in owner_repo. For a FuzeInfra-owned app
  # owner_repo is this repo, and the cluster-capable handler (fuze-cluster.yml)
  # answers it with prod kubeconfig + kubectl/helm/terraform and reconciles the
  # chart via a PR. For a consumer app it lands in their repo. The LLM
  # diagnosis/fix happens inside that handler (fuze-code-action's multi-provider
  # cascade) — never a single-vendor CLI here.
  #
  # An AppProject denial on a CONSUMER app is ALSO raised here, in FuzeInfra: the
  # project boundary is FuzeInfra's policy (#99, #629) and the consumer cannot fix
  # it by widening its project — argocd-register rejects that.
  delegate:
    needs: preflight
    runs-on: staging
    timeout-minutes: 120
    env:
      PAYLOAD: ${{ toJSON(github.event.client_payload) }}
      OWNER_REPO: ${{ needs.preflight.outputs.owner_repo }}
      IS_SELF: ${{ needs.preflight.outputs.is_self }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: scripts/argo_alert.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: '3.12' }
      - name: Open or update the @fuze issue
        env:
          # PAT REQUIRED: the opened issue must be authored by a trusted
          # OWNER/MEMBER/COLLABORATOR for the @fuze handler's author gate to fire.
          # The default GITHUB_TOKEN authors as a bot and would silently not trigger.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && { echo "::warning::GH_TOKEN unset — cannot open @fuze issue for $OWNER_REPO"; exit 0; }
          alert() { python3 scripts/argo_alert.py "$@"; }
          MARKER=$(alert marker)

          # post <repo> <audience>: comment on the open issue for this app and
          # audience if there is one (unless this exact state was already posted),
          # otherwise open one. Matching is by exact title prefix.
          post() {
            repo=$1; audience=$2
            prefix=$(alert title-prefix --audience "$audience")
            body=$(alert body --audience "$audience" --owner-repo "$OWNER_REPO" --is-self "$IS_SELF")
            num=$(PREFIX="$prefix" gh issue list --repo "$repo" --state open --label argo-autofix \
                    --limit 200 --json number,title \
                    --jq '[.[] | select(.title | startswith(env.PREFIX))][0].number // empty')
            if [ -n "$num" ]; then
              seen=$(gh issue view "$num" --repo "$repo" --json body,comments \
                       --jq '([.body] + [.comments[].body]) | join("\n")')
              if printf '%s' "$seen" | grep -qF -- "$MARKER"; then
                echo "$repo#$num already carries this state — nothing to add"
              else
                gh issue comment "$num" --repo "$repo" --body "$body"
                echo "commented on $repo#$num"
              fi
            else
              gh label create argo-autofix --repo "$repo" --color B60205 --description "ArgoCD self-heal" 2>/dev/null || true
              gh issue create --repo "$repo" --label argo-autofix \
                --title "$(alert title --audience "$audience")" --body "$body"
            fi
          }

          post "$OWNER_REPO" owner
          if [ "$(alert classify)" = project-permission ] && [ "$IS_SELF" != true ]; then
            post "${{ github.repository }}" boundary
          fi
