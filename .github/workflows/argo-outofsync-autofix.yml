# =============================================================================
# argo-outofsync-autofix
# =============================================================================
# Fired by ArgoCD Notifications (argocd-notifications-cm) via repository_dispatch
# when any prod ArgoCD app is UNHEALTHY — OutOfSync, Degraded (ImagePullBackOff /
# CrashLoop), or Unknown (ComparisonError, i.e. manifests won't render). Does
# BOTH halves of the alert:
#   1. Telegram 🔴 with a link to the Argo app (so you can review).
#   2. An auto-fix run — ALWAYS via the canonical `@fuze` mechanism, for VENDOR
#      INDEPENDENCE. This workflow does NOT invoke any single-vendor CLI directly;
#      it opens an idempotent `@fuze` issue in the OWNING repo and lets that repo's
#      `@fuze` handler diagnose + fix through fuze-code-action's multi-provider
#      cascade:
#        - app sourced from THIS repo (FuzeInfra) -> the @fuze issue lands here and
#          is answered by the CLUSTER-CAPABLE handler (fuze-cluster.yml), which holds
#          the prod kubeconfig + kubectl/helm/terraform + destructive-op guard shims
#          and reconciles the chart via a PR (auto-merge -> Argo re-syncs).
#        - app sourced from a CONSUMER repo (e.g. MendysRobotics) -> the @fuze issue
#          lands in the OWNING repo, answered by its unprivileged handler (fuze.yml).
#          FuzeInfra never edits a consumer's chart — that's the delegation boundary.
#      Either way the LLM call runs inside the @fuze handler, never here.
#
# Dedup: concurrency per app + a preflight that exits if an argo-autofix PR/issue
# is already open for the app (a trigger can fire repeatedly).
#
# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID,
#          GH_TOKEN (PAT owned by a repo OWNER/MEMBER/COLLABORATOR — REQUIRED so the
#          opened issue passes the @fuze handler's trusted-author gate; the default
#          GITHUB_TOKEN authors as a bot and would NOT trigger the handler).
# =============================================================================
name: argo-outofsync-autofix

on:
  repository_dispatch:
    types: [argo-out-of-sync]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: argo-autofix-${{ github.event.client_payload.app }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: staging
    timeout-minutes: 120
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      owner_repo: ${{ steps.route.outputs.owner_repo }}
      is_self: ${{ steps.route.outputs.is_self }}
    steps:
      # SECURITY: app is sender-controlled (the dispatch payload). Validate it to
      # a strict k8s-name charset before it reaches an agent holding cluster creds.
      - name: Validate app name
        env:
          APP: ${{ github.event.client_payload.app }}
        run: |
          if ! printf '%s' "$APP" | grep -qE '^[a-z0-9][a-z0-9-]{0,62}$'; then
            echo "::error::Rejected app name: '$APP'"; exit 1
          fi
      # Derive the owning repo (owner/name) from the app's source repoURL so we
      # can route the fix. Validate it too (also sender-controlled).
      - name: Route to owning repo
        id: route
        env:
          REPO_URL: ${{ github.event.client_payload.repo }}
        run: |
          # strip scheme, trailing .git, keep owner/name
          slug=$(printf '%s' "$REPO_URL" | sed -E 's#^https?://[^/]+/##; s#\.git$##')
          if ! printf '%s' "$slug" | grep -qE '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "::warning::Unrecognized repo '$REPO_URL' — defaulting to self"; slug="${{ github.repository }}"
          fi
          echo "owner_repo=$slug" >> "$GITHUB_OUTPUT"
          if [ "$slug" = "${{ github.repository }}" ]; then echo "is_self=true"; else echo "is_self=false"; fi >> "$GITHUB_OUTPUT"
      - name: Skip if an argo-autofix PR/issue is already open for this app
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP: ${{ github.event.client_payload.app }}
        run: |
          open=$(gh pr list --repo "${{ github.repository }}" --state open --label argo-autofix --search "$APP in:title" --json number --jq 'length' 2>/dev/null || echo 0)
          iss=$(gh issue list --repo "${{ github.repository }}" --state open --label argo-autofix --search "$APP in:title" --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "${open:-0}" -gt 0 ] || [ "${iss:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  notify:
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: staging
    timeout-minutes: 120
    steps:
      - name: Telegram 🔴 alert
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP: ${{ github.event.client_payload.app }}
          SYNC: ${{ github.event.client_payload.sync }}
          HEALTH: ${{ github.event.client_payload.health }}
          OWNER_REPO: ${{ needs.preflight.outputs.owner_repo }}
        run: |
          [ -z "$TOKEN" ] && { echo "::warning::TELEGRAM_BOT_TOKEN unset — skipping alert"; exit 0; }
          TEXT=$(printf '🔴 ArgoCD app unhealthy\nApp: %s\nsync=%s health=%s\nrepo=%s\nReview: https://argocd.prod.fuzefront.com/applications/%s\nAuto-fix starting.' "$APP" "$SYNC" "$HEALTH" "$OWNER_REPO" "$APP")
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=${TEXT}" \
            --data "disable_web_page_preview=true" >/dev/null && echo "telegram sent" || echo "::warning::telegram send failed"

  # ---- Delegate to the OWNING repo's @fuze handler (self OR consumer) --------
  # One path for both: open an idempotent `@fuze` issue in owner_repo. For a
  # FuzeInfra-owned app owner_repo is this repo, and the cluster-capable handler
  # (fuze-cluster.yml) answers it with prod kubeconfig + kubectl/helm/terraform and
  # reconciles the chart via a PR. For a consumer app it lands in their repo. The
  # LLM diagnosis/fix happens inside that handler (fuze-code-action's multi-provider
  # cascade) — never a single-vendor CLI here.
  delegate:
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: staging
    timeout-minutes: 120
    env:
      APP: ${{ github.event.client_payload.app }}
      OWNER_REPO: ${{ needs.preflight.outputs.owner_repo }}
      IS_SELF: ${{ needs.preflight.outputs.is_self }}
      SYNC: ${{ github.event.client_payload.sync }}
      HEALTH: ${{ github.event.client_payload.health }}
    steps:
      - name: Open an idempotent @fuze issue in the owning repo
        env:
          # PAT REQUIRED: the opened issue must be authored by a trusted
          # OWNER/MEMBER/COLLABORATOR for the @fuze handler's author gate to fire.
          # The default GITHUB_TOKEN authors as a bot and would silently not trigger.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          [ -z "$GH_TOKEN" ] && { echo "::warning::GH_TOKEN unset — cannot open @fuze issue for $OWNER_REPO"; exit 0; }
          # idempotent: one open issue per app in the owning repo
          existing=$(gh issue list --repo "$OWNER_REPO" --state open --label argo-autofix --search "$APP in:title" --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "${existing:-0}" -gt 0 ]; then echo "issue already open for $APP in $OWNER_REPO"; exit 0; fi
          gh label create argo-autofix --repo "$OWNER_REPO" --color B60205 --description "ArgoCD self-heal" 2>/dev/null || true
          COND=$(printf '%s' '${{ toJSON(github.event.client_payload.conditions) }}')
          if [ "$IS_SELF" = "true" ]; then
            ASK="@fuze please diagnose the root cause with prod cluster reads (kubectl get application \`$APP\` -n argocd -o json; compare live vs the Helm-rendered desired) and FIX the chart under \`helm/fuzeinfra/\` so it converges, then open a PR. If the state is transient (a hook or rollout still settling), say so and make no change. GitOps guardrails: never kubectl-patch chart-managed resources — reconcile via chart+PR."
          else
            ASK="FuzeInfra runs the Argo instance but does not edit consumer charts. @fuze please diagnose from this repo's deploy manifests (Helm/kustomize/Argo Application) and open a fix PR. Common causes: a values/kustomize render error (\`Unknown\`/ComparisonError), an image pull secret / tag issue (\`Degraded\` ImagePullBackOff), or drift (\`OutOfSync\`)."
          fi
          BODY=$(cat <<BODY
          ArgoCD reports app **\`$APP\`** unhealthy on the shared FuzeInfra cluster.

          - sync: \`$SYNC\`
          - health: \`$HEALTH\`
          - conditions (the actual error):
          \`\`\`json
          $COND
          \`\`\`

          $ASK
          BODY
          )
          gh issue create --repo "$OWNER_REPO" --label argo-autofix \
            --title "ArgoCD unhealthy: $APP ($HEALTH/$SYNC)" --body "$BODY"
