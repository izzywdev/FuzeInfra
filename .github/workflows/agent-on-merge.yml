name: Agent — refresh MCP + Swagger + mobile on merge

# When a PR merges to main, have the mcp-engineer check/update the stdio + remote
# SSE MCP server, and the openapi-maintainer refresh the live Swagger — if the merged
# change requires it. Guarded: no-ops cleanly unless the Managed-Agents secrets are set
# (agent creation needs a Managed-Agents-entitled key + the MCP URLs — see
# agent-templates/PORTING-TO-FUZEAGENT.md). Slated to move to FuzeAgent.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to review (context for the agents)"
        required: false

# Serialize every run of this workflow (regardless of trigger). `provision.py` does a
# list-then-create against the Managed Agents vault/credential API to stay idempotent;
# that check is only race-free against a SINGLE concurrent caller. Two `refresh` runs
# overlapping (e.g. two PRs merged back-to-back, or a manual re-dispatch racing a merge)
# can both list "credential missing" before either POST lands, so both POST and the loser
# gets a 409 even though the resource is genuinely new from its own point of view. Queue
# instead of cancelling in-progress runs: a cancelled provisioning run can leave the vault
# half-populated. See the "Provision" step below for the (separate, deterministic) 409
# root cause that this alone does not fix.
concurrency:
  group: agent-on-merge-provision
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    # only on real merges (or manual dispatch)
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Guard — Managed Agents configured?
        id: guard
        env:
          MA_KEY: ${{ secrets.MANAGED_AGENTS_API_KEY }}
        run: |
          if [ -z "${MA_KEY}" ]; then
            echo "::notice::MANAGED_AGENTS_API_KEY not set — skipping (agents not provisionable). See agent-templates/PORTING-TO-FUZEAGENT.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Validate the key by probing /v1/environments. A 401/403 means the key
          # is stale or not entitled for the Managed Agents beta — treat it the same
          # as unset so the job skips cleanly rather than failing with an unhelpful
          # Python traceback. Rotate at https://console.anthropic.com/settings/keys.
          http_code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "x-api-key: ${MA_KEY}" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: managed-agents-2026-04-01" \
            "https://api.anthropic.com/v1/environments")
          if [ "$http_code" = "401" ] || [ "$http_code" = "403" ]; then
            echo "::warning::MANAGED_AGENTS_API_KEY returned HTTP ${http_code} from the Managed Agents API — key is stale or not entitled. Skipping. Rotate it at https://console.anthropic.com/settings/keys and update the MANAGED_AGENTS_API_KEY repo secret."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$http_code" != "200" ]; then
            echo "::warning::Managed Agents API probe returned unexpected HTTP ${http_code} — skipping to avoid a misleading failure."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.guard.outputs.ok == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps
        if: steps.guard.outputs.ok == 'true'
        run: pip install --quiet jsonschema requests

      - name: Provision (idempotent) + launch mcp-engineer & openapi-maintainer
        if: steps.guard.outputs.ok == 'true'
        working-directory: agent-templates
        env:
          ANTHROPIC_API_KEY: ${{ secrets.MANAGED_AGENTS_API_KEY }}
          GITHUB_MCP_URL: ${{ secrets.GH_MCP_URL }}
          GITHUB_MCP_TOKEN: ${{ secrets.GH_MCP_TOKEN }}
          HANDOFF_MCP_URL: ${{ secrets.HANDOFF_MCP_URL }}
          HANDOFF_MCP_TOKEN: ${{ secrets.HANDOFF_MCP_TOKEN }}
          ATLASSIAN_MCP_URL: ${{ secrets.ATLASSIAN_MCP_URL }}
          SLACK_MCP_URL: ${{ secrets.SLACK_MCP_URL }}
          STRIPE_MCP_URL: ${{ secrets.STRIPE_MCP_URL }}
          GMAIL_MCP_URL: ${{ secrets.GMAIL_MCP_URL }}
          TELEGRAM_MCP_URL: ${{ secrets.TELEGRAM_MCP_URL }}
          TWILIO_MCP_URL: ${{ secrets.TWILIO_MCP_URL }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        run: |
          set -euo pipefail
          # Do NOT catch/retry HTTP 409 here. Swallowing it (grep the output, treat as
          # success, or retry with --no-vault) hides the real bug instead of fixing it:
          # `ensure_vault` in agent-templates/providers/anthropic/adapter.py already does
          # a list-then-create idempotency check before every POST, via
          # agent-templates/sync/common.py's `list_all()`. That helper paginates with the
          # `has_more`/`after_id` scheme, but `/v1/vaults` and `/v1/vaults/{id}/credentials`
          # use the API's OTHER pagination scheme (`next_page`/`page` — confirmed against
          # the anthropic-sdk-typescript `PageCursor` class and the vaults/credentials
          # resource files). Since a `PageCursor` response never sets `has_more`, list_all()
          # always stops after page 1, so once a vault's credential count exceeds one page
          # the exists-check can no longer see credentials past page 1 and re-POSTs them.
          # `common.py`/`adapter.py` are FuzeSDLC-governed framework files reconciled into
          # this repo by governance-sync.yml on every PR (see .fuze/manifest.json) — a local
          # patch here would just get reverted, so the pagination fix belongs upstream in
          # FuzeSDLC (tracked issue: see the PR description). A 409 surfacing here means
          # that upstream fix hasn't landed/synced yet — that's real, actionable signal and
          # must keep failing the build, not be masked.
          python providers/provision.py --provider anthropic
          for role in openapi-maintainer mcp-engineer mobile-engineer; do
            python sync/launch_session.py --role "$role" --auto allow \
              --prompt "PR #${PR} just merged to main. If it changes your surface, update it and open a PR; otherwise report no change. Do NOT touch prod directly — open PRs only."
          done
