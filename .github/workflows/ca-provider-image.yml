name: Build & Push CA Provider Image

on:
  push:
    branches: [main]
    paths:
      - 'cluster-autoscaler/contabo-externalgrpc/**'
      - '.github/workflows/ca-provider-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cluster-autoscaler/contabo-externalgrpc/**'
      - '.github/workflows/ca-provider-image.yml'
      # TestValuesContaboUserDataB64Parity asserts the cloud-init this overlay
      # ships (userDataTemplateB64) still matches deploy/elastic-userdata.template.
      # Without this path the guard would miss the exact PR that breaks it: one
      # that re-encodes the base64 and touches nothing under the Go module.
      - 'helm/fuzeinfra/values-contabo.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Nothing ran `go test` for this module before, which meant the provider's own
  # unit tests -- including the cloud-init/CA-simulation label parity guards that
  # exist precisely to stop a silent scale-up regression -- were only ever run on
  # a developer's machine, if at all. Gate the image on them: an image that fails
  # its tests must not be promoted to :latest, because :latest is what
  # values-contabo.yaml pins and Argo rolls into prod.
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Matches the `go` directive in
          # cluster-autoscaler/contabo-externalgrpc/go.mod and the golang:1.25
          # builder in that module's Dockerfile.
          go-version: '1.25'
          cache-dependency-path: cluster-autoscaler/contabo-externalgrpc/go.sum

      - name: go vet
        working-directory: cluster-autoscaler/contabo-externalgrpc
        run: go vet ./...

      # Run from the module dir but inside the full checkout:
      # TestValuesContaboUserDataB64Parity walks up to helm/fuzeinfra/values-contabo.yaml
      # to prove the base64 prod actually ships still matches the source template.
      - name: go test
        working-directory: cluster-autoscaler/contabo-externalgrpc
        run: go test ./... -count=1

  build-and-push:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/fuzeinfra-contabo-ca-provider
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: cluster-autoscaler/contabo-externalgrpc
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
