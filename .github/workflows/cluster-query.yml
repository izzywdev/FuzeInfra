# cluster-query — self-service READ-ONLY introspection of the prod cluster for
# agent sessions. Dispatch with a kubectl read command (and/or a public URL to
# curl); read the result from the job log. Replaces the fragile human/Cowork
# relay for "what's happening in the cluster" without handing any session the
# raw kubeconfig.
#
# SECURITY: an allowed READ verb must appear as a token, AND no mutating/exec
# token may appear (apply/delete/edit/patch/replace/exec/attach/cp/scale/
# rollout/annotate/label/drain/cordon/proxy/port-forward/run/create/set),
# AND the Secret resource may not be read at all (see the guard below).
#
# Secret: KUBE_CONFIG (base64 kubeconfig) — same secret used by
# apply-cluster-config.yml / argo-outofsync-autofix.yml.
name: cluster-query

on:
  workflow_dispatch:
    inputs:
      kubectl_args:
        description: 'kubectl args, e.g. "-n mendys-prod get pods -o wide". Must contain a read verb (get/describe/logs/…). Reading Secrets is blocked — output lands in this job log; see docs/SECRETS_MANAGEMENT.md §4.'
        required: false
        default: 'get nodes'
      curl_url:
        description: 'Optional https URL to probe (only *.mendysrobotics.com / *.prod.fuzefront.com).'
        required: false
        default: ''
  # repository_dispatch is what makes this usable from a CONSUMER repo without
  # minting a new credential. workflow_dispatch needs Actions:write on FuzeInfra;
  # repository_dispatch needs Contents:write — which is exactly what the already-
  # distributed FUZEINFRA_DISPATCH_TOKEN carries (docs/INFRA_REQUEST_DISPATCH.md).
  # That token can already trigger infra-request, i.e. apply Terraform and create
  # VPS nodes, so letting it run a guarded read-only kubectl is a REDUCTION in
  # relative privilege, not an escalation. Same guard either way — the filter
  # below does not care which event delivered the args.
  repository_dispatch:
    types: [cluster-query]

permissions:
  contents: read

concurrency:
  group: cluster-query
  cancel-in-progress: false

jobs:
  query:
    runs-on: staging
    steps:
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then echo "::error::KUBE_CONFIG unset"; exit 1; fi
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Run read-only kubectl
        env:
          # Both event shapes feed the SAME filter. Drop either side of this
          # fallback and that event silently runs with empty args (a no-op that
          # looks like success) — tests/test_cluster_query_guard.py pins it.
          ARGS: ${{ github.event.inputs.kubectl_args || github.event.client_payload.kubectl_args }}
        run: |
          set -u
          [ -z "${ARGS// }" ] && { echo "no kubectl_args"; exit 0; }
          # An allowed read verb must be present as a token (order-independent).
          read_ok=0
          for tok in $ARGS; do
            case "$tok" in
              get|describe|logs|top|events|version|api-resources|api-versions|explain|cluster-info|config) read_ok=1;;
            esac
          done
          if [ "$read_ok" != 1 ]; then
            echo "::error::No read verb in args. Allowed: get describe logs top events version api-resources api-versions explain cluster-info config."
            exit 1
          fi
          # Reject any mutating/exec token anywhere in the args.
          for tok in $ARGS; do
            case "$tok" in
              exec|attach|cp|port-forward|proxy|run|delete|apply|edit|patch|replace|scale|rollout|cordon|drain|annotate|label|set|create|taint|uncordon|debug)
                echo "::error::Rejected mutating/exec token: '$tok'."; exit 1;;
            esac
          done
          # Reject reads of the Secret resource. `get secret -o jsonpath=...` passes
          # every check above and prints the credential verbatim into THIS job log,
          # which is retained and readable by anyone with repo access. That is not a
          # hypothetical: it happened on 2026-07-29 to fetch LITELLM_MASTER_KEY, and
          # the log had to be deleted after the fact. Read-only is not the same as
          # safe-to-log, so the guard is separate from the verb checks.
          #
          # Separators are normalised FIRST. `secret/foo`, `pods,secrets` and
          # `secrets.v1.` all name the resource but are each a single $ARGS token, so
          # matching the raw token would miss every one of them; kubectl also accepts
          # `Secret`, hence the case fold. Splitting on - would be wrong: it must not
          # match a Secret's NAME (`litellm-secret` is fine to mention, e.g. in
          # `describe deployment litellm-secret-reader`).
          #
          # `sealedsecret` deliberately still passes: it is encrypted at rest and
          # useless to an attacker, so blocking it would cost debuggability for
          # nothing.
          for tok in $(printf '%s' "$ARGS" | tr '[:upper:]' '[:lower:]' | tr '/,.' '   '); do
            case "$tok" in
              secret|secrets)
                echo "::error::Rejected: reading Secret objects would write the credential into this job log, which is retained and readable by anyone with repo access. Use the operator SSH path in docs/SECRETS_MANAGEMENT.md §4, or rotate the value instead. SealedSecrets are readable here."
                exit 1;;
            esac
          done
          # Reject --raw. `kubectl config view --raw` prints THIS runner's kubeconfig —
          # client cert + key, i.e. cluster-admin — into a job log on a PUBLIC repo.
          # `config` is an allowed read verb and --raw names no resource, so nothing
          # above catches it; without --raw, `config view` redacts those fields
          # (DATA+OMITTED), which is why the verb itself stays allowed. The cost is
          # `get --raw /metrics`, a read nothing here needs.
          for tok in $ARGS; do
            case "$tok" in
              --raw|--raw=*)
                echo "::error::Rejected '--raw': 'kubectl config view --raw' would print this runner's cluster-admin kubeconfig into a job log that is public and retained. Ask for the specific resource instead."
                exit 1;;
            esac
          done
          echo "### kubectl $ARGS"
          # shellcheck disable=SC2086
          kubectl $ARGS 2>&1 | head -c 200000

      - name: Probe public URL
        if: ${{ (github.event.inputs.curl_url || github.event.client_payload.curl_url) != '' }}
        env:
          URL: ${{ github.event.inputs.curl_url || github.event.client_payload.curl_url }}
        run: |
          case "$URL" in
            https://*.mendysrobotics.com|https://*.mendysrobotics.com/*|https://*.prod.fuzefront.com|https://*.prod.fuzefront.com/*)
              echo "### curl -sSIL $URL"
              curl -sSIL --max-time 20 "$URL" 2>&1 | head -c 20000;;
            *)
              echo "::error::URL not allowlisted (only *.mendysrobotics.com / *.prod.fuzefront.com): $URL"; exit 1;;
          esac
