name: node-orphan-cleanup

# Detects and removes orphaned k8s Node objects for elastic nodes whose
# Contabo VPS has already been terminated (billing period expired or manually
# deleted) but whose Node object was never cleaned up.
#
# Orphaned nodes attract ARC runner pod scheduling, causing a thundering-herd
# of Pending pods on the surviving CI node.  This workflow is the manual escape
# hatch for that scenario; the reaper's SweepOrphans() pass (runs hourly via
# the CronJob) handles it automatically going forward.
#
# SAFE DEFAULT: mode=list only enumerates candidates — no mutations.
# Use mode=delete with confirm=DELETE-ORPHANS to actually remove them.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'list = show orphaned nodes (safe, no mutations); delete = kubectl delete node for each'
        type: choice
        options: [list, delete]
        default: list
        required: true
      confirm:
        description: 'For mode=delete ONLY: type DELETE-ORPHANS to proceed. Ignored in list mode.'
        default: ''
        required: false

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Get Contabo elastic instances
        id: contabo
        env:
          CID: ${{ secrets.CONTABO_CLIENT_ID }}
          CSEC: ${{ secrets.CONTABO_CLIENT_SECRET }}
          CUSER: ${{ secrets.CONTABO_API_USER }}
          CPASS: ${{ secrets.CONTABO_API_PASSWORD }}
        run: |
          set -euo pipefail
          for v in CID CSEC CUSER CPASS; do
            eval "val=\${$v}"; [ -n "$val" ] || { echo "::error::secret $v is empty"; exit 1; }
          done
          TOK=$(curl -sS -X POST -H "Content-Type: application/x-www-form-urlencoded" \
            "https://auth.contabo.com/auth/realms/contabo/protocol/openid-connect/token" \
            --data-urlencode "client_id=${CID}" --data-urlencode "client_secret=${CSEC}" \
            --data-urlencode "username=${CUSER}" --data-urlencode "password=${CPASS}" \
            --data-urlencode "grant_type=password" | jq -r .access_token)
          [ -n "$TOK" ] && [ "$TOK" != "null" ] || { echo "::error::Contabo auth failed"; exit 1; }

          # Collect EVERY identifier of EVERY live instance -- displayName, the
          # Contabo-assigned name (vmi*), and both IPs.
          #
          # DO NOT reintroduce a name-prefix filter here. The previous revision
          # used `startswith("fuzeinfra-elastic")`, which never matched the real
          # convention `fuzeinfra-prod-elastic-v2-*`. The live-instance list was
          # therefore ALWAYS EMPTY, so every NotReady elastic node looked like an
          # orphan and was deleted while its VPS was alive and healthy. That is
          # what produced the 2026-09-06 incident: four running nodes whose Node
          # objects were deleted out from under them, k3s-agent spinning forever
          # on "node not found", the autoscaler reporting "4 unregistered nodes"
          # and refusing every scale-up, 40+ Pending pods, and finally an OOM'd
          # API server.
          #
          # Matching on displayName alone is unsafe for a second, independent
          # reason: the autoscaler sometimes fails to set displayName at all
          # (vmi3547160 ran for days with a BLANK one). An identifier that can
          # legitimately be empty must never be the sole basis for a delete
          # decision -- so a node is kept when ANY identifier matches.
          page=1; : > /tmp/contabo-live-ids.txt
          while :; do
            RESP=$(curl -sS -H "Authorization: Bearer $TOK" \
              -H "x-request-id: $(cat /proc/sys/kernel/random/uuid)" \
              "https://api.contabo.com/v1/compute/instances?size=100&page=${page}")
            n=$(echo "$RESP" | jq '.data | length')
            [ "$n" -gt 0 ] || break
            echo "$RESP" | jq -r '
              .data[]
              | [ .displayName, .name, .ipConfig.v4.ip, .ipConfig.v6.ip ]
              | .[] | select(. != null and . != "")
            ' >> /tmp/contabo-live-ids.txt || true
            page=$((page+1)); [ "$page" -gt 30 ] && { echo "::warning::page cap hit"; break; }
          done
          sort -u -o /tmp/contabo-live-ids.txt /tmp/contabo-live-ids.txt

          LIVE=$(grep -c . /tmp/contabo-live-ids.txt || true)
          echo "Live Contabo identifiers collected: $LIVE"
          # Fail closed. An empty list is indistinguishable from "the API broke"
          # and would make EVERY node look orphaned -- the exact failure above.
          if [ "$LIVE" -eq 0 ]; then
            echo "::error::No live Contabo identifiers parsed. Refusing to proceed: every node would be classified an orphan. Check the API response shape."
            exit 1
          fi
          # If the elastic naming convention moves again, say so loudly rather
          # than silently mis-classifying live nodes.
          if ! grep -qE '^fuzeinfra-(prod-)?elastic' /tmp/contabo-live-ids.txt; then
            echo "::warning::No identifier matching 'fuzeinfra-*elastic*'. If the elastic pool is genuinely empty this is fine; otherwise the naming convention changed and this workflow needs updating."
          fi
          cat /tmp/contabo-live-ids.txt

      - name: Find orphaned k8s Node objects
        id: find
        run: |
          set -euo pipefail
          : > /tmp/orphans.txt

          # All elastic k8s nodes (by pool label), with their addresses. A node
          # is matched against Contabo by name OR by any of its IPs, because the
          # name alone is not a reliable key (see the previous step's comment).
          NODES=$(kubectl get nodes -l 'fuzeinfra.io/pool=elastic' \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{range .status.conditions[?(@.type=="Ready")]}{.status}{end}{"\t"}{range .status.addresses[*]}{.address}{","}{end}{"\n"}{end}' 2>/dev/null || true)

          echo "=== Elastic k8s nodes ==="
          echo "${NODES:-  (none)}"

          while IFS=$'\t' read -r NAME READY ADDRS; do
            [ -n "$NAME" ] || continue
            if [ "$READY" = "True" ]; then
              echo "KEEP  $NAME (Ready — never an orphan candidate)"
              continue
            fi
            if grep -qxF "$NAME" /tmp/contabo-live-ids.txt 2>/dev/null; then
              echo "KEEP  $NAME (NotReady but its name matches a live Contabo instance — may be rebooting)"
              continue
            fi
            # Name did not match. Before calling it an orphan, try every address
            # the node reports. This is what saves a node whose displayName was
            # never set by the autoscaler.
            MATCHED=""
            IFS=',' read -ra A <<< "$ADDRS"
            for a in "${A[@]}"; do
              [ -n "$a" ] || continue
              if grep -qxF "$a" /tmp/contabo-live-ids.txt 2>/dev/null; then
                MATCHED="$a"; break
              fi
            done
            if [ -n "$MATCHED" ]; then
              echo "KEEP  $NAME (NotReady, name unmatched, but address $MATCHED belongs to a live Contabo instance)"
              continue
            fi
            echo "ORPHAN $NAME (NotReady + no live Contabo instance matched by name or any address)"
            echo "$NAME" >> /tmp/orphans.txt
          done <<< "$NODES"

          COUNT=$(grep -c . /tmp/orphans.txt || true)
          echo "orphan_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "=== Orphan candidates ($COUNT) ==="
          cat /tmp/orphans.txt || echo "(none)"

          {
            echo "## node-orphan-cleanup"
            echo "| Node | Action |"
            echo "| ---- | ------ |"
            if [ "$COUNT" -gt 0 ]; then
              while read -r N; do echo "| \`$N\` | 🗑 delete |"; done < /tmp/orphans.txt
            else
              echo "| — | no orphans found |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete orphaned nodes (mode=delete only)
        if: ${{ inputs.mode == 'delete' }}
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          ORPHAN_COUNT: ${{ steps.find.outputs.orphan_count }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "DELETE-ORPHANS" ] || { echo "::error::mode=delete requires confirm=DELETE-ORPHANS"; exit 1; }
          if [ "$ORPHAN_COUNT" -eq 0 ]; then
            echo "No orphans to delete — nothing to do."
            exit 0
          fi

          OK=0; ERR=0
          while read -r NAME; do
            [ -n "$NAME" ] || continue
            echo "Deleting orphan node: $NAME"
            if kubectl delete node "$NAME" --ignore-not-found; then
              echo "  ✓ deleted $NAME"
              OK=$((OK+1))
            else
              echo "  ✗ failed to delete $NAME"
              ERR=$((ERR+1))
            fi
          done < /tmp/orphans.txt

          echo "=== delete complete: ok=${OK} err=${ERR} ==="
          echo "- Deleted OK: **$OK**, errors: **$ERR**" >> "$GITHUB_STEP_SUMMARY"
          [ "$ERR" -eq 0 ] || { echo "::error::$ERR node deletions failed"; exit 1; }

      - name: Post-cleanup node status
        if: ${{ inputs.mode == 'delete' }}
        run: |
          echo "=== All nodes (fuzeinfra.io/pool=elastic) after cleanup ==="
          kubectl get nodes -l 'fuzeinfra.io/pool=elastic' -o wide 2>/dev/null || echo "(none remaining)"
          echo "=== ARC runner pods (arc-runners namespace) ==="
          kubectl -n arc-runners get pods -o wide 2>/dev/null || echo "(none)"
