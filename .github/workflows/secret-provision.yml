# =============================================================================
# secret-provision — self-service GitHub Actions SECRET WRITES for agent
# sessions, the write-side counterpart to cluster-query.yml.
#
# WHY THIS EXISTS. A Claude cloud session cannot write repo secrets at all: the
# Anthropic agent proxy refuses /repos/*/actions/secrets outright —
#   403 {"message":"Access to this GitHub Actions path is not permitted through
#        this proxy."}
# — because the proxy injects *git* credentials only, never org/secret admin
# (CAPABILITY_DELEGATION.md §5). That block is keyed on the URL, so it is not
# fixable by adding a token to the session's environment, and every managed-agent
# environment is `anthropic_cloud` and sits behind the same proxy. Delegating the
# capability to another cloud session therefore buys nothing.
#
# A GitHub Actions runner is NOT behind that proxy. So the capability is exposed
# the same way prod reads are: a guarded, dispatchable workflow with the
# credential held by the repo, not by any session.
#
# WHAT IT DELIBERATELY CANNOT DO. There is NO input carrying a secret value, and
# adding one is a release blocker — this repo's job logs are public, so a value
# passed as a dispatch input is a published credential. That is the same lesson
# cluster-query learned the expensive way (LITELLM_MASTER_KEY, 2026-07-29). The
# three sources below are exactly those that never require a caller to transport
# plaintext:
#
#   generate  mint a fresh random value in-runner (passwords, webhook/shared
#             secrets, anything the platform itself owns). Alphanumeric ONLY —
#             a shell metachar like `&` in a generated secret breaks airflow-init
#             (CLAUDE.md), and it is the documented repo-wide rule.
#   copy      re-key an existing secret under a new name (renames, fan-out to a
#             second consumer) without anyone reading it.
#   verify    report PRESENCE and updated_at for a name — never the value. This
#             is the honest path for a THIRD-PARTY key (Twilio, Mailjet): a human
#             injects the value once, out of band, and the agent confirms it
#             landed instead of ever holding it.
#
# For a key that must reach the CLUSTER rather than Actions, do not use this
# workflow at all — seal it offline with scripts/seal-secret.sh against the
# committed public cert and commit the ciphertext (docs/SECRETS_MANAGEMENT.md).
# That path needs no cluster access, no GitHub secret, and no agent ever touches
# plaintext.
#
# Secret: SECRETS_ADMIN_PAT — a fine-grained PAT with Secrets: write on this repo.
# It is on the PROTECTED list below, so this workflow can never rewrite the
# credential it runs on.
# =============================================================================
name: secret-provision

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'Target Actions secret name, e.g. WEBHOOK_SHARED_SECRET. UPPER_SNAKE, not GITHUB_*, not protected.'
        required: true
      source:
        description: 'generate = mint a random value | copy = re-key an existing secret | verify = report presence only (never the value)'
        required: true
        default: verify
        type: choice
        options: [verify, generate, copy]
      copy_from:
        description: 'source = copy only: the existing secret name to re-key.'
        required: false
        default: ''
      length:
        description: 'source = generate only: value length, 16-128.'
        required: false
        default: '48'
  # repository_dispatch mirrors cluster-query: it lets a consuming repo use the
  # already-distributed FUZEINFRA_DISPATCH_TOKEN (Contents:write) instead of
  # minting an Actions:write credential per caller. Same guard either way — the
  # filter below does not care which event delivered the args.
  repository_dispatch:
    types: [secret-provision]

permissions:
  contents: read

concurrency:
  group: secret-provision-${{ github.event.client_payload.id || github.run_id }}
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate request
        env:
          # Both event shapes feed the SAME filter. Drop either side of a
          # fallback and that event silently runs with empty args — a no-op that
          # looks like success. tests/test_secret_provision_guard.py pins this.
          SECRET_NAME: ${{ github.event.inputs.secret_name || github.event.client_payload.secret_name }}
          SOURCE: ${{ github.event.inputs.source || github.event.client_payload.source }}
          COPY_FROM: ${{ github.event.inputs.copy_from || github.event.client_payload.copy_from }}
          LENGTH: ${{ github.event.inputs.length || github.event.client_payload.length }}
        run: |
          set -uo pipefail
          NAME="${SECRET_NAME:-}"
          SRC="${SOURCE:-}"
          FROM="${COPY_FROM:-}"
          LEN="${LENGTH:-48}"

          # Credentials this workflow must never create, overwrite, or re-key.
          # SECRETS_ADMIN_PAT is its own credential: rewriting it either locks the
          # workflow out or silently swaps the identity every later run acts as.
          # The rest are privileged enough that an unattended rewrite is an
          # outage (KUBE_CONFIG breaks cluster-query) or a lateral move.
          PROTECTED="SECRETS_ADMIN_PAT GH_RELEASE_PAT GH_TF_TOKEN GH_MCP_TOKEN
                     FUZESDLC_AGENT_PUSH_TOKEN FUZE_AGENT_APP_ID
                     FUZE_AGENT_APP_PRIVATE_KEY KUBE_CONFIG K3S_NODE_TOKEN
                     CLAUDE_CODE_OAUTH_TOKEN ANTHROPIC_API_KEY
                     FUZEINFRA_DISPATCH_TOKEN ARGOCD_AUTH_TOKEN"

          is_protected() {
            for p in $PROTECTED; do [ "$1" = "$p" ] && return 0; done
            return 1
          }
          valid_name() {
            case "$1" in
              *[!A-Z0-9_]*|"") return 1;;
              [!A-Z]*)        return 1;;
            esac
            [ "${#1}" -ge 3 ] && [ "${#1}" -le 64 ]
          }

          [ -z "${NAME// }" ] && { echo "::error::secret_name is required"; exit 1; }

          if ! valid_name "$NAME"; then
            echo "::error::secret_name $NAME is not UPPER_SNAKE (^[A-Z][A-Z0-9_]{2,63}$)"; exit 1
          fi
          # GITHUB_* is reserved by Actions and rejected server-side; failing here
          # gives a readable reason instead of an opaque 422.
          case "$NAME" in GITHUB_*) echo "::error::GITHUB_* is reserved by Actions"; exit 1;; esac
          if is_protected "$NAME"; then
            echo "::error::$NAME is PROTECTED — this workflow may not write it. Rotate it by hand."; exit 1
          fi

          case "$SRC" in
            verify|generate|copy) ;;
            *) echo "::error::source must be one of verify|generate|copy (got '${SRC:-<empty>}')"; exit 1;;
          esac

          if [ "$SRC" = copy ]; then
            [ -z "${FROM// }" ] && { echo "::error::source=copy requires copy_from"; exit 1; }
            if ! valid_name "$FROM"; then echo "::error::copy_from $FROM is not UPPER_SNAKE"; exit 1; fi
            # Re-keying a privileged credential under a caller-chosen name is a
            # lateral move even though the value is never printed.
            if is_protected "$FROM"; then echo "::error::copy_from $FROM is PROTECTED"; exit 1; fi
            [ "$FROM" = "$NAME" ] && { echo "::error::copy_from equals secret_name"; exit 1; }
          fi

          if [ "$SRC" = generate ]; then
            case "$LEN" in *[!0-9]*|"") echo "::error::length must be numeric"; exit 1;; esac
            if [ "$LEN" -lt 16 ] || [ "$LEN" -gt 128 ]; then
              echo "::error::length must be 16-128 (got $LEN)"; exit 1
            fi
          fi

          echo "OK: $SRC -> $NAME"
          echo "SECRET_NAME=$NAME" >> "$GITHUB_ENV"
          echo "SOURCE=$SRC"       >> "$GITHUB_ENV"
          echo "COPY_FROM=$FROM"   >> "$GITHUB_ENV"
          echo "LENGTH=$LEN"       >> "$GITHUB_ENV"

      - name: Provision
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_PAT }}
          REPO: ${{ github.repository }}
          # Dynamic indexing of the secrets context: resolves the copy source
          # without naming it statically. Empty for verify/generate.
          #
          # BOTH event shapes, same as every var in the Validate step above:
          # `github.event.inputs` is null on repository_dispatch, so keying off it
          # alone left COPY_VALUE permanently empty there and failed source=copy
          # with the misleading "resolved empty ... does not exist" error. The
          # outer guard keeps an empty name from ever indexing the secrets context.
          COPY_VALUE: >-
            ${{ (github.event.inputs.copy_from || github.event.client_payload.copy_from)
                && secrets[github.event.inputs.copy_from || github.event.client_payload.copy_from]
                || '' }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::SECRETS_ADMIN_PAT is unset. Add a fine-grained PAT with Secrets: write on $REPO."
            exit 1
          fi
          umask 077
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT

          case "$SOURCE" in
            verify)
              # Names and timestamps only. `gh secret list` never returns values —
              # GitHub has no read-the-value API for Actions secrets at all.
              echo "### Secrets (names + updated_at only; values are never readable)"
              gh secret list --repo "$REPO" | grep -E "^${SECRET_NAME}[[:space:]]" \
                && echo "PRESENT: $SECRET_NAME" \
                || { echo "ABSENT: $SECRET_NAME"; exit 1; }
              ;;
            generate)
              # Alphanumeric ONLY — a metachar such as `&` in a generated secret
              # breaks airflow-init (CLAUDE.md, setup_environment_ci.py).
              LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c "$LENGTH" > "$d/val"
              echo "::add-mask::$(cat "$d/val")"
              # Value arrives on stdin, never argv — argv is visible to other
              # processes on the runner.
              gh secret set "$SECRET_NAME" --repo "$REPO" < "$d/val" || exit 1
              echo "SET: $SECRET_NAME (generated, ${LENGTH} alphanumeric chars)"
              ;;
            copy)
              if [ -z "${COPY_VALUE:-}" ]; then
                echo "::error::$COPY_FROM resolved empty — it does not exist, or is an environment/org secret this job cannot see."
                exit 1
              fi
              printf '%s' "$COPY_VALUE" > "$d/val"
              gh secret set "$SECRET_NAME" --repo "$REPO" < "$d/val" || exit 1
              echo "SET: $SECRET_NAME (re-keyed from $COPY_FROM; value not disclosed)"
              ;;
          esac
