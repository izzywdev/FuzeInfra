# fuze:fork — deliberately NOT `fuze:managed`, so governance-sync never reconciles it.
#
# The canonical (94 lines) is a generic chart linter: discover helm/*/Chart.yaml and
# deploy/helm/*/Chart.yaml, `helm lint`, `helm template | kubeconform` per overlay. This
# repo OWNS the chart the rest of the family deploys onto, so its copy (194 lines) also
# asserts contracts the canonical has no notion of. FuzeInfra-only steps:
#
#   * `runs-on: staging` — the in-cluster ARC runner.
#   * "Validate + unit-test Prometheus alert rules" — promtool check + rule unit tests.
#   * "Cache Kubernetes JSON schemas (v1.29.0)" — kubeconform schema cache.
#   * "Render & validate LiteLLM (gate forced on)" — renders the service whose `enabled`
#     gate is off in the base values, so the disabled path is still schema-checked.
#   * "Assert the LiteLLM consumer contract" and "Assert the Kafka advertised-listener
#     contract" — chart-level invariants that consuming repos depend on and that a plain
#     `helm lint` cannot express.
#
# Stamping would delete all four assertions and move the job off the in-cluster runner,
# while the remaining generic lint kept reporting green.

name: Helm Chart Validation

on:
  push:
    branches: [main, develop, staging]
    paths:
      - 'helm/**'
      - '.github/workflows/helm-validate.yml'
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint & schema-validate chart
    # Use the scale-set NAME, not [self-hosted, staging]. The controller self-heal
    # CronJob (arc-systems) auto-recovers stuck-controller and missing-pool-label
    # failure modes. Self-hosted = no GitHub Actions minutes consumed.
    runs-on: staging
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      # --namespace is NOT cosmetic here: Helm substitutes "default" when it is
      # omitted, and the chart publishes namespace-qualified service FQDNs to
      # cross-namespace consumers. Linting/rendering without it validated an
      # artifact that could never be prod's. The chart now fails the render on
      # namespace "default" (fuzeinfra.serviceNamespace), so these flags are load-bearing.
      - name: Helm lint (all overlays)
        run: |
          helm lint helm/fuzeinfra --namespace fuzeinfra
          helm lint helm/fuzeinfra --namespace fuzeinfra -f helm/fuzeinfra/values-local.yaml
          helm lint helm/fuzeinfra --namespace fuzeinfra -f helm/fuzeinfra/values-aws.yaml
          helm lint helm/litellm
          helm lint helm/litellm -f helm/litellm/values-local.yaml
          helm lint helm/litellm -f helm/litellm/values-contabo.yaml

      # Alert rules are shipped as raw files via .Files.Get, so helm lint never
      # looks inside them. promtool parses the PromQL and — via the unit tests —
      # proves the rules actually FIRE on the condition they claim to catch.
      # (CiNodePoolLabelMissing originally used `count(...) == 0`, which parses
      # fine and can never fire, because an empty selector yields no samples.)
      - name: Validate + unit-test Prometheus alert rules
        run: |
          set -euo pipefail
          curl -sSLo /tmp/prom.tar.gz \
            https://github.com/prometheus/prometheus/releases/download/v2.53.0/prometheus-2.53.0.linux-amd64.tar.gz
          tar -xzf /tmp/prom.tar.gz -C /tmp
          sudo install /tmp/prometheus-2.53.0.linux-amd64/promtool /usr/local/bin/promtool
          promtool check rules helm/fuzeinfra/rules/*.yml
          promtool test rules helm/fuzeinfra/rules/tests/*_test.yml

      - name: Install kubeconform
        run: |
          if command -v kubeconform &>/dev/null; then
            echo "kubeconform pre-baked in runner image: $(kubeconform -v 2>&1)"
          else
            curl -sSLo /tmp/kubeconform.tar.gz \
              https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
            tar -xzf /tmp/kubeconform.tar.gz -C /tmp
            sudo install /tmp/kubeconform /usr/local/bin/kubeconform
          fi

      # The staging runner is in-cluster and cannot reach raw.githubusercontent.com
      # (NetworkPolicy blocks external egress to that host). github.com releases and
      # git-over-HTTPS both work fine, so clone the schema repo via git sparse-checkout
      # and point kubeconform at the local copy. This also avoids per-resource download
      # bursts that trigger rate limits on shared hosted runners.
      - name: Cache Kubernetes JSON schemas (v1.29.0)
        run: |
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/yannh/kubernetes-json-schema.git /tmp/k8s-schemas
          cd /tmp/k8s-schemas && git sparse-checkout set "v1.29.0-standalone-strict"

      # values-contabo.yaml IS INCLUDED DELIBERATELY. It used to be omitted, which
      # made PROD the one overlay CI never schema-validated -- so a manifest that
      # could not be applied to prod could still merge with this gate green.
      #
      # That is not hypothetical. The Prometheus Deployment reached main rendering
      # `nodeSelector` TWICE (#816 and #817 each added a block to the same pod spec;
      # neither conflicted textually, so git merged both). Duplicate mapping keys are
      # a YAML unmarshal ERROR -- `key "nodeSelector" already set in map` -- which
      # invalidates the entire resource, so Argo could not apply the very Deployment
      # both PRs existed to repair. This job passed on every one of those commits,
      # because the duplicate only materialises once `prometheus.nodeSelector` is SET,
      # and it is set only in values-contabo.yaml; under local/aws both
      # `{{- with .Values.prometheus.nodeSelector }}` blocks render to nothing and the
      # manifest is well-formed. (#819 fixed that instance; this closes the gap that
      # let it merge.) Every overlay-gated value has the same shape.
      - name: Render & validate (local + aws + contabo overlays)
        run: |
          for overlay in values-local.yaml values-aws.yaml values-contabo.yaml; do
            echo "::group::$overlay"
            helm template fuzeinfra helm/fuzeinfra -f "helm/fuzeinfra/$overlay" \
              --namespace fuzeinfra \
              | kubeconform -strict -summary -kubernetes-version 1.29.0 -ignore-missing-schemas \
                  -schema-location 'file:///tmp/k8s-schemas/{{.NormalizedKubernetesVersion}}-standalone-strict/{{.ResourceKind}}{{.KindSuffix}}.json'
            echo "::endgroup::"
          done

      # The LiteLLM gateway is a separate chart with its own Argo Application
      # (argocd/applications/litellm.yaml). Its `enabled` gate defaults to false
      # so the chart renders NOTHING by default — validating it as-is would be a
      # no-op that always passes. Force the gate on so the templates are actually
      # exercised, independent of whether prod has flipped it yet.
      - name: Render & validate LiteLLM (gate forced on)
        run: |
          for overlay in values-local.yaml values-contabo.yaml; do
            echo "::group::litellm/$overlay"
            helm template litellm helm/litellm -f "helm/litellm/$overlay" --set enabled=true \
              | kubeconform -strict -summary -kubernetes-version 1.29.0 -ignore-missing-schemas \
                  -schema-location 'file:///tmp/k8s-schemas/{{.NormalizedKubernetesVersion}}-standalone-strict/{{.ResourceKind}}{{.KindSuffix}}.json'
            echo "::endgroup::"
          done

      # The gateway's whole purpose is the DNS + port + model-name contract that
      # FuzeFront's chat-service compiles against. Assert it here so a careless
      # rename fails CI instead of 500ing every chat turn in prod.
      #
      # Pure grep against per-template renders (`-s`) on purpose: no python/pip,
      # no yq. The self-hosted ARC runner is not guaranteed to have either, and a
      # contract check that can fail on a missing interpreter is worse than none.
      - name: Assert the LiteLLM consumer contract
        run: |
          set -euo pipefail
          render() {
            helm template litellm helm/litellm \
              -f helm/litellm/values-contabo.yaml --set enabled=true -s "$1"
          }

          # Service DNS + port: litellm.fuzeinfra.svc.cluster.local:4000
          render templates/service.yaml > /tmp/litellm-svc.yaml
          grep -qE '^  name: litellm$' /tmp/litellm-svc.yaml \
            || { echo "::error::Service renamed — breaks litellm.fuzeinfra.svc.cluster.local"; exit 1; }
          grep -qE '^      port: 4000$' /tmp/litellm-svc.yaml \
            || { echo "::error::Service port must stay 4000"; exit 1; }

          # Model names consumers resolve by string.
          render templates/configmap.yaml > /tmp/litellm-cm.yaml
          for model in claude-opus-4-5 text-embedding-3-small; do
            grep -qE "model_name: ${model}$" /tmp/litellm-cm.yaml \
              || { echo "::error::model '${model}' removed; consumers resolve it by name"; exit 1; }
          done

          echo "LiteLLM consumer contract OK (litellm:4000, claude-opus-4-5, text-embedding-3-small)"

      # Kafka hands its advertised address to clients in the metadata response
      # that FOLLOWS a successful bootstrap. If that address is not resolvable
      # from other namespaces, bootstrap still succeeds and every produce/consume
      # then fails — a failure mode that looks like a client bug and is not.
      # It has now broken cross-namespace consumers twice (#104: bare service
      # name; the `.default.` regression: namespace-less render), so assert the
      # exact string rather than trusting review.
      - name: Assert the Kafka advertised-listener contract
        run: |
          set -euo pipefail
          fqdn='fuzeinfra-kafka.fuzeinfra.svc.cluster.local:9092'

          for overlay in values-contabo.yaml values-local.yaml values-aws.yaml; do
            helm template fuzeinfra helm/fuzeinfra -f "helm/fuzeinfra/$overlay" \
              --namespace fuzeinfra -s templates/messaging.yaml > /tmp/kafka-$overlay.yaml
            grep -qF "PLAINTEXT://${fqdn}" "/tmp/kafka-$overlay.yaml" \
              || { echo "::error::$overlay: KAFKA_ADVERTISED_LISTENERS must advertise ${fqdn} — anything else breaks every consumer outside ns fuzeinfra"; exit 1; }
            # Match the listener VALUE, not the bare hostname: the template's
            # explanatory comment names the broken address on purpose, and
            # `helm template` emits comments into the rendered output.
            # `if !`, not `&&` — under `set -e` a failing grep in an AND-list
            # would abort the job on the SUCCESS path.
            if grep -qF 'PLAINTEXT://fuzeinfra-kafka.default.svc.cluster.local' "/tmp/kafka-$overlay.yaml"; then
              echo "::error::$overlay: broker advertises the unresolvable .default. address"; exit 1
            fi
            echo "  $overlay OK"
          done

          # The prod overlay pins global.serviceNamespace, so it must render the
          # correct address even when the ambient namespace is wrong — that is the
          # whole point of pinning it. `--namespace default` is the worst case, and
          # using it explicitly keeps this deterministic: with no flag the ambient
          # namespace could happen to BE fuzeinfra, and then this passes whether or
          # not the pin exists, proving nothing.
          helm template fuzeinfra helm/fuzeinfra -f helm/fuzeinfra/values-contabo.yaml \
            --namespace default -s templates/messaging.yaml > /tmp/kafka-wrong-ns.yaml
          grep -qF "PLAINTEXT://${fqdn}" /tmp/kafka-wrong-ns.yaml \
            || { echo "::error::prod overlay does not advertise ${fqdn} when rendered into the wrong namespace — is global.serviceNamespace still pinned?"; exit 1; }

          # And rendering into "default" WITHOUT that pin must fail loudly rather
          # than emit a broker no consumer can reach. Match the guard's own
          # message so an unrelated template error cannot pass this check.
          #
          # `--namespace default` explicitly, NOT an omitted flag: helm resolves a
          # missing --namespace from the ambient kube context, and this self-hosted
          # ARC runner is cluster-connected, so the fallback is a real namespace,
          # not "default" — an omitted flag does not exercise the guard here even
          # though it does on a workstation. Which is precisely why the advertised
          # address must never be left ambient.
          guard_out=$(helm template fuzeinfra helm/fuzeinfra -f helm/fuzeinfra/values-local.yaml \
                        --namespace default \
                        -s templates/messaging.yaml 2>&1) && guard_rc=0 || guard_rc=$?
          if [ "$guard_rc" -eq 0 ]; then
            echo "::error::a namespace-less render should have failed but did not — the serviceNamespace guard is gone"
            exit 1
          fi
          grep -qF 'refusing to render service addresses in namespace' <<<"$guard_out" || {
            echo "::error::namespace-less render failed for the wrong reason:"; echo "$guard_out"; exit 1; }

          echo "Kafka advertised-listener contract OK (${fqdn}; guard active)"
