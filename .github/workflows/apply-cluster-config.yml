# ===========================================================================
# apply-cluster-config
# ===========================================================================
# Applies FuzeInfra's OWN cluster-scoped manifests — the bootstrap things ArgoCD
# can't self-seed because they are what LETS ArgoCD work (e.g. the repo-credential
# template that lets it read private consumer repos). GitOps-triggered: a commit
# to argocd/cluster-config/** kubectl-applies it to the shared cluster via the
# KUBE_CONFIG secret — SSH-free, no manual kubectl on prod.
#
# Also applies argocd/notifications/** (the argocd-notifications-cm) the same way
# — the notifications controller hot-reloads the ConfigMap, so a commit to it
# lands the trigger/template/subscription changes with no manual kubectl.
#
# This is the generic, reusable path for any future cluster bootstrap manifest
# (repo-creds, image-pull creds, cluster settings). kubectl apply is idempotent,
# so re-runs are safe. Sealed Secrets stay ciphertext in git; the in-cluster
# controller decrypts them.
#
# Required repo secret (FuzeInfra CI only):
#   KUBE_CONFIG   # base64 kubeconfig for the k3s server (same one argocd-register uses)

name: apply-cluster-config

on:
  push:
    branches: [main]
    paths:
      - 'argocd/cluster-config/**'
      - 'argocd/cluster-bootstrap/**'
      - 'argocd/cluster-settings/**'
      - 'argocd/notifications/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: apply-cluster-config
  cancel-in-progress: false

jobs:
  apply:
    runs-on: staging
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1

      # `runs-on: staging` is a self-hosted runner and does NOT ship kubectl.
      # It used to be present in the image: this workflow last succeeded
      # 2026-07-05 and then failed with "kubectl: command not found" on
      # 2026-07-29, i.e. the runner drifted underneath us. Because every step
      # here is a kubectl call, the whole workflow became a silent no-op that
      # only surfaced when someone actually needed it to land a change.
      #
      # Install it explicitly rather than trusting the image, so the workflow is
      # self-contained and survives the next runner rebuild.
      - name: Install kubectl
        run: |
          if command -v kubectl >/dev/null 2>&1; then
            echo "kubectl already present: $(kubectl version --client -o yaml 2>/dev/null | head -3 | tr '\n' ' ')"
            exit 0
          fi
          # Pin to the cluster's minor version rather than `stable.txt`: kubectl
          # supports +/-1 minor from the API server, so an unpinned client can
          # drift out of the support window without warning.
          KUBECTL_VERSION="v1.31.4"
          curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x /tmp/kubectl
          mkdir -p "$HOME/.local/bin"
          mv /tmp/kubectl "$HOME/.local/bin/kubectl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "installed kubectl ${KUBECTL_VERSION}"

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          kubectl version --client=true -o yaml >/dev/null
          echo "kubectl configured."

      - name: Apply argocd/cluster-config
        run: |
          kubectl apply -f argocd/cluster-config/
          echo "Applied argocd/cluster-config/ to the shared cluster."
          echo "SealedSecrets decrypt in-cluster; ArgoCD picks up repo-creds on its next repo access."

      - name: Apply argocd/cluster-bootstrap
        run: |
          kubectl apply -f argocd/cluster-bootstrap/
          echo "Applied argocd/cluster-bootstrap/ — HelmChartConfigs (traefik, etc.)."
          echo "k3s helm-controller reconciles within ~15s."

      # kubectl apply -f <dir> does NOT prune: a manifest deleted from git stays
      # live in the cluster forever unless something explicitly removes it. This
      # bit us for real: argocd/cluster-bootstrap/coredns-ha.yaml (PR #1193) was
      # a coredns-ha Deployment explicitly tolerating fuzeinfra.io/ci and pinned
      # OFF the control-plane, so both its replicas landed on the CI nodes. The
      # PR that deletes that file (superseding it with the node-configurator
      # mechanism in helm/fuzeinfra/templates/node-configurator.yaml, which fixes
      # the REAL k3s-packaged CoreDNS instead) does nothing to the live object —
      # confirmed: `kubectl -n kube-system get deploy coredns-ha` carries no
      # argocd.argoproj.io/tracking-id, because this directory is NOT Argo-
      # managed, it is applied here via plain `kubectl apply -f`. Left alone, the
      # superseded Deployment keeps running with both replicas on the CI nodes
      # forever, AND (once ci-node-isolation.yaml's ValidatingAdmissionPolicy is
      # enabled) its pods can never be recreated on any future drain/restart —
      # a confusing half-state, not an active outage, but a landmine.
      #
      # ORDERING IS LOAD-BEARING. coredns-ha's pods carry `k8s-app: kube-dns`,
      # so they are live endpoints behind the SAME kube-dns Service the
      # node-configurator's replacement replicas join — deleting coredns-ha
      # BEFORE the replacement is Ready would dip cluster DNS capacity right
      # when this very fix is rolling out. helm/fuzeinfra (Argo, via
      # deploy-prod.yml) and this directory (kubectl apply, here) are two
      # INDEPENDENT pipelines with no ordering guarantee between them on the
      # same merge to main, so this step actively WAITS for the node-configurator
      # CoreDNS to prove itself ready before touching coredns-ha, rather than
      # assuming deploy-prod.yml already ran.
      #
      # Fails OPEN on timeout: if the replacement isn't ready yet, coredns-ha is
      # left running (extra DNS capacity, not a duplicate outage) and this step
      # only warns — it does not fail the job, so the rest of cluster-bootstrap
      # still applies. The next push that touches these paths (or a manual
      # workflow_dispatch) retries the cleanup; it eventually converges.
      #
      # NOT a general fix for the prune gap above — `kubectl apply --prune`
      # needs careful label scoping to be safe and is a separate, deliberately
      # out-of-scope piece of work (tracked separately; every OTHER file ever
      # deleted from this directory has the same latent leak, coredns-ha is
      # just the instance that was caught).
      - name: Remove superseded coredns-ha Deployment (idempotent, ordered after the real fix is Ready)
        run: |
          set -u
          if ! kubectl -n kube-system get deployment coredns-ha >/dev/null 2>&1; then
            echo "coredns-ha already gone — nothing to clean up."
            exit 0
          fi

          echo "coredns-ha still present; waiting up to 900s for the node-configurator's"
          echo "replacement CoreDNS (deploy/coredns in kube-system) to reach >=2 ready replicas"
          echo "before tearing coredns-ha down, so cluster DNS capacity never dips."
          ready=0
          for _ in $(seq 1 60); do
            r=$(kubectl -n kube-system get deployment coredns -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo 0)
            case "$r" in ''|*[!0-9]*) r=0 ;; esac
            if [ "$r" -ge 2 ]; then
              ready=1
              echo "deploy/coredns readyReplicas=$r (>=2) — safe to remove coredns-ha."
              break
            fi
            sleep 15
          done

          if [ "$ready" -eq 1 ]; then
            kubectl -n kube-system delete deployment coredns-ha --ignore-not-found
            echo "Deleted superseded coredns-ha Deployment."
          else
            echo "WARNING: deploy/coredns never reached >=2 ready replicas within 900s."
            echo "Leaving coredns-ha running (fails open — extra DNS capacity is safer than"
            echo "a capacity dip). Will retry on the next run touching these paths."
          fi

      - name: Apply argocd/cluster-settings (server-side)
        run: |
          # SERVER-SIDE, deliberately — these patch ArgoCD's OWN ConfigMaps
          # (argocd-cm, argocd-rbac-cm), which are not owned by git: upstream
          # install.yaml ships defaults in them and a kubectl patch adds more.
          # ConfigMap `data` is a granular map under SSA, so ownership is
          # per-key and the keys we don't declare are left alone. A client-side
          # `kubectl apply` would three-way-merge against install.yaml's
          # last-applied and DELETE every key we omit — including the custom
          # Ingress health check, without which every Application sits
          # Progressing forever (Traefik is ClusterIP, so Ingresses get no
          # ADDRESS).
          #
          # --force-conflicts takes ownership of the specific keys we declare
          # from whichever manager set them first. It does not touch other keys.
          kubectl apply --server-side --force-conflicts \
            --field-manager=fuzeinfra-cluster-settings \
            -f argocd/cluster-settings/
          echo "Applied argocd/cluster-settings/ (server-side)."
          echo "argocd-server reads oidc.config on demand; RBAC is hot-reloaded."

      - name: Apply argocd/notifications
        run: |
          kubectl apply -f argocd/notifications/
          echo "Applied argocd/notifications/ — the argocd-notifications controller"
          echo "hot-reloads the ConfigMap; no restart needed."
