name: Build & Push Custom Hostname API Image

# Builds the in-cluster custom hostname API (services/custom-hostname-api),
# which provisions customer-owned domains at runtime via Cloudflare for SaaS.
# See docs/consuming-repos/CUSTOM_DOMAINS.md.

on:
  push:
    branches: [main]
    paths:
      - 'services/custom-hostname-api/**'
      - '.github/workflows/custom-hostname-api-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/custom-hostname-api/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push custom-hostname-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/fuzeinfra/custom-hostname-api
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: services/custom-hostname-api
          file: services/custom-hostname-api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
