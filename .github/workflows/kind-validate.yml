# =============================================================================
# kind-validate — the "one command and the local devenv is up" gate.
#
# Stands the FULL FuzeInfra stack up on a fresh kind cluster, proves every
# enabled service is Ready + reachable, and runs the pytest smoke suite. This is
# the stand-up + smoke half of gate-localup (helm-validate.yml covers the static
# lint + kubeconform half).
#
# It runs the SAME entrypoint a developer runs:
#
#     python3 scripts-tools/devenv.py up --fresh --profile full     # == make dev-fresh
#
# That identity is the point. If a developer's `make dev` would fail, this gate
# fails first, on the PR that broke it — rather than the next person to try
# discovering it by hand.
#
# ---------------------------------------------------------------------------
# Runner: GITHUB-HOSTED (ubuntu-latest), NOT self-hosted.
#
# This previously required a host-level self-hosted runner labelled `kind-host`.
# That runner stopped picking up jobs on 2026-07-24 and every run since either
# timed out in the queue (`cancelled`) or failed — so the gate silently did not
# run for days while merely looking "pending". A gate that depends on a machine
# somebody has to keep alive is a gate that will keep going quiet.
#
# ubuntu-latest has docker, 4 vCPU / 16 GB RAM, and (after the cleanup step
# below) ample free disk for a 3-node kind cluster running the full stack. It is
# also ephemeral, which removes the RCE-on-a-persistent-host risk that forced the
# old fork-PR exclusion.
# ---------------------------------------------------------------------------
name: kind-validate

on:
  pull_request:
    branches: [main]
    paths:
      - 'helm/**'
      - 'k8s/**'
      - 'tests/**'
      - 'scripts-tools/devenv.py'
      - 'scripts-tools/validate_kind_deployment.py'
      - 'scripts-tools/kind_port_forward.py'
      - 'Makefile'
      - '.github/workflows/kind-validate.yml'
  push:
    branches: [main]
    paths:
      - 'helm/**'
      - 'k8s/**'
      - 'scripts-tools/devenv.py'
      - 'scripts-tools/validate_kind_deployment.py'
      - 'scripts-tools/kind_port_forward.py'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Chart profile to deploy'
        type: choice
        default: full
        options: [full, data-stores, minimal]

concurrency:
  group: kind-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  devenv-up:
    name: devenv up (${{ github.event.inputs.profile || 'full' }})
    runs-on: ubuntu-latest
    # A cold full-stack bring-up pulls elasticsearch/kafka/airflow images; 45m is
    # deliberately generous so a slow image pull reads as slow, not as a failure.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # ubuntu-latest ships tens of GB of preinstalled toolchains we never use,
      # and the full stack's images do not comfortably fit in what is left.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}" || true
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Install kind + kubectl
        run: |
          set -euo pipefail
          curl -sSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          curl -sSLo /tmp/kubectl https://dl.k8s.io/release/v1.31.4/bin/linux/amd64/kubectl
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kind --version
          kubectl version --client

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      # THE GATE. Identical to what a developer runs locally (`make dev-fresh`).
      # --fresh proves a from-scratch build, which is the actual promise: a new
      # machine, one command, a working environment.
      - name: devenv up (fresh full-stack bring-up + verify + smoke)
        run: |
          python3 scripts-tools/devenv.py up \
            --fresh \
            --backend kind \
            --profile "${{ github.event.inputs.profile || 'full' }}" \
            --timeout 1200

      # devenv.py already prints namespace-scoped diagnostics on failure; this
      # adds the cluster-wide view it deliberately does not — nodes, other
      # namespaces, disk — which is where image-pull and disk-pressure failures
      # actually show up.
      - name: Cluster-wide diagnostics
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get pods -A -o wide || true
          kubectl describe nodes | grep -A15 -iE "conditions|allocated resources" || true
          docker system df || true
          df -h /

      - name: Tear down
        if: always()
        run: python3 scripts-tools/devenv.py down --backend kind
