name: contabo-instance-reboot

# Reboots (POST /v1/compute/instances/{id}/actions/restart) a Contabo instance
# backing a k3s node. Built as the action half of the dark-node watchdog
# (scripts-tools/deployment_watchdog.py:detect_dark_nodes,
# .github/workflows/deployment-watchdog.yml): when a node's kubelet stops
# posting status for longer than governance/watchdog-thresholds.json's
# dark_node.unknown_minutes, the watchdog files an issue mentioning @fuze with
# the node's facts (control-plane role, etcd-voter status, how many OTHER
# control-plane nodes are Ready, external IP). @fuze reads that issue, decides
# whether a restart is safe (docs/runbooks/dark-node-reboot.md), and if so
# dispatches THIS workflow.
#
# WHY A SEPARATE WORKFLOW rather than letting the cluster-capable @fuze agent
# runner (fuze-cluster.yml) call the Contabo API directly: that runner already
# holds prod kubeconfig + an open-ended agent; handing it the Contabo
# credential too would mean one compromised/misdirected agent session holds
# BOTH the cluster and the hypervisor layer under it. This workflow holds the
# Contabo credential and does exactly one narrow, auditable thing instead —
# the same split contabo-rename-instance.yml / ca-delete-instance.yml already
# use for other Contabo mutations.
#
# Give it EITHER instance_id directly, OR node_name + external_ip so it can
# resolve the instanceId itself by matching the instance's ipConfig.v4.ip
# against external_ip. Nodes carry no Contabo-instanceId label at bootstrap
# (modules/contabo-k3s-node/cloud-init.tftpl sets none) — the public IP is the
# only reliable link that exists today; see .claude/agents/contabo-expert.md
# for the endpoint map this relies on.
#
# `restart` only — not the full InstanceActions set (start/stop/shutdown/
# rescue/resetPassword). Narrower than the API allows, on purpose: this
# workflow answers exactly one question ("reboot this node"), the same
# single-purpose shape as every other one-off contabo-*.yml workflow here.
on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: 'Contabo numeric instanceId (leave empty to resolve via node_name/external_ip)'
        required: false
        default: ''
      node_name:
        description: 'k3s node name — for the audit trail and the issue comment only, not used to identify the instance'
        required: false
        default: ''
      external_ip:
        description: "Node's Contabo public IP (kubectl get node <name> -o wide) — used to resolve instance_id when it is not given directly"
        required: false
        default: ''
      reason:
        description: 'Why this is safe (e.g. "Ready=Unknown 4.6d, other_ready_control_plane_nodes=2 — not a quorum risk")'
        required: true
      confirm:
        description: 'Type RESTART to confirm'
        required: true
        default: ''
      issue_number:
        description: 'Optional: watchdog issue number to comment the result back onto'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  reboot:
    runs-on: ubuntu-latest
    steps:
      - name: Interlock
        env:
          CONFIRM: ${{ inputs.confirm }}
          IID: ${{ inputs.instance_id }}
          IP: ${{ inputs.external_ip }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "RESTART" ] || { echo "::error::confirm must be the literal RESTART"; exit 1; }
          [ -n "$IID" ] || [ -n "$IP" ] || { echo "::error::need instance_id or external_ip to identify the instance"; exit 1; }

      - name: Auth
        id: auth
        env:
          CID: ${{ secrets.CONTABO_CLIENT_ID }}
          CSEC: ${{ secrets.CONTABO_CLIENT_SECRET }}
          CUSER: ${{ secrets.CONTABO_API_USER }}
          CPASS: ${{ secrets.CONTABO_API_PASSWORD }}
        run: |
          set -euo pipefail
          TOK=$(curl -sS -X POST -H "Content-Type: application/x-www-form-urlencoded" \
            "https://auth.contabo.com/auth/realms/contabo/protocol/openid-connect/token" \
            --data-urlencode "client_id=${CID}" --data-urlencode "client_secret=${CSEC}" \
            --data-urlencode "username=${CUSER}" --data-urlencode "password=${CPASS}" \
            --data-urlencode "grant_type=password" | jq -r .access_token)
          [ -n "$TOK" ] && [ "$TOK" != "null" ] || { echo "::error::auth failed"; exit 1; }
          echo "::add-mask::$TOK"
          echo "token=$TOK" >> "$GITHUB_OUTPUT"

      - name: Resolve instanceId
        id: resolve
        env:
          TOK: ${{ steps.auth.outputs.token }}
          IID: ${{ inputs.instance_id }}
          IP: ${{ inputs.external_ip }}
        run: |
          set -euo pipefail
          if [ -n "$IID" ]; then
            echo "instance_id=$IID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RESOLVED=""
          page=1
          while :; do
            RESP=$(curl -sS -H "Authorization: Bearer $TOK" \
              -H "x-request-id: $(cat /proc/sys/kernel/random/uuid)" \
              "https://api.contabo.com/v1/compute/instances?size=100&page=${page}")
            n=$(printf '%s' "$RESP" | jq '.data | length')
            [ "$n" -gt 0 ] || break
            RESOLVED=$(printf '%s' "$RESP" | jq -r --arg ip "$IP" \
              '.data[] | select(.ipConfig.v4.ip == $ip) | .instanceId' | head -1)
            [ -n "$RESOLVED" ] && break
            page=$((page + 1))
            [ "$page" -gt 30 ] && break
          done
          [ -n "$RESOLVED" ] || { echo "::error::no Contabo instance found with ipConfig.v4.ip=$IP"; exit 1; }
          echo "instance_id=$RESOLVED" >> "$GITHUB_OUTPUT"

      - name: Restart
        id: restart
        env:
          TOK: ${{ steps.auth.outputs.token }}
          IID: ${{ steps.resolve.outputs.instance_id }}
          NODE: ${{ inputs.node_name }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          echo "### Restarting Contabo instance $IID (node: ${NODE:-unknown})"
          echo "Reason: $REASON"
          curl -sS -X POST -H "Authorization: Bearer $TOK" -H "Content-Type: application/json" \
            -H "x-request-id: $(cat /proc/sys/kernel/random/uuid)" \
            "https://api.contabo.com/v1/compute/instances/${IID}/actions/restart" -d '{}' | jq .

      - name: Comment result back on the watchdog issue
        if: ${{ always() && inputs.issue_number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ inputs.issue_number }}
          REPO: ${{ github.repository }}
          IID: ${{ steps.resolve.outputs.instance_id }}
          NODE: ${{ inputs.node_name }}
          REASON: ${{ inputs.reason }}
          OUTCOME: ${{ steps.restart.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = "success" ]; then
            STATUS="Dispatched a Contabo restart for instance \`${IID:-unknown}\` (node \`${NODE:-unknown}\`)."
            FOOTER="The node should re-register within a few minutes of the VM coming back up (verify with \`kubectl get nodes\` via cluster-query.yml). This does **not** close this issue automatically — confirm Ready=True and close once verified."
          else
            STATUS="Restart attempt for node \`${NODE:-unknown}\` FAILED — see the run log."
            FOOTER="No restart was performed. Check the run log for the actual error before retrying."
          fi
          {
            printf '%s\n\n' "$STATUS"
            printf 'Reason given: %s\n' "$REASON"
            printf 'Run: %s\n\n' "$RUN_URL"
            printf '%s\n' "$FOOTER"
          } > "${RUNNER_TEMP}/reboot-comment.md"
          gh issue comment "$ISSUE" --repo "$REPO" --body-file "${RUNNER_TEMP}/reboot-comment.md"
