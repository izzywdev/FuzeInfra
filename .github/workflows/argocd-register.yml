# ===========================================================================
# argocd-register
# ===========================================================================
# ONE-TIME registration of a consumer repo into the FuzeInfra cluster's ArgoCD.
#
# Supports two trigger modes:
#   1. workflow_dispatch (manual): for public repos or manual onboarding.
#      Pass repo, ref, path inputs — handler checks out the consumer repo.
#   2. repository_dispatch (type=argocd-register): for private repos or
#      automated dispatch on deploy/argocd/** changes.
#      Consumer bundles its deploy/argocd/ as base64-gzipped tar in
#      client_payload.argocd_bundle; handler extracts inline (no token needed).
#
# After the first registration, ArgoCD polls and self-syncs the consumer's
# deploy/argocd manifests — re-running this is safe (kubectl apply is idempotent)
# but normally unnecessary. Let ArgoCD own the steady state.
#
# Required repo secrets (FuzeInfra CI only):
#   KUBE_CONFIG   # base64 kubeconfig for the k3s server
#
# Example (manual, public repo):
#   gh workflow run argocd-register.yml \
#     -f repo=izzywdev/FuzeFront -f ref=main -f path=deploy/argocd
#
# Example (automated dispatch from private repo infra-dispatch.yml):
#   jq -nc '{event_type:"argocd-register",
#            client_payload:{repo:"izzywdev/MendysRobotics", argocd_bundle:"<base64-tar>"}}' \
#     | gh api repos/izzywdev/FuzeInfra/dispatches --input -

name: argocd-register

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Consumer repo to register (owner/name)"
        required: true
        type: string
      ref:
        description: "Ref to read the argo manifests from"
        required: false
        default: main
        type: string
      path:
        description: "Path in the consumer repo holding the Argo Application and AppProject manifests"
        required: false
        default: deploy/argocd
        type: string
  repository_dispatch:
    types: [argocd-register]

permissions:
  contents: read

concurrency:
  group: argocd-register-${{ github.event.client_payload.repo || inputs.repo }}
  cancel-in-progress: false

jobs:
  register:
    runs-on: staging
    steps:
      # --- Inline bundle mode (private repo dispatch) --------------------------
      - name: Extract inline argocd bundle (repository_dispatch with argocd_bundle)
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.argocd_bundle != ''
        run: |
          mkdir -p consumer/deploy/argocd
          echo "${{ github.event.client_payload.argocd_bundle }}" \
            | base64 -d \
            | tar -xz -C consumer/deploy/argocd --strip-components=0
          echo "Extracted inline argocd bundle from ${{ github.event.client_payload.repo }}"

      # --- Git checkout mode (workflow_dispatch or public repo) ----------------
      #
      # TOKEN MUST BE GH_TOKEN, NOT GITHUB_TOKEN. The built-in GITHUB_TOKEN is
      # scoped to THIS repository (FuzeInfra) and cannot read any other private
      # repo, so this step failed for every private consumer with a message that
      # reads like the repo does not exist:
      #
      #   remote: Repository not found.
      #   fatal: repository 'https://github.com/izzywdev/FuzeFinance/' not found
      #
      # "Repository not found" is what GitHub returns for BOTH "absent" and
      # "present but this token cannot see it" -- it deliberately does not leak
      # the existence of private repos. So the message sends the reader looking
      # for a deleted repo when the repo is fine and the TOKEN is wrong. Verified
      # on FuzeFinance, FuzeExecutive and FuzeBI (runs 41-43), all three of which
      # exist and had their manifests on main at the time.
      #
      # This made the file's own header untrue in practice: it offers
      # workflow_dispatch "for public repos or manual onboarding" and
      # repository_dispatch "for private repos", but NOT ONE consumer repo in the
      # family implements the repository_dispatch side (measured: zero workflows
      # anywhere send event_type argocd-register). So for every private consumer
      # the documented path did not exist and the available path could not work.
      # Registration for private repos had therefore never succeeded by either
      # route.
      #
      # GH_TOKEN is the cross-repo token this repo already uses in 49 places, and
      # publish-sealed-handoff.yml demonstrably clones and pushes to these same
      # private consumer repos with it.
      - name: Guard GH_TOKEN is present
        if: github.event_name == 'workflow_dispatch' || github.event.client_payload.argocd_bundle == ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Fail loudly and specifically. Without this the run dies later at
          # "Repository not found", which names the wrong problem.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=argocd-register::GH_TOKEN is not set. The built-in GITHUB_TOKEN cannot read another private repo; a cross-repo token is required to check out the consumer's deploy/argocd manifests." >&2
            exit 1
          fi
          echo "GH_TOKEN present."

      - name: Check out consumer argo manifests (git checkout mode)
        if: github.event_name == 'workflow_dispatch' || github.event.client_payload.argocd_bundle == ''
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.client_payload.repo || inputs.repo }}
          ref: ${{ github.event.client_payload.ref || inputs.ref || 'main' }}
          path: consumer
          token: ${{ secrets.GH_TOKEN }}
          sparse-checkout: |
            ${{ inputs.path || 'deploy/argocd' }}


      # `runs-on: staging` is a self-hosted runner that does NOT reliably ship
      # kubectl — the image drifted and caused all recent runs to fail with
      # "kubectl: command not found" (exit 127). Install explicitly so the workflow
      # is self-contained and survives runner rebuilds. See FuzeInfra#135.
      - name: Install kubectl
        run: |
          if command -v kubectl >/dev/null 2>&1; then
            kubectl version --client --short 2>/dev/null || kubectl version --client 2>/dev/null | head -3
            exit 0
          fi
          # Pin to cluster minor version; kubectl supports ±1 minor from the server.
          KUBECTL_VERSION="v1.31.4"
          curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x /tmp/kubectl
          mkdir -p "$HOME/.local/bin"
          mv /tmp/kubectl "$HOME/.local/bin/kubectl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Register Argo Applications (one-time)
        run: |
          REPO="${{ github.event.client_payload.repo || inputs.repo }}"
          DIR="consumer/deploy/argocd"
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            DIR="consumer/${{ inputs.path || 'deploy/argocd' }}"
          fi
          if [ ! -d "$DIR" ]; then
            echo "::error::No argo manifests directory found at $DIR — nothing to register."
            exit 1
          fi
          echo "Registering Argo manifests from $DIR (repo: $REPO)..."
          # AppProjects ARE applied here — this is a deliberate reversal of the
          # issue-#625 policy that filtered them out (PR #629). The owner decided
          # (#639) that consumers must own their AppProject so they can manage their
          # own destination/resource allow-lists without a FuzeInfra PR for every
          # change. FuzeInfra's own AppProjects live in argocd/projects/ and are
          # applied by deploy-prod.yml, which is a separate path.
          for manifest in "$DIR"/*.yaml "$DIR"/*.yml; do
            [ -f "$manifest" ] || continue
            kubectl apply -f "$manifest"
          done
          echo ""
          echo "Done. ArgoCD now owns these Applications and will self-sync future"
          echo "changes to deploy/argocd — do not re-run this for ordinary edits."
