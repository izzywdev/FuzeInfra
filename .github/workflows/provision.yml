name: Provision Managed Agents

# LOCAL reusable workflow, stamped into a roles-repo by sdlc-bootstrap (canonical copy lives
# in FuzeSDLC/workflow-templates and is kept current by governance-sync). Its caller is the
# stamped provision-sync.yml, which invokes it via `uses: ./.github/workflows/provision.yml`
# — deliberately LOCAL, since a cross-repo `uses:` into a private FuzeSDLC fails to resolve
# unless the hub's Actions access setting allows it, reddening the whole run.
#
# Creates/updates every environment +
# agent (+ vaults, memory, coordinators) idempotently for the selected provider from the
# CALLER repo's agent-templates/ tree, and uploads the id state (agent-ids/environment-ids/
# vault-ids/memory-ids.json) as an artifact — that state becomes the `handoff-state`
# ConfigMap the handoff MCP server mounts.
#

# Requires a Managed-Agents-entitled key as MANAGED_AGENTS_API_KEY (a Console API key
# with the managed-agents beta — NOT a Claude Code token) + the MCP URLs/tokens the role
# manifests reference. If the key is absent the job SKIPS (does not fail).

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to provision"
        default: "anthropic"
        type: choice
        options: ["anthropic"]
      dry_run:
        description: "Dry run (resolve + print only, no API calls)"
        default: false
        type: boolean
  workflow_call:
    inputs:
      provider:
        type: string
        default: "anthropic"
      dry_run:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Guard — Managed Agents key present
        id: guard
        env:
          MA_KEY: ${{ secrets.MANAGED_AGENTS_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" != "true" ] && [ -z "${MA_KEY}" ]; then
            echo "::notice::MANAGED_AGENTS_API_KEY not set — skipping provisioning for ${{ inputs.provider }}."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Guard — repo has an agent-templates tree
        id: haveframework
        if: steps.guard.outputs.ok == 'true'
        run: |
          if [ -f agent-templates/providers/provision.py ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no agent-templates/providers/provision.py in this repo — nothing to provision."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.ok == 'true' && steps.haveframework.outputs.ok == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - if: steps.guard.outputs.ok == 'true' && steps.haveframework.outputs.ok == 'true'
        run: pip install --quiet jsonschema requests

      - name: Validate manifests
        if: steps.guard.outputs.ok == 'true' && steps.haveframework.outputs.ok == 'true'
        working-directory: agent-templates
        run: python sync/validate.py

      - name: Provision (${{ inputs.provider }})
        if: steps.guard.outputs.ok == 'true' && steps.haveframework.outputs.ok == 'true'
        working-directory: agent-templates
        env:
          ANTHROPIC_API_KEY: ${{ secrets.MANAGED_AGENTS_API_KEY }}
          GITHUB_MCP_URL: ${{ secrets.GH_MCP_URL }}
          GITHUB_MCP_TOKEN: ${{ secrets.GH_MCP_TOKEN }}
          HANDOFF_MCP_URL: ${{ secrets.HANDOFF_MCP_URL }}
          HANDOFF_MCP_TOKEN: ${{ secrets.HANDOFF_MCP_TOKEN }}
          ATLASSIAN_MCP_URL: ${{ secrets.ATLASSIAN_MCP_URL }}
          SLACK_MCP_URL: ${{ secrets.SLACK_MCP_URL }}
          STRIPE_MCP_URL: ${{ secrets.STRIPE_MCP_URL }}
          GMAIL_MCP_URL: ${{ secrets.GMAIL_MCP_URL }}
          TELEGRAM_MCP_URL: ${{ secrets.TELEGRAM_MCP_URL }}
          TWILIO_MCP_URL: ${{ secrets.TWILIO_MCP_URL }}
          FIGMA_MCP_URL: ${{ secrets.FIGMA_MCP_URL }}
          CRM_MCP_URL: ${{ secrets.CRM_MCP_URL }}
          CALENDAR_MCP_URL: ${{ secrets.CALENDAR_MCP_URL }}
          SUPPORT_MCP_URL: ${{ secrets.SUPPORT_MCP_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python providers/provision.py --provider "${{ inputs.provider }}" --dry-run
          else
            python providers/provision.py --provider "${{ inputs.provider }}"
          fi

      - name: Upload id state (for the handoff-state ConfigMap)
        if: steps.guard.outputs.ok == 'true' && steps.haveframework.outputs.ok == 'true' && inputs.dry_run != true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: managed-agents-state-${{ inputs.provider }}
          path: agent-templates/sync/.state/*.json
          if-no-files-found: warn
