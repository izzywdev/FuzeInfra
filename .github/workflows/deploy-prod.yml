name: Deploy FuzeInfra – Production

# Triggers on helm chart changes merged to main.
# ArgoCD (running on the Contabo k3s cluster) owns the actual Helm deployment.
# This workflow validates the chart and then triggers an immediate ArgoCD sync
# so the rollout starts seconds after merge rather than waiting for the poll cycle.
on:
  push:
    branches: [main]
    paths:
      - 'helm/**'
      - 'deploy/sealed-secrets/**'
      # Any Application or AppProject manifest — the registration step below globs
      # both directories, so listing files individually only risks going stale.
      - 'argocd/applications/**'
      - 'argocd/projects/**'
      - 'runners/arc/gitops/**'
      - '.github/workflows/deploy-prod.yml'
  workflow_dispatch:

jobs:
  validate-and-sync:
    name: Validate → ArgoCD sync
    runs-on: staging
    environment: production

    env:
      # The apps this workflow kicks AND waits on. Single source of truth so the
      # trigger loop and the wait step can never drift apart.
      # FuzeInfra-owned Applications only. Consumer apps (e.g. fuzequality) carry
      # selfHeal and converge on their own; gating this deploy on their sync state
      # let one consumer app's failed hook (a stuck kafka-topics Job) freeze the
      # whole FuzeInfra deploy signal — see #682. Their health is theirs to own.
      SYNC_APPS: "fuzeinfra-prod sealed-secrets fuzeinfra-sealed-secrets arc-selfheal litellm"
      # Per-app budget for reaching Synced. 600s (10 min) to accommodate first-boot
      # of newly-provisioned stateful services (e.g. Neo4j fresh PVC + image pull
      # + DB bootstrap easily exceeds 5 min on cold start).
      SYNC_WAIT_TIMEOUT: "600"

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - name: Install verified Argo CD CLI
        run: |
          set -euo pipefail
          version=v3.4.2
          curl -fsSLO "https://github.com/argoproj/argo-cd/releases/download/${version}/argocd-linux-amd64"
          curl -fsSLO "https://github.com/argoproj/argo-cd/releases/download/${version}/cli_checksums.txt"
          grep ' argocd-linux-amd64$' cli_checksums.txt | sha256sum -c -
          sudo install -m0755 argocd-linux-amd64 /usr/local/bin/argocd
          argocd version --client

      - name: Helm lint (contabo values)
        run: helm lint helm/fuzeinfra -f helm/fuzeinfra/values-contabo.yaml

      - name: Install kubeconform
        run: |
          if ! command -v kubeconform &>/dev/null; then
            curl -sSLo /tmp/kubeconform.tar.gz \
              https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
            tar -xzf /tmp/kubeconform.tar.gz -C /tmp
            sudo install /tmp/kubeconform /usr/local/bin/kubeconform
          fi

      - name: Helm template + kubeconform
        run: |
          helm template fuzeinfra helm/fuzeinfra \
            -f helm/fuzeinfra/values-contabo.yaml \
            --namespace fuzeinfra \
            | kubeconform -strict -ignore-missing-schemas

      # Trigger an immediate ArgoCD sync via kubectl patch.
      # Requires KUBE_CONFIG secret (set by `terraform apply` in terraform/contabo/).
      # If the secret is absent the deploy is skipped with a warning.
      - name: Register standalone Argo apps + trigger sync
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::error::KUBE_CONFIG secret not set — production sync cannot run."
            echo "Run 'terraform apply' in terraform/contabo/ to provision the server and set the secret."
            exit 1
          fi
          echo "$KUBE_CONFIG" | base64 -d > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig

          # AppProjects are the destination/security boundary and must exist
          # before their Applications are registered or synchronized. An Application
          # naming a project that does not exist yet is rejected outright with
          # InvalidSpecError (this bit arc-selfheal, which lives in arc-systems, and
          # again fuzemarket).
          #
          # Register EVERY project, for the same reason the Application loop below
          # globs: this was a hand-maintained list of three (fuzefront, fuzeinfra,
          # fuzemarket) while argocd/projects/ also held fuzeagent, fuzepicker and
          # fuzeplan. Those three were applied once by hand and never reconciled
          # after, so an edit to them in Git silently did nothing and a VPS rebuild
          # would drop them entirely — exactly the drift the Applications glob was
          # introduced to kill. A glob cannot go stale the same way.
          #
          # NOTE: this means edits to fuzeagent/fuzepicker/fuzeplan projects now
          # take effect on merge instead of needing a manual apply. That is the
          # point, but it does make Git authoritative for their destination lists.
          for f in argocd/projects/*.yaml; do
            kubectl apply -f "$f"
            echo "registered $(basename "$f" .yaml) AppProject"
          done

          # Register the standalone Application manifests idempotently on every prod
          # deploy. Terraform only applies them on first-provision, so on a VPS
          # rebuild (or if one was never registered — e.g. sealed-secrets, #88) they
          # would silently go missing. apply -f makes the repo the source of truth.
          # Register EVERY Application manifest in argocd/applications/, except the
          # ones scoped to another environment. This was a hand-maintained list and
          # it went stale: argocd/applications/arc-runners.yaml (8 ARC scale-set
          # Applications) was never added, so those Applications existed in Git but
          # NOT in the cluster — the GitOps wiring was declared and inert, and the
          # live scale sets drifted from runner-scale-set-values.yaml indefinitely.
          # A glob cannot go stale the same way.
          #
          # NOTE: file basename != Application name for some manifests
          # (fuzeagent.yaml -> fuzeagent-apps, arc-runners.yaml -> 8 apps), which is
          # why this iterates FILES while the sync loop below iterates NAMES.
          SKIP_APPS="fuzeinfra-local fuzeinfra-aws"   # kind / EKS overlays — never prod
          for f in argocd/applications/*.yaml; do
            app=$(basename "$f" .yaml)
            case " $SKIP_APPS " in
              *" $app "*) echo "skipped $app (other environment)"; continue;;
            esac
            kubectl apply -f "$f"
            echo "registered $app"
          done

          # Kick an immediate sync so the rollout starts seconds after merge.
          # Deliberately an explicit list, NOT every registered app: forcing a hard
          # refresh + sync on the ARC scale sets would restart listeners and can
          # disrupt in-flight CI jobs. Those Applications carry selfHeal, so Argo
          # converges them on its own without being kicked.
          for app in $SYNC_APPS; do
            # Ensure the sync renders this Git revision instead of reusing a
            # cached Helm result whose reported revision has already advanced.
            kubectl -n argocd annotate application "$app" \
              argocd.argoproj.io/refresh=hard --overwrite
            kubectl -n argocd patch application "$app" --type merge \
              -p '{"operation":{"initiatedBy":{"username":"ci"},"sync":{}}}'
            echo "sync triggered for $app"
          done

      # Until this step existed the job ended here, two seconds after the last
      # patch call — so a green "Deploy FuzeInfra – Production" meant only that a
      # sync had been REQUESTED, never that it landed. That is a misleading signal
      # on a GitOps repo whose whole contract is "merge to main = live in prod",
      # and it actively misleads debugging: a change can sit unapplied for tens of
      # minutes behind a green tick while everyone reads the tick as proof it is
      # deployed. (Cost real time chasing a FuzeMarket RBAC grant that a green
      # deploy said was live and was not.)
      #
      # Waiting on SYNC status only, deliberately not --health:
      #   sync   = "the cluster now has the manifests this commit describes", which
      #            is exactly the claim the green tick should be making, and is
      #            entirely caused by this deploy.
      #   health = workload readiness, which routinely degrades for reasons no
      #            single deploy owns (a CrashLoop from a missing secret, a node
      #            under pressure, a scaled-to-0 StatefulSet). Gating on it would
      #            make prod deploys red for pre-existing conditions and train
      #            people to ignore the result — the same failure in a new place.
      # Health is still reported, as a warning, so a degraded app stays visible.
      - name: Wait for ArgoCD syncs to land
        run: |
          set -euo pipefail
          export KUBECONFIG=/tmp/kubeconfig
          kubectl config set-context --current --namespace=argocd
          argocd login --core

          failed=""
          for app in $SYNC_APPS; do
            if argocd app wait "$app" --core --operation --sync \
                 --timeout "$SYNC_WAIT_TIMEOUT"; then
              health=$(kubectl -n argocd get application "$app" \
                         -o jsonpath='{.status.health.status}' 2>/dev/null || echo Unknown)
              if [ "$health" = Healthy ]; then
                echo "$app synced and healthy"
              else
                echo "::warning::$app is Synced but health=$health (not failing the deploy — health degrades for reasons one deploy does not own; investigate if it persists)"
              fi
            else
              # argocd app wait --operation timed out.  Distinguish between:
              #   OutOfSync  → real failure (code bug or merge conflict)
              #   Synced     → operation still Running because a StatefulSet is
              #                rolling (pod not yet Ready).  The Git↔cluster sync
              #                already landed; the pod will catch up.  Treat as a
              #                warning so we don't false-alarm every time a probe
              #                or image change triggers a slow Longhorn rollout.
              sync_status=$(kubectl -n argocd get application "$app" \
                              -o jsonpath='{.status.sync.status}' 2>/dev/null || echo Unknown)
              if [ "$sync_status" = "Synced" ]; then
                echo "::warning::$app operation still in-progress after ${SYNC_WAIT_TIMEOUT}s (StatefulSet rollout) — sync status is Synced so deploy is valid; pod will catch up"
                kubectl -n argocd get application "$app" -o jsonpath='
          sync:      {.status.sync.status}
          health:    {.status.health.status}
          phase:     {.status.operationState.phase}
          message:   {.status.operationState.message}
          ' 2>/dev/null || true
              else
                echo "::error::$app did not reach Synced within ${SYNC_WAIT_TIMEOUT}s (sync status: $sync_status)"
                # Print why, so the failure is actionable from the log alone rather
                # than needing someone to go get cluster access.
                kubectl -n argocd get application "$app" -o jsonpath='
          sync:      {.status.sync.status}
          health:    {.status.health.status}
          phase:     {.status.operationState.phase}
          message:   {.status.operationState.message}
          revision:  {.status.sync.revision}
          ' 2>/dev/null || true
                echo
                failed="$failed $app"
              fi
            fi
          done

          if [ -n "$failed" ]; then
            echo "::error::sync did not land for:$failed"
            exit 1
          fi
          echo "all syncs landed"
