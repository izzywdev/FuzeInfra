name: Provision FuzePlan Neo4j instance

# Bootstrap provisioning for the FuzePlan dedicated Neo4j StatefulSet.
# Supersedes the manual scripts/seed-neo4j-instance.sh that shipped with #529.
#
# What this workflow does atomically:
#   1. Generates a cryptographically random hex password for the FuzePlan Neo4j.
#   2. Seals it as `neo4j-fuzeplan-credentials` (key: password) for the
#      fuzeinfra namespace — the StatefulSet reads NEO4J_PASSWORD via secretKeyRef,
#      then builds NEO4J_AUTH=neo4j/$(NEO4J_PASSWORD) at container start.
#   3. Sets FUZEPLAN_NEO4J_PASSWORD on izzywdev/FuzePlan so the app's own
#      Helm chart / SealedSecrets can seal its bolt-URL credential.
#   4. Flips the `fuzeplan` serviceNeo4jInstances gate to enabled:true in
#      helm/fuzeinfra/values-contabo.yaml.
#   5. Opens a PR in FuzeInfra with the ciphertext + gate flip.
#
# After the PR merges, Argo applies the SealedSecret; the controller decrypts it
# and the StatefulSet boots with NEO4J_AUTH=neo4j/<password>.  FuzePlan then
# connects via bolt://fuzeinfra-neo4j-fuzeplan.fuzeinfra.svc.cluster.local:7687.
#
# Resolves the GitOps gap from FuzeInfra #157.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: provision-fuzeplan-neo4j
  cancel-in-progress: false

jobs:
  provision:
    runs-on: staging
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install kubeseal
        run: |
          set -euo pipefail
          version=0.27.1
          curl -fsSL -o /tmp/kubeseal.tgz \
            "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${version}/kubeseal-${version}-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeseal.tgz -C /tmp kubeseal
          sudo install -m0755 /tmp/kubeseal /usr/local/bin/kubeseal

      - name: Install GitHub CLI
        run: |
          set -euo pipefail
          version=2.74.2
          archive="gh_${version}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/cli/cli/releases/download/v${version}/${archive}"
          curl -fsSLO "https://github.com/cli/cli/releases/download/v${version}/gh_${version}_checksums.txt"
          grep " ${archive}$" "gh_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive"
          sudo install -m0755 "gh_${version}_linux_amd64/bin/gh" /usr/local/bin/gh
          gh --version

      - name: Generate credentials, seal, set GH secret, open PR
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$GH_TOKEN" || { echo '::error::GH_TOKEN is required (needs repo + secrets:write on FuzePlan)'; exit 1; }

          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          # Generate a 48-char hex password (192 bits of entropy).
          # Hex is alphanumeric [0-9a-f] — safe for Neo4j NEO4J_AUTH env var
          # which embeds the password directly: NEO4J_AUTH=neo4j/<password>.
          neo4j_password=$(openssl rand -hex 24)
          echo "::add-mask::$neo4j_password"
          printf '%s' "$neo4j_password" > "$work/neo4j-password"

          # Seal for strict scope: fuzeinfra/neo4j-fuzeplan-credentials
          bash scripts/seal-secret.sh "fuzeinfra/neo4j-fuzeplan-credentials" \
            "password=@$work/neo4j-password" \
            --cert deploy/sealed-secrets/sealing-cert.pem \
            --out "deploy/sealed-secrets/neo4j-fuzeplan-credentials.yaml"

          # Deliver plaintext password to FuzePlan repo as a GH Actions secret
          # so its Helm chart can seal its own NEO4J_URI credential.
          gh secret set FUZEPLAN_NEO4J_PASSWORD \
            --repo izzywdev/FuzePlan \
            --body "$neo4j_password"

          # Flip the serviceNeo4jInstances gate in values-contabo.yaml.
          # Use '--' before the pattern so grep doesn't parse '- name:...' as flags.
          # '- name: fuzeplan-repo-digester' (Chroma) has enabled:true so the
          # -c 'enabled: false' count is unaffected even if it also matches.
          config=helm/fuzeinfra/values-contabo.yaml
          before=$(grep -A1 -- '- name: fuzeplan' "$config" | grep -c 'enabled: false' || true)
          test "$before" -eq 1 || { echo '::error::fuzeplan neo4j gate not found or already enabled'; exit 1; }
          sed -i '/- name: fuzeplan/{n;s/enabled: false/enabled: true/;}' "$config"
          remaining=$(grep -A1 -- '- name: fuzeplan' "$config" | grep -c 'enabled: false' || true)
          test "$remaining" -eq 0 || { echo '::error::fuzeplan neo4j gate still disabled after sed'; exit 1; }

          run_id="${{ github.run_id }}"
          branch="provision/fuzeplan-neo4j-$run_id"
          git config --local --unset-all http.https://github.com/.extraheader || true
          gh auth setup-git
          git config user.name 'FuzeInfra Provisioning'
          git config user.email 'provisioning@fuzeinfra'
          git checkout -b "$branch"
          git add deploy/sealed-secrets/neo4j-fuzeplan-credentials.yaml \
                  helm/fuzeinfra/values-contabo.yaml
          git commit -m "feat(neo4j): provision FuzePlan dedicated Neo4j instance (#157)"
          git push origin "$branch"
          pr_body="Provisions the FuzePlan dedicated Neo4j StatefulSet via GitOps. Adds strict-scoped ciphertext for the fuzeinfra/neo4j-fuzeplan-credentials Secret (key: password) and flips serviceNeo4jInstances[fuzeplan].enabled to true. FUZEPLAN_NEO4J_PASSWORD is now set on izzywdev/FuzePlan. No plaintext secret material. After merge, Argo applies the SealedSecret; the controller decrypts it and the StatefulSet boots with NEO4J_AUTH=neo4j/\$(NEO4J_PASSWORD). Bolt address: bolt://fuzeinfra-neo4j-fuzeplan.fuzeinfra.svc.cluster.local:7687. Resolves the GitOps gap from #157."
          gh pr create \
            --repo izzywdev/FuzeInfra \
            --base main \
            --head "$branch" \
            --title "feat(neo4j): provision FuzePlan dedicated Neo4j instance" \
            --body "$pr_body"
