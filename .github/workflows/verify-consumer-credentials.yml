# =============================================================================
# verify-consumer-credentials — the detection half of FuzeInfra#510.
#
# THE POINT: a stale credential breaks NOTHING until a pod restarts. In #499 the
# consumer's sealed DATABASE_URL froze on 2026-07-09 and the cluster kept running
# fine; the outage only began weeks later when pods were rescheduled and loaded
# it, then took 5–6 days to diagnose. A working delivery channel does not fix
# that on its own — a channel can break again, and it will break silently for the
# same reason.
#
# So: every 6 hours, take the credential the consumer ACTUALLY holds (the live
# Secret in the consumer's namespace, i.e. whatever Argo last decrypted from
# their committed SealedSecret) and try to authenticate with it for real. Applied
# to #499 this fires on DAY ONE, and — the part that matters — it fires BEFORE
# any pod restarts, i.e. before there is an outage at all.
#
# On failure it does two things, both on channels this repo already uses:
#   1. Files a deduped GitHub issue in the OWNING repo, resolved exactly the way
#      grafana-crit-fix.yml resolves it — the `fuzeinfra.io/owner-repo` annotation
#      on the emitting namespace, falling back to FuzeInfra.
#   2. Sends the Telegram 🔴, same secrets as argo-outofsync-autofix.yml.
# It also asks publish-sealed-handoff to re-publish, so the common case (the
# consumer is simply behind) self-heals into a PR without anyone being paged.
#
# NO PLAINTEXT: the value is read into a umask-077 temp file, handed to psql
# through PGPASSWORD (the environment — never argv, which `ps` exposes), and the
# only things that reach this log are a sha256[:16] fingerprint, psql's own error
# text, and a verdict. See scripts/credential-handoff.sh.
#
# Secrets: KUBE_CONFIG, GH_TOKEN (issues:write on consumer repos),
#          TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
# =============================================================================
name: verify-consumer-credentials

on:
  workflow_dispatch:
    inputs:
      id:
        description: 'Hand-off id to verify (blank = every enabled entry)'
        required: false
        default: ''
  repository_dispatch:
    types: [verify-consumer-credentials]
  schedule:
    # Offset from publish-sealed-handoff so a verify never races a publish.
    - cron: '53 */6 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-consumer-credentials
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.check.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Ensure psql
        run: |
          set -euo pipefail
          command -v psql >/dev/null 2>&1 && { psql --version; exit 0; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version

      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$KUBE_CONFIG" ]; then echo "::error::KUBE_CONFIG unset"; exit 1; fi
          umask 077
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"

      - name: Authenticate with the credential each consumer holds
        id: check
        env:
          HANDOFF_ID: ${{ github.event.inputs.id || github.event.client_payload.id }}
          HANDOFF_FAILURE_FILE: ${{ runner.temp }}/handoff-failures.tsv
        run: |
          set -uo pipefail
          args=(verify)
          case "${HANDOFF_ID:-}" in
            "") : ;;
            *[!a-z0-9-]*) echo "::error::invalid hand-off id"; exit 1 ;;
            *) args+=(--id "$HANDOFF_ID") ;;
          esac
          : > "$HANDOFF_FAILURE_FILE"
          if bash scripts/credential-handoff.sh "${args[@]}"; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
            echo "All enabled hand-offs authenticated." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Credential verification FAILED"
              echo ""
              echo "| hand-off | consumer | namespace | mode | detail |"
              echo "|---|---|---|---|---|"
              while IFS=$'\t' read -r id repo ns mode detail; do
                [ -z "$id" ] && continue
                printf '| `%s` | `%s` | `%s` | `%s` | %s |\n' "$id" "$repo" "$ns" "$mode" "$detail"
              done < "$HANDOFF_FAILURE_FILE"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Same resolution rule as grafana-crit-fix.yml: the owning repo is declared
      # by the `fuzeinfra.io/owner-repo` annotation on the consumer's namespace.
      # The registry's consumerRepo is only a fallback hint — the annotation is
      # the platform's routing source of truth, and it is validated to a strict
      # owner/repo slug before it can reach `gh --repo`.
      - name: File a deduped issue in the owning repo
        if: steps.check.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          FAILURES: ${{ runner.temp }}/handoff-failures.tsv
          DEFAULT_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          while IFS=$'\t' read -r id registry_repo ns mode detail; do
            [ -z "$id" ] && continue

            OWNER_REPO="$DEFAULT_REPO"
            ANNOT="$(kubectl get ns "$ns" \
                      -o jsonpath='{.metadata.annotations.fuzeinfra\.io/owner-repo}' 2>/dev/null || true)"
            if printf '%s' "$ANNOT" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
              OWNER_REPO="$ANNOT"
            elif printf '%s' "$registry_repo" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
              OWNER_REPO="$registry_repo"
            fi

            TITLE="Credential for hand-off \`${id}\` does not authenticate"
            EXISTING="$(gh issue list --repo "$OWNER_REPO" --state open \
                          --label credential-drift --search "$id in:title" \
                          --json number --jq '.[0].number' 2>/dev/null || true)"
            if [ -n "$EXISTING" ]; then
              echo "issue #$EXISTING already open on $OWNER_REPO for $id — not filing a duplicate"
              continue
            fi

            {
              printf 'The credential currently deployed in `%s` **fails to authenticate**.\n\n' "$ns"
              printf -- '- Hand-off id: `%s`\n' "$id"
              printf -- '- Failure mode: `%s`\n' "$mode"
              printf -- '- Detail: %s\n' "$detail"
              printf -- '- Detected by: %s\n\n' "$RUN_URL"
              printf 'This is the check added for FuzeInfra#510. It runs every 6h and\n'
              printf 'authenticates with the value your namespace actually holds, so this\n'
              printf 'fires while the running pods are still fine — **before** a restart\n'
              printf 'turns it into an outage.\n\n'
              printf '### What happens next\n'
              printf 'FuzeInfra automatically re-publishes the credential as ciphertext:\n'
              printf 'look for an open `handoff/%s-*` PR on this repo and merge it. Argo\n' "$id"
              printf 'CD then syncs the new value. No plaintext is handled by anyone.\n\n'
              printf 'If no such PR appears, the delivery channel itself is broken —\n'
              printf 'check FuzeInfra `publish-sealed-handoff`.\n'
            } > /tmp/issue_body.md

            gh issue create --repo "$OWNER_REPO" --title "$TITLE" \
              --body-file /tmp/issue_body.md --label credential-drift 2>/dev/null \
              || gh issue create --repo "$OWNER_REPO" --title "$TITLE" --body-file /tmp/issue_body.md \
              || echo "::warning::could not file an issue on $OWNER_REPO (GH_TOKEN scope?)"
          done < "$FAILURES"

      # Self-heal: the most likely cause is simply that the consumer is behind.
      # Asking the publisher to reconcile turns that into a ready-to-merge PR.
      - name: Request a re-publish
        if: steps.check.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          gh workflow run publish-sealed-handoff.yml --repo "${{ github.repository }}" \
            || echo "::warning::could not trigger publish-sealed-handoff"

      - name: Telegram 🔴
        if: steps.check.outputs.failed == 'true'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -z "${TOKEN:-}" ] && { echo "::warning::TELEGRAM_BOT_TOKEN unset — skipping alert"; exit 0; }
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=🔴 A consumer credential no longer authenticates. Running pods are probably still fine — this fires before a restart makes it an outage. ${RUN_URL}" \
            --data "disable_web_page_preview=true" >/dev/null && echo "telegram sent" \
            || echo "::warning::telegram send failed"

      - name: Fail the run
        if: steps.check.outputs.failed == 'true'
        run: |
          echo "::error::at least one consumer credential failed to authenticate — see the job summary"
          exit 1
