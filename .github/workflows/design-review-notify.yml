# fuze:fork — deliberately NOT `fuze:managed`, so governance-sync never reconciles it.
#
# Content-identical to `workflow-templates/design-review-notify.yml` apart from two
# deliberate repo changes, both of which stamping would revert:
#
#   * MENTION CONVENTION. This file was migrated @claude -> @fuze by commit 1811ff3
#     ("migrate @claude -> @fuze in docs, workflows, and schemas"). FuzeInfra runs BOTH
#     handlers — claude.yml triggers on `@claude`, fuze.yml on `@fuze` — and the designer
#     instructions in the Telegram message deliberately point at the @fuze one. The canonical
#     still says @claude.
#   * PIN. appleboy/telegram-action is pinned here at v1.1.1 (214f06cf...); the canonical is
#     still on v0.1.1 (2efd2328...), so reconciling would be a downgrade.
#
# The right way to close this gap is to land the @fuze rename and the pin bump in the
# FuzeSDLC canonical, then stamp. Until then the divergence is intentional, not drift.

name: Design Review — Notify via Telegram

# Fires when any issue is labeled `design-review`.
# Sends a Telegram message with an inline link to the issue so the product
# owner can review design frames and comment `@fuze approve` or
# `@fuze reject: <reason>` to trigger the next Claude Code cloud session.

on:
  issues:
    types: [labeled]

jobs:
  notify:
    if: github.event.label.name == 'design-review'
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram design-review notification
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1  # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🎨 *Design Review Required*

            *Issue:* [${{ github.event.issue.title }}](${{ github.event.issue.html_url }})
            *Repo:* `${{ github.repository }}`
            *Opened by:* ${{ github.event.issue.user.login }}

            Review the design frames in the issue, then comment on the issue:
            • `@fuze approve` — continue implementation
            • `@fuze reject: <reason>` — send back for revision
