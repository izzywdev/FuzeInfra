name: Build & Push API-VIP keepalived Image

# Builds ghcr.io/izzywdev/fuzeinfra-keepalived — keepalived + bash + curl + jq,
# the image the API active-active VIP DaemonSet runs
# (helm/fuzeinfra/templates/api-vip-keepalived.yaml, apiVip.keepalived.image).
# See docs/runbooks/api-floating-vip.md.

on:
  push:
    branches: [main]
    paths:
      - 'images/keepalived/**'
      - '.github/workflows/build-api-vip-keepalived-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'images/keepalived/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push fuzeinfra-keepalived
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/fuzeinfra-keepalived
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: images/keepalived
          file: images/keepalived/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
