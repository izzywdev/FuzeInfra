name: ca-reinstall-controlplane

# Reinstall a CONTROL-PLANE / durable node onto the private VLAN.
#
# WHY THIS EXISTS. ca-salvage-enroll deliberately refuses non-elastic templates:
# it enrols agents into the autoscaler pool, and a control plane reinstalled with
# an agent template silently loses its server role. That guard is correct and
# must stay. But it left NO path at all for the operation the private-VLAN
# cutover actually needs -- reinstalling a control plane so the Contabo eth1 NIC
# appears -- so the last leg of that cutover had no tooling. mendys-worker-1 has
# been NotReady since 2026-09-02 for exactly this reason: it carries the private
# networking add-on and is enlisted in network 60932, but the NIC only
# materialises on a reinstall (a reboot is not enough -- confirmed three times).
#
# This is the MIRROR of that guard, not a hole in it: control-plane/durable
# templates ONLY, and it refuses any instance in the elastic name prefix.
#
# WHAT IT DELIBERATELY DOES NOT DO. The CP template does not join k3s. It only
# prepares the host (eth1, firewall including the etcd peer/client ports a
# server needs, Longhorn prerequisites). The k3s SERVER join stays a deliberate
# operator step -- a control plane rejoining etcd is not something to put behind
# a single button.
#
# BEFORE RUNNING, non-negotiable (docs/runbooks/k3s-ha-etcd-migration.md):
#   1. k3s etcd-snapshot save                  -- the rollback net
#   2. kubectl delete node <name>              -- k3s reconciles etcd membership
#      from Node objects; reinstalling while the old member is still registered
#      leaves a member whose data no longer exists.
#   3. confirm every Longhorn volume has replicas OFF this node: the reinstall
#      wipes /var/lib/longhorn.
on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: 'Contabo instance ID of the control-plane/durable node to reinstall.'
        required: true
      node_name:
        description: 'k8s node name to render into the template (e.g. mendys-worker-1).'
        required: true
      template:
        description: 'Control-plane cloud-init template. Elastic templates are REFUSED.'
        default: 'cluster-autoscaler/contabo-externalgrpc/deploy/cp-userdata-eth1.template'
      mode:
        description: 'dry-run = render + validate (safe, no API write); reinstall = PUT reinstall (DESTRUCTIVE)'
        type: choice
        options: [dry-run, reinstall]
        default: dry-run
        required: true
      confirm:
        description: 'For mode=reinstall ONLY: type REINSTALL-CONTROL-PLANE to proceed.'
        default: ''

permissions:
  contents: read

jobs:
  reinstall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      # PREFLIGHT: refuse the reinstall if it would destroy the last copies of data.
      #
      # This replaces step 3 of the "BEFORE RUNNING, non-negotiable" comment in the
      # header ("confirm every Longhorn volume has replicas OFF this node"). That
      # instruction was followed on 2026-09-07 before reinstalling vmi3383846, it
      # PASSED, and the Prometheus TSDB was destroyed anyway -- every metric the
      # cluster had, gone. The instruction was not merely unenforced, it was the
      # WRONG TEST: a replica that "exists elsewhere" may be a rebuild that started
      # minutes ago and holds nothing. See scripts/preflight_node_teardown.py.
      #
      # Runs only for mode=reinstall: a dry-run mutates nothing, and gating it would
      # stop operators from using dry-run to inspect a cluster that is already
      # degraded -- exactly when they most need to look.
      - name: Preflight — would this reinstall destroy the last copy of any volume?
        if: ${{ inputs.mode == 'reinstall' }}
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          NODE_NAME: ${{ inputs.node_name }}
        run: |
          set -euo pipefail
          if [ -z "${KUBE_CONFIG:-}" ]; then
            echo "::error::KUBE_CONFIG is unset, so the data-safety preflight cannot run."
            echo "::error::Refusing rather than reinstalling blind — this gate exists because"
            echo "::error::an unchecked reinstall destroyed the Prometheus TSDB on 2026-09-07."
            exit 1
          fi
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          python3 scripts/preflight_node_teardown.py --node "$NODE_NAME"

      - name: Reinstall control-plane node
        env:
          CID: ${{ secrets.CONTABO_CLIENT_ID }}
          CSEC: ${{ secrets.CONTABO_CLIENT_SECRET }}
          CUSER: ${{ secrets.CONTABO_API_USER }}
          CPASS: ${{ secrets.CONTABO_API_PASSWORD }}
          K3S_SERVER_URL: ${{ secrets.K3S_SERVER_URL }}
          K3S_NODE_TOKEN: ${{ secrets.K3S_NODE_TOKEN }}
          NODE_SSH_PUBLIC_KEY: ${{ secrets.NODE_SSH_PUBLIC_KEY }}
          IMAGE_ID: ${{ secrets.CONTABO_IMAGE_ID }}
          ELASTIC_NAME_PREFIX: fuzeinfra-prod-elastic-v2
          INSTANCE_ID: ${{ inputs.instance_id }}
          NODE_NAME: ${{ inputs.node_name }}
          TEMPLATE_IN: ${{ inputs.template }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail

          if [ "$MODE" = "reinstall" ] && [ "$CONFIRM" != "REINSTALL-CONTROL-PLANE" ]; then
            echo "::error::mode=reinstall requires confirm=REINSTALL-CONTROL-PLANE"; exit 1
          fi

          TMPL="$TEMPLATE_IN"
          [ -f "$TMPL" ] || { echo "::error::template not found: $TMPL"; exit 1; }

          # Mirror of ca-salvage-enroll's guard. An agent template here would
          # silently demote a control plane to a worker.
          case "$(basename "$TMPL")" in
            cp-userdata*.template|durable-userdata*.template|ci-userdata*.template) ;;
            *)
              # The invariant is NOT ELASTIC, not "control plane only". Elastic
              # nodes belong to ca-salvage-enroll, whose own guard refuses any node
              # name outside the elastic prefix. Between the two guards, CI nodes
              # had no reinstall path at all -- which on 2026-09-07 turned an
              # ordinary VLAN repair on fuzeinfra-ci-runner-2 into "quarantine the
              # node and lose the capacity", stalling the whole fleet's CI.
              echo "::error::refusing template $TMPL. This workflow handles non-elastic nodes (control-plane, durable, ci); elastic nodes go through ca-salvage-enroll."
              exit 1 ;;
          esac

          case "$NODE_NAME" in
            "$ELASTIC_NAME_PREFIX"-*)
              echo "::error::refusing: node name is in the elastic prefix; use ca-salvage-enroll"
              exit 1 ;;
          esac

          ID=$(printf '%s' "$INSTANCE_ID" | tr -dc '0-9')
          [ -n "$ID" ] || { echo "::error::instance_id must be numeric"; exit 1; }
          [ -n "$IMAGE_ID" ] || { echo "::error::CONTABO_IMAGE_ID secret is unset"; exit 1; }

          TOK=$(curl -sS -X POST -H "Content-Type: application/x-www-form-urlencoded" \
            "https://auth.contabo.com/auth/realms/contabo/protocol/openid-connect/token" \
            --data-urlencode "client_id=${CID}" --data-urlencode "client_secret=${CSEC}" \
            --data-urlencode "username=${CUSER}" --data-urlencode "password=${CPASS}" \
            --data-urlencode "grant_type=password" | jq -r .access_token)
          [ -n "$TOK" ] && [ "$TOK" != "null" ] || { echo "::error::Contabo auth failed"; exit 1; }

          INST=$(curl -sS -H "Authorization: Bearer $TOK" \
            -H "x-request-id: $(cat /proc/sys/kernel/random/uuid)" \
            "https://api.contabo.com/v1/compute/instances/${ID}")
          CURNAME=$(echo "$INST" | jq -r '.data[0].displayName')
          STATUS=$(echo "$INST" | jq -r '.data[0].status')
          echo "instance $ID contaboName=$CURNAME status=$STATUS -> node $NODE_NAME"

          # Apply the inverse guard to what Contabo actually holds, not only to
          # the operator-supplied name.
          case "$CURNAME" in
            "$ELASTIC_NAME_PREFIX"-*)
              echo "::error::refusing: instance $ID belongs to the elastic pool"
              exit 1 ;;
          esac

          RENDERED=$(sed \
            -e "s|{{.NodeName}}|${NODE_NAME}|g" \
            -e "s|{{.K3SServerURL}}|${K3S_SERVER_URL}|g" \
            -e "s|{{.K3SNodeToken}}|${K3S_NODE_TOKEN}|g" \
            -e "s|__SSH_PUBLIC_KEY__|${NODE_SSH_PUBLIC_KEY}|g" \
            "$TMPL")
          if printf '%s' "$RENDERED" | grep -q '{{'; then
            echo "::error::unrendered template action remains"; exit 1; fi
          if ! printf '%s' "$RENDERED" | head -1 | grep -q '^#cloud-config'; then
            echo "::error::rendered userData must start with #cloud-config"; exit 1; fi
          echo "rendered userData bytes: $(printf '%s' "$RENDERED" | wc -c)"
          # The netplan config is the ONE artifact every template here must carry:
          # without it eth1 is never configured, and the whole point of this
          # workflow is to bring a node up on the VLAN. This used to print "MISS"
          # and CARRY ON, so a template missing it would happily reinstall a node
          # that could never reach the VLAN -- the exact failure class that stranded
          # fuzeinfra-ci-runner-2 and 871c48fc. It is now a hard failure.
          if printf '%s' "$RENDERED" | grep -qF "60-eth1-private.yaml"; then
            echo "  OK   60-eth1-private.yaml"
          else
            echo "::error::rendered userData has no 60-eth1-private.yaml — the node would come up with no eth1 config. Refusing."
            exit 1
          fi

          # The readiness sentinel is CP-SPECIFIC. Asserting it for every template
          # printed a bogus "MISS fuzeinfra-cp-eth1-ready" on the ci-userdata run
          # (2026-09-07) — a scary-looking line on a render that was perfectly
          # correct. Only claim it when the source template actually declares one.
          if grep -qE '/etc/fuzeinfra-[a-z0-9-]*-ready' "$TMPL"; then
            MARKER=$(grep -oE '/etc/fuzeinfra-[a-z0-9-]*-ready' "$TMPL" | head -1 | sed 's#^/etc/##')
            if printf '%s' "$RENDERED" | grep -qF "$MARKER"; then
              echo "  OK   $MARKER"
            else
              echo "::error::template declares $MARKER but the render lost it"; exit 1
            fi
          else
            echo "  --   (this template declares no readiness sentinel; not required)"
          fi

          # Does this template join the cluster by itself? Drives the closing
          # message below, which used to assert "does NOT join" unconditionally.
          if grep -qE 'get\.k3s\.io \| sh -s - (agent|server)' "$TMPL"; then
            SELF_JOINS=yes
          else
            SELF_JOINS=no
          fi
          echo "  self-joins: $SELF_JOINS"

          if [ "$MODE" = "dry-run" ]; then
            echo "[dry-run] WOULD PUT reinstall imageId=$IMAGE_ID onto instance $ID. No API write performed."
            exit 0
          fi

          BODY=$(jq -n --arg img "$IMAGE_ID" --arg ud "$RENDERED" '{imageId:$img, userData:$ud, defaultUser:"root"}')
          RC=$(curl -sS -o /tmp/reinstall.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $TOK" -H "Content-Type: application/json" \
            -H "x-request-id: $(cat /proc/sys/kernel/random/uuid)" \
            -d "$BODY" "https://api.contabo.com/v1/compute/instances/${ID}")
          echo "reinstall $ID -> HTTP $RC"
          if [ "$RC" != "200" ] && [ "$RC" != "201" ]; then
            cat /tmp/reinstall.json
            echo "::error::reinstall failed"
            exit 1
          fi
          echo "instance $ID is reinstalling."
          # This used to assert unconditionally that the template does not join, which
          # was already wrong for cp-userdata-eth1-join and became actively misleading
          # for ci-userdata: on 2026-09-07 it told the operator to "perform the server
          # join manually" for a node that had just joined itself as an agent. A
          # closing instruction that contradicts what the workflow did is worse than
          # no closing instruction.
          if [ "$SELF_JOINS" = "yes" ]; then
            echo "This template JOINS THE CLUSTER ITSELF once eth1 is up (systemd oneshot on boot)."
            echo "Nothing further to run. Watch for the node with:"
            echo "  kubectl get node $NODE_NAME -o wide     # InternalIP must be 10.0.0.x, not the public address"
            echo "If it comes back on its PUBLIC address, the vNIC did not attach and the node is off-VLAN:"
            echo "  pods on it cannot reach 10.43.0.1 even though the node reports Ready."
          else
            echo "This template does NOT join k3s -- it only prepares the host."
            echo "Perform the server join manually once eth1 is up, per"
            echo "docs/runbooks/k3s-ha-etcd-migration.md."
          fi
