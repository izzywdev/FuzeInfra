name: dataTier reconcile

# Reads .fuze/manifest.json from every consuming repo, compares dataTier[]
# against helm/fuzeinfra/values-contabo.yaml, and opens a PR if any
# provisions are missing.  Runs nightly + on workflow_dispatch so the gap
# is caught within 24 h of a new repo declaring its dataTier.
#
# The reconciler never writes credentials — it adds DISABLED stub entries
# that a human (or the devops-engineer agent) must enable after sealing the
# per-service password secret.

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC nightly
  workflow_dispatch:
    inputs:
      apply:
        description: "Append missing stub entries to values-contabo.yaml"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  reconcile:
    name: Reconcile dataTier declarations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run reconciler (report mode)
        id: reconcile
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set +e
          python scripts-tools/reconcile_datatier.py 2>&1 | tee /tmp/reconcile.out
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Run reconciler (apply mode)
        if: >
          steps.reconcile.outputs.exit_code != '0' &&
          (github.event_name == 'workflow_dispatch' && inputs.apply == true)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts-tools/reconcile_datatier.py --apply

      - name: Open PR for missing provisions
        if: >
          steps.reconcile.outputs.exit_code != '0' &&
          (github.event_name == 'workflow_dispatch' && inputs.apply == true)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          branch="datatier-reconcile/$(date +%Y%m%d-%H%M)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add helm/fuzeinfra/values-contabo.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(datatier): add missing dataTier stub entries from manifests [skip ci]"
          git push origin "$branch"
          gh pr create \
            --title "chore(datatier): missing dataTier provisions detected by reconciler" \
            --body "$(cat /tmp/reconcile.out)

          The reconciler found dataTier[] declarations in consuming repo manifests
          that are not yet reflected in \`values-contabo.yaml\`. Stub entries have
          been added as \`enabled: false\` — review, add the sealed-secret for each,
          flip \`enabled: true\`, and merge to trigger ArgoCD provisioning.

          Generated by \`datatier-reconcile.yml\` + \`scripts-tools/reconcile_datatier.py\`." \
            --head "$branch" \
            --base main

      - name: Fail if gaps exist (CI gate — report only mode)
        if: >
          steps.reconcile.outputs.exit_code != '0' &&
          !(github.event_name == 'workflow_dispatch' && inputs.apply == true)
        run: |
          echo "::error::dataTier gaps detected — see reconcile step output."
          echo "Re-run with 'Apply' checked to generate a fix PR, or add the missing"
          echo "entries to helm/fuzeinfra/values-contabo.yaml manually."
          exit 1
