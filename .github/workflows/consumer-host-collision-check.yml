# ===========================================================================
# consumer-host-collision-check — static guard against a consumer label
# publishing an infra-owned hostname
# ===========================================================================
# consumers.tfvars is GENERATED by cf-hosts-materialize.yml's auto-PR flow
# from a consumer repo's own deploy/cf/hosts.yaml. Every label in it gets a
# Cloudflare Access app with decision = "bypass" (no auth gate), and the
# tunnel's catch-all ingress rule + the *.prod.fuzefront.com wildcard CNAME
# mean any Ingress is internet-reachable the moment it exists. If a
# consumer-declared label ever collided with an infra-owned hostname
# ($routes in helm/fuzeinfra/templates/ingress.yaml, neo4j-ingress.yaml, or
# cloudflare.tf's launcher_services), merging the auto-PR would publish an
# infra service — potentially a raw datastore — to the public internet with
# zero auth in front of it. That policy previously existed only as a COMMENT
# in consumers.tfvars's own header; this workflow makes it an executable,
# required CI gate.
#
#   • Pull request touching the materialized tfvars OR any of the three
#     source-of-truth files → run the guard → FAIL on collision/wildcard.
#   • workflow_dispatch → manual trigger for verification.
#
# Safety / why static analysis:
#   • Requires NO credentials, NO Cloudflare/Terraform/cluster access.
#   • Requires NO terraform init/plan, NO helm template, NO network.
#   • The infra-owned hostname set is DERIVED from the real source files at
#     check time (never hand-copied), so it cannot drift out of date the way
#     a literal list would.
#   • Runs on every PR (fork PRs included) and never fails open.
# ---------------------------------------------------------------------------

name: Consumer host collision check

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/contabo/materialized/consumers.tfvars'
      - 'helm/fuzeinfra/templates/ingress.yaml'
      - 'helm/fuzeinfra/templates/neo4j-ingress.yaml'
      - 'terraform/contabo/cloudflare.tf'
      - 'scripts-tools/check_consumer_host_collisions.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collision-check:
    name: Guard consumer-host collisions (static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Consumer host collision guard
        run: python3 scripts-tools/check_consumer_host_collisions.py
