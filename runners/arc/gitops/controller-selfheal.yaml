# =============================================================================
# ARC self-heal / CI-capacity watchdog  (namespace: arc-systems)
#
# GitOps-managed by argocd/applications/arc-selfheal.yaml. This directory is an
# Argo *directory* source, so it must contain ONLY applyable manifests — never
# Helm values files (that is why this lives in runners/arc/gitops/ and not
# alongside runner-scale-set-values.yaml).
#
# It watches three independent failure modes that all end with "runner pods
# Pending forever, CI queues silently":
#
#   1. CONTROLLER WEDGED (2026-07-24) — the gha-rs-controller stopped creating
#      runner pods after transient generatejitconfig TLS timeouts; staging jobs
#      queued 30h. A rollout restart clears it.
#
#   2. CI NODE LOST ITS POOL LABEL (2026-07-27) — runner pods hard-select
#      `fuzeinfra.io/pool: ci` (runners/arc/runner-scale-set-values.yaml), and
#      the node label is set by k3s `--node-label` at AGENT REGISTRATION ONLY
#      (modules/contabo-k3s-node/cloud-init.tftpl). All 8 scale sets sat Pending
#      for 11h. A controller restart CANNOT fix this. The watchdog now auto-
#      repairs the label + taint on any node in CI_NODES when the label is absent,
#      then emits CRIT (routed by the fuzeinfra.io/owner-repo ns annotation —
#      docs/crit-log-autofix.md) and SKIPS the controller restart (the next run
#      will see the node and can restart if needed).
#
#   3. ONE SCALE SET'S LISTENER WEDGED ON A DEAD NODE (2026-08-02) — each scale
#      set has its own per-repo AutoscalingListener Pod in arc-systems
#      (label app.kubernetes.io/component=runner-scale-set-listener, e.g.
#      fuzehub-<hash>-listener). Checks 1+2 are cluster-wide/count-based, so
#      when the node under ONE listener pod goes NotReady the pod sticks in
#      Terminating forever (kubelet is unreachable, so the delete can never
#      complete) while every OTHER scale set stays healthy — `ephemeralrunner`
#      count across the cluster is still >0, so check 2 sees nothing wrong.
#      That one repo's CI queues silently with 0 desired runners. Observed:
#      fuzehub/fuzecontact/staging listeners stuck Terminating 3+ days on
#      `mendys-prod` after its kubelet died. Fixed by hand via
#      `kubectl delete pod <listener> -n arc-systems --grace-period=0 --force`,
#      which lets the AutoscalingListener controller recreate the pod on a
#      healthy node. Check 3 automates exactly that: force-delete any listener
#      pod that has been Terminating longer than $LISTENER_STUCK_SECS. This is
#      a symptom fix, not a root-cause fix — the dead node itself still needs
#      manual attention, so it also emits CRIT.
#
# NOTE ON THE IMAGE: this ran with `rancher/kubectl` + `command: ["sh","-c"]`
# from creation until 2026-07-27 and StartError'd on EVERY run — that image
# ships no shell. Any replacement image MUST contain /bin/sh. Check 3 also
# relies on this image's bundled /usr/bin/jq (with fromdateiso8601/now) to
# compute how long a pod has been Terminating — BusyBox `date -d` in this
# image does NOT parse RFC3339 timestamps, so don't rewrite check 3 to use it.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata: {name: arc-selfheal, namespace: arc-systems}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: arc-selfheal}
rules:
  - {apiGroups: ["actions.github.com"], resources: ["ephemeralrunners"], verbs: ["get","list"]}
  # Node patch access for check 1: auto-repair missing fuzeinfra.io/pool=ci label
  # and the fuzeinfra.io/ci=true:NoSchedule taint when they are absent from the
  # expected CI node(s). CRIT is still emitted so the incident is visible in logs.
  - {apiGroups: [""], resources: ["nodes"], verbs: ["get","list","patch"]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: arc-selfheal}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: arc-selfheal}
subjects: [{kind: ServiceAccount, name: arc-selfheal, namespace: arc-systems}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: arc-selfheal, namespace: arc-systems}
rules:
  - {apiGroups: ["apps"], resources: ["deployments"], verbs: ["get","patch"]}
  # AutoscalingListener pods live only in arc-systems (check 3) — namespaced
  # Role, not the cluster-wide ClusterRole, to keep delete scoped as tightly
  # as possible.
  - {apiGroups: [""], resources: ["pods"], verbs: ["get","list","delete"]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: arc-selfheal, namespace: arc-systems}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: arc-selfheal}
subjects: [{kind: ServiceAccount, name: arc-selfheal, namespace: arc-systems}]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arc-controller-selfheal
  namespace: arc-systems
  labels:
    app.kubernetes.io/name: arc-selfheal
    app.kubernetes.io/component: ci-watchdog
    app.kubernetes.io/part-of: arc
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  # Do not fire a backlog of missed runs after an apiserver/node outage.
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: arc-selfheal
            app.kubernetes.io/component: ci-watchdog
        spec:
          serviceAccountName: arc-selfheal
          restartPolicy: Never
          # Must be able to run when the CI pool itself is unschedulable — that
          # is precisely the condition check 1 exists to report.
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          containers:
            - name: selfheal
              # alpine/k8s = kubectl + busybox sh. Tag tracks the k3s server
              # version (v1.36.2+k3s1) to stay inside the kubectl skew policy.
              image: alpine/k8s:1.36.2
              imagePullPolicy: IfNotPresent
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits:   {cpu: 200m, memory: 128Mi}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  crit=0

                  # ---- check 1: a schedulable node carries fuzeinfra.io/pool=ci ----
                  # CI_NODES: nodes that SHOULD carry the label. k3s applies --node-label
                  # only at agent registration and Terraform never reconciles it, so the
                  # label can go missing after a VLAN cutover / node reinstall. This list
                  # stays in sync with runners/arc/runner-scale-set-values.yaml (which pins
                  # the scale sets to fuzeinfra.io/pool: ci via nodeSelector). Add a space-
                  # separated entry if a second durable CI node is ever enrolled.
                  CI_NODES="fuzeinfra-ci-runner-1"

                  nodes=$(kubectl get nodes -l fuzeinfra.io/pool=ci \
                    -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.unschedulable}{"\n"}{end}' 2>/dev/null)
                  total=$(printf '%s\n' "$nodes" | awk 'NF' | wc -l | tr -d ' ')
                  sched=$(printf '%s\n' "$nodes" | awk 'NF && $2!="true"' | wc -l | tr -d ' ')

                  if [ "$total" -eq 0 ]; then
                    echo "CRIT ARC ci-pool: no node carries fuzeinfra.io/pool=ci — attempting auto-repair on: $CI_NODES"
                    crit=1
                    for _node in $CI_NODES; do
                      if kubectl get node "$_node" >/dev/null 2>&1; then
                        # Restore the pool label
                        if kubectl label node "$_node" fuzeinfra.io/pool=ci --overwrite 2>/dev/null; then
                          echo "AUTO-FIXED label: kubectl label node $_node fuzeinfra.io/pool=ci --overwrite"
                        else
                          echo "WARN: could not label node $_node — may need manual: kubectl label node $_node fuzeinfra.io/pool=ci --overwrite"
                        fi
                        # Restore the CI taint (NoSchedule keeps non-CI workloads off this node)
                        if ! kubectl get node "$_node" -o jsonpath='{.spec.taints}' 2>/dev/null | grep -q 'fuzeinfra.io/ci'; then
                          if kubectl taint node "$_node" fuzeinfra.io/ci=true:NoSchedule --overwrite 2>/dev/null; then
                            echo "AUTO-FIXED taint: kubectl taint node $_node fuzeinfra.io/ci=true:NoSchedule --overwrite"
                          else
                            echo "WARN: could not taint node $_node — may need manual: kubectl taint node $_node fuzeinfra.io/ci=true:NoSchedule --overwrite"
                          fi
                        fi
                      else
                        echo "WARN: expected CI node $_node not found in cluster — cannot auto-repair"
                      fi
                    done
                  elif [ "$sched" -eq 0 ]; then
                    echo "CRIT ARC ci-pool: all $total node(s) labelled fuzeinfra.io/pool=ci are cordoned; runner pods cannot schedule. Uncordon one or add CI capacity."
                    crit=1
                  else
                    echo "ok ci-pool: $sched/$total schedulable node(s) with fuzeinfra.io/pool=ci"
                  fi

                  # ---- check 2: controller still creating runner pods ----
                  ph=$(kubectl get ephemeralrunner -A \
                    -o jsonpath='{range .items[*]}{.status.phase}{"\n"}{end}' 2>/dev/null)
                  pend=$(printf '%s\n' "$ph" | grep -cvE 'Running|Succeeded|Failed|^$' || true)
                  run=$(printf '%s\n' "$ph" | grep -c 'Running' || true)
                  echo "ephemeralrunners: non-running=$pend running=$run"

                  if [ "$pend" -gt 0 ] && [ "$run" -eq 0 ]; then
                    if [ "$crit" -eq 1 ]; then
                      # Restarting the controller cannot schedule a pod onto a pool
                      # with no schedulable node; the label auto-repair above already
                      # fired, so the next cron run will see the node and try a restart.
                      echo "runners stuck, but the CI pool above is the cause - NOT restarting the controller (auto-repair attempted above)"
                    else
                      echo "STUCK detected -> restarting ARC controller"
                      kubectl -n arc-systems rollout restart deployment/arc-controller-gha-rs-controller
                    fi
                  else
                    echo "ok controller: creating runners normally"
                  fi

                  # ---- check 3: per-scale-set listener wedged on a dead node ----
                  # A listener stuck Terminating past this is not "still shutting
                  # down" - normal termination completes in low tens of seconds.
                  LISTENER_STUCK_SECS=300
                  listeners_json=$(kubectl get pods -n arc-systems \
                    -l app.kubernetes.io/component=runner-scale-set-listener \
                    -o json 2>/dev/null)

                  if [ -z "$listeners_json" ]; then
                    echo "warn listener-pods: could not list scale-set listener pods, skipping check 3"
                  else
                    stuck=$(printf '%s' "$listeners_json" | jq -r --argjson thresh "$LISTENER_STUCK_SECS" '
                      .items[]
                      | select(.metadata.deletionTimestamp != null)
                      | select((now - (.metadata.deletionTimestamp | fromdateiso8601)) > $thresh)
                      | .metadata.name' 2>/dev/null)

                    if [ -z "$stuck" ]; then
                      echo "ok listener-pods: no scale-set listener stuck Terminating"
                    else
                      for name in $stuck; do
                        echo "CRIT ARC listener-pod: $name has been Terminating for over ${LISTENER_STUCK_SECS}s - likely wedged on a dead/NotReady node (kubelet unreachable, delete can never complete), so that scale set's CI has 0 runners while the rest of the cluster looks healthy. Force-deleting so the AutoscalingListener controller recreates it elsewhere; the underlying node still needs manual attention."
                        kubectl -n arc-systems delete pod "$name" --grace-period=0 --force >/dev/null 2>&1
                        crit=1
                      done
                    fi
                  fi

                  # Fail the Job on CRIT so PodFailed alerting and
                  # failedJobsHistoryLimit retain the evidence.
                  exit "$crit"
