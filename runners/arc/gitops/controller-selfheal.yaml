# =============================================================================
# ARC self-heal / CI-capacity watchdog  (namespace: arc-systems)
#
# GitOps-managed by argocd/applications/arc-selfheal.yaml. This directory is an
# Argo *directory* source, so it must contain ONLY applyable manifests — never
# Helm values files (that is why this lives in runners/arc/gitops/ and not
# alongside runner-scale-set-values.yaml).
#
# It watches three independent failure modes that all end with "runner pods
# Pending forever, CI queues silently":
#
#   1. CONTROLLER WEDGED (2026-07-24) — the gha-rs-controller stopped creating
#      runner pods after transient generatejitconfig TLS timeouts; staging jobs
#      queued 30h. A rollout restart clears it.
#
#   2. CI NODE LOST ITS POOL LABEL (2026-07-27) — runner pods hard-select
#      `fuzeinfra.io/pool: ci` (runners/arc/runner-scale-set-values.yaml), and
#      the node label is set by k3s `--node-label` at AGENT REGISTRATION ONLY
#      (modules/contabo-k3s-node/cloud-init.tftpl). All 8 scale sets sat Pending
#      for 11h. A controller restart CANNOT fix this. The watchdog now auto-
#      repairs the label + taint on any node in CI_NODES when the label is absent,
#      then emits CRIT (routed by the fuzeinfra.io/owner-repo ns annotation —
#      docs/crit-log-autofix.md) and SKIPS the controller restart (the next run
#      will see the node and can restart if needed).
#
#   3. ONE SCALE SET'S LISTENER WEDGED ON A DEAD NODE (2026-08-02) — each scale
#      set has its own per-repo AutoscalingListener Pod in arc-systems
#      (label app.kubernetes.io/component=runner-scale-set-listener, e.g.
#      fuzehub-<hash>-listener). Checks 1+2 are cluster-wide/count-based, so
#      when the node under ONE listener pod goes NotReady the pod sticks in
#      Terminating forever (kubelet is unreachable, so the delete can never
#      complete) while every OTHER scale set stays healthy — `ephemeralrunner`
#      count across the cluster is still >0, so check 2 sees nothing wrong.
#      That one repo's CI queues silently with 0 desired runners. Observed:
#      fuzehub/fuzecontact/staging listeners stuck Terminating 3+ days on
#      `mendys-prod` after its kubelet died. Fixed by hand via
#      `kubectl delete pod <listener> -n arc-systems --grace-period=0 --force`,
#      which lets the AutoscalingListener controller recreate the pod on a
#      healthy node. Check 3 automates exactly that: force-delete any listener
#      pod that has been Terminating longer than $LISTENER_STUCK_SECS. This is
#      a symptom fix, not a root-cause fix — the dead node itself still needs
#      manual attention, so it also emits CRIT.
#
#   3b. LISTENER ABSENT ENTIRELY (2026-08-26) — check 3's blind spot: if the
#      node under a listener dies and the pod is removed *cleanly*, or the ARC
#      controller simply never recreates it, the scale set ends up with NO
#      listener pod at all (not Terminating — just gone). Check 3 finds
#      nothing to force-delete, so that one repo's CI queues silently with 0
#      runners while the rest of the cluster (incl. the controller itself)
#      looks perfectly healthy. Observed: fuzecontact CI queued ~2.5h with its
#      `fuzecontact-<hash>-listener` absent, controller Running and healthily
#      cycling other repos' runners. Check 3b diffs every AutoscalingRunnerSet
#      against the actual listener pods and, on a miss, restarts the
#      controller so it re-reconciles every AutoscalingListener and recreates
#      the missing pod(s) — this is a symptom fix; the recurring node
#      instability behind it still needs separate ops attention.
#
#   4. A RUNNER POD HUNG ON A JOB HOLDS A maxRunners SLOT (2026-08-27) — the
#      other three checks are about pods that never START; this is a pod that
#      starts, picks up a job, and then never FINISHES. ARC runners are
#      ephemeral (one job per pod), so a job that hangs — a step with no
#      `timeout-minutes`, e.g. a Playwright/`docker compose up --wait` that
#      waits on a server that never comes up — pins its runner slot for up to
#      GitHub's 6h job cap. A repo whose scale set is `maxRunners: N` needs
#      only N such zombies to wedge its own CI at zero free slots while the
#      controller, listener, and node all look perfectly healthy; every check
#      above reports OK. Worse on this cluster: all scale sets share ONE
#      4-vCPU CI node, so a handful of zombies across repos also exhausts node
#      CPU/RAM, so OTHER repos' fresh runners go Pending too. Observed: fuzeplan
#      and fuzesdlc CI both queued for hours behind runner pods that had been
#      Running 2.5h+ still renewing the job lease (izzywdev/FuzePlan ci-cd.yml
#      "Run Playwright tests", no timeout-minutes). Check 4 reaps any
#      EphemeralRunner Running past $RUNNER_STUCK_SECS — well above any legit
#      job on this stack (harden-gate minutes, full compose+e2e well under an
#      hour) and well below the 6h cap — so a genuinely-long build is never
#      touched while a hung one is freed. Deleting the EphemeralRunner cascades
#      to its Pod and lets the listener request a fresh runner for whatever is
#      still queued. This is a symptom fix: the durable fix is timeout-minutes
#      on the jobs (canonical workflows in FuzeSDLC workflow-templates/,
#      repo-owned ones like ci-cd.yml in the repo) so pods self-terminate.
#
#   5. AN EPHEMERALRUNNER STUCK "Failed" PINS A maxRunners SLOT (2026-08-31) --
#      check 4 reaps a runner that starts a job and never finishes; this is the
#      mirror image: a runner whose POD IS NEVER CREATED AT ALL. When the API
#      server rejects the runner pod (an invalid podspec, a quota denial, a
#      rejected securityContext), the EphemeralRunner goes phase=Failed with the
#      rejection in .status.message and NO pod. ARC does not garbage-collect a
#      Failed EphemeralRunner, and the EphemeralRunnerSet still counts it in
#      CurrentReplicas -- so once maxRunners of them pile up the listener sees
#      currentRunnerCount == desired, stops asking for runners, and re-patches
#      the same set forever while every job on that repo queues. Nothing above
#      catches it: the controller is healthy (check 1), the CI node is labelled
#      and schedulable (check 2), the listener pod exists and is Running
#      (checks 3/3b), and no runner is Running-too-long (check 4). Argo also
#      reports Synced, because the object matches Git.
#      Observed: EIGHT scale sets (fuzecontact, fuzehub, fuzemarket, fuzepicker,
#      fuzesales, fuzeservice, fuzesocial, mendysrobotics) dead for up to 30h,
#      each with 5/5 EphemeralRunners Failed on
#        "spec.initContainers[1].name: Duplicate value: \"dind\""
#      -- a stale dind initContainer left behind by the old imperative
#      `containerMode: dind` helm release that Argo's ServerSideApply could not
#      prune because the "helm" field manager still owned it (root-caused and
#      fixed in runners/arc/register-repo.sh).
#      Check 5 deletes any EphemeralRunner Failed longer than
#      $FAILED_RUNNER_SECS, freeing the slot, and emits CRIT carrying
#      .status.message -- so the NEXT occurrence names its own cause in the
#      alert instead of costing a multi-hour investigation. Reaping is a
#      symptom fix: if the podspec itself is rejected the replacement fails
#      too, so a REPEATING runner-failed CRIT means "fix the podspec", not
#      "reap harder".
#
# NOTE ON THE IMAGE: this ran with `rancher/kubectl` + `command: ["sh","-c"]`
# from creation until 2026-07-27 and StartError'd on EVERY run — that image
# ships no shell. Any replacement image MUST contain /bin/sh. Check 3 also
# relies on this image's bundled /usr/bin/jq (with fromdateiso8601/now) to
# compute how long a pod has been Terminating — BusyBox `date -d` in this
# image does NOT parse RFC3339 timestamps, so don't rewrite check 3 to use it.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata: {name: arc-selfheal, namespace: arc-systems}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: arc-selfheal}
rules:
  # checks 4 and 5 both delete an EphemeralRunner, so this needs delete in
  # addition to get/list. Check 4 reaps one Running past the hang threshold (a
  # job with no timeout-minutes holding a maxRunners slot) -- that delete
  # cascades to its runner Pod via ownerReferences, freeing the slot AND the
  # CI-node capacity the zombie was pinning. Check 5 reaps one stuck Failed,
  # whose pod was never created at all; there is nothing to cascade to, but the
  # CR itself still counts against the EphemeralRunnerSet's replica total, so
  # deleting it is what frees that scale set to request a working runner.
  - {apiGroups: ["actions.github.com"], resources: ["ephemeralrunners"], verbs: ["get","list","delete"]}
  # autoscalingrunnersets: check 3b diffs the desired scale-set list against
  # the actual listener pods to catch a listener that is absent entirely
  # (not just stuck Terminating, which check 3 already covers).
  - {apiGroups: ["actions.github.com"], resources: ["autoscalingrunnersets"], verbs: ["get","list"]}
  # Node patch access for check 1: auto-repair missing fuzeinfra.io/pool=ci label
  # and the fuzeinfra.io/ci=true:NoSchedule taint when they are absent from the
  # expected CI node(s). CRIT is still emitted so the incident is visible in logs.
  - {apiGroups: [""], resources: ["nodes"], verbs: ["get","list","patch"]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: arc-selfheal}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: arc-selfheal}
subjects: [{kind: ServiceAccount, name: arc-selfheal, namespace: arc-systems}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: arc-selfheal, namespace: arc-systems}
rules:
  - {apiGroups: ["apps"], resources: ["deployments"], verbs: ["get","patch"]}
  # AutoscalingListener pods live only in arc-systems (check 3) — namespaced
  # Role, not the cluster-wide ClusterRole, to keep delete scoped as tightly
  # as possible.
  - {apiGroups: [""], resources: ["pods"], verbs: ["get","list","delete"]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: arc-selfheal, namespace: arc-systems}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: arc-selfheal}
subjects: [{kind: ServiceAccount, name: arc-selfheal, namespace: arc-systems}]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arc-controller-selfheal
  namespace: arc-systems
  labels:
    app.kubernetes.io/name: arc-selfheal
    app.kubernetes.io/component: ci-watchdog
    app.kubernetes.io/part-of: arc
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  # Do not fire a backlog of missed runs after an apiserver/node outage.
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: arc-selfheal
            app.kubernetes.io/component: ci-watchdog
        spec:
          serviceAccountName: arc-selfheal
          restartPolicy: Never
          # Must be able to run when the CI pool itself is unschedulable — that
          # is precisely the condition check 1 exists to report.
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          containers:
            - name: selfheal
              # alpine/k8s = kubectl + busybox sh. Tag tracks the k3s server
              # version (v1.36.2+k3s1) to stay inside the kubectl skew policy.
              image: alpine/k8s:1.36.2
              imagePullPolicy: IfNotPresent
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits:   {cpu: 200m, memory: 128Mi}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  crit=0
                  # Tracks whether the controller was already restarted this run, so
                  # check 2 and check 3b never double-restart it in the same pass.
                  restarted=0

                  # ---- check 1: a schedulable node carries fuzeinfra.io/pool=ci ----
                  # CI_NODES: nodes that SHOULD carry the label. k3s applies --node-label
                  # only at agent registration and Terraform never reconciles it, so the
                  # label can go missing after a VLAN cutover / node reinstall. This list
                  # stays in sync with runners/arc/runner-scale-set-values.yaml (which pins
                  # the scale sets to fuzeinfra.io/pool: ci via nodeSelector). Add a space-
                  # separated entry if a second durable CI node is ever enrolled.
                  CI_NODES="fuzeinfra-ci-runner-1 fuzeinfra-ci-runner-2"

                  nodes=$(kubectl get nodes -l fuzeinfra.io/pool=ci \
                    -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.unschedulable}{"\n"}{end}' 2>/dev/null)
                  total=$(printf '%s\n' "$nodes" | awk 'NF' | wc -l | tr -d ' ')
                  sched=$(printf '%s\n' "$nodes" | awk 'NF && $2!="true"' | wc -l | tr -d ' ')

                  if [ "$total" -eq 0 ]; then
                    echo "CRIT ARC ci-pool: no node carries fuzeinfra.io/pool=ci — attempting auto-repair on: $CI_NODES"
                    crit=1
                    for _node in $CI_NODES; do
                      if kubectl get node "$_node" >/dev/null 2>&1; then
                        # Restore the pool label
                        if kubectl label node "$_node" fuzeinfra.io/pool=ci --overwrite 2>/dev/null; then
                          echo "AUTO-FIXED label: kubectl label node $_node fuzeinfra.io/pool=ci --overwrite"
                        else
                          echo "WARN: could not label node $_node — may need manual: kubectl label node $_node fuzeinfra.io/pool=ci --overwrite"
                        fi
                        # Restore the CI taint (NoSchedule keeps non-CI workloads off this node)
                        if ! kubectl get node "$_node" -o jsonpath='{.spec.taints}' 2>/dev/null | grep -q 'fuzeinfra.io/ci'; then
                          if kubectl taint node "$_node" fuzeinfra.io/ci=true:NoSchedule --overwrite 2>/dev/null; then
                            echo "AUTO-FIXED taint: kubectl taint node $_node fuzeinfra.io/ci=true:NoSchedule --overwrite"
                          else
                            echo "WARN: could not taint node $_node — may need manual: kubectl taint node $_node fuzeinfra.io/ci=true:NoSchedule --overwrite"
                          fi
                        fi
                      else
                        echo "WARN: expected CI node $_node not found in cluster — cannot auto-repair"
                      fi
                    done
                  elif [ "$sched" -eq 0 ]; then
                    echo "CRIT ARC ci-pool: all $total node(s) labelled fuzeinfra.io/pool=ci are cordoned; runner pods cannot schedule. Uncordon one or add CI capacity."
                    crit=1
                  else
                    echo "ok ci-pool: $sched/$total schedulable node(s) with fuzeinfra.io/pool=ci"
                  fi

                  # ---- check 2: controller still creating runner pods ----
                  ph=$(kubectl get ephemeralrunner -A \
                    -o jsonpath='{range .items[*]}{.status.phase}{"\n"}{end}' 2>/dev/null)
                  pend=$(printf '%s\n' "$ph" | grep -cvE 'Running|Succeeded|Failed|^$' || true)
                  run=$(printf '%s\n' "$ph" | grep -c 'Running' || true)
                  echo "ephemeralrunners: non-running=$pend running=$run"

                  if [ "$pend" -gt 0 ] && [ "$run" -eq 0 ]; then
                    if [ "$crit" -eq 1 ]; then
                      # Restarting the controller cannot schedule a pod onto a pool
                      # with no schedulable node; the label auto-repair above already
                      # fired, so the next cron run will see the node and try a restart.
                      echo "runners stuck, but the CI pool above is the cause - NOT restarting the controller (auto-repair attempted above)"
                    else
                      echo "STUCK detected -> restarting ARC controller"
                      kubectl -n arc-systems rollout restart deployment/arc-controller-gha-rs-controller
                      restarted=1
                    fi
                  else
                    echo "ok controller: creating runners normally"
                  fi

                  # ---- check 3: per-scale-set listener wedged on a dead node ----
                  # A listener stuck Terminating past this is not "still shutting
                  # down" - normal termination completes in low tens of seconds.
                  LISTENER_STUCK_SECS=300
                  listeners_json=$(kubectl get pods -n arc-systems \
                    -l app.kubernetes.io/component=runner-scale-set-listener \
                    -o json 2>/dev/null)

                  if [ -z "$listeners_json" ]; then
                    echo "warn listener-pods: could not list scale-set listener pods, skipping check 3"
                  else
                    stuck=$(printf '%s' "$listeners_json" | jq -r --argjson thresh "$LISTENER_STUCK_SECS" '
                      .items[]
                      | select(.metadata.deletionTimestamp != null)
                      | select((now - (.metadata.deletionTimestamp | fromdateiso8601)) > $thresh)
                      | .metadata.name' 2>/dev/null)

                    if [ -z "$stuck" ]; then
                      echo "ok listener-pods: no scale-set listener stuck Terminating"
                    else
                      for name in $stuck; do
                        echo "CRIT ARC listener-pod: $name has been Terminating for over ${LISTENER_STUCK_SECS}s - likely wedged on a dead/NotReady node (kubelet unreachable, delete can never complete), so that scale set's CI has 0 runners while the rest of the cluster looks healthy. Force-deleting so the AutoscalingListener controller recreates it elsewhere; the underlying node still needs manual attention."
                        kubectl -n arc-systems delete pod "$name" --grace-period=0 --force >/dev/null 2>&1
                        crit=1
                      done
                    fi
                  fi

                  # ---- check 3b: scale set has NO listener pod at all (absent) ----
                  # A listener pod removed cleanly (or never recreated) leaves nothing
                  # Terminating for check 3 to find, so diff the desired scale-set list
                  # against the actual listener pods instead of relying on pod phase.
                  sets=$(kubectl get autoscalingrunnersets -n arc-runners \
                    -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null)
                  listener_pods=$(kubectl get pods -n arc-systems \
                    -l app.kubernetes.io/component=runner-scale-set-listener \
                    -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null)

                  if [ -z "$sets" ]; then
                    echo "warn listener-absent: could not list autoscalingrunnersets, skipping check 3b"
                  else
                    absent=""
                    for set in $sets; do
                      if ! printf '%s\n' "$listener_pods" | grep -Eq "^${set}-[^-]+-listener$"; then
                        absent="$absent $set"
                      fi
                    done

                    if [ -z "$absent" ]; then
                      echo "ok listener-present: every scale set has a listener pod"
                    else
                      echo "CRIT ARC listener-absent:$absent has no listener pod at all (any phase) - that scale set's CI has 0 runners and check 3 has nothing Terminating to force-delete. Requesting a controller reconcile to recreate the missing listener(s); the underlying node instability still needs manual attention."
                      crit=1
                      if [ "$restarted" -eq 0 ]; then
                        kubectl -n arc-systems rollout restart deployment/arc-controller-gha-rs-controller
                        restarted=1
                      else
                        echo "controller already restarted this run (check 2) - not restarting again"
                      fi
                    fi
                  fi

                  # ---- check 4: runner pod hung on a job, holding a slot ----
                  # An EphemeralRunner Running past this has not "just started a
                  # long build" — a runner picks up its one job within seconds of
                  # going Running, and the heaviest legit job on this stack (full
                  # docker compose + e2e) finishes well under an hour. Anything
                  # past 2h is a job hung with no timeout-minutes, pinning a
                  # maxRunners slot (and CI-node CPU/RAM) until GitHub's 6h cap.
                  # Kept well below that cap and well above any real job so a
                  # genuine long build is never reaped. Tune up if a legitimately
                  # multi-hour job is ever added on a self-hosted runner.
                  RUNNER_STUCK_SECS=7200
                  runners_json=$(kubectl get ephemeralrunner -A -o json 2>/dev/null)

                  if [ -z "$runners_json" ]; then
                    echo "warn runner-hung: could not list ephemeralrunners, skipping check 4"
                  else
                    # Running phase + alive longer than the threshold. creationTimestamp
                    # is the right clock: an EphemeralRunner is created when a job is
                    # assigned to it, so its age is the job's running time. Emit
                    # "<namespace>/<name>" so the delete is namespace-correct (runners
                    # live in arc-runners, not this CronJob's arc-systems).
                    hung=$(printf '%s' "$runners_json" | jq -r --argjson thresh "$RUNNER_STUCK_SECS" '
                      .items[]
                      | select(.status.phase == "Running")
                      | select((now - (.metadata.creationTimestamp | fromdateiso8601)) > $thresh)
                      | "\(.metadata.namespace)/\(.metadata.name)"' 2>/dev/null)

                    if [ -z "$hung" ]; then
                      echo "ok runner-hung: no ephemeralrunner Running past ${RUNNER_STUCK_SECS}s"
                    else
                      for nn in $hung; do
                        ns=${nn%%/*}; name=${nn##*/}
                        echo "CRIT ARC runner-hung: $nn has been Running over ${RUNNER_STUCK_SECS}s - a job hung with no timeout-minutes is holding a maxRunners slot (and CI-node capacity) up to GitHub's 6h cap, so this scale set's queue cannot drain. Deleting the EphemeralRunner (cascades to its Pod) to free the slot; the durable fix is a timeout-minutes on that job so the pod self-terminates."
                        kubectl -n "$ns" delete ephemeralrunner "$name" --wait=false >/dev/null 2>&1
                        crit=1
                      done
                    fi
                  fi

                  # ---- check 5: EphemeralRunner stuck Failed (pod never created) ----
                  # Terminal state: ARC never GCs these and never retries them, so a
                  # Failed runner holds its maxRunners slot until something deletes it.
                  # 10 min is far longer than any legitimate transient (a pod is either
                  # admitted or rejected within seconds) while still clearing a wedged
                  # scale set inside one cron period.
                  FAILED_RUNNER_SECS=600
                  failed_json=$(kubectl get ephemeralrunner -A -o json 2>/dev/null)

                  if [ -z "$failed_json" ]; then
                    echo "warn runner-failed: could not list ephemeralrunners, skipping check 5"
                  else
                    stuck=$(printf '%s' "$failed_json" | jq -r --argjson thresh "$FAILED_RUNNER_SECS" '
                      .items[]
                      | select(.status.phase == "Failed")
                      | select((now - (.metadata.creationTimestamp | fromdateiso8601)) > $thresh)
                      | .metadata.namespace + "/" + .metadata.name' 2>/dev/null)

                    if [ -z "$stuck" ]; then
                      echo "ok runner-failed: no ephemeralrunner Failed past ${FAILED_RUNNER_SECS}s"
                    else
                      for nn in $stuck; do
                        ns=${nn%%/*}; name=${nn##*/}
                        # Carry the rejection reason into the alert -- this is the whole
                        # point of check 5. Truncated so one bad podspec cannot flood the
                        # log; jsonpath yields "" (not an error) when status.message is unset.
                        msg=$(kubectl -n "$ns" get ephemeralrunner "$name"                           -o jsonpath='{.status.message}' 2>/dev/null | head -c 300)
                        echo "CRIT ARC runner-failed: $nn has been Failed for over ${FAILED_RUNNER_SECS}s - its pod was never created, ARC never garbage-collects a Failed EphemeralRunner, and the EphemeralRunnerSet still counts it, so it pins a maxRunners slot and that scale set's queue can never drain. Reason: ${msg:-(status.message empty)}. Deleting it to free the slot. If this CRIT REPEATS for the same scale set the podspec itself is being rejected - fix the podspec (runners/arc/runner-scale-set-values.yaml), reaping cannot help."
                        kubectl -n "$ns" delete ephemeralrunner "$name" --wait=false >/dev/null 2>&1
                        crit=1
                      done
                    fi
                  fi

                  # Fail the Job on CRIT so PodFailed alerting and
                  # failedJobsHistoryLimit retain the evidence.
                  exit "$crit"
