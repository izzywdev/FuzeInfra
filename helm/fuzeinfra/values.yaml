# =============================================================================
# FuzeInfra Helm chart - default values (in-cluster everything)
#
# These defaults run the full stack with StatefulSets for stateful services.
# Override per environment with values-local.yaml (kind) or values-aws.yaml (EKS).
# =============================================================================

global:
  # Namespace is taken from the Helm release namespace (`helm -n fuzeinfra`).
  #
  # serviceNamespace overrides ONLY the namespace segment of the in-cluster
  # service addresses this chart publishes to consumers (Kafka's
  # advertised.listeners, NOTES.txt) — not where resources are installed.
  # Leave empty to use the release namespace, which is correct whenever the
  # caller passes `--namespace`. Set it when you cannot guarantee that.
  #
  # It exists because Helm silently substitutes "default" for a missing
  # `--namespace`, and a broker advertising fuzeinfra-kafka.default.svc.cluster.local
  # accepts bootstrap connections and then fails every produce/consume on an
  # address no consumer can resolve. The chart now refuses to render "default"
  # rather than ship that; see `fuzeinfra.serviceNamespace` in _helpers.tpl.
  serviceNamespace: ""
  # Storage class for PersistentVolumeClaims:
  #   - kind:  "standard" (default kind storage class)
  #   - EKS:   "gp3" (provided by the aws-ebs-csi-driver / values-aws.yaml)
  storageClass: "standard"

  # Base domain used to build Ingress hostnames, e.g. grafana.dev.local.
  # Local:  dev.local   (resolve via /etc/hosts or dnsmasq -> 127.0.0.1)
  # AWS:    set to your real domain in values-aws.yaml
  domain: dev.local

  # imagePullPolicy applied to every workload.
  imagePullPolicy: IfNotPresent

# -----------------------------------------------------------------------------
# Credentials. For real environments, override these or supply an existing
# Secret via `existingSecret`. Defaults mirror the docker-compose dev values.
# -----------------------------------------------------------------------------
credentials:
  # If set, the chart will NOT create a Secret and instead reads keys from this one.
  existingSecret: ""
  postgres:
    user: fuzeinfra
    password: fuzeinfra_secure_password
    db: fuzeinfra_db
  mongodb:
    user: admin
    password: admin123
  neo4j:
    user: neo4j
    password: password123
  rabbitmq:
    user: admin
    password: admin123
  grafana:
    adminPassword: admin
  airflow:
    adminUser: admin
    adminPassword: admin
    # LOCAL DEV ONLY — never use this placeholder in any real environment.
    # For prod/staging: set fernetKeySecret (below) pointing at a SealedSecret
    # and leave fernetKey as the empty string so secrets.yaml omits the key entirely.
    # Generate a real key:
    #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
    fernetKey: "Zp9p8x0Q3y0sJpQ8m2nq3l4F6tH9wXyZ1aB2cD3eF4="
    # When set, AIRFLOW__CORE__FERNET_KEY is sourced from this Secret instead
    # of fuzeinfra-secrets.  Set in prod via values-contabo.yaml + SealedSecret.
    fernetKeySecret: {}
    #  name: fuzeinfra-app-credentials
    #  key: AIRFLOW_FERNET_KEY
  cloudflare:
    # Tunnel token from the Cloudflare Zero Trust dashboard. Required only when
    # cloudflareTunnel.enabled=true. Prefer supplying via an existing Secret.
    tunnelToken: ""

# -----------------------------------------------------------------------------
# Per-service Postgres provisioning (issue #153).
#
# Declaratively provisions per-service roles + databases on the shared
# `fuzeinfra-postgres` server via an idempotent, GitOps-reconciled hook Job
# (templates/service-db-provisioning.yaml). This is the declarative successor
# to the imperative runner-side recipe in governance/datastore-provisioning.md.
#
# CROSS-NAMESPACE SECRET CONTRACT (important):
#   The provisioning Job runs in the `fuzeinfra` namespace so the Postgres
#   SUPERUSER creds (`fuzeinfra-secrets`) never leave this namespace and never
#   land in git. The role password MUST equal the password the consuming
#   service already sealed for its own DATABASE_URL. A Job pod can only read
#   Secrets in its OWN namespace, so each consuming repo must ALSO ship a
#   SealedSecret of its DB credentials sealed FOR the `fuzeinfra` namespace
#   (precedent: `fuzekeys-db-credentials`, `fuzesocial-app-db-credentials`
#   already exist in `fuzeinfra`). The Job reads that per-service password via
#   `secretKeyRef` (below) and syncs it onto the role. No plaintext credential
#   is ever committed here — only Secret NAMES + KEYS.
#
# Off by default (base/local/aws): the referenced per-service Secrets only
# exist on prod. Enable per env in the overlay (see values-contabo.yaml).
serviceDbProvisioning:
  image: postgres:15          # matches the server; ships psql/pg_isready
  host: fuzeinfra-postgres    # in-namespace DNS of the shared Postgres Service
  # Superuser used to create roles/dbs. Defaults to the chart-managed admin
  # secret (fuzeinfra-secrets). Never referenced by value — only by key.
  adminSecret:
    name: ""                  # "" -> fuzeinfra.secretName (fuzeinfra-secrets)
    userKey: POSTGRES_USER
    passwordKey: POSTGRES_PASSWORD

# List of services to provision. Each entry gates itself via `enabled`.
#   name:     logical service name (used to derive the password env var)
#   role:     Postgres LOGIN role to ensure (issue #153 convention: <svc>_svc)
#   database: database to ensure, owned by `role`
#   passwordSecret.{name,key}: the per-service Secret (sealed for the
#     `fuzeinfra` namespace by the consumer repo) holding the role password.
# Defaults are OFF; prod overlay flips `enabled: true` once the SealedSecrets
# are present in the `fuzeinfra` namespace.
serviceDatabases:
  - name: fuzesales
    enabled: false
    role: fuzesales_svc
    database: fuzesales
    passwordSecret:
      name: fuzesales-db-credentials
      key: password
  - name: fuzecontact
    enabled: false
    role: fuzecontact_svc
    database: fuzecontact
    passwordSecret:
      name: fuzecontact-db-credentials
      key: password
  - name: fuzeservice
    enabled: false
    role: fuzeservice_svc
    database: fuzeservice
    passwordSecret:
      name: fuzeservice-db-credentials
      key: password
  # MendysRobotics app DB — enabled in values-contabo.yaml once the
  # mendys-db-credentials SealedSecret is present in the fuzeinfra namespace.
  - name: mendys
    enabled: false
    role: mendys_svc
    database: mendys
    passwordSecret:
      name: mendys-db-credentials
      key: password
  - name: fuzequality
    enabled: false
    role: fuzequality_user
    database: fuzequality
    passwordSecret:
      name: fuzequality-db-credentials
      key: password
  # Backing store for the MendysRobotics Authentik instance — a SECOND, fully
  # separate Authentik deployment in the FuzeFront chart (see FuzeFront
  # deploy/helm/fuzefront/templates/authentik.yaml, instance "mendys").
  #
  # WHY A SEPARATE DATABASE: Authentik has no realm concept. One Authentik
  # instance = one user directory, and brands (authentik_brands.brand) are
  # branding + default flows only — "all objects like applications and
  # providers are still global". Hard tenancy (one Postgres SCHEMA per tenant)
  # exists from 2024.2 but is Enterprise-only, alpha, requires a license per
  # tenant, and is API-managed — i.e. unusable from the blueprint/GitOps model
  # this platform is built on. A second instance on its own DATABASE gives the
  # same isolation property (separate user table, separate sessions) for free
  # and stays fully declarative.
  #
  # Isolation contract: MendysRobotics accounts live ONLY here; a FuzeFront
  # account is not recognised by the Mendys apps and vice versa, and the same
  # email address may exist independently on both sides.
  - name: authentik-mendys
    enabled: false
    role: authentik_mendys_user
    database: authentik_mendys
    passwordSecret:
      name: authentik-mendys-db-credentials
      key: password

# MongoDB admin connection config for serviceMongoProvisioning Jobs.
serviceMongoProvisioning:
  host: fuzeinfra-mongodb    # in-namespace DNS of the shared MongoDB Service

# List of MongoDB users to provision per-service. Same gate pattern as
# serviceDatabases: disabled by default; prod overlay flips enabled: true once
# the per-service SealedSecret is present in the fuzeinfra namespace.
#   name:     logical service name (used to derive the password env var)
#   database: MongoDB database the user will own (default target for the role)
#   user:     MongoDB username to create / sync
#   passwordSecret.{name,key}: SealedSecret in fuzeinfra namespace holding the password
#   authDatabase:   OPTIONAL — database the user record lives in / authenticates
#                   against (default: `database`). Set to `admin` when the app
#                   connects with authSource=admin.
#   roles:          OPTIONAL — list of {role, db} to ensure on the user (default:
#                   [{role: readWrite, db: <database>}]). Lets one user hold
#                   readWrite on a database whose name differs from its auth db.
#   managePassword: OPTIONAL bool (default: true). When false, the Job never
#                   touches the password (no createUser/updateUser) and only
#                   grants roles to a pre-existing user — use for users created
#                   out-of-band whose password FuzeInfra does not own.
serviceMongoDatabases:
  # mendys_app's user record lives in the `mendys` db (authSource=mendys) and is
  # provisioned out-of-band; FuzeInfra only reconciles its readWrite grants
  # (incl. `robot_catalog`, the DB the backend uses). Enabled in the contabo
  # overlay. See #238. managePassword:false ⇒ no passwordSecret required.
  - name: mendys
    enabled: false
    user: mendys_app
    authDatabase: mendys
    managePassword: false
    database: robot_catalog
    roles:
      - { role: readWrite, db: robot_catalog }
      - { role: readWrite, db: mendys }

# Authenticated, isolated ChromaDB allocations. Each enabled consumer is bound
# server-side to exactly one tenant/database by its sealed bearer token.
# `credentialSecret` must exist in the fuzeinfra namespace before enabling an
# allocation. Network selectors are an additional boundary, not a replacement
# for Chroma authorization. Only bootstrap collections belong in this list.
serviceChromaCollections: []

# -----------------------------------------------------------------------------
# Ingress (replaces the docker-compose nginx reverse proxy). Web UIs are exposed
# at <service>.<global.domain>. Requires an ingress controller (ingress-nginx),
# installed by the bootstrap scripts for kind and as an EKS addon path.
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  # TLS via cert-manager / secrets is left to the environment overlay.
  tls:
    enabled: false

# =============================================================================
# Split-horizon DNS (k3s CoreDNS coredns-custom ConfigMap)
# Rewrites *.global.domain external hostnames to cluster-internal service FQDNs
# so in-cluster callers hit the ClusterIP directly rather than the CF Tunnel.
# Disable on non-k3s clusters (kind uses nginx ingress without this need).
# -----------------------------------------------------------------------------
coreDnsSplitHorizon:
  enabled: false

# =============================================================================
# Service definitions. Each block: enabled, image, resources, storage size.
# =============================================================================

postgres:
  enabled: true
  image: postgres:15
  port: 5432
  storage: 5Gi
  # Optional node pin. Empty by default (kind/AWS unaffected). On overlays with
  # a durable node pool, set to a label only durable nodes carry so Postgres
  # never schedules onto an ephemeral autoscaled node.
  nodeSelector: {}
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 1Gi }

mongodb:
  enabled: true
  image: mongo:7
  port: 27017
  storage: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 1Gi }

mongoExpress:
  enabled: true
  image: mongo-express:latest
  port: 8081

redis:
  enabled: true
  image: redis:7-alpine
  port: 6379
  storage: 2Gi
  # Per-app ACL persistence. When enabled, redis runs with `--aclfile
  # /data/users.acl` and a bootstrap initContainer seeds that file (on the PVC)
  # with the shared no-auth `default` user so existing consumers are unaffected.
  # Per-app least-privilege ACL users (created imperatively during consumer
  # onboarding, e.g. `fuzekeys` with `~fuzekeys:* +@all -@admin -@dangerous`)
  # are written to the file via `ACL SAVE` and survive pod restarts. Passwords
  # live only on the PVC as hashes — never in git. See
  # governance/datastore-allocations.md for the per-app allocation registry.
  acl:
    enabled: true
  resources:
    requests: { cpu: 50m,  memory: 64Mi }
    limits:   { cpu: 500m, memory: 512Mi }

neo4j:
  enabled: true
  image: neo4j:5
  httpPort: 7474
  boltPort: 7687
  storage: 5Gi
  # Optional durable-node pin (empty by default; set on overlays with a durable
  # node pool). See postgres.nodeSelector.
  nodeSelector: {}
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 2Gi }

# Per-consumer dedicated Neo4j instances (Community edition — one database per container).
# Community edition does not support multi-database or RBAC; each consumer gets a fully
# isolated Neo4j with its own PVC and credentials. Flip enabled:true once the corresponding
# SealedSecret (key: password) is present in the fuzeinfra namespace.
# Consumer bolt address: bolt://fuzeinfra-neo4j-<name>.fuzeinfra.svc.cluster.local:7687
serviceNeo4jInstances: []
# Example:
# serviceNeo4jInstances:
#   - name: fuzeplan
#     enabled: false
#     passwordSecret:
#       name: neo4j-fuzeplan-credentials
#       key: password
#     storage: 5Gi
#     nodeSelector: {}
#     resources:
#       requests: {cpu: 200m, memory: 1Gi}
#       limits: {cpu: "1", memory: 2Gi}

elasticsearch:
  enabled: true
  image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
  port: 9200
  storage: 10Gi
  javaOpts: "-Xms512m -Xmx512m"
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits:   { cpu: "1",  memory: 2Gi }

chromadb:
  enabled: true
  # 0.5.23 is the last OSS release with the built-in token auth provider used
  # below. Never use `latest`: auth behavior and client/server APIs must match.
  image: chromadb/chroma:0.5.23@sha256:18e67eecc172abbcd9413d751bde64983b3d167fe497c98f979083eb24c0c942
  port: 8000
  storage: 5Gi
  auth:
    adminSecret:
      name: chromadb-admin-credentials
      key: token
      # LOCAL DEVELOPMENT ONLY — must stay disabled in every real overlay.
      # The Secret named above is produced solely by
      # deploy/sealed-secrets/chromadb-admin-credentials.yaml, which needs a
      # Sealed Secrets controller and the prod private key. On a bare kind or
      # Docker Desktop cluster nothing creates it, so the StatefulSet's
      # render-auth-config init container sits in CreateContainerConfigError
      # (`secret "chromadb-admin-credentials" not found`) indefinitely.
      # values-local.yaml turns this on to render a throwaway token instead.
      devSecret:
        enabled: false
        token: ""
  networkPolicy:
    enabled: true

# Kafka in KRaft mode (no ZooKeeper) - fixes the ZooKeeper startup races and
# deprecation warnings from the docker-compose ZooKeeper-based setup.
kafka:
  enabled: true
  image: confluentinc/cp-kafka:7.6.1
  port: 9092
  storage: 5Gi
  # Fixed cluster id so the StatefulSet can re-format storage deterministically.
  clusterId: "j7z6bP_dQ8-uF_3Dp5tiXw"
  # Optional second listener for clients arriving through `kubectl port-forward`
  # (the pytest smoke suite). MUST stay disabled anywhere real: it advertises
  # `localhost`, which on a live cluster points every client at its own pod.
  #
  # Needed because Kafka returns the advertised address of the listener the
  # client connected on. Without it a port-forwarded client bootstraps fine and
  # is then redirected to fuzeinfra-kafka.<ns>.svc.cluster.local:9092, which does
  # not resolve outside the cluster — so every produce/consume fails while the
  # connection itself looks healthy. No port-forward mapping can fix that.
  externalListener:
    enabled: false
    port: 29092
    advertisedHost: localhost
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "1",  memory: 1Gi }

kafkaUi:
  enabled: true
  # PINNED deliberately. This image was on :latest, which is unsafe once auth is
  # configured: the AUTH_OAUTH2_CLIENT_* env var names are version-specific, so a
  # silent upstream bump could drop the OAuth config on the floor and leave the
  # UI unauthenticated behind the Access wall. v0.7.2 is the last provectuslabs
  # release (the project continues as kafbat/kafka-ui); revisit on migration.
  image: provectuslabs/kafka-ui:v0.7.2
  port: 8080
  # Authentik SSO. Off by default — enabling without the SealedSecret named
  # below present in the namespace yields CreateContainerConfigError. Flip on in
  # the SAME commit that lands deploy/sealed-secrets/kafka-ui-oidc.yaml.
  oidc:
    enabled: false
    displayName: Authentik
    clientId: kafka-ui
    # Full OIDC issuer; kafka-ui discovers endpoints from /.well-known.
    # Trailing slash matters — it must match the `iss` claim exactly.
    issuer: https://authentik.prod.fuzefront.com/application/o/kafka-ui/
    secretName: kafka-ui-oidc
    secretKey: CLIENT_SECRET
    # Scopes requested at the authorization endpoint.
    #
    # `groups` is NOT optional once rbac.enabled is true. Granting the scope on
    # the Authentik provider only makes it AVAILABLE; the client still has to ask
    # for it, and kafka-ui asks for exactly this list. Without it the ID token
    # carries no `groups` claim, the authority extractor finds nothing, and every
    # SSO user resolves to zero roles — which under RBAC is a total lockout, not
    # a downgrade. Verified against the live discovery document:
    #   scopes_supported: ["openid","email","profile","groups"]
    #   claims_supported: [... "groups" ...]
    # Keep it in the list even while rbac is off: it costs nothing, and it means
    # flipping rbac on is a single change instead of an ordering puzzle.
    scopes:
      - openid
      - email
      - profile
      - groups
    # ---- Authorization (RBAC) -------------------------------------------------
    # Without this, kafka-ui is authentication-only: every user who completes SSO
    # is an unscoped admin, and with DYNAMIC_CONFIG_ENABLED=true that admin can
    # rewrite cluster config, produce and delete messages, and delete topics.
    #
    # Default OFF, because turning RBAC on is a hard cutover, not a soft one:
    # kafka-ui enables RBAC purely by observing that `rbac.roles` is non-empty
    # (AccessControlService#init at v0.7.2), after which anyone who matches no
    # role is denied everything. Enable it in an environment only once you are
    # sure the `groups` claim actually reaches the pod.
    rbac:
      enabled: false
      # The ID-token claim holding the user's group memberships, passed to
      # kafka-ui as the generic-oauth `roles-field` custom param. Authentik emits
      # group names in `groups`.
      rolesClaim: groups
      # CROSS-REPO CONTRACT — do not rename here alone.
      #
      # The same Authentik group already gates Grafana (grafana.oidc
      # .roleAttributePath) and ArgoCD (argocd/cluster-settings/argocd-rbac-cm
      # .yaml -> `g, fuzeinfra-admins, role:admin`). It is created by the
      # groups-fuzeinfra-admins.yaml blueprint in izzywdev/FuzeFront. Renaming it
      # in one consumer silently removes everyone's access in that consumer only.
      adminGroup: fuzeinfra-admins
      # Name of the kafka-ui role the group is mapped onto. Internal identifier
      # only — kafka-ui matches a user to a role by comparing the role NAME
      # against the set of role names the extractor produced, so this never
      # leaves the pod.
      adminRoleName: admin
      # NO read-only catch-all role, deliberately — everyone outside adminGroup
      # gets NOTHING, not Viewer.
      #
      # This mirrors the fix already made to grafana.oidc.roleAttributePath: a
      # `|| 'Viewer'` fallback there meant every account in the directory was
      # silently auto-provisioned with read access to every dashboard. The same
      # shape here would be worse — kafka topic payloads are application data,
      # and "read-only" on a Kafka UI still means reading every message on every
      # topic. Authentik's policy binding on the `kafka-ui` Application is the
      # primary gate; this fails closed behind it.
      #
      # A read-only tier is a real future need (on-call wanting to inspect lag
      # without write access). It needs its OWN Authentik group, created in the
      # FuzeFront blueprints first — do not repurpose fuzeinfra-admins for it.
    # Raise Spring Security's OAuth2 logging so a failed login reports WHY.
    # Off by default and meant to be turned back off after diagnosis — see the
    # TRACE warning in templates/messaging.yaml before changing the level.
    debugLogging: false

rabbitmq:
  # Source RABBITMQ_DEFAULT_PASS from a dedicated Secret instead of the
  # chart-managed fuzeinfra-secrets. Empty name keeps existing behaviour.
  # Only honoured on a FRESH broker — see templates/messaging.yaml.
  passwordSecret:
    name: ""
    key: RABBITMQ_PASSWORD
  enabled: true
  image: rabbitmq:3-management
  amqpPort: 5672
  managementPort: 15672
  storage: 2Gi

# -----------------------------------------------------------------------------
# Monitoring & logging
# -----------------------------------------------------------------------------
prometheus:
  enabled: true
  image: prom/prometheus:latest
  port: 9090
  storage: 20Gi
  retention:
    time: "15d"
    size: "15GB"
  # Discover alert/recording rules from labeled ConfigMaps in ANY namespace.
  # Opt-in: runs a k8s-sidecar that watches ConfigMaps with the configured label
  # and writes their data into Prometheus' rules dir, then triggers a reload.
  # Consumers add rules without forking the chart by creating a ConfigMap labeled
  # `prometheus_rule: "1"` whose keys are *.yml Prometheus rule files.
  ruleSidecar:
    enabled: false
    image: kiwigrid/k8s-sidecar:1.27.4
    label: prometheus_rule
    labelValue: "1"
    # ALL = watch every namespace. Set to a specific namespace to scope it.
    searchNamespace: ALL
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits:   { cpu: 100m, memory: 128Mi }

grafana:
  enabled: true
  image: grafana/grafana:latest
  port: 3000
  # Datasources (Prometheus, Loki), dashboards and alerting are all provisioned
  # from ConfigMaps, so Grafana is stateless by default and can be rescheduled
  # onto any node without depending on node-pinned local-path storage.
  persistence:
    # Off by default → Grafana's SQLite DB lives in an emptyDir. Set to true to
    # retain runtime state (manually-created users/dashboards) across restarts
    # via a PVC. Note: a PVC pins the pod to a node when using local-path.
    enabled: false
  # PVC size, used only when persistence.enabled=true.
  storage: 2Gi
  # Scheduling controls (default empty → no change to single-node behaviour).
  # Populate these to move Grafana onto a chosen node, e.g. to offload the
  # primary node:
  #   nodeSelector:
  #     kubernetes.io/hostname: worker-2
  #   tolerations:
  #     - key: dedicated
  #       operator: Equal
  #       value: monitoring
  #       effect: NoSchedule
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # Authentik SSO (Grafana "generic OAuth").
  #
  # Off by default: enabling without the SealedSecret named below present in the
  # namespace yields CreateContainerConfigError. Flip this on in the SAME commit
  # that lands deploy/sealed-secrets/grafana-oidc.yaml.
  #
  # The local admin (GF_SECURITY_ADMIN_PASSWORD) stays enabled either way — see
  # the break-glass note in templates/monitoring.yaml.
  # Source the local break-glass admin password from a dedicated Secret instead
  # of the chart-managed fuzeinfra-secrets. Leave name empty to keep the existing
  # behaviour. Set it in an overlay so the real password never rides in values.
  adminPasswordSecret:
    name: ""
    key: GRAFANA_ADMIN_PASSWORD
    # Bump when the referenced Secret is resealed — it is hashed into
    # checksum/credentials, which is what forces Grafana to restart and pick the
    # new password up. Resealing alone does not roll the pod.
    rotation: ""
  oidc:
    enabled: false
    displayName: Authentik
    clientId: grafana
    # Authentik serves authorize/, token/ and userinfo/ at the /application/o/
    # ROOT — they are NOT per-application. Only `issuer` and `jwks_uri` carry the
    # application slug. Verified against the live discovery document:
    #   issuer                 .../application/o/grafana/
    #   authorization_endpoint .../application/o/authorize/
    # Deriving these from the per-app path yields a 404 on the first redirect,
    # so this is deliberately a shared base, not the issuer.
    endpointBase: https://authentik.prod.fuzefront.com/application/o
    secretName: grafana-oidc
    secretKey: CLIENT_SECRET
    # JMESPath over the ID-token claims. Requires the `groups` scope to be
    # granted by the Authentik provider, and the group to exist there
    # (blueprint: groups-fuzeinfra-admins.yaml in izzywdev/FuzeFront).
    #
    # NO `|| 'Viewer'` FALLBACK — that is deliberate, and it is a fix.
    # With a fallback this expression can never evaluate to nothing, so
    # GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT has nothing to reject: a token
    # with no `groups` claim at all took the fallback branch and, together with
    # ALLOW_SIGN_UP, was auto-created as a Viewer. Combined with Authentik not
    # gating enrollment, that meant any account in the directory silently got
    # read access to every dashboard. Without the fallback, no matching group
    # yields no role and strict mode denies the login outright.
    roleAttributePath: "contains(groups[*], 'fuzeinfra-admins') && 'Admin'"
  # Discover dashboards from labeled ConfigMaps in ANY namespace.
  # Opt-in: runs a k8s-sidecar that watches ConfigMaps with the configured label
  # and writes their JSON into a Grafana provisioning folder. Consumers ship
  # dashboards without forking the chart by creating a ConfigMap labeled
  # `grafana_dashboard: "1"` whose keys are *.json dashboard models.
  dashboardSidecar:
    enabled: false
    image: kiwigrid/k8s-sidecar:1.27.4
    label: grafana_dashboard
    labelValue: "1"
    # ALL = watch every namespace. Set to a specific namespace to scope it.
    searchNamespace: ALL
    # Grafana folder discovered dashboards are filed under.
    folderName: "Discovered"
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits:   { cpu: 100m, memory: 128Mi }

alertmanager:
  enabled: true
  image: prom/alertmanager:latest
  port: 9093
  storage: 1Gi
  # Alertmanager routing/notification config. Defaults preserve the previous
  # behavior: a single no-op `default` receiver (alerts group but go nowhere).
  # Operators wire notifications by overriding `receivers` and `routes`, e.g. a
  # webhook/Telegram/Slack receiver — no chart fork required.
  config:
    resolveTimeout: 5m
    groupBy: ['alertname', 'namespace']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 3h
    # Name of the root (catch-all) receiver. Must exist in `receivers` below.
    receiver: default
    # Extra top-level global keys (e.g. smtp_*, slack_api_url) merged verbatim.
    global: {}
  # Receivers. Default is a single no-op receiver named `default`.
  # Example webhook receiver:
  #   - name: ops
  #     webhook_configs:
  #       - url: https://example.com/alerts
  receivers:
    - name: default
  # Child routes under the root route (rendered as route.routes). Default keeps
  # the previous critical->default route with a faster repeat interval.
  routes:
    - match:
        severity: critical
      receiver: default
      repeat_interval: 1h
  # Inhibition rules (silence warnings when a matching critical is firing).
  inhibitRules:
    - source_match:
        severity: critical
      target_match:
        severity: warning
      equal: ['alertname', 'namespace']

loki:
  enabled: true
  image: grafana/loki:3.2.0
  port: 3100
  storage: 5Gi
  # Optional S3-compatible object store backend for Loki chunks + index.
  # When disabled (default) Loki uses on-disk filesystem storage (the PVC above).
  # When enabled, chunk+index storage moves to the configured bucket — keeping
  # node disk free. Tested against Contabo Object Storage (S3-compatible).
  #
  # Credentials are read from a referenced Secret (never inlined in values), with
  # `-config.expand-env=true` substituting them into the Loki config at runtime.
  s3:
    enabled: false
    # S3 endpoint host (no scheme), e.g. eu2.contabostorage.com or s3.amazonaws.com
    endpoint: ""
    region: ""
    bucket: ""
    # Path-style access (required by most non-AWS S3 providers like Contabo/MinIO).
    s3ForcePathStyle: true
    # Set true only for plain-HTTP endpoints (not recommended).
    insecure: false
    # Existing Secret holding the access/secret keys. REQUIRED when s3.enabled.
    existingSecret: ""
    accessKeyIdKey: LOKI_S3_ACCESS_KEY_ID
    secretAccessKeyKey: LOKI_S3_SECRET_ACCESS_KEY

# ---------------------------------------------------------------------------
# Scheduled database backups → S3 (Contabo Object Storage)
# ---------------------------------------------------------------------------
# The stateful databases keep running on block/local-path storage — S3 has no
# POSIX/block semantics, so it is NOT a live data volume for any DB. Its only
# role here is a *backup offload*: each CronJob below dumps a logical snapshot
# of a running DB and uploads it to the `fuzeinfra-backups` bucket.
#
# Everything is OFF by default. To enable in an overlay:
#   1. Provision the bucket (terraform object-storage) + an S3 key pair.
#   2. Seal the key pair OFFLINE into a SealedSecret in the fuzeinfra namespace,
#      e.g. `fuzeinfra-backups-s3` with keys BACKUP_S3_ACCESS_KEY_ID /
#      BACKUP_S3_SECRET_ACCESS_KEY. (Never `kubectl create secret` — GitOps.)
#   3. Set backups.enabled=true, backups.s3.existingSecret, backups.s3.endpoint.
#
# Object lifecycle / retention (age-out of old dumps) is enforced by an S3
# bucket lifecycle policy, NOT by these Jobs — see docs/backups-and-blobs.md.
backups:
  enabled: false
  # Where dumps land: "s3" (Contabo Object Storage — the durable off-cluster
  # target, needs the bucket + backups.s3.existingSecret) or "pvc" (a Longhorn
  # PVC in-cluster — needs no object storage; the interim tier that works today,
  # replicated across the durable nodes). See docs/backups-and-blobs.md.
  sink: s3
  # PVC-sink settings (used only when sink=pvc).
  pvc:
    storageClass: longhorn
    size: 20Gi
    image: busybox:1.36     # sh + cp/ls/xargs for copy + in-pod rotation
    keep: 7                 # keep newest N dumps per DB on the PVC
  # aws-cli image used by the upload sidecar step of every CronJob.
  awsCliImage: amazon/aws-cli:2.17.0
  # Default cron schedule (UTC). Per-DB `schedule` overrides this when set.
  schedule: "0 2 * * *"
  # Keep this many most-recent Jobs' pods around for log inspection.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Fail (and alert via kube-state-metrics job_failed) rather than hang forever.
  activeDeadlineSeconds: 3600
  backoffLimit: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  # S3 destination for all dumps.
  s3:
    # Full URL incl. scheme, e.g. https://eu2.contabostorage.com
    endpoint: ""
    region: "default"
    bucket: "fuzeinfra-backups"
    # Key prefix inside the bucket; each DB adds its own subfolder + timestamp.
    prefix: "db"
    # SealedSecret (in the fuzeinfra namespace) holding the S3 credentials.
    # REQUIRED when backups.enabled=true. Never inlined.
    existingSecret: ""
    accessKeyIdKey: BACKUP_S3_ACCESS_KEY_ID
    secretAccessKeyKey: BACKUP_S3_SECRET_ACCESS_KEY
    # Age-out for the dumps, applied as a BUCKET LIFECYCLE POLICY (the provider
    # deletes them, not us). Required with sink=s3: the in-pod `pvc.keep` prune
    # only ever applied to the PVC sink, so without this S3 grows forever.
    # 0 disables the policy entirely.
    lifecycleExpireDays: 30
  # Per-database toggles. Each dumps a *running* instance (no downtime) and is
  # independently gated so an overlay can enable only the DBs it runs.
  postgres:
    enabled: true
    # "" -> inherits backups.schedule
    schedule: ""
    image: postgres:15          # ships pg_dumpall
    host: fuzeinfra-postgres
    port: 5432
  mongodb:
    enabled: true
    schedule: ""
    image: mongo:7              # ships mongodump
    host: fuzeinfra-mongodb
    port: 27017
  neo4j:
    enabled: true
    schedule: ""
    image: neo4j:5             # ships cypher-shell; APOC stream export (online)
    host: fuzeinfra-neo4j
    boltPort: 7687

promtail:
  enabled: true
  image: grafana/promtail:3.2.0

nodeExporter:
  enabled: true
  image: prom/node-exporter:latest
  port: 9100

# Node Configurator DaemonSet — writes /etc/gai.conf on every node.
# Disabled by default; enable in values-contabo.yaml for prod.
# Uses docker.io/busybox (not GHCR) so the DaemonSet itself is not affected
# by GHCR pull failures on nodes that haven't been patched yet.
nodeConfigurator:
  preferIPv4:
    enabled: false
  image: docker.io/busybox:1.36.1

kubeStateMetrics:
  enabled: true
  image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.10.1
  # Node labels to expose as label_* dimensions on kube_node_labels. KSM v2
  # drops every node label by default, so anything alerted on must be listed.
  # fuzeinfra.io/pool backs the CiNodePoolLabelMissing rule (rules/nodes.yml):
  # k3s sets --node-label only at agent registration, so a manual relabel is
  # never reconciled by Terraform and silently strands all CI runner pods.
  nodeLabelsAllowlist:
    - fuzeinfra.io/pool
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits:   { cpu: 250m, memory: 128Mi }

# -----------------------------------------------------------------------------
# Airflow (CeleryExecutor) - workflow orchestration for data pipelines.
# Reuses the in-cluster Postgres (metadata DB) and Redis (Celery broker).
# -----------------------------------------------------------------------------
airflow:
  # Source AIRFLOW_ADMIN_PASSWORD from a dedicated Secret instead of the
  # chart-managed fuzeinfra-secrets. Empty name keeps existing behaviour.
  # Only honoured on a FRESH metadata DB — see templates/airflow.yaml.
  adminPasswordSecret:
    name: ""
    key: AIRFLOW_ADMIN_PASSWORD
  enabled: true
  image: apache/airflow:2.9.1
  webPort: 8080
  flowerPort: 5555
  # Authentik SSO for the WEBSERVER only (Flask-AppBuilder AUTH_OAUTH).
  #
  # Off by default, same gate as grafana.oidc / kafkaUi.oidc: enabling without
  # the SealedSecret named below present in the namespace yields
  # CreateContainerConfigError. Flip on in the SAME commit that lands
  # deploy/sealed-secrets/airflow-oidc.yaml.
  #
  # SCOPE: this covers the Airflow UI. It does NOT cover Flower — Flower's
  # tornado auth has no generic OIDC handler (only hard-coded Google/GitHub/
  # GitLab/Okta handlers, and the Okta one builds `<base>/v1/authorize`, which
  # is not Authentik's endpoint shape). Flower stays gated by Cloudflare Access
  # alone. It also does NOT touch the Airflow REST API, which keeps
  # AIRFLOW__API__AUTH_BACKENDS=basic_auth, so machine callers are unaffected.
  #
  # The local admin created by airflow-init stays usable for break-glass: FAB's
  # AUTH_OAUTH replaces the login PAGE, and the account remains in the metadata
  # DB behind `airflow users` and the basic-auth REST API. Same rationale as
  # Grafana's retained GF_SECURITY_ADMIN_PASSWORD.
  oidc:
    enabled: false
    displayName: Authentik
    # Load-bearing: the provider NAME must be the literal string "authentik".
    # Flask-AppBuilder's get_oauth_user_info is a per-provider switch, and only
    # its `authentik` branch decodes the ID token for the group claim
    # (role_keys <- groups). Rename it and role mapping silently stops working,
    # leaving every user on registrationRole.
    providerName: authentik
    clientId: airflow
    # Per-application issuer. FAB is given server_metadata_url and discovers
    # authorize/token/userinfo from it, so — unlike Grafana — the shared
    # /application/o base is NOT needed here. Trailing slash matters: it must
    # match the `iss` claim exactly.
    issuer: https://authentik.prod.fuzefront.com/application/o/airflow/
    secretName: airflow-oidc
    secretKey: CLIENT_SECRET
    # FAB role mapping, keyed on the `groups` claim. Requires the `groups`
    # scope on the Authentik provider AND include_claims_in_id_token, because
    # the authentik branch reads the ID TOKEN, not /userinfo.
    #
    # Anyone outside this group lands on registrationRole (FAB's `Public`) — no
    # DAG visibility, no actions. That is deliberate: it fails closed for
    # ordinary product users. The Authentik-side policy binding on the
    # `airflow` Application is the primary gate; this is defence in depth.
    adminGroup: fuzeinfra-admins
    registrationRole: Public
  # Number of Celery worker pods (scale data pipeline throughput here).
  workerReplicas: 1
  # Celery prefork concurrency per worker pod. Default Celery uses nproc (can
  # be 16+ on a 4-core node), consuming 1.5 GB+ of RAM. Set explicitly.
  celeryWorkerConcurrency: 4
  # Resource envelope for the worker pod. Unset = unbounded (dangerous on
  # single-node clusters). Override per environment in values-<env>.yaml.
  workerResources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "2",  memory: 1Gi }
  # Mount DAGs from a ConfigMap built from airflow-shared/dags? For real use,
  # prefer git-sync or a baked image. Default: empty dir + example DAG ConfigMap.
  loadExamples: false
  # How `fuzeinfra-airflow-init` (create the `airflow` database -> db migrate ->
  # create the admin user) is ordered against the Airflow Deployments.
  #
  #   inline — DEFAULT. A plain Job in the main resource wave, plus a
  #            wait-for-airflow-db init container on every Airflow pod.
  #
  #   hook   — the historical behaviour: a post-install/post-upgrade Helm hook,
  #            PostSync under Argo. Retained as an escape hatch; see below for
  #            why it is no longer the default.
  #
  # `hook` CANNOT COLD-START, on any cluster — this was never a local-only
  # problem. Helm runs post-install hooks only AFTER `--wait` reports the release
  # ready, and the Airflow pods can never become ready while the database the
  # hook is responsible for creating does not exist. So `--wait` burns its full
  # timeout, the hook never runs, and the pods sit in CrashLoopBackOff on
  # `FATAL: database "airflow" does not exist`. Argo has the identical ordering:
  # PostSync runs only after the sync goes healthy.
  #
  # It appeared to work everywhere only because every cluster it had ever run on
  # already had the database, created out-of-band years ago. Prod would deadlock
  # the same way if it were ever rebuilt from nothing — which is exactly the
  # situation you are in during a disaster recovery, when you can least afford to
  # be debugging chart ordering.
  #
  # `inline` is safe on an already-provisioned cluster: creating the database is
  # guarded, `airflow db migrate` is a no-op when there is nothing to apply, and
  # the admin-user step already tolerates existing users.
  init:
    mode: inline
    # How long the wait-for-airflow-db init container polls before failing the
    # pod. Bounded on purpose — a pod hung in Init forever is invisible to
    # restart-count alerting.
    waitTimeoutSeconds: 600

# -----------------------------------------------------------------------------
# DNS & external access
# -----------------------------------------------------------------------------
# dnsmasq: optional in-cluster DNS server that resolves the wildcard dev domain
# (*.<global.domain>) to a single target. In-cluster service discovery is already
# handled by CoreDNS, so this is OFF by default and mainly useful for kind where
# you want *.dev.local resolution served from the cluster.
dnsmasq:
  enabled: false
  image: jpillora/dnsmasq:latest
  dnsPort: 53
  webPort: 8080
  # Where *.<global.domain> resolves to. For host-side resolution keep 127.0.0.1;
  # set to the ingress controller address to route into the cluster.
  wildcardTarget: "127.0.0.1"
  # Additional wildcard zones beyond global.domain. Each entry:
  #   - domain: fuzefront.local
  #     target: "127.0.0.1"   # optional; defaults to wildcardTarget
  # Used for local parity with a consumer's production tenant-subdomain zone.
  extraWildcards: []
  adminPassword: admin123
  # ClusterIP | NodePort | LoadBalancer. Use LoadBalancer/NodePort to use this as
  # an actual DNS server from outside the cluster.
  serviceType: ClusterIP

# cloudflare-tunnel: optional cloudflared Deployment for secure external access.
# Two modes:
#   Local-config (preferred): set tunnelId to the Named Tunnel UUID.
#     cloudflared uses CLOUDFLARE_TUNNEL_CREDENTIALS from the cluster secret and
#     a generated config.yaml with ingress rules — no dashboard config needed.
#   Token mode (legacy): leave tunnelId empty.
#     cloudflared uses CLOUDFLARE_TUNNEL_TOKEN from the cluster secret and
#     fetches routing from the Cloudflare Zero Trust dashboard.
cloudflareTunnel:
  enabled: false
  image: cloudflare/cloudflared:latest
  metricsPort: 2000
  # ALL app ingress (every product family) multiplexes through this tunnel, so a
  # single replica is a shared-fate bottleneck: a broken backend's long-polling /
  # canceled socket.io streams congest the one pod's edge legs and add head-of-line
  # latency for everyone (see #389). Run ≥2 in prod. Each replica opens its own set
  # of HA edge connections, so replicas spread load across independent legs.
  replicas: 1
  # Per-replica resource envelope for the cloudflared process. Cloudflared is light;
  # requests keep it schedulable, the CPU limit caps a congestion/retry storm.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi
  # PodDisruptionBudget — only rendered when replicas > 1 (a PDB with minAvailable:1
  # on a single replica would block node drains). Keeps ≥1 tunnel leg up during
  # voluntary disruptions (drains, rollouts).
  pdb:
    minAvailable: 1
  # Soft anti-affinity: prefer scheduling replicas onto different nodes so one node
  # going down doesn't take the whole tunnel with it. Soft (preferred) so it never
  # blocks scheduling on a single-node cluster.
  spreadAcrossNodes: true
  # Named Tunnel UUID (from `cloudflared tunnel list` or Terraform output).
  # When set, switches to local-config mode with inline ingress rules.
  tunnelId: ""

# -----------------------------------------------------------------------------
# Cluster Autoscaler overprovisioning
# Maintains spare capacity on elastic node pools via low-priority pause pods.
# Disabled by default; enable in environment overlays that use elastic autoscaling.
# -----------------------------------------------------------------------------
overprovisioning:
  enabled: false
  replicas: 1
  image: registry.k8s.io/pause:3.9
  resources:
    cpu: "1"
    memory: 2Gi

# Cluster Autoscaler Contabo provider
# Runs as a standalone gRPC server that scales elastic nodes on Contabo.
# Disabled by default; enable and configure in environment overlays.
# The existingSecret must contain: CONTABO_CLIENT_ID, CONTABO_CLIENT_SECRET,
# CONTABO_API_USER, CONTABO_API_PASSWORD, K3S_NODE_TOKEN, SSH_KEY_ID.
# (Non-secret values are templated from the provider block below.)
# -----------------------------------------------------------------------------
clusterAutoscaler:
  enabled: false
  image: registry.k8s.io/autoscaling/cluster-autoscaler:v1.30.3
  nodeGroup:
    minSize: 0
    maxSize: 2
  scaleDownUnneededTime: 45m
  scaleDownDelayAfterAdd: 20m
  maxNodeProvisionTime: 15m
  maxTotalUnreadyPercentage: 45
  expander: least-waste
  # Billing-aware model (see reaper below): Contabo only terminates a
  # canceled instance at the END of its current paid month, so CA's normal
  # utilization-based scale-down (cordon+drain an idle node immediately)
  # just wastes the rest of the paid period. Scale-down is disabled here;
  # the reaper CronJob is what actually releases idle elastic capacity, and
  # only right before the instance would renew anyway.
  scaleDownEnabled: false
  provider:
    image: ghcr.io/izzywdev/fuzeinfra-contabo-ca-provider:latest
    existingSecret: fuzeinfra-ca-provider
    productId: ""
    imageId: ""
    region: EU
    k3sServerUrl: ""
    elasticTag: fuzeinfra-elastic
    elasticNamePrefix: fuzeinfra-elastic
    minSize: 0
    maxSize: 2
    grpcListen: ":8086"
    userDataTemplateB64: ""
    # Best-effort email warning sent immediately before each Create call in
    # NodeGroupIncreaseSize (internal/notify + internal/provider/scale.go) —
    # purely informational, never the authoritative safeguard (the MaxSize
    # name-prefix hard cap is enforced regardless of whether email is
    # configured/enabled/reachable). Off by default. NOTIFY_SMTP_USER/
    # NOTIFY_SMTP_PASS are deliberately NOT set here — if the chosen SMTP
    # relay needs auth, add those two keys to the existingSecret above
    # (fuzeinfra-ca-provider) via SealedSecret; they arrive as env vars
    # automatically through that Secret's envFrom, so no separate values
    # field is needed for them.
    notifyEmailEnabled: false
    notifySmtpHost: ""
    notifySmtpPort: "587"
    notifyEmailFrom: ""
    notifyEmailTo: ""
    # Same before-provision warning, delivered via the Telegram Bot API
    # (internal/notify.Telegram) instead of email — takes precedence over
    # notifyEmailEnabled above when both are true. Off by default.
    # NOTIFY_TELEGRAM_BOT_TOKEN is deliberately NOT a values field — it must
    # be added as a KEY to the existingSecret above (fuzeinfra-ca-provider)
    # via SealedSecret, never a plain Helm value.
    notifyTelegramEnabled: false
    notifyTelegramChatId: ""
    # Order the paid Contabo Private Networking add-on on every created elastic
    # node (createInstance addOns.privateNetworking) so it can attach to the
    # private VLAN without a separate /upgrade — the missing add-on is what
    # returns HTTP 402 on assign. OFF by default: turn on ONLY during the
    # coordinated private-VLAN cutover (a node on private-only flannel cannot
    # join a still-public control plane). See docs/design/s3-and-private-networking.md.
    privateNetworking: false
    # The Contabo private-network id created elastic nodes are ATTACHED to after
    # the add-on above is ordered (0 = no attach). Ordering the add-on grants the
    # capability; this grants network membership — both needed for a zero-touch
    # VLAN node. Set to the live network id (e.g. 60932) only at the cutover.
    privateNetworkId: 0
  # Billing-aware reaper (cluster-autoscaler/contabo-externalgrpc/cmd/reaper):
  # an hourly one-shot CronJob, run from the SAME image as the provider
  # (command: /reaper), that cordons/drains/cancels an elastic instance only
  # once it is within releaseWindow of its projected monthly renewal AND
  # currently idle. Off by default; enable per-overlay alongside
  # clusterAutoscaler.enabled (the template gates on both).
  reaper:
    enabled: false
    schedule: "0 * * * *"
    releaseWindow: 24h
    billingPeriod: 720h
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    # Bounds a single CronJob run; the binary's own internal context timeout
    # is 10m (cmd/reaper/main.go) — this gives it a little headroom before
    # Kubernetes itself kills the Job.
    activeDeadlineSeconds: 600
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

# -----------------------------------------------------------------------------
# Handoff MCP server — agent-to-agent orchestration carrier for the FuzeOne
# Managed-Agents fleet (agent-templates/orchestration/handoff_mcp).
# OFF by default. Enable per-overlay in the SAME change that lands the sealed
# secret deploy/sealed-secrets/handoff-mcp-secret.yaml (ANTHROPIC_API_KEY +
# HANDOFF_MCP_TOKEN) and populates helm/fuzeinfra/files/handoff-state/*.json.
# Exposed at mcp-handoff.<domain> (Ingress here + CF Access bypass in Terraform).
# -----------------------------------------------------------------------------
a2aRelay:
  # A2A WSS relay for cloud<->cloud Claude Code session messaging
  # (agent-templates/orchestration/a2a_relay). Off by default; on in values-contabo.
  enabled: false
  # v0: no image build — a stock python image pip-installs websockets at start.
  image: python:3.12-slim
  replicas: 1
  # Bump to force a pod roll after resealing a2a-relay-secret (see the template).
  secretRotation: "0"
  resources: {}

handoffMcp:
  enabled: false
  image: ghcr.io/izzywdev/fuzeinfra/agent-handoff
  tag: latest
  replicas: 1
  imagePullSecrets: []
  # Empty = inherit global.imagePullPolicy. Set to Always in any overlay that
  # still runs the floating `latest` tag, otherwise a node that cached `latest`
  # never sees a rebuild.
  imagePullPolicy: ""
  # Bump on EVERY reseal of deploy/sealed-secrets/handoff-mcp-secret.yaml, in the
  # SAME commit. It feeds checksum/handoff-secret, which is the only thing that
  # rolls the pod onto a rotated ANTHROPIC_API_KEY / HANDOFF_MCP_TOKEN: resealing
  # only rewrites ciphertext that Argo applies from outside this release, and a
  # running pod keeps its old env until something restarts it (#589).
  secretRotation: "1"
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# -----------------------------------------------------------------------------
# Custom Hostname API — runtime provisioning of customer-owned domains.
#
# Lets a consumer attach an arbitrary customer domain (app.corpabc.com) at
# runtime, with NO Helm release per domain. Two halves: Cloudflare for SaaS
# issues + deploys the edge certificate, and the service materializes a
# per-domain Ingress so Traefik host-routes it. Cluster-internal only — no
# Ingress, no tunnel route. See docs/consuming-repos/CUSTOM_DOMAINS.md.
#
# OFF by default. Enable per-overlay in the SAME change that lands
# deploy/sealed-secrets/custom-hostname-api-secret.yaml.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# Consumer registration RBAC — cross-namespace secret reads for consumer CI.
#
# A consumer whose CI must seal a token owned by ANOTHER product needs `get` on
# that one Secret. The grant lives here, not in the consumer's chart: handing out
# access to another namespace is the platform's boundary to control (FuzeInfra#99),
# and a consumer chart that renders RBAC into a foreign namespace gets its whole
# Argo sync rejected by its own restricted AppProject.
#
# Each entry is one Secret, one namespace, one ServiceAccount, `get` only.
# OFF by default; enable per-overlay alongside the consumer that needs it.
# -----------------------------------------------------------------------------
consumerRegistrationRbac:
  enabled: false
  # - namespace: fuzefront            # where the Secret lives
  #   secretName: fuzefront-registration
  #   subjectName: arc-runner-sa      # the ServiceAccount being granted access
  #   subjectNamespace: arc-runners
  grants: []

customHostnameApi:
  enabled: false
  image: ghcr.io/izzywdev/fuzeinfra/custom-hostname-api
  tag: latest
  replicas: 1
  port: 8080
  imagePullSecrets: []

  # "cloudflare" (real Cloudflare for SaaS) or "stub" (kind/local — emulates the
  # validation + issuance state machine so consumers can develop offline).
  provider: stub

  # Secret holding CLOUDFLARE_API_TOKEN, CLOUDFLARE_ZONE_ID, and one
  # CONSUMER_TOKEN_<PROFILE> per enabled route profile. Never committed —
  # delivered as a SealedSecret to the fuzeinfra namespace.
  secretName: custom-hostname-api-secret

  # Zones this platform already serves via wildcard DNS + certificate. Domains
  # inside them are rejected (422): they need no per-domain provisioning and
  # would silently consume Cloudflare custom-hostname quota.
  managedZone: fuzefront.com
  reservedZones: []

  # The hostname customers CNAME their domain to. Must be a proxied record in
  # the managed zone that resolves to the tunnel (terraform/contabo/cloudflare.tf,
  # var saas_custom_hostnames_enabled).
  cnameTarget: connect.fuzefront.com

  # Soft cap, checked before calling Cloudflare, so a runaway consumer cannot
  # walk the account into overage billing. Cloudflare includes 100 custom
  # hostnames on Free/Pro/Business; each one beyond that is $0.10/month.
  # 0 disables the check.
  maxCustomHostnames: 100

  # Materialize the per-domain Ingress. Off in the base values so a chart
  # rendered without route profiles cannot try to write to the cluster.
  routingEnabled: false

  # Stub only: seconds before a pending hostname auto-advances to active.
  stubActivateAfterSeconds: 20

  networkPolicy:
    enabled: false
    extraAllowedNamespaces: []

  # LOCAL DEVELOPMENT ONLY — renders a plaintext Secret with a well-known
  # consumer token so a kind cluster needs no SealedSecret. The chart FAILS to
  # render if this is enabled alongside provider=cloudflare.
  devSecret:
    enabled: false
    token: local-dev-token

  # Route profiles: which workload a consumer's domains are routed to. A
  # consumer's bearer token maps to exactly ONE profile, which is what stops it
  # pointing a customer domain at another consumer's Service.
  #   name:      logical consumer name; also derives CONSUMER_TOKEN_<NAME>
  #   namespace: consumer namespace the Ingress is created in
  #   service:   Service the Ingress backends to
  #   port:      Service port
  #   paths:     path prefixes to route (the consumer's full fan-out)
  #   createNamespace:
  #              create `namespace` ourselves. Keep FALSE on any cluster where
  #              the consumer deploys itself — it owns that namespace, and two
  #              releases claiming one Namespace object means an Argo sync loop
  #              or a `helm uninstall` that takes their workloads with it.
  #              Set true ONLY for a standalone cluster (kind / Docker Desktop)
  #              where this chart is the only thing installed; without it the
  #              profile's Role/RoleBinding fail with `namespaces "<x>" not
  #              found` and the whole install is rejected.
  # Defaults are OFF; the prod overlay flips `enabled: true` once the
  # SealedSecret carrying that profile's token is in the fuzeinfra namespace.
  routeProfiles:
    - name: fuzefront
      enabled: false
      namespace: fuzefront
      createNamespace: false
      service: fuzefront-frontend
      port: 80
      paths: ["/"]

# -----------------------------------------------------------------------------
# Longhorn replicated block storage (OPT-IN, default OFF).
#
# The Longhorn CONTROLLER (CSI driver, manager DaemonSet, CRDs, UI) deploys via
# its OWN independent Argo Application `argocd/applications/longhorn.yaml`
# (manual sync) — NOT this umbrella chart. This block only controls the OPT-IN,
# NON-DEFAULT `longhorn` StorageClass that the chart renders when
# `storageClass.enabled=true` (templates/storageclass-longhorn.yaml).
#
# `local-path` stays the cluster default (global.storageClass). Enabling this
# StorageClass changes NOTHING on its own — no existing PVC/StatefulSet is
# migrated here; each DB is moved onto `longhorn` in a separate, human-gated
# maintenance window. Enable ONLY after the Longhorn controller is installed and
# healthy (provisioner driver.longhorn.io must exist). See
# docs/design/longhorn-storage.md.
# -----------------------------------------------------------------------------
longhorn:
  # Umbrella-level marker (documentation/consistency). The actual controller is
  # the separate Argo Application; this chart never installs Longhorn itself.
  enabled: false
  storageClass:
    # Render the opt-in `longhorn` StorageClass. Default OFF → renders nothing.
    enabled: false
    name: longhorn
    # 3 replicas across distinct DURABLE (baseline) nodes. Keep replicas off
    # billing-reaped elastic nodes via diskSelector/nodeSelector (design §4.1).
    numberOfReplicas: 3
    # Never reap the underlying replicated DB volume when a PVC is deleted.
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    staleReplicaTimeout: 30
    fsType: ext4
    # Longhorn disk/node tags scoping replicas to durable nodes. Empty = no
    # scoping (set to e.g. "baseline" once baseline nodes are tagged in Longhorn).
    diskSelector: ""
    nodeSelector: ""
