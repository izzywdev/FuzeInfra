groups:
  - name: nodes
    rules:
      - alert: NodeDown
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node exporter {{ $labels.instance }} unreachable"
          description: "Node exporter has been unreachable for more than 2 minutes."

      - alert: NodeHighCPU
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.instance }} ({{ $value | humanizePercentage }})"
          description: "CPU usage above 85% for 10 minutes."

      - alert: NodeCriticalCPU
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical CPU on {{ $labels.instance }} ({{ $value | humanizePercentage }})"
          description: "CPU usage above 95% for 5 minutes."

      - alert: NodeHighMemory
        expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory on {{ $labels.instance }} ({{ $value | humanizePercentage }})"
          description: "Memory usage above 90%."

      - alert: NodeCriticalMemory
        expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical memory on {{ $labels.instance }} ({{ $value | humanizePercentage }})"
          description: "Memory usage above 95% — OOM kill risk."

      - alert: NodeDiskWarning
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs|overlay"} / node_filesystem_size_bytes < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space low on {{ $labels.instance }}:{{ $labels.mountpoint }}"
          description: "Less than 15% disk space available."

      - alert: NodeDiskCritical
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs|overlay"} / node_filesystem_size_bytes < 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical disk space on {{ $labels.instance }}:{{ $labels.mountpoint }}"
          description: "Less than 5% disk space — writes may fail."

      # ARC runner pods hard-select fuzeinfra.io/pool=ci. k3s applies
      # --node-label only at agent registration, so a manual `kubectl label`
      # is never reconciled by Terraform — on 2026-07-27 the CI node was
      # relabelled to pool=durable and all 8 scale sets sat Pending for 11h
      # with no alert. Requires kubeStateMetrics.nodeLabelsAllowlist to include
      # fuzeinfra.io/pool, otherwise the label_* dimension does not exist.
      # absent(), NOT count(...) == 0: when no node carries the label the
      # selector returns an EMPTY vector, count() over it yields no samples, and
      # `== 0` can never match. absent() is the only form that fires on absence.
      - alert: CiNodePoolLabelMissing
        expr: absent(kube_node_labels{label_fuzeinfra_io_pool="ci"})
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No node labelled fuzeinfra.io/pool=ci"
          description: >-
            Every ARC runner pod hard-selects fuzeinfra.io/pool=ci and will stay
            Pending until a node carries it. Terraform will NOT fix this (k3s
            sets node labels only at agent registration) — relabel by hand:
            kubectl label node <ci-node> fuzeinfra.io/pool=ci --overwrite

      # "every ci node is cordoned" == "the cordoned count equals the total".
      # Comparing two counts avoids the empty-vector trap above: the right-hand
      # side only produces samples when at least one ci node is cordoned, so
      # the rule is silent (rather than wrong) when none are.
      - alert: CiNodePoolUnschedulable
        expr: >-
          count(kube_node_labels{label_fuzeinfra_io_pool="ci"})
          ==
          count(kube_node_labels{label_fuzeinfra_io_pool="ci"}
                * on(node) group_left() (kube_node_spec_unschedulable == 1))
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "All fuzeinfra.io/pool=ci nodes are cordoned"
          description: "CI runner pods cannot schedule until a pool=ci node is uncordoned or added."

      - alert: NodeClockSkew
        expr: abs(node_timex_offset_seconds) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Clock skew on {{ $labels.instance }}"
          description: "System clock offset is {{ $value }}s. TLS and logs may be affected."

      # ---------------------------------------------------------------------
      # PRIVATE-VLAN MEMBERSHIP (net 60932, 10.0.0.0/22)
      #
      # An off-VLAN node is not benign. It registers Ready and runs pods, but its
      # kubelet is unreachable from the control plane (10250 is only open on the
      # VLAN), so `kubectl logs`/`exec`/`port-forward` against anything on it
      # fail with a 502 while the same call against a VLAN node succeeds -- the
      # node becomes undebuggable. Measured 2026-09-02 against
      # fuzeinfra-ci-runner-2 (off-VLAN) vs fuzeinfra-ci-runner-1 (10.0.0.4).
      #
      # THREE alerts on purpose, because each catches a different failure:
      #  * NodeOffPrivateVLAN is PATH-INDEPENDENT -- it reads the node's actual
      #    InternalIP, so it catches a node created by ANY provisioning path,
      #    including one nobody has audited yet. This is the backstop: the
      #    ci-runner-2 incident happened because a fix covered only the paths
      #    that were known at the time.
      #  * NodeQuarantinedOffVLAN catches a node whose cloud-init deliberately
      #    self-quarantined (the add-on or the network assign never landed).
      #  * NodeMissingVLANLabel catches a node from a provisioning path that
      #    predates the vlan= labelling, i.e. one that is not being audited at
      #    all. "No label" must never read as healthy.
      # ---------------------------------------------------------------------
      - alert: NodeOffPrivateVLAN
        # kube_node_info.internal_ip is the address k3s registered. Anything
        # outside 10.0.0.0/22 (including an IPv6 InternalIP, which is what k3s
        # picks when --node-ip is absent) means the node is off the VLAN.
        expr: kube_node_info{internal_ip!~"10[.]0[.][0-3][.].*"}
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.node }} is OFF the private VLAN (InternalIP {{ $labels.internal_ip }})"
          description: >-
            k3s registered this node on {{ $labels.internal_ip }} instead of an address in
            10.0.0.0/22. Its kubelet is unreachable from the control plane, so logs/exec/
            port-forward for every pod on it will fail with a 502. Remediation:
            docs/design/off-vlan-node-failure-policy.md.

      - alert: NodeQuarantinedOffVLAN
        expr: kube_node_labels{label_fuzeinfra_io_vlan="absent"}
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.node }} self-quarantined: private NIC never appeared"
          description: >-
            cloud-init waited for eth1 to carry an IPv4 and gave up, so the node joined with
            fuzeinfra.io/off-vlan=true:NoSchedule and carries no workload. The paid
            privateNetworking add-on or the assign to network 60932 did not land. Fix with
            the ca-private-net workflow (action=upgrade then action=assign); the node's join
            unit re-runs on the next boot and repairs itself.

      - alert: NodeMissingVLANLabel
        # Control planes are excluded: they are provisioned by
        # terraform/contabo/provisioning.tf, which sets node-ip from
        # config.yaml rather than from the node cloud-init, so they will never
        # carry this label. Expect this to fire for the agent nodes that
        # predate the labelling and to clear as each is recycled -- that is the
        # point: an unaudited node must not read as healthy. Kept at info with a
        # 24h window so it is a coverage signal, not a page.
        expr: >-
          (kube_node_info unless on(node)
            kube_node_labels{label_fuzeinfra_io_vlan=~"present|absent"})
          unless on(node) kube_node_role{role="control-plane"}
        for: 24h
        labels:
          severity: info
        annotations:
          summary: "Node {{ $labels.node }} carries no fuzeinfra.io/vlan label"
          description: >-
            This node was created by a provisioning path that does not report VLAN status,
            so nothing is auditing it. Identify the path and bring it onto the contract --
            see the provisioning-path table in docs/design/off-vlan-node-failure-policy.md.
