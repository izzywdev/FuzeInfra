groups:
  - name: kubernetes-pods
    rules:
      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total[1h]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} crash looping"
          description: "Container {{ $labels.container }} has restarted {{ $value | humanize }} times in the last hour."

      - alert: PodFrequentRestarts
        expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarting rapidly"
          description: "Container {{ $labels.container }} restarted {{ $value | humanize }} times in 15 minutes."

      - alert: PodOOMKilled
        expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "OOMKilled: {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}"
          description: "Container was killed by the OOM killer. Consider increasing memory limits."

      - alert: PodNotReady
        expr: kube_pod_status_ready{condition="false"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready"
          description: "Pod has been non-ready for more than 10 minutes."

      - alert: PodPendingTooLong
        expr: kube_pod_status_phase{phase="Pending"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} stuck Pending"
          description: "Pod has been in Pending state for 15 minutes — possible scheduling or PVC issue."

      - alert: PodFailed
        # A Failed pod owned by a Job (i.e. a Job/CronJob pod) is an EXPECTED
        # terminal state that Kubernetes retains ON PURPOSE — failedJobsHistoryLimit
        # keeps the last N failed Jobs' pods around for inspection. Those must not
        # page here: a healthy CronJob never pushes an old failure out of its
        # history, so a single legacy failed run (e.g. the mongodb backup dumps
        # that broke for ~2 days, since fixed) keeps kube_pod_status_phase{Failed}=1
        # and fires PodFailed FOREVER, long after backups went green again (#1090).
        # Batch failures have their own signal — KubeJobFailed below — which is the
        # design intent recorded in values.yaml ("Fail (and alert via
        # kube-state-metrics job_failed)"). Bare pods and controller pods
        # (ReplicaSet/StatefulSet/DaemonSet-owned) still page as before.
        expr: |
          kube_pod_status_phase{phase="Failed"} == 1
          unless on (namespace, pod) kube_pod_owner{owner_kind="Job"}
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is Failed"
          description: "Pod entered the Failed phase."

  - name: kubernetes-workloads
    rules:
      - alert: StatefulSetReplicasMismatch
        expr: |
          kube_statefulset_status_replicas_ready
          < kube_statefulset_replicas
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} degraded"
          description: "Ready replicas ({{ $value }}) < desired replicas."

      - alert: DeploymentReplicasMismatch
        expr: |
          kube_deployment_status_replicas_available
          < kube_deployment_spec_replicas
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} degraded"
          description: "Available replicas < desired. Rollout may be stuck."

      # Batch/CronJob failures are NO LONGER surfaced by PodFailed (it now excludes
      # Job-owned pods, because Kubernetes retains their terminal Failed pods by
      # design). This is the replacement signal — the "alert via kube-state-metrics
      # job_failed" that backups/values.yaml assumes exists. A Job that exhausts its
      # backoffLimit sets kube_job_status_failed>0.
      #
      # The recency guard is load-bearing, and is exactly why PodFailed was wrong:
      # a failed Job stays in CronJob history for days (failedJobsHistoryLimit), so
      # an UNGUARDED kube_job_status_failed>0 would re-create #1090 one level up —
      # paging forever on a run that failed a week ago and has since recovered.
      # Gating on "started within the last 24h" means each new failed daily backup
      # run keeps the alert live while the breakage is ongoing, but a long-since-
      # recovered failure ages out on its own. `for: 15m` additionally rides out a
      # run that fails once and then succeeds on its next scheduled attempt.
      - alert: KubeJobFailed
        expr: |
          (kube_job_status_failed > 0)
          and on (namespace, job_name)
          (time() - kube_job_status_start_time < 86400)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed"
          description: "Job has failed pods (backoffLimit exhausted). For a backup CronJob this means the dump or upload did not complete — check the job's pods."

      - alert: PVCPending
        expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} stuck Pending"
          description: "PersistentVolumeClaim has not been bound for 5 minutes."

      # EARLY WARNING for PVC growth, deliberately ahead of PVCAlmostFull below.
      # This exists because Loki OSS has NO size-based retention — only time
      # (limits_config.retention_period) — so nothing inside Loki reacts to "the
      # disk is filling"; an alarm is the only mechanism that catches it before
      # it fills. And a full Loki volume is self-sealing: retention is enforced
      # by the compactor, the compactor runs inside Loki, and Loki cannot start
      # on a full disk. On 2026-08-30 that crash-looped 694 times over 2d11h and
      # wedged an Argo sync in phase=Running for 37 hours, silently freezing
      # every prod deployment queued behind it.
      #
      # Expressed as used/capacity (not available/capacity) so the threshold
      # reads the same way as the incident did. 80% on a 20Gi volume leaves ~4Gi
      # of headroom — hours, not minutes, at fleet log rates.
      #
      # Requires the `kubernetes-nodes` scrape job (kubelet /metrics via the
      # apiserver proxy) to be up; kubelet_volume_stats_* comes from the kubelet,
      # not cAdvisor, and is not subject to the cadvisor keep-list.
      - alert: PVCFillingUp
        expr: |
          kubelet_volume_stats_used_bytes
          / kubelet_volume_stats_capacity_bytes > 0.80
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"
          description: >-
            Act now, while there is still headroom — a volume that reaches 100%
            can wedge its workload and, for Loki, the whole Argo sync queue.
            Do BOTH, in Git only (prod is GitOps under selfHeal; never
            `kubectl patch` the live PVC): (1) reduce what is written — for
            fuzeinfra-loki-data lower limits_config.retention_period in
            helm/fuzeinfra/templates/configmaps-monitoring.yaml, or set
            loki.s3.enabled=true in values-contabo.yaml to move chunks+index off
            the PVC entirely; (2) if growth is legitimate, raise the matching
            `storage:` value in helm/fuzeinfra/values-contabo.yaml and merge —
            the `longhorn` class allows expansion, and growth only (the API
            server rejects a shrink).

      - alert: PVCAlmostFull
        expr: |
          kubelet_volume_stats_available_bytes
          / kubelet_volume_stats_capacity_bytes < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} almost full"
          description: "Less than 10% capacity remaining."

  - name: kubernetes-resources
    rules:
      - alert: ContainerHighCPU
        expr: |
          sum by (namespace, pod, container) (
            rate(container_cpu_usage_seconds_total{container!="",container!="POD"}[5m])
          ) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "High CPU: {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}"
          description: "Container using {{ $value | humanize }} CPU cores for 15 minutes."

      - alert: ContainerHighMemory
        expr: |
          container_memory_working_set_bytes{container!="",container!="POD"}
          / on(namespace, pod, container)
          kube_pod_container_resource_limits{resource="memory"} > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory: {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}"
          description: "Container using >90% of its memory limit."
