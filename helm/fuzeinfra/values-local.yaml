# =============================================================================
# Local (kind) overlay.
#   helm upgrade --install fuzeinfra helm/fuzeinfra \
#     -n fuzeinfra --create-namespace -f helm/fuzeinfra/values-local.yaml
# =============================================================================
global:
  storageClass: "standard"   # kind's default dynamic provisioner
  domain: dev.local
  imagePullPolicy: IfNotPresent

ingress:
  enabled: true
  className: nginx
  tls:
    enabled: false

# Smaller footprint for laptops.
elasticsearch:
  javaOpts: "-Xms256m -Xmx256m"
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits:   { cpu: 500m, memory: 1Gi }

# The pytest smoke suite reaches Kafka over a port-forward and expects
# localhost:29092. Without this listener it bootstraps successfully and is then
# handed the in-cluster FQDN for every produce/consume, which does not resolve
# from outside — see kafka.externalListener in values.yaml. Local only.
kafka:
  externalListener:
    enabled: true

airflow:
  workerReplicas: 1
  # A fresh cluster has no `airflow` database, and the default `hook` mode
  # cannot create one: Helm runs post-install hooks only after `--wait` reports
  # the release ready, and the Airflow pods can never be ready until the hook
  # has run. `--wait` burns its full 10m, the hook never fires, and all four
  # pods sit in CrashLoopBackOff on
  #   FATAL:  database "airflow" does not exist
  # Local is the only place that genuinely cold-starts, so it is the only place
  # that needs `inline`. See airflow.init.mode in values.yaml.
  init:
    mode: inline

# The admin token Secret is a SealedSecret in prod and does not exist on kind.
# Without this the chromadb pod is stuck in Init:CreateContainerConfigError
# forever. Throwaway value — never set this in a real overlay.
chromadb:
  auth:
    adminSecret:
      devSecret:
        enabled: true
        token: local-dev-chroma-admin-token

# Optional local DNS server for *.dev.local. Exposed in-cluster; query it via the
# dnsmasq Service. CoreDNS still handles in-cluster service names.
dnsmasq:
  enabled: true
  wildcardTarget: "127.0.0.1"
  serviceType: ClusterIP
  # Local mirror of the production tenant-subdomain zone: *.fuzefront.com in
  # prod becomes *.fuzefront.local on kind, so multi-tenant Host-header
  # resolution can be developed without editing /etc/hosts per tenant.
  extraWildcards:
    - domain: fuzefront.local

# cloudflare-tunnel stays off locally (needs a real tunnel token). To enable:
#   cloudflareTunnel.enabled=true and set credentials.cloudflare.tunnelToken
cloudflareTunnel:
  enabled: false

# Cluster Autoscaler / Contabo provider / overprovisioning stay off on kind —
# there's no Contabo API to call locally. kind uses fake-mode node scaling
# (see Task 17), not this stack. Base chart defaults already set these to
# false; listed here explicitly so the overlay stays self-documenting.
clusterAutoscaler:
  enabled: false

overprovisioning:
  enabled: false

# Custom Hostname API — ON locally in stub mode so consumers can develop the
# self-service custom-domain flow with no Cloudflare account and no real DNS.
# The stub emulates the full validation -> issuance -> deployment -> active
# state machine on a 5s timer, returns the same TXT/CNAME record shapes as
# Cloudflare, and still materializes a real Ingress in the consumer namespace,
# so a locally-resolved host actually routes.
#
# Reach it from another pod:
#   curl -H "Authorization: Bearer local-dev-token" \
#     http://custom-hostname-api.fuzeinfra.svc.cluster.local:8080/custom-hostnames
#
# Pair with a wildcard *.fuzefront.local in dnsmasq (below) for the tenant-
# subdomain half of the story.
customHostnameApi:
  enabled: true
  provider: stub
  managedZone: fuzefront.local
  cnameTarget: connect.fuzefront.local
  routingEnabled: true
  stubActivateAfterSeconds: 5
  # Plaintext token, kind only. Guarded: the chart refuses to render this
  # alongside provider=cloudflare.
  devSecret:
    enabled: true
    token: local-dev-token
  networkPolicy:
    enabled: false
  routeProfiles:
    - name: fuzefront
      enabled: true
      namespace: fuzefront
      # Local only. Nothing else installs FuzeFront on a kind/Docker-Desktop
      # cluster, so this chart has to create the namespace its Role/RoleBinding
      # land in — otherwise the install is rejected outright with
      # `namespaces "fuzefront" not found`. Never set this in a real overlay.
      createNamespace: true
      service: fuzefront-frontend
      port: 80
      paths: ["/", "/api", "/socket.io"]
      ingressClass: nginx
