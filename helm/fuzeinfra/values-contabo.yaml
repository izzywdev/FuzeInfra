# =============================================================================
# Contabo VPS (k3s single-node) overlay
#
#   helm upgrade --install fuzeinfra helm/fuzeinfra \
#     -n fuzeinfra --create-namespace -f helm/fuzeinfra/values-contabo.yaml
#
# k3s ships with:
#   - local-path provisioner as default StorageClass
#   - Traefik as the default ingress controller (className: traefik)
#
# Domain: defaults to <server-ip>.nip.io (free wildcard DNS).
# Replace with a real domain once you have DNS pointing at the server.
# =============================================================================
global:
  # Pin the namespace segment of every published service address. Prod consumers
  # (fuzefront, mendys-prod, fuzequality, ...) live in other namespaces and can
  # only reach the shared services by FQDN, so this value is part of the
  # cross-namespace contract in CONTRACT.md — not an install detail. Pinning it
  # makes the rendered addresses identical no matter how the chart is invoked,
  # including an out-of-band `helm upgrade` that forgets `--namespace`.
  serviceNamespace: "fuzeinfra"
  # DB StatefulSet PVCs default to durable Longhorn. This is the systemic cure
  # for the 2026-07-24 local-path reversion class: whenever a StatefulSet is
  # (re)created, its volume lands on Longhorn (reclaimPolicy: Retain) instead of
  # a fresh, empty local-path PVC. Existing STSs are unaffected — Argo's
  # ignoreDifferences on .spec.volumeClaimTemplates ignores the immutable VCT.
  # local-path remains the cluster's default class for anything not using this.
  storageClass: "longhorn"
  # Cloudflare tunnel routes *.prod.fuzefront.com → Traefik → these Ingress rules.
  # Change back to <ip>.nip.io if the tunnel is disabled for debugging.
  domain: "prod.fuzefront.com"
  imagePullPolicy: IfNotPresent
# Longhorn opt-in StorageClass. GATED OFF. The controller installs via the
# independent Argo app argocd/applications/longhorn.yaml (manual sync); this only
# renders the non-default `longhorn` StorageClass. P4 enable step (design doc §9):
# flip storageClass.enabled to true AFTER the controller is installed + healthy.
longhorn:
  enabled: false
  storageClass:
    enabled: false
    numberOfReplicas: 3
    reclaimPolicy: Retain
coreDnsSplitHorizon:
  enabled: true   # k3s prod — rewrites *.prod.fuzefront.com to ClusterIP inside cluster

ingress:
  enabled: true
  className: traefik
  tls:
    enabled: false # enable once cert-manager is wired up
# Sizing for 4 vCPU / 8 GB RAM single node.
# Leave headroom for k3s, ArgoCD, and system processes (~2 GB).
postgres:
  storage: 20Gi
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
  # Pin to durable Longhorn-disk nodes (the 3 durable nodes carry this label;
  # ephemeral elastics do not) so Postgres availability never depends on an
  # autoscaled node. See the 2026-07-24 storage/OOM incident.
  nodeSelector:
    node.longhorn.io/create-default-disk: "true"
mongodb:
  # Pin to durable Longhorn-disk nodes. longhorn-manager only runs on the 3
  # durable nodes, so Longhorn registers node.longhorn.io objects only there;
  # a stateful pod scheduled onto an ephemeral elastic node can NEVER attach
  # its volume (FailedAttachVolume: node.longhorn.io "..." not found).
  nodeSelector:
    node.longhorn.io/create-default-disk: "true"
  storage: 10Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
# Shared MariaDB engine — ON in prod. Consumers needing a MySQL-protocol store
# (WordPress and friends) must stop shipping their own MariaDB StatefulSet:
# mendys-wp's own `mendys-wp-mariadb` STS had its PVC on `local-path` and lost
# it to a node reinstall (2026-07-24 storage class). The shared engine's PVC is
# Longhorn (global.storageClass, reclaimPolicy Retain) and is backed up by the
# nightly DB backup CronJobs, which a consumer-owned engine never was.
mariadb:
  enabled: true
  # Pin to durable Longhorn-disk nodes. longhorn-manager only runs on the 3
  # durable nodes, so Longhorn registers node.longhorn.io objects only there;
  # a stateful pod scheduled onto an ephemeral elastic node can NEVER attach
  # its volume (FailedAttachVolume: node.longhorn.io "..." not found).
  nodeSelector:
    node.longhorn.io/create-default-disk: "true"
  storage: 20Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
neo4j:
  # Pin to durable Longhorn-disk nodes (same as postgres) so Neo4j never runs
  # on an ephemeral autoscaled node once products start seeding it.
  nodeSelector:
    node.longhorn.io/create-default-disk: "true"
serviceNeo4jInstances:
  # FuzePlan gets a dedicated Neo4j — Community edition cannot RBAC or multi-DB,
  # so full isolation requires a separate container with its own PVC + creds.
  # Bolt address for FuzePlan: bolt://fuzeinfra-neo4j-fuzeplan.fuzeinfra.svc.cluster.local:7687
  # Disabled: Longhorn volume pvc-7cbb913f faulted (8d ContainerCreating, 5700+ FailedAttachVolume).
  # PVCs survive STS deletion — re-enable after Longhorn volume is repaired via Longhorn UI.
  - name: fuzeplan
    enabled: false
    passwordSecret:
      name: neo4j-fuzeplan-credentials
      key: password
    storage: 5Gi
    nodeSelector:
      node.longhorn.io/create-default-disk: "true"
    resources:
      requests: {cpu: 200m, memory: 1Gi}
      limits: {cpu: "1", memory: 2Gi}
redis:
  # Pin to durable Longhorn-disk nodes. longhorn-manager only runs on the 3
  # durable nodes, so Longhorn registers node.longhorn.io objects only there;
  # a stateful pod scheduled onto an ephemeral elastic node can NEVER attach
  # its volume (FailedAttachVolume: node.longhorn.io "..." not found).
  nodeSelector:
    node.longhorn.io/create-default-disk: "true"
  storage: 2Gi
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
# TEMPORARY headroom reduction for the saturated single control-plane node (#93).
# elasticsearch / rabbitmq / airflow are scaled to 0 pods. Their StatefulSets and
# PVCs are RETAINED (no prune, no data loss) — set replicas back to 1 to restore.
# mongo / neo4j / postgres / redis / kafka / chromadb / monitoring stay running.
elasticsearch:
  # Pin to durable Longhorn-disk nodes. longhorn-manager only runs on the 3
  # durable nodes, so Longhorn registers node.longhorn.io objects only there;
  # a stateful pod scheduled onto an ephemeral elastic node can NEVER attach
  # its volume (FailedAttachVolume: node.longhorn.io "..." not found).
  nodeSelector:
    node.longhorn.io/create-default-disk: "true"
  replicas: 0
  storage: 20Gi
  javaOpts: "-Xms512m -Xmx512m"
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {cpu: "1", memory: 1536Mi}
rabbitmq:
  # Pin to durable Longhorn-disk nodes. longhorn-manager only runs on the 3
  # durable nodes, so Longhorn registers node.longhorn.io objects only there;
  # a stateful pod scheduled onto an ephemeral elastic node can NEVER attach
  # its volume (FailedAttachVolume: node.longhorn.io "..." not found).
  nodeSelector:
    node.longhorn.io/create-default-disk: "true"
  replicas: 0 # TEMP headroom (#93) — restore to 1 when the node has capacity
  # Strong credential from deploy/sealed-secrets/fuzeinfra-app-credentials.yaml,
  # replacing the chart default "admin123" that prod was otherwise rendering.
  # Takes effect only when the broker initialises against an empty mnesia — which
  # is exactly what will happen whenever replicas goes back above 0 on a fresh
  # volume. If an existing volume is reused, rotate with `rabbitmqctl
  # change_password`, and re-seal any consumer repo holding the old value.
  passwordSecret:
    name: fuzeinfra-app-credentials
    key: RABBITMQ_PASSWORD
kafka:
  # Pin to durable Longhorn-disk nodes. longhorn-manager only runs on the 3
  # durable nodes, so Longhorn registers node.longhorn.io objects only there;
  # a stateful pod scheduled onto an ephemeral elastic node can NEVER attach
  # its volume (FailedAttachVolume: node.longhorn.io "..." not found).
  nodeSelector:
    node.longhorn.io/create-default-disk: "true"
  storage: 10Gi
prometheus:
  # Pin to durable Longhorn-disk nodes. longhorn-manager only runs on the 3
  # durable nodes, so Longhorn registers node.longhorn.io objects only there;
  # a stateful pod scheduled onto an ephemeral elastic node can NEVER attach
  # its volume (FailedAttachVolume: node.longhorn.io "..." not found).
  nodeSelector:
    node.longhorn.io/create-default-disk: "true"
  storage: 20Gi
  # Let downstream apps ship Prometheus alert/recording rules from their own
  # namespaces via ConfigMaps labeled `prometheus_rule: "1"`.
  ruleSidecar:
    enabled: true
grafana:
  # Auto-load dashboards from any namespace via ConfigMaps labeled
  # `grafana_dashboard: "1"`.
  dashboardSidecar:
    enabled: true
  # Real break-glass admin password, from deploy/sealed-secrets/grafana-admin.yaml.
  # Without this, prod inherited the chart default — the literal string "admin" —
  # because no overlay ever set credentials.grafana.adminPassword. Cloudflare
  # Access was the only thing in front of admin/admin.
  adminPasswordSecret:
    name: grafana-admin
    key: GRAFANA_ADMIN_PASSWORD
    # Rotated 2026-08-20. Bumping this is what rolls the pod so the new password
    # is actually loaded; resealing alone does not restart anything.
    rotation: "2026-08-20"
  # Authentik SSO. Safe to enable: deploy/sealed-secrets/grafana-oidc.yaml is in
  # this same change, and the `grafana` provider is live in Authentik
  # (https://authentik.prod.fuzefront.com/application/o/grafana/ returns a discovery doc
  # advertising the `groups` scope that roleAttributePath depends on).
  #
  # The local admin stays enabled — /login still works. See the break-glass note
  # in templates/monitoring.yaml; do not remove it.
  oidc:
    enabled: true

# Kafka UI has NO authentication without this — before Authentik SSO, anyone who
# cleared the Cloudflare Access wall was an unauthenticated admin, and with
# DYNAMIC_CONFIG_ENABLED=true that was write-capable.
kafkaUi:
  oidc:
    enabled: true
    # Authorization, not just authentication. Until this flipped, every account
    # that completed SSO was a full kafka-ui admin — and with
    # DYNAMIC_CONFIG_ENABLED=true that admin could edit cluster config, produce
    # and delete messages, and delete topics.
    #
    # Safe to enable HERE and only here because prod is the only environment
    # whose Authentik `kafka-ui` provider actually grants the `groups` scope.
    # Verified against the live discovery document on 2026-08-20:
    #   https://authentik.prod.fuzefront.com/application/o/kafka-ui/.well-known/openid-configuration
    #   -> scopes_supported includes "groups", claims_supported includes "groups"
    #
    # This is a hard cutover: once rbac.roles is non-empty, kafka-ui denies
    # everything to anyone who matches no role. Members of fuzeinfra-admins get
    # full access; everyone else gets nothing (see values.yaml for why there is
    # no read-only fallback).
    rbac:
      enabled: true
    # Bump this whenever deploy/sealed-secrets/kafka-ui-oidc.yaml is resealed.
    #
    # It exists solely to change the checksum/oidc pod annotation, which hashes
    # this block. Kubernetes does NOT restart a pod when a Secret changes — env
    # is read once at startup — and the chart cannot hash the SealedSecret's
    # content because that is ciphertext applied by Argo, outside the release.
    # So a reseal alone leaves the consumer running with the OLD secret while
    # Authentik has the new one, and the token exchange fails with a generic
    # "Invalid credentials" that implicates neither side.
    #
    # Learned the hard way: the reseal landed, Authentik rolled on its
    # checksum/blueprints annotation and picked up the new value, and kafka-ui
    # did not roll at all — leaving the pair mismatched in the opposite direction
    # from the one the reseal was meant to fix.
    secretRotation: "2026-08-19"
    # Off again. It did its job: with Spring Security at DEBUG the pod log named
    # the actual failure — "[invalid_id_token] Unsupported algorithm of HS256" —
    # which is what identified the missing signing_key on the Authentik providers
    # (izzywdev/FuzeFront#762). Four prior hypotheses had not found it.
    #
    # Turn it back on the same way if another OAuth2 failure needs diagnosing.
    # Read the TRACE warning in templates/messaging.yaml first.
    debugLogging: false
# Alertmanager: wire real notification receivers here. Example webhook receiver:
# alertmanager:
#   config:
#     receiver: ops
#   receivers:
#     - name: default
#     - name: ops
#       webhook_configs:
#         - url: https://example.com/hooks/alerts
#           send_resolved: true
#   routes:
#     - match:
#         severity: critical
#       receiver: ops
#       repeat_interval: 1h

# Loki S3 backend (Contabo Object Storage) — keeps logs off the node disk.
#
# The endpoint/bucket are wired here for prod; the switch is `enabled`, kept
# FALSE until the credential SealedSecret is present (flipping it on without the
# secret would crash-loop Loki). This is a human-gated phase — see
# docs/backups-and-blobs.md.
#
# To turn on (GitOps — never `kubectl create secret` in prod):
#   1. Fetch the S3 key pair from the Contabo panel for the `fuzeinfra-loki`
#      bucket (provisioned by terraform object-storage).
#   2. Seal it OFFLINE into a SealedSecret named `loki-s3` in the fuzeinfra
#      namespace with keys LOKI_S3_ACCESS_KEY_ID / LOKI_S3_SECRET_ACCESS_KEY,
#      commit it, let Argo sync.
#   3. Flip loki.s3.enabled -> true here, commit, let Argo sync.
loki:
  # Pin to durable Longhorn-disk nodes. longhorn-manager only runs on the 3
  # durable nodes, so Longhorn registers node.longhorn.io objects only there;
  # a stateful pod scheduled onto an ephemeral elastic node can NEVER attach
  # its volume (FailedAttachVolume: node.longhorn.io "..." not found).
  nodeSelector:
    node.longhorn.io/create-default-disk: "true"
  # 20Gi, not the 5Gi base default — and as of the Deployment conversion this
  # value is ENFORCED rather than aspirational.
  #
  # HOW IT WORKS NOW. Loki is a Deployment (strategy: Recreate) whose data volume
  # is the standalone PVC `fuzeinfra-loki-data`, declared as its own template in
  # helm/fuzeinfra/templates/monitoring.yaml. A standalone PVC's
  # spec.resources.requests.storage is mutable and the `longhorn` class sets
  # allowVolumeExpansion: true, so resizing Loki's disk is now an ordinary GitOps
  # change: edit the number below, merge to main, Argo applies the PVC patch and
  # Longhorn expands the volume. Growth only — the API server rejects a shrink.
  #
  # WHAT THIS REPLACED. Loki used to be a StatefulSet, so its storage came from
  # volumeClaimTemplates — an immutable field, additionally hidden from the sync by
  # the chart's Argo ignoreDifferences + RespectIgnoreDifferences. This number was
  # therefore INERT: raising it 5Gi -> 20Gi changed nothing on the running cluster,
  # and the live volume only reached 20Gi via a direct `kubectl patch pvc` on
  # 2026-08-31 — exactly the out-of-band mutation GitOps exists to eliminate.
  # That ignoreDifferences rule is deliberately UNTOUCHED: it is keyed on
  # `kind: StatefulSet` with no name, and postgres/mongodb/neo4j/kafka/
  # elasticsearch/redis/rabbitmq/prometheus/alertmanager/chromadb all still need it
  # to protect real data after the 2026-07-24 incident. Loki is simply no longer a
  # StatefulSet, so it is no longer in that rule's scope.
  #
  # WHY 5Gi WAS NOT SURVIVABLE, and why this is not merely a tuning nit. Loki
  # retained 744h (31 days) of fleet logs and compacted them on a schedule
  # (compactor.retention_enabled, configmaps-monitoring.yaml). 31 days of logs
  # from 22 repos' workloads does not fit in 5Gi, so the volume filled — and a
  # FULL Loki volume is self-sealing, because retention is enforced BY the
  # compactor, the compactor runs inside Loki, and Loki cannot start:
  #
  #   mkdir /loki/tsdb-shipper-active/scratch/...: no space left on device
  #
  # It crash-looped 694 times over 2d11h and could never free its own space.
  #
  # The cost was not lost logs. Argo's sync of fuzeinfra-prod blocks on resource
  # health, so a permanently-unhealthy Loki wedged one sync operation in `Running`
  # for 37 HOURS (started 2026-08-30 08:47), and every prod change queued behind
  # it silently — including the cluster-autoscaler maxSize raise that fleet-wide
  # CI was waiting on. A monitoring component took the delivery pipeline down by
  # filling a disk. Size this generously; it is not where to economise.
  #
  # Retention is now 336h (14 days, configmaps-monitoring.yaml) and s3.enabled is
  # true below, so this volume no longer holds the retention window at all. Kept
  # at 20Gi deliberately: it is the WAL + tsdb-shipper cache + compactor scratch,
  # and Loki OSS has no size-based retention, so headroom is still the only thing
  # standing between a write spike and a stuck pod. The new PVCFillingUp alert
  # (rules/kubernetes.yml, 80%) is what catches that now.
  storage: 20Gi
  s3:
    # ON since 2026-09-01. This — not a bigger disk — is the real remedy for
    # unbounded growth: chunks + index live in Contabo Object Storage, so the PVC
    # stops being the constraint and can no longer wedge Loki (and, through Loki's
    # health, the whole Argo sync queue). The PVC above still exists and still
    # matters: Loki keeps its WAL, the tsdb-shipper active/cache directories and
    # the compactor working_directory on local disk, so it is sized for working
    # set rather than for the full retention window.
    #
    # No longer "human-gated". The gate was never a safeguard — it was a flag
    # waiting on a human to seal a secret, which is a defect in an autonomous
    # SDLC. The credential was fetched from the Contabo API (NOT the panel; the
    # API also requires x-request-id to be a valid UUID), verified against
    # eu2.contabostorage.com/fuzeinfra-loki with a list + put/head/delete
    # round-trip, and sealed OFFLINE against the committed public cert
    # (deploy/sealed-secrets/sealing-cert.pem) into
    # deploy/sealed-secrets/loki-s3-credentials.yaml -> SealedSecret
    # fuzeinfra/loki-s3, which the fuzeinfra-sealed-secrets Argo app syncs.
    # Ordering note: that SealedSecret ships in the SAME commit as this flip, and
    # monitoring.yaml wires the keys via secretKeyRef, so if the Secret is not yet
    # materialised the Loki pod stays Pending on the missing Secret rather than
    # starting with an empty credential and looping on S3 auth errors.
    enabled: true
    endpoint: "eu2.contabostorage.com"
    region: "default"
    bucket: "fuzeinfra-loki"
    s3ForcePathStyle: true
    insecure: false
    existingSecret: "loki-s3"

# Scheduled DB backups → S3 (Contabo Object Storage). Bucket/endpoint wired for
# prod; kept OFF until the `fuzeinfra-backups-s3` SealedSecret is committed.
# See docs/backups-and-blobs.md for the enable + retention-policy steps.
backups:
  # ENABLED via the PVC sink (Longhorn) — the interim tier instituted after the
  # 2026-07-24 data-loss incident. Works today with no object storage. When the
  # fuzeinfra-backups bucket + fuzeinfra-backups-s3 SealedSecret are provisioned,
  # flip `sink: s3` for durable off-cluster backups (the S3 block below is ready).
  enabled: true
  # s3 sink: dumps go OFF-cluster to Contabo Object Storage. The pvc sink was the
  # interim tier and it failed exactly as feared — the durable nodes' Longhorn
  # disks were re-initialised, every replica of fuzeinfra-db-backups referenced a
  # dead disk UUID, the volume could not attach anywhere and all stored dumps
  # were lost. Backups held on the storage they protect against are not backups.
  sink: s3
  pvc:
    storageClass: longhorn
    size: 20Gi
    keep: 7
  # Stagger per-DB schedules: they share one RWO PVC, so they must not overlap.
  postgres:
    schedule: "0 2 * * *"    # 02:00 UTC
  mongodb:
    schedule: "20 2 * * *"   # 02:20 UTC
  neo4j:
    schedule: "40 2 * * *"   # 02:40 UTC
  # Follows mariadb.enabled: true above. Staggered clear of the other three.
  mariadb:
    enabled: true
    schedule: "0 3 * * *"    # 03:00 UTC
  s3:
    endpoint: "https://eu2.contabostorage.com"
    region: "default"
    bucket: "fuzeinfra-backups"
    prefix: "db"
    existingSecret: "fuzeinfra-backups-s3"
    lifecycleExpireDays: 30   # provider expires db/ objects after 30 days
airflow:
  # Restored to 1 to make the SSO login exercisable — with no webserver pod the
  # flow cannot be tested at all, which is why the runbook lists this as a
  # precondition for flipping oidc.enabled rather than an afterthought.
  #
  # workerReplicas is deliberately left at 0 below. The webserver is what serves
  # the login; celery workers only execute DAG tasks and would add memory
  # pressure for nothing. This node has OOM-thrashed before (#93 is the headroom
  # ticket, and the durable nodes went down under concentrated load), so this
  # restores the minimum needed to verify SSO, not the whole stack.
  replicas: 1
  oidc:
    enabled: true
    # Bump when deploy/sealed-secrets/airflow-oidc.yaml is resealed — see the
    # checksum annotation in templates/airflow.yaml.
    secretRotation: "2026-08-20"
  # Strong credential, replacing the chart default "admin". Applies on a fresh
  # metadata DB only: airflow-init runs `airflow users create ... || true`, which
  # silently no-ops for an existing user. Rotate an existing one with
  # `airflow users reset-password`.
  adminPasswordSecret:
    name: fuzeinfra-app-credentials
    key: AIRFLOW_ADMIN_PASSWORD
  # Real Fernet key for connection-credential encryption. A human operator must:
  #   1. python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  #   2. seal it: scripts/seal-secret.sh fuzeinfra fuzeinfra-app-credentials AIRFLOW_FERNET_KEY <value>
  #   3. commit deploy/sealed-secrets/fuzeinfra-app-credentials.yaml (or whichever SealedSecret holds it)
  # After any key rotation: airflow connections rotate-fernet-key (if connections exist)
  fernetKeySecret:
    name: fuzeinfra-app-credentials
    key: AIRFLOW_FERNET_KEY
  # Authentik SSO for the Airflow UI.
  #
  # DELIBERATELY STILL FALSE, for two independent reasons — either one alone is
  # enough to keep it off:
  #
  #   1. deploy/sealed-secrets/airflow-oidc.yaml does not exist yet. The value
  #      has to be minted by a human, sealed TWICE (fuzefront/fuzefront-secrets
  #      key AIRFLOW_CLIENT_SECRET for the IdP side, fuzeinfra/airflow-oidc key
  #      CLIENT_SECRET for this side) and merged together — see
  #      deploy/sealed-secrets/authentik-oidc-secrets.yaml.template. Enabling
  #      first gives the webserver CreateContainerConfigError, exactly as
  #      documented for grafana.oidc and kafkaUi.oidc.
  #
  #   2. `replicas: 0` above. There is no webserver pod, so an SSO login cannot
  #      be exercised end to end even if the secret existed. Flipping this while
  #      the service is scaled to zero would look like coverage without being
  #      coverage.
  #
  # Flip to true in the same commit that lands the SealedSecret, and only once
  # replicas is back above 0.
  workerReplicas: 0 # TEMP headroom (#93): celery worker -> 0 pods
  # 4 vCPU / 8 GB node — cap concurrency and memory to stop the worker from
  # crowding out CoreDNS/Postgres under memory pressure.
  celeryWorkerConcurrency: 4
  workerResources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: "2", memory: 1536Mi}
# Cloudflare tunnel: all traffic enters via the named tunnel; no host-level
# ports 80/443 need to be open.  The tunnel token lives in fuzeinfra-secrets
# (key: CLOUDFLARE_TUNNEL_TOKEN) which is patched by terraform/cloudflare or
# scripts/setup-cloudflare-tunnel.sh — it is NEVER committed to git.
# Routing rules (hostname → service) are managed via terraform/cloudflare.
cloudflareTunnel:
  enabled: true
  # ≥2 replicas so ALL product-family ingress isn't multiplexed through one pod's
  # edge legs. A single replica let a broken backend's long-polling / canceled
  # socket.io storm congest the shared tunnel and add 5–20x head-of-line latency
  # for other apps' browser traffic (#389). Each replica opens its own HA edge
  # connections; a PDB (minAvailable:1) + soft node anti-affinity keep a leg up
  # through drains/rollouts.
  replicas: 2
  # Token mode: cloudflared connects via CLOUDFLARE_TUNNEL_TOKEN in fuzeinfra-secrets.
  # Ingress rules are managed by Terraform in cloudflare_zero_trust_tunnel_cloudflared_config.
  # (tunnelId would switch to local-config mode requiring CLOUDFLARE_TUNNEL_CREDENTIALS JSON
  # which we don't provision — omitting it keeps the simpler token-based connection.)
# Handoff MCP server — exposed at mcp-handoff.prod.fuzefront.com through the CF tunnel
# (Ingress in helm/fuzeinfra/templates/handoff-mcp.yaml) with a more-specific CF Access
# "bypass" app (terraform/contabo/cloudflare.tf, var handoff_mcp_access_enabled) so
# Anthropic's machine calls skip the *.prod email-OTP wildcard and the app bearer
# (HANDOFF_MCP_TOKEN) is the gate.
#
# GITOPS GATE (satisfied by #587): both preconditions landed in the same change —
#   1. deploy/sealed-secrets/handoff-mcp-secret.yaml (ANTHROPIC_API_KEY + HANDOFF_MCP_TOKEN),
#      sealed via scripts/seal-secret.sh, and
#   2. helm/fuzeinfra/files/handoff-state/*.json (the provisioned ids).
# Enabling before the secret exists CrashLoops the pod (CreateContainerConfigError).
#
# STATUS — the gate is open but the service is NOT functional end to end. Three
# things were wrong at once, each silent on its own. Do not read `enabled: true`
# as "working":
#
#   a. FIXED HERE — the image could not start at all. requirements.txt floored
#      `mcp>=1.2.0` with no ceiling; mcp 2.0.0 removed mcp.server.fastmcp, so the
#      image built on main at 2026-08-20T01:52 died on import and the pod ran 248
#      restarts over 21h in CrashLoopBackOff. Pinned to mcp>=1.9,<2, with an import
#      smoke test in agent-images.yml so a build can no longer be green about an
#      image that cannot start.
#
#   b. OPEN, needs a human — files/handoff-state/*.json are still `{}` placeholders.
#      They come from the Provision Managed Agents workflow, which fails with HTTP
#      400 "Your credit balance is too low to access the Anthropic API" (run
#      32322608863). Empty state does not crash the server: it starts, serves, and
#      fails every tool call ("unknown role", "no memory store synced"). Restore
#      credit on the MANAGED_AGENTS_API_KEY account, re-run Provision, commit the
#      artifact's ids here.
#
#   c. OPEN, one merge away — the CF Access bypass in front of this host was never
#      applied. #588 set TF_VAR_handoff_mcp_access_enabled=true in the workflow env,
#      but terraform-plan-apply's apply job only triggers on push to main touching
#      terraform/**, and #588 touched only .github/workflows/. No apply has run on
#      main since 2026-08-19T11:23 (before #588 merged), so the Access application
#      does not exist at the edge and mcp-handoff.prod.fuzefront.com still answers
#      302 to the *.prod email-OTP login — which a machine caller cannot complete.
#      This PR touches terraform/ so that apply finally runs.
a2aRelay:
  enabled: true

a2aGateway:
  # Enabled together with the a2a-gateway-secret (Claude.ai account .credentials.json)
  # landed in this same change — see deploy/sealed-secrets/a2a-gateway-secret.yaml.
  enabled: true

handoffMcp:
  enabled: true
  # `latest` + IfNotPresent = a node that already cached the tag never pulls the
  # rebuild, so the fix in (a) would never reach the pod. Drop this once the tag is
  # pinned to an immutable sha-<commit> tag.
  imagePullPolicy: Always
# -----------------------------------------------------------------------------
# Custom Hostname API (prod) — runtime provisioning of customer-owned domains
# for FuzeFront's multi-tenant portals (EPIC-16). Cloudflare for SaaS issues and
# deploys the edge certificate; the service materializes a per-domain Ingress so
# Traefik host-routes it. Cluster-internal only: no Ingress, no tunnel route, no
# CF Access app — it is unreachable from outside the cluster by construction.
#
# GITOPS GATE: keep enabled:false (and routeProfiles[].enabled:false) until ALL
# of these land in the SAME change —
#   1. deploy/sealed-secrets/custom-hostname-api-secret.yaml, sealed via
#      scripts/seal-secret.sh, carrying CLOUDFLARE_API_TOKEN (scoped to
#      SSL and Certificates:Edit + Zone:Read on the fuzefront.com zone ONLY),
#      CLOUDFLARE_ZONE_ID, and CONSUMER_TOKEN_FUZEFRONT;
#   2. `terraform apply` with saas_custom_hostnames_enabled=true, so
#      connect.fuzefront.com and the Cloudflare for SaaS fallback origin exist;
#   3. the fuzefront namespace with a fuzefront-frontend Service to back the
#      materialized Ingresses.
# Enabling before (1) CrashLoops the pod (CreateContainerConfigError); enabling
# before (2) issues certificates for domains that resolve nowhere.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# Consumer registration RBAC.
#
# FuzeMarket's seal-registration-secret workflow runs on an ARC runner and must
# read the FuzeFront registration token once in order to seal a copy for its own
# namespace. That is a cross-namespace read, so the grant is issued here rather
# than asserted by FuzeMarket's chart — see the header of
# templates/consumer-registration-rbac.yaml for what went wrong when it wasn't.
#
# Scope is one Secret, `get` only. Revoking FuzeMarket's access is deleting the
# entry below; nothing in the consumer repo can re-grant it.
# -----------------------------------------------------------------------------
consumerRegistrationRbac:
  enabled: true
  grants:
    - namespace: fuzefront
      secretName: fuzefront-registration
      subjectName: arc-runner-sa
      subjectNamespace: arc-runners

customHostnameApi:
  enabled: true
  provider: cloudflare
  managedZone: fuzefront.com
  # Hosts under prod.fuzefront.com sit behind the CF Access OTP wall and are
  # served by the *.prod wildcard — never provision them as custom hostnames.
  reservedZones:
    - prod.fuzefront.com
  cnameTarget: connect.fuzefront.com
  routingEnabled: true
  # Cloudflare includes 100 custom hostnames on Free/Pro/Business; each one
  # beyond that bills at $0.10/month. Raise deliberately, not by accident.
  maxCustomHostnames: 100
  networkPolicy:
    enabled: true
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits:   { cpu: "300m", memory: "256Mi" }
  routeProfiles:
    - name: fuzefront
      enabled: true
      namespace: fuzefront
      service: fuzefront-frontend
      port: 80
      # Mirrors the fan-out on FuzeFront's own app.fuzefront.com Ingress so a
      # custom domain behaves identically to the canonical host.
      paths: ["/", "/api", "/socket.io"]
      ingressClass: traefik
# dnsmasq not needed on a remote server (use real DNS / nip.io)
dnsmasq:
  enabled: false
# -----------------------------------------------------------------------------
# Cluster Autoscaler elastic pool (Contabo).
# Maintains an elastic node pool sized 0:1 (min:max) via the externalgrpc
# provider (Task 12) + upstream Cluster Autoscaler (this task). This is one
# elastic node ADDED ON TOP of the existing (floating) baseline — the
# control-plane plus however many worker nodes consumer repos have currently
# dispatched via infra-request-handler. There is no fixed baseline count here;
# the elastic pool only ever adds/removes the nodes it tagged itself
# (the production-scoped tag configured below) and never touches the baseline.
# Overprovisioning pause
# pods hold a headroom buffer so the CA has something to evict/scale against
# before real workloads go unschedulable — bumping overprovisioning replicas
# raises how much of the 0:1 elastic pool is proactively reserved.
# -----------------------------------------------------------------------------
# Prod is Argo auto-synced (selfHeal) from main. Keep the SealedSecret,
# product/image/k3s URL, pool identity, and canonical userDataTemplateB64 in one
# reviewed change; never patch either autoscaler Deployment in the live cluster.
clusterAutoscaler:
  enabled: true
  # Keep the upstream CA and the external provider on the exact same bounds.
  # Desired size is provider-discovered (the count of instances carrying the
  # clean pool tag below), so this overlay deliberately starts at 0 and lets
  # the pending elastic-only overprovisioning pod request the first worker.
  nodeGroup:
    minSize: 0
    # Raised 1 -> 4 on 2026-08-31. At maxSize 1 the autoscaler had exactly one elastic
    # node to give and was already at it, so it logged `Skipping node group elastic -
    # max size reached` against 49 unschedulable pods (40 ARC runners plus fuzebi,
    # fuzehub-backend and fuzekeys-frontend) and could do nothing. Paired with the
    # runner affinity change in runners/arc/runner-scale-set-values.yaml — that change
    # lets runner pods land on elastic nodes at all, and this one lets there be more
    # than one. Either alone leaves CI stuck.
    #
    # Scale-DOWN remains billing-aware and is NOT governed by this number: Contabo only
    # terminates a cancelled instance at the end of its paid month, so utilization
    # scale-down stays disabled and the reaper CronJob releases idle elastic capacity
    # 24h before renewal. So this is a ceiling on concurrent spend, not a commitment to
    # it — the pool still returns to 0 when idle.
    maxSize: 4
  # Billing-aware model: Contabo only terminates a canceled instance at the
  # end of its paid month, so utilization scale-down is disabled — the
  # reaper CronJob below owns releasing idle elastic capacity instead.
  scaleDownEnabled: false
  provider:
    # TODO: replace with the published image once fuzeinfra-contabo-ca-provider
    # has a tagged release (see cluster-autoscaler/contabo-externalgrpc).
    image: ghcr.io/izzywdev/fuzeinfra-contabo-ca-provider:latest
    # Bump with the provider image build SHA so Argo rolls the :latest pod.
    imageRollout: "740d7d11a7a2083d990bd6a8c722eff3725e0441"
    existingSecret: fuzeinfra-ca-provider
    # Current Contabo create-instance catalog: Cloud VPS 4 (4 vCPU / 8 GiB).
    # V92 is a retired SKU and fails ordering with "No offer was found".
    productId: "V153"
    imageId: "d64d5c6c-9dda-4e38-8174-0ee282474d8a"
    region: EU
    # v1 is contaminated: ca-salvage-enroll historically assigned the
    # `fuzeinfra-elastic` tag to durable/control-plane/CI instances whose
    # Contabo display names do not match their Kubernetes node identities.
    # That made NodeGroupTargetSize report 4 while only 2 nodes correlated,
    # so CA tried to repair target size and skipped every scale-up iteration.
    # A fresh, production-scoped identity gives this pool desired=0 at cutover;
    # every node subsequently created by the provider has the same display
    # name, k3s --node-name, and contabo:// providerID by construction.
    elasticTag: fuzeinfra-prod-elastic-v2
    elasticNamePrefix: fuzeinfra-prod-elastic-v2
    minSize: 0
    # Must match clusterAutoscaler.nodeGroup.maxSize exactly — the block above states
    # the rule ("Keep the upstream CA and the external provider on the exact same
    # bounds"). If these two disagree the CA and the provider hold different ideas of
    # the pool ceiling, which is the class of desired-vs-target mismatch that already
    # cost this pool a cutover once (see the elasticTag v1 contamination note above:
    # NodeGroupTargetSize reported 4 while only 2 nodes correlated, and CA skipped every
    # scale-up iteration trying to repair target size).
    maxSize: 4
    # TODO: set to the k3s server URL the elastic nodes join
    # (e.g. https://<contabo-server-ip>:6443).
    k3sServerUrl: "https://161.97.118.134:6443"
    # TODO: base64 of cluster-autoscaler/contabo-externalgrpc/deploy/elastic-userdata.template
    # (the canonical elastic-node cloud-init template) — e.g.
    # `base64 -w0 cluster-autoscaler/contabo-externalgrpc/deploy/elastic-userdata.template`.
    # See that file's header for the template vars (.NodeName/.K3SServerURL/.K3SNodeToken)
    # and why --kubelet-arg=provider-id=contabo://{{.NodeName}} is load-bearing for scale-down.
    userDataTemplateB64: ""
    # VLAN CUTOVER, autoscaler half. The baseline nodes were migrated to Contabo
    # private network 60932 (control plane vmi3383846 = 10.0.0.6, vmi3396106 =
    # 10.0.0.2, mendys-worker-1 = 10.0.0.3), but the autoscaler was never flipped
    # to match -- so every node it created landed OFF the VLAN with an unreachable
    # kubelet (no exec/logs/port-forward). That is why all five elastic nodes were
    # broken and the three baseline nodes were fine: a split exactly along VLAN
    # membership, not a per-node fault. It also explains why LiteLLM could not be
    # reached until its pod was moved, and why Loki's stale mount was so hard to
    # inspect.
    #
    # The gate comment in values.yaml said to turn this on ONLY during the
    # coordinated cutover, because a node on private-only flannel cannot join a
    # still-public control plane. That precondition is now MET -- the control plane
    # is already on 10.0.0.x. This is the last step of a finished migration.
    #
    # Ordering the add-on + attaching is NOT sufficient by itself: the paired
    # cloud-init change above derives the private IP at boot and passes --node-ip
    # and --flannel-iface. Without those k3s advertises the PUBLIC address and the
    # kubelet stays unreachable even once the node is on the VLAN.
    privateNetworking: true
    privateNetworkId: 60932
    # Best-effort email warning fired immediately before each new elastic
    # instance is provisioned (see internal/notify + internal/provider/scale.go's
    # NodeGroupIncreaseSize) — purely an early-warning signal for an operator;
    # the MaxSize name-prefix hard cap above is what actually prevents runaway
    # scaling, regardless of whether this is enabled/configured/reachable.
    # Off by default here too. To enable: set notifyEmailEnabled: true and fill
    # in notifySmtpHost/notifyEmailFrom/notifyEmailTo below; if the chosen SMTP
    # relay needs auth, add NOTIFY_SMTP_USER/NOTIFY_SMTP_PASS as NEW keys to the
    # existingSecret SealedSecret (helm/fuzeinfra/templates/autoscaler/sealed-secret-ca-provider.yaml)
    # — never as a plain value here — they arrive as env vars automatically via
    # that Secret's envFrom.
    notifyEmailEnabled: false
    notifySmtpHost: ""
    notifySmtpPort: "587"
    notifyEmailFrom: ""
    notifyEmailTo: ""
    # Telegram delivery for the same before-provision warning (internal/notify.Telegram)
    # — takes precedence over notifyEmailEnabled above when both are true.
    # Enabled here; the orchestrator fills in the real chat id below and
    # seals the bot token as a NEW key (NOTIFY_TELEGRAM_BOT_TOKEN) on the
    # existingSecret SealedSecret (helm/fuzeinfra/templates/autoscaler/sealed-secret-ca-provider.yaml)
    # — never as a plain value here.
    notifyTelegramEnabled: true
    # TODO(operator): replace with the real destination chat id (or source
    # this value from the sealed secret / a separate values overlay instead
    # of committing the literal id here).
    notifyTelegramChatId: "5196390841"
  # Billing-aware reaper -- releases an idle elastic instance only within 24h
  # of its projected monthly renewal (see cmd/reaper). billingPeriod matches
  # the chart default (720h/~30d); set explicitly here so prod release window
  # is self-documenting rather than relying on an inherited default.
  reaper:
    enabled: true
    schedule: "0 * * * *"
    releaseWindow: 24h
    billingPeriod: 720h
overprovisioning:
  # Enabled together with clusterAutoscaler during the gated Task 18 cutover.
  enabled: true
  replicas: 1
# Per-service Postgres provisioning (issue #153) — PROD.
#
# The provisioning hook Job reads each role password via `secretKeyRef` from a
# Secret the consumer repo seals FOR the `fuzeinfra` namespace. Helm replaces
# (does NOT deep-merge) lists, so the full list is restated here.
#
# GITOPS GATE: each service stays `enabled: false` until its per-service
# credentials Secret is present in the `fuzeinfra` namespace. This is a HARD
# gate: the provisioning hook is a SINGLE Job pod that mounts every enabled
# service's password via `secretKeyRef` (Optional: false), so ONE missing
# secret fails the whole pod with CreateContainerConfigError, blocks ALL
# entries (including ones whose secret DOES exist), and degrades the Argo
# PostSync hook. (Observed: the Job sat in CreateContainerConfigError for
# ~3.7 days because fuzesales/fuzecontact/fuzeservice were flipped on before
# their secrets landed.) Flip each to `true` in the SAME change that lands its
# secret — never before.
#   - mendys      -> Secret `mendys-db-credentials` key `password`
#                    (DONE, issue #183: applied as a hand-off Secret in the
#                     `fuzeinfra` namespace via the FuzeKeys #136 precedent, so
#                     `mendys` below is enabled)
#   - fuzesales   -> Secret `fuzesales-db-credentials`   key `password`  (present)
#   - fuzecontact -> Secret `fuzecontact-db-credentials` key `password`  (present)
#   - fuzeservice -> Secret `fuzeservice-db-credentials` key `password`  (present)
serviceDatabases:
  - name: fuzesales
    enabled: true
    role: fuzesales_svc
    database: fuzesales
    passwordSecret:
      name: fuzesales-db-credentials
      key: password
  - name: fuzecontact
    enabled: true
    role: fuzecontact_svc
    database: fuzecontact
    passwordSecret:
      name: fuzecontact-db-credentials
      key: password
  - name: fuzeservice
    enabled: true
    role: fuzeservice_svc
    database: fuzeservice
    passwordSecret:
      name: fuzeservice-db-credentials
      key: password
  # Enabled: `mendys-db-credentials` (key `password`) is present in the
  # `fuzeinfra` namespace as a hand-off Secret (issue #183, FuzeKeys #136
  # precedent — annotated `fuzeinfra.dev/consumer: izzywdev/MendysRobotics`).
  # The role/db were also provisioned imperatively with the same password, so
  # this hook Job idempotently adopts and re-syncs them on the next Argo sync.
  - name: mendys
    enabled: true
    role: mendys_svc
    database: mendys
    passwordSecret:
      name: mendys-db-credentials
      key: password
  # The provisioning workflow flips this gate only in the same PR that adds
  # the strict-scoped fuzeinfra password SealedSecret.
  - name: fuzequality
    enabled: true
    role: fuzequality_user
    database: fuzequality
    passwordSecret:
      name: fuzequality-db-credentials
      key: password
  # Backing store for the MendysRobotics Authentik instance (FuzeFront chart,
  # instance "mendys"). See the base values.yaml entry for why MendysRobotics
  # gets its own Authentik instance + database rather than a brand on the
  # shared FuzeFront directory.
  #
  # STILL GATED OFF: per governance/datastore-provisioning.md the gate flips
  # only in the same PR that lands the strict-scoped SealedSecret
  # `authentik-mendys-db-credentials` (key `password`) sealed FOR the
  # `fuzeinfra` namespace. FuzeFront owns that password (its Authentik pods
  # connect with it), so FuzeFront seals it into BOTH namespaces:
  #   - fuzefront  → the authentik-mendys server/worker DATABASE_URL
  #   - fuzeinfra  → read by this provisioning Job via secretKeyRef
  # Flipping this to `true` before that Secret exists fails the PostSync Job.
  - name: authentik-mendys
    enabled: false
    role: authentik_mendys_user
    database: authentik_mendys
    passwordSecret:
      name: authentik-mendys-db-credentials
      key: password
  # FuzeHub backend (Prisma). fuzehub-db-credentials sealed for the fuzeinfra
  # namespace (key `password`) in the same PR as this gate flip, so the
  # PostSync provisioning Job finds it on first sync — no separate follow-up.
  - name: fuzehub
    enabled: true
    role: fuzehub_svc
    database: fuzehub
    passwordSecret:
      name: fuzehub-db-credentials
      key: password
  # GATED: flip to enabled:true in the same PR that commits
  # deploy/sealed-secrets/fuzesocial-db-credentials.yaml (sealed for fuzeinfra
  # namespace, key: password). The provision-fuzesocial workflow does both
  # atomically. See issue #149.
  - name: fuzesocial
    enabled: true
    role: fuzesocial_app
    database: fuzesocial
    passwordSecret:
      name: fuzesocial-db-credentials
      key: password
# Per-service MongoDB provisioning (Helm REPLACES lists, so the full set must be
# declared here — the base values default every entry to enabled: false).
#
# MendysRobotics prod (FuzeInfra #238): the backend reads/writes database
# `robot_catalog` (MONGODB_DATABASE=robot_catalog). Verified against the live
# cluster, the backend's actual MONGODB_URL authenticates as user `mendys_app`
# whose user record lives in — and whose authSource is — the `mendys` database
# (NOT `admin`; that is the only mendys user in the whole deployment). It was
# created out-of-band (#124) with readWrite on `mendys` only, so every
# find/aggregate/createIndexes on `robot_catalog` failed with code 13
# (Unauthorized).
#
# This entry grants that existing `mendys.mendys_app` user readWrite on the
# databases it uses, via the idempotent PostSync provisioning Job
# (grantRolesToUser). managePassword: false — FuzeInfra does not own this user's
# password, so the Job must NOT rotate it (which would break the working auth)
# and mounts no per-service Secret; it only reconciles the role grants. (The
# same grant was applied imperatively to unblock prod immediately; this Job
# re-applies it idempotently and makes it durable across syncs/rebuilds.)
serviceMongoDatabases:
  - name: mendys
    enabled: true
    user: mendys_app
    authDatabase: mendys
    managePassword: false
    database: robot_catalog
    roles:
      - {role: readWrite, db: robot_catalog}
      - {role: readWrite, db: mendys}
  # FuzePicker backend (issue #242). FuzeInfra creates the least-privilege user
  # `fuzepicker_svc` on the shared mongo server with readWrite on its own
  # `fuzepicker` database. managePassword defaults true, so the provisioning Job
  # creates the user (if missing) and syncs its password from the sealed
  # `fuzepicker-db-credentials` secret
  # (deploy/sealed-secrets/fuzepicker-db-credentials.yaml, key `password`).
  - name: fuzepicker
    enabled: true
    database: fuzepicker
    user: fuzepicker_svc
    passwordSecret:
      name: fuzepicker-db-credentials
      key: password
# Per-service MariaDB provisioning — PROD. Helm REPLACES lists, so the full set
# is restated here (the base values.yaml default is an empty list).
#
# GITOPS GATE, identical to serviceDatabases above and just as hard: the hook is
# a SINGLE Job pod that mounts every enabled entry's password by `secretKeyRef`
# (optional: false). ONE missing Secret fails the pod with
# CreateContainerConfigError, blocks every other entry, and degrades the Argo
# PostSync wave. Flip an entry to `true` ONLY in the same PR that lands its
# sealed Secret in the `fuzeinfra` namespace.
#
#   - mendys-wp -> Secret `mendys-wp-db-credentials` key `password`  (ABSENT)
#
# mendys-wp is the reason this engine exists, but it still runs its own
# `mendys-wp-mariadb` StatefulSet in the `mendys-wp` namespace with credentials
# in its own `mendys-wp-db` Secret (keys MYSQL_DATABASE / MYSQL_USER /
# MYSQL_PASSWORD / MYSQL_ROOT_PASSWORD). Migrating it is a two-step handshake
# owned by the consumer repo, not by this PR:
#   1. mendys-wp seals its existing MYSQL_PASSWORD value as
#      `mendys-wp-db-credentials` (key `password`) FOR the `fuzeinfra`
#      namespace and commits the ciphertext to deploy/sealed-secrets/.
#   2. THEN this entry flips to `enabled: true`; the PostSync Job creates the
#      user+database on the shared engine with that same password, mendys-wp
#      repoints WORDPRESS_DB_HOST at
#      fuzeinfra-mariadb.fuzeinfra.svc.cluster.local:3306, dumps/restores its
#      data, and retires its own StatefulSet.
# See docs/consuming-repos/MARIADB_PROVISIONING.md.
serviceMariadbDatabases:
  - name: mendys-wp
    enabled: false
    user: mendys_wp_svc
    database: mendys_wp
    passwordSecret:
      name: mendys-wp-db-credentials
      key: password
# Chroma allocations are enabled only with a matching strict-scoped
# SealedSecret in deploy/sealed-secrets. Chroma binds each bearer token to the
# declared tenant/database; the NetworkPolicy also admits only the named pods.
serviceChromaCollections:
  - name: fuzeplan-repo-digester
    enabled: true
    tenant: fuzeplan
    database: repo-digester
    credentialSecret:
      name: fuzeplan-repo-digester-chroma-credentials
      key: token
    networkPolicy:
      namespace: fuzeplan
      podLabels:
        app.kubernetes.io/name: repo-digester
    collections:
      - repo_digester_ready
  - name: fuzequality
    enabled: true
    tenant: fuzequality
    database: fuzequality
    credentialSecret:
      name: fuzequality-chroma-credentials
      key: token
    networkPolicy:
      namespace: fuzequality
      podLabels:
        app.kubernetes.io/name: fuzequality
    collections:
      - fuzequality_ready
  # Shared A2A server RAG store (FuzeInfra#643, delegated from FuzeAgent).
  # collections: [] is deliberate — the A2A server creates one collection per
  # A2A tenant (a2a-<tenant>) inside the a2a database at runtime, so there is no
  # meaningful bootstrap set; isolation is by collection, not by a where filter.
  - name: fuzeagent-a2a
    enabled: true
    tenant: fuzeagent
    database: a2a
    credentialSecret:
      name: fuzeagent-a2a-chroma-credentials
      key: token
    networkPolicy:
      namespace: fuzeagent
      podLabels:
        app.kubernetes.io/name: a2a-shared
    collections: []

# Enable IPv4-preference node configurator on Contabo — fixes GHCR pulls being
# TCP-reset over IPv6 CDN paths (FuzeInfra#616). Uses busybox from Docker Hub
# so the DaemonSet itself never touches GHCR.
nodeConfigurator:
  preferIPv4:
    enabled: true
  # ENABLED. multipathd claims Longhorn's /dev/sd* devices, and Longhorn has been
  # reporting it on EVERY Longhorn node while nothing acted on it:
  #
  #   Multipathd=False  MultipathdIsRunning
  #   "multipathd is running with a known issue that affects Longhorn"
  #   fuzeinfra-ci-runner-1  False     mendys-worker-1  False
  #   vmi3383846             False     vmi3396106       False
  #
  # It produces BOTH stuck-volume signatures seen in this cluster:
  #   * "already mounted or mount point busy"        — Loki, x4458 over 6d7h
  #   * mke2fs "apparently in use by the system"     — Prometheus, on a BRAND NEW volume
  #
  # This is why fuzeinfra-prometheus-0 sat ContainerCreating for 9 DAYS, which left
  # Prometheus with no endpoints — so every rule under helm/fuzeinfra/rules/ was
  # inert, including the PVCFillingUp alert added to catch the very disk-full
  # condition that took Loki down. The monitoring layer was dark the whole time.
  #
  # CORRECTS THE CONCLUSION OF #773. Converting a StatefulSet to a Deployment +
  # fresh PVC did NOT fix this class; it only sidesteps it when the new device wins
  # the race against multipathd. Loki won. Prometheus, converted identically in
  # #816, LOST — its replacement volume attached healthy and then failed to FORMAT.
  # Since #814 made longhorn the default StorageClass, that race now applies to
  # every new volume in the cluster, not just these two.
  #
  # RISK: this restarts multipathd on all four Longhorn nodes. It was gated off
  # because it touches a host daemon and could not be tested in advance. Verify
  # after Argo syncs:
  #   multipath -t | grep -A2 blacklist
  #   the Longhorn node condition Multipathd flipping False -> True
  #   fuzeinfra-prometheus reaching Running/Ready
  # REVERTED 2026-09-01 ~22:35Z. Enabling this correlates in time with the prod
  # control plane becoming unreachable: TCP 6443 open but the TLS handshake timing
  # out, from BOTH an external host and an in-cluster runner, starting after the
  # 22:17:30Z deploy (the 21:52:27Z deploy was fine).
  #
  # Plausible mechanism, NOT verified on-node -- the cluster is unreachable, which
  # is the symptom itself. The rendered blacklist is `devnode "^sd[a-z0-9]+"`, i.e.
  # EVERY /dev/sd* device, and an on-node check earlier today found `dm-0 = mpatha`
  # on these hosts. If a filesystem on vmi3383846 -- the control-plane node running
  # etcd -- was mounted through that multipath map, dropping the map stalls its
  # disk, which stalls etcd, which presents exactly as a TLS handshake timeout.
  #
  # Turning this off does NOT by itself repair a node: the DaemonSet has already
  # written /etc/multipath.conf. Recovery is restoring the backup the script took
  # at /etc/multipath.conf.pre-fuzeinfra and restarting multipathd (console/SSH).
  #
  # The underlying Prometheus/Longhorn mount bug is REAL and still unfixed. A retry
  # should match Longhorn's devices specifically (vendor/product or wwid) rather
  # than all of sd*, and roll out to ONE non-control-plane node first.
  multipathBlacklist:
    enabled: false

# Stateful services not otherwise overridden here still need the durable pin.
alertmanager:
  # Pin to durable Longhorn-disk nodes. longhorn-manager only runs on the 3
  # durable nodes, so Longhorn registers node.longhorn.io objects only there;
  # a stateful pod scheduled onto an ephemeral elastic node can NEVER attach
  # its volume (FailedAttachVolume: node.longhorn.io "..." not found).
  nodeSelector:
    node.longhorn.io/create-default-disk: "true"
chromadb:
  # Pin to durable Longhorn-disk nodes. longhorn-manager only runs on the 3
  # durable nodes, so Longhorn registers node.longhorn.io objects only there;
  # a stateful pod scheduled onto an ephemeral elastic node can NEVER attach
  # its volume (FailedAttachVolume: node.longhorn.io "..." not found).
  nodeSelector:
    node.longhorn.io/create-default-disk: "true"

# Pin kube-state-metrics to a DURABLE (VLAN) node. It had been landing on
# autoscaler-managed elastic nodes, which are billing-reaped out from under it and
# whose kubelet the API server cannot reach — `kubectl logs` there fails with
# `proxy error ... dialing <ip>:10250, code 502`, so the component was both
# evictable-at-random and impossible to debug. Same selector the databases use.
kubeStateMetrics:
  nodeSelector:
    node.longhorn.io/create-default-disk: "true"
