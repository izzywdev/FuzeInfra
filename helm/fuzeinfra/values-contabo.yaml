# =============================================================================
# Contabo VPS (k3s single-node) overlay
#
#   helm upgrade --install fuzeinfra helm/fuzeinfra \
#     -n fuzeinfra --create-namespace -f helm/fuzeinfra/values-contabo.yaml
#
# k3s ships with:
#   - local-path provisioner as default StorageClass
#   - Traefik as the default ingress controller (className: traefik)
#
# Domain: defaults to <server-ip>.nip.io (free wildcard DNS).
# Replace with a real domain once you have DNS pointing at the server.
# =============================================================================
global:
  # Pin the namespace segment of every published service address. Prod consumers
  # (fuzefront, mendys-prod, fuzequality, ...) live in other namespaces and can
  # only reach the shared services by FQDN, so this value is part of the
  # cross-namespace contract in CONTRACT.md — not an install detail. Pinning it
  # makes the rendered addresses identical no matter how the chart is invoked,
  # including an out-of-band `helm upgrade` that forgets `--namespace`.
  serviceNamespace: "fuzeinfra"
  # DB StatefulSet PVCs default to durable Longhorn. This is the systemic cure
  # for the 2026-07-24 local-path reversion class: whenever a StatefulSet is
  # (re)created, its volume lands on Longhorn (reclaimPolicy: Retain) instead of
  # a fresh, empty local-path PVC. Existing STSs are unaffected — Argo's
  # ignoreDifferences on .spec.volumeClaimTemplates ignores the immutable VCT.
  # local-path remains the cluster's default class for anything not using this.
  storageClass: "longhorn"
  # Cloudflare tunnel routes *.prod.fuzefront.com → Traefik → these Ingress rules.
  # Change back to <ip>.nip.io if the tunnel is disabled for debugging.
  domain: "prod.fuzefront.com"
  imagePullPolicy: IfNotPresent
# Longhorn opt-in StorageClass. GATED OFF. The controller installs via the
# independent Argo app argocd/applications/longhorn.yaml (manual sync); this only
# renders the non-default `longhorn` StorageClass. P4 enable step (design doc §9):
# flip storageClass.enabled to true AFTER the controller is installed + healthy.
longhorn:
  enabled: false
  storageClass:
    enabled: false
    numberOfReplicas: 3
    reclaimPolicy: Retain
ingress:
  enabled: true
  className: traefik
  tls:
    enabled: false # enable once cert-manager is wired up
# Sizing for 4 vCPU / 8 GB RAM single node.
# Leave headroom for k3s, ArgoCD, and system processes (~2 GB).
postgres:
  storage: 20Gi
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
  # Pin to durable Longhorn-disk nodes (the 3 durable nodes carry this label;
  # ephemeral elastics do not) so Postgres availability never depends on an
  # autoscaled node. See the 2026-07-24 storage/OOM incident.
  nodeSelector:
    node.longhorn.io/create-default-disk: "true"
mongodb:
  storage: 10Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
neo4j:
  # Pin to durable Longhorn-disk nodes (same as postgres) so Neo4j never runs
  # on an ephemeral autoscaled node once products start seeding it.
  nodeSelector:
    node.longhorn.io/create-default-disk: "true"
serviceNeo4jInstances:
  # FuzePlan gets a dedicated Neo4j — Community edition cannot RBAC or multi-DB,
  # so full isolation requires a separate container with its own PVC + creds.
  # Bolt address for FuzePlan: bolt://fuzeinfra-neo4j-fuzeplan.fuzeinfra.svc.cluster.local:7687
  # enabled: false until neo4j-fuzeplan-credentials SealedSecret is present in fuzeinfra ns.
  - name: fuzeplan
    enabled: true
    passwordSecret:
      name: neo4j-fuzeplan-credentials
      key: password
    storage: 5Gi
    nodeSelector:
      node.longhorn.io/create-default-disk: "true"
    resources:
      requests: {cpu: 200m, memory: 1Gi}
      limits: {cpu: "1", memory: 2Gi}
redis:
  storage: 2Gi
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
# TEMPORARY headroom reduction for the saturated single control-plane node (#93).
# elasticsearch / rabbitmq / airflow are scaled to 0 pods. Their StatefulSets and
# PVCs are RETAINED (no prune, no data loss) — set replicas back to 1 to restore.
# mongo / neo4j / postgres / redis / kafka / chromadb / monitoring stay running.
elasticsearch:
  replicas: 0
  storage: 20Gi
  javaOpts: "-Xms512m -Xmx512m"
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {cpu: "1", memory: 1536Mi}
rabbitmq:
  replicas: 0 # TEMP headroom (#93) — restore to 1 when the node has capacity
  # Strong credential from deploy/sealed-secrets/fuzeinfra-app-credentials.yaml,
  # replacing the chart default "admin123" that prod was otherwise rendering.
  # Takes effect only when the broker initialises against an empty mnesia — which
  # is exactly what will happen whenever replicas goes back above 0 on a fresh
  # volume. If an existing volume is reused, rotate with `rabbitmqctl
  # change_password`, and re-seal any consumer repo holding the old value.
  passwordSecret:
    name: fuzeinfra-app-credentials
    key: RABBITMQ_PASSWORD
kafka:
  storage: 10Gi
prometheus:
  storage: 20Gi
  # Let downstream apps ship Prometheus alert/recording rules from their own
  # namespaces via ConfigMaps labeled `prometheus_rule: "1"`.
  ruleSidecar:
    enabled: true
grafana:
  # Auto-load dashboards from any namespace via ConfigMaps labeled
  # `grafana_dashboard: "1"`.
  dashboardSidecar:
    enabled: true
  # Real break-glass admin password, from deploy/sealed-secrets/grafana-admin.yaml.
  # Without this, prod inherited the chart default — the literal string "admin" —
  # because no overlay ever set credentials.grafana.adminPassword. Cloudflare
  # Access was the only thing in front of admin/admin.
  adminPasswordSecret:
    name: grafana-admin
    key: GRAFANA_ADMIN_PASSWORD
  # Authentik SSO. Safe to enable: deploy/sealed-secrets/grafana-oidc.yaml is in
  # this same change, and the `grafana` provider is live in Authentik
  # (https://authentik.prod.fuzefront.com/application/o/grafana/ returns a discovery doc
  # advertising the `groups` scope that roleAttributePath depends on).
  #
  # The local admin stays enabled — /login still works. See the break-glass note
  # in templates/monitoring.yaml; do not remove it.
  oidc:
    enabled: true

# Kafka UI has NO authentication without this — before Authentik SSO, anyone who
# cleared the Cloudflare Access wall was an unauthenticated admin, and with
# DYNAMIC_CONFIG_ENABLED=true that was write-capable.
kafkaUi:
  oidc:
    enabled: true
# Alertmanager: wire real notification receivers here. Example webhook receiver:
# alertmanager:
#   config:
#     receiver: ops
#   receivers:
#     - name: default
#     - name: ops
#       webhook_configs:
#         - url: https://example.com/hooks/alerts
#           send_resolved: true
#   routes:
#     - match:
#         severity: critical
#       receiver: ops
#       repeat_interval: 1h

# Loki S3 backend (Contabo Object Storage) — keeps logs off the node disk.
#
# The endpoint/bucket are wired here for prod; the switch is `enabled`, kept
# FALSE until the credential SealedSecret is present (flipping it on without the
# secret would crash-loop Loki). This is a human-gated phase — see
# docs/backups-and-blobs.md.
#
# To turn on (GitOps — never `kubectl create secret` in prod):
#   1. Fetch the S3 key pair from the Contabo panel for the `fuzeinfra-loki`
#      bucket (provisioned by terraform object-storage).
#   2. Seal it OFFLINE into a SealedSecret named `loki-s3` in the fuzeinfra
#      namespace with keys LOKI_S3_ACCESS_KEY_ID / LOKI_S3_SECRET_ACCESS_KEY,
#      commit it, let Argo sync.
#   3. Flip loki.s3.enabled -> true here, commit, let Argo sync.
loki:
  s3:
    enabled: false            # human-gated flip (needs the loki-s3 SealedSecret)
    endpoint: "eu2.contabostorage.com"
    region: "default"
    bucket: "fuzeinfra-loki"
    s3ForcePathStyle: true
    insecure: false
    existingSecret: "loki-s3"

# Scheduled DB backups → S3 (Contabo Object Storage). Bucket/endpoint wired for
# prod; kept OFF until the `fuzeinfra-backups-s3` SealedSecret is committed.
# See docs/backups-and-blobs.md for the enable + retention-policy steps.
backups:
  # ENABLED via the PVC sink (Longhorn) — the interim tier instituted after the
  # 2026-07-24 data-loss incident. Works today with no object storage. When the
  # fuzeinfra-backups bucket + fuzeinfra-backups-s3 SealedSecret are provisioned,
  # flip `sink: s3` for durable off-cluster backups (the S3 block below is ready).
  enabled: true
  # s3 sink: dumps go OFF-cluster to Contabo Object Storage. The pvc sink was the
  # interim tier and it failed exactly as feared — the durable nodes' Longhorn
  # disks were re-initialised, every replica of fuzeinfra-db-backups referenced a
  # dead disk UUID, the volume could not attach anywhere and all stored dumps
  # were lost. Backups held on the storage they protect against are not backups.
  sink: s3
  pvc:
    storageClass: longhorn
    size: 20Gi
    keep: 7
  # Stagger per-DB schedules: they share one RWO PVC, so they must not overlap.
  postgres:
    schedule: "0 2 * * *"    # 02:00 UTC
  mongodb:
    schedule: "20 2 * * *"   # 02:20 UTC
  neo4j:
    schedule: "40 2 * * *"   # 02:40 UTC
  s3:
    endpoint: "https://eu2.contabostorage.com"
    region: "default"
    bucket: "fuzeinfra-backups"
    prefix: "db"
    existingSecret: "fuzeinfra-backups-s3"
    lifecycleExpireDays: 30   # provider expires db/ objects after 30 days
airflow:
  replicas: 0 # TEMP headroom (#93): webserver/scheduler/flower -> 0 pods
  # Strong credential, replacing the chart default "admin". Applies on a fresh
  # metadata DB only: airflow-init runs `airflow users create ... || true`, which
  # silently no-ops for an existing user. Rotate an existing one with
  # `airflow users reset-password`.
  adminPasswordSecret:
    name: fuzeinfra-app-credentials
    key: AIRFLOW_ADMIN_PASSWORD
  workerReplicas: 0 # TEMP headroom (#93): celery worker -> 0 pods
  # 4 vCPU / 8 GB node — cap concurrency and memory to stop the worker from
  # crowding out CoreDNS/Postgres under memory pressure.
  celeryWorkerConcurrency: 4
  workerResources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: "2", memory: 1536Mi}
# Cloudflare tunnel: all traffic enters via the named tunnel; no host-level
# ports 80/443 need to be open.  The tunnel token lives in fuzeinfra-secrets
# (key: CLOUDFLARE_TUNNEL_TOKEN) which is patched by terraform/cloudflare or
# scripts/setup-cloudflare-tunnel.sh — it is NEVER committed to git.
# Routing rules (hostname → service) are managed via terraform/cloudflare.
cloudflareTunnel:
  enabled: true
  # ≥2 replicas so ALL product-family ingress isn't multiplexed through one pod's
  # edge legs. A single replica let a broken backend's long-polling / canceled
  # socket.io storm congest the shared tunnel and add 5–20x head-of-line latency
  # for other apps' browser traffic (#389). Each replica opens its own HA edge
  # connections; a PDB (minAvailable:1) + soft node anti-affinity keep a leg up
  # through drains/rollouts.
  replicas: 2
  # Token mode: cloudflared connects via CLOUDFLARE_TUNNEL_TOKEN in fuzeinfra-secrets.
  # Ingress rules are managed by Terraform in cloudflare_zero_trust_tunnel_cloudflared_config.
  # (tunnelId would switch to local-config mode requiring CLOUDFLARE_TUNNEL_CREDENTIALS JSON
  # which we don't provision — omitting it keeps the simpler token-based connection.)
# Handoff MCP server — exposed at mcp-handoff.prod.fuzefront.com through the CF tunnel
# (Ingress in helm/fuzeinfra/templates/handoff-mcp.yaml) with a more-specific CF Access
# "bypass" app (terraform/contabo/cloudflare.tf, var handoff_mcp_access_enabled) so
# Anthropic's machine calls skip the *.prod email-OTP wildcard and the app bearer
# (HANDOFF_MCP_TOKEN) is the gate.
#
# GITOPS GATE: keep enabled:false until BOTH land in the SAME change —
#   1. deploy/sealed-secrets/handoff-mcp-secret.yaml (ANTHROPIC_API_KEY + HANDOFF_MCP_TOKEN),
#      sealed via scripts/seal-secret.sh, and
#   2. helm/fuzeinfra/files/handoff-state/*.json (the provisioned ids).
# Enabling before the secret exists CrashLoops the pod (CreateContainerConfigError).
handoffMcp:
  enabled: false
# -----------------------------------------------------------------------------
# Custom Hostname API (prod) — runtime provisioning of customer-owned domains
# for FuzeFront's multi-tenant portals (EPIC-16). Cloudflare for SaaS issues and
# deploys the edge certificate; the service materializes a per-domain Ingress so
# Traefik host-routes it. Cluster-internal only: no Ingress, no tunnel route, no
# CF Access app — it is unreachable from outside the cluster by construction.
#
# GITOPS GATE: keep enabled:false (and routeProfiles[].enabled:false) until ALL
# of these land in the SAME change —
#   1. deploy/sealed-secrets/custom-hostname-api-secret.yaml, sealed via
#      scripts/seal-secret.sh, carrying CLOUDFLARE_API_TOKEN (scoped to
#      SSL and Certificates:Edit + Zone:Read on the fuzefront.com zone ONLY),
#      CLOUDFLARE_ZONE_ID, and CONSUMER_TOKEN_FUZEFRONT;
#   2. `terraform apply` with saas_custom_hostnames_enabled=true, so
#      connect.fuzefront.com and the Cloudflare for SaaS fallback origin exist;
#   3. the fuzefront namespace with a fuzefront-frontend Service to back the
#      materialized Ingresses.
# Enabling before (1) CrashLoops the pod (CreateContainerConfigError); enabling
# before (2) issues certificates for domains that resolve nowhere.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# Consumer registration RBAC.
#
# FuzeMarket's seal-registration-secret workflow runs on an ARC runner and must
# read the FuzeFront registration token once in order to seal a copy for its own
# namespace. That is a cross-namespace read, so the grant is issued here rather
# than asserted by FuzeMarket's chart — see the header of
# templates/consumer-registration-rbac.yaml for what went wrong when it wasn't.
#
# Scope is one Secret, `get` only. Revoking FuzeMarket's access is deleting the
# entry below; nothing in the consumer repo can re-grant it.
# -----------------------------------------------------------------------------
consumerRegistrationRbac:
  enabled: true
  grants:
    - namespace: fuzefront
      secretName: fuzefront-registration
      subjectName: arc-runner-sa
      subjectNamespace: arc-runners

customHostnameApi:
  enabled: true
  provider: cloudflare
  managedZone: fuzefront.com
  # Hosts under prod.fuzefront.com sit behind the CF Access OTP wall and are
  # served by the *.prod wildcard — never provision them as custom hostnames.
  reservedZones:
    - prod.fuzefront.com
  cnameTarget: connect.fuzefront.com
  routingEnabled: true
  # Cloudflare includes 100 custom hostnames on Free/Pro/Business; each one
  # beyond that bills at $0.10/month. Raise deliberately, not by accident.
  maxCustomHostnames: 100
  networkPolicy:
    enabled: true
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits:   { cpu: "300m", memory: "256Mi" }
  routeProfiles:
    - name: fuzefront
      enabled: true
      namespace: fuzefront
      service: fuzefront-frontend
      port: 80
      # Mirrors the fan-out on FuzeFront's own app.fuzefront.com Ingress so a
      # custom domain behaves identically to the canonical host.
      paths: ["/", "/api", "/socket.io"]
      ingressClass: traefik
# dnsmasq not needed on a remote server (use real DNS / nip.io)
dnsmasq:
  enabled: false
# -----------------------------------------------------------------------------
# Cluster Autoscaler elastic pool (Contabo).
# Maintains an elastic node pool sized 0:2 (min:max) via the externalgrpc
# provider (Task 12) + upstream Cluster Autoscaler (this task). This is up to 2
# elastic nodes ADDED ON TOP of the existing (floating) baseline — the
# control-plane plus however many worker nodes consumer repos have currently
# dispatched via infra-request-handler. There is no fixed baseline count here;
# the elastic pool only ever adds/removes the nodes it tagged itself
# (`fuzeinfra-elastic`) and never touches the baseline. Overprovisioning pause
# pods hold a headroom buffer so the CA has something to evict/scale against
# before real workloads go unschedulable — bumping overprovisioning replicas
# raises how much of the 0:2 elastic pool is proactively reserved.
# -----------------------------------------------------------------------------
# NOTE: kept DISABLED on main. Prod is Argo auto-synced (selfHeal) from main, so
# enabling here before the fuzeinfra-ca-provider SealedSecret + real product/image/
# k3sServerUrl + canonical elastic userDataTemplateB64 exist would CrashLoop the
# provider into prod. Flip to true ONLY as part of the gated Task 18 cutover.
clusterAutoscaler:
  enabled: true
  # Billing-aware model: Contabo only terminates a canceled instance at the
  # end of its paid month, so utilization scale-down is disabled — the
  # reaper CronJob below owns releasing idle elastic capacity instead.
  scaleDownEnabled: false
  provider:
    # TODO: replace with the published image once fuzeinfra-contabo-ca-provider
    # has a tagged release (see cluster-autoscaler/contabo-externalgrpc).
    image: ghcr.io/izzywdev/fuzeinfra-contabo-ca-provider:latest
    existingSecret: fuzeinfra-ca-provider
    # TODO: fill in the Contabo product/image IDs for the elastic node flavor
    # (contabo API: GET /v1/compute/instances/images, /v1/pricing).
    productId: "V92"
    imageId: "d64d5c6c-9dda-4e38-8174-0ee282474d8a"
    region: EU
    # TODO: set to the k3s server URL the elastic nodes join
    # (e.g. https://<contabo-server-ip>:6443).
    k3sServerUrl: "https://161.97.118.134:6443"
    # TODO: base64 of cluster-autoscaler/contabo-externalgrpc/deploy/elastic-userdata.template
    # (the canonical elastic-node cloud-init template) — e.g.
    # `base64 -w0 cluster-autoscaler/contabo-externalgrpc/deploy/elastic-userdata.template`.
    # See that file's header for the template vars (.NodeName/.K3SServerURL/.K3SNodeToken)
    # and why --kubelet-arg=provider-id=contabo://{{.NodeName}} is load-bearing for scale-down.
    userDataTemplateB64: ""
    # Best-effort email warning fired immediately before each new elastic
    # instance is provisioned (see internal/notify + internal/provider/scale.go's
    # NodeGroupIncreaseSize) — purely an early-warning signal for an operator;
    # the MaxSize name-prefix hard cap above is what actually prevents runaway
    # scaling, regardless of whether this is enabled/configured/reachable.
    # Off by default here too. To enable: set notifyEmailEnabled: true and fill
    # in notifySmtpHost/notifyEmailFrom/notifyEmailTo below; if the chosen SMTP
    # relay needs auth, add NOTIFY_SMTP_USER/NOTIFY_SMTP_PASS as NEW keys to the
    # existingSecret SealedSecret (helm/fuzeinfra/templates/autoscaler/sealed-secret-ca-provider.yaml)
    # — never as a plain value here — they arrive as env vars automatically via
    # that Secret's envFrom.
    notifyEmailEnabled: false
    notifySmtpHost: ""
    notifySmtpPort: "587"
    notifyEmailFrom: ""
    notifyEmailTo: ""
    # Telegram delivery for the same before-provision warning (internal/notify.Telegram)
    # — takes precedence over notifyEmailEnabled above when both are true.
    # Enabled here; the orchestrator fills in the real chat id below and
    # seals the bot token as a NEW key (NOTIFY_TELEGRAM_BOT_TOKEN) on the
    # existingSecret SealedSecret (helm/fuzeinfra/templates/autoscaler/sealed-secret-ca-provider.yaml)
    # — never as a plain value here.
    notifyTelegramEnabled: true
    # TODO(operator): replace with the real destination chat id (or source
    # this value from the sealed secret / a separate values overlay instead
    # of committing the literal id here).
    notifyTelegramChatId: "5196390841"
    maxSize: 5
  # Billing-aware reaper -- releases an idle elastic instance only within 24h
  # of its projected monthly renewal (see cmd/reaper). billingPeriod matches
  # the chart default (720h/~30d); set explicitly here so prod release window
  # is self-documenting rather than relying on an inherited default.
  reaper:
    enabled: true
    schedule: "0 * * * *"
    releaseWindow: 24h
    billingPeriod: 720h
  nodeGroup:
    maxSize: 5
overprovisioning:
  # Enabled together with clusterAutoscaler during the gated Task 18 cutover.
  enabled: true
# Per-service Postgres provisioning (issue #153) — PROD.
#
# The provisioning hook Job reads each role password via `secretKeyRef` from a
# Secret the consumer repo seals FOR the `fuzeinfra` namespace. Helm replaces
# (does NOT deep-merge) lists, so the full list is restated here.
#
# GITOPS GATE: each service stays `enabled: false` until its per-service
# credentials Secret is present in the `fuzeinfra` namespace. This is a HARD
# gate: the provisioning hook is a SINGLE Job pod that mounts every enabled
# service's password via `secretKeyRef` (Optional: false), so ONE missing
# secret fails the whole pod with CreateContainerConfigError, blocks ALL
# entries (including ones whose secret DOES exist), and degrades the Argo
# PostSync hook. (Observed: the Job sat in CreateContainerConfigError for
# ~3.7 days because fuzesales/fuzecontact/fuzeservice were flipped on before
# their secrets landed.) Flip each to `true` in the SAME change that lands its
# secret — never before.
#   - mendys      -> Secret `mendys-db-credentials` key `password`
#                    (DONE, issue #183: applied as a hand-off Secret in the
#                     `fuzeinfra` namespace via the FuzeKeys #136 precedent, so
#                     `mendys` below is enabled)
#   - fuzesales   -> Secret `fuzesales-db-credentials`   key `password`  (present)
#   - fuzecontact -> Secret `fuzecontact-db-credentials` key `password`  (present)
#   - fuzeservice -> Secret `fuzeservice-db-credentials` key `password`  (present)
serviceDatabases:
  - name: fuzesales
    enabled: true
    role: fuzesales_svc
    database: fuzesales
    passwordSecret:
      name: fuzesales-db-credentials
      key: password
  - name: fuzecontact
    enabled: true
    role: fuzecontact_svc
    database: fuzecontact
    passwordSecret:
      name: fuzecontact-db-credentials
      key: password
  - name: fuzeservice
    enabled: true
    role: fuzeservice_svc
    database: fuzeservice
    passwordSecret:
      name: fuzeservice-db-credentials
      key: password
  # Enabled: `mendys-db-credentials` (key `password`) is present in the
  # `fuzeinfra` namespace as a hand-off Secret (issue #183, FuzeKeys #136
  # precedent — annotated `fuzeinfra.dev/consumer: izzywdev/MendysRobotics`).
  # The role/db were also provisioned imperatively with the same password, so
  # this hook Job idempotently adopts and re-syncs them on the next Argo sync.
  - name: mendys
    enabled: true
    role: mendys_svc
    database: mendys
    passwordSecret:
      name: mendys-db-credentials
      key: password
  # The provisioning workflow flips this gate only in the same PR that adds
  # the strict-scoped fuzeinfra password SealedSecret.
  - name: fuzequality
    enabled: true
    role: fuzequality_user
    database: fuzequality
    passwordSecret:
      name: fuzequality-db-credentials
      key: password
  # Backing store for the MendysRobotics Authentik instance (FuzeFront chart,
  # instance "mendys"). See the base values.yaml entry for why MendysRobotics
  # gets its own Authentik instance + database rather than a brand on the
  # shared FuzeFront directory.
  #
  # STILL GATED OFF: per governance/datastore-provisioning.md the gate flips
  # only in the same PR that lands the strict-scoped SealedSecret
  # `authentik-mendys-db-credentials` (key `password`) sealed FOR the
  # `fuzeinfra` namespace. FuzeFront owns that password (its Authentik pods
  # connect with it), so FuzeFront seals it into BOTH namespaces:
  #   - fuzefront  → the authentik-mendys server/worker DATABASE_URL
  #   - fuzeinfra  → read by this provisioning Job via secretKeyRef
  # Flipping this to `true` before that Secret exists fails the PostSync Job.
  - name: authentik-mendys
    enabled: false
    role: authentik_mendys_user
    database: authentik_mendys
    passwordSecret:
      name: authentik-mendys-db-credentials
      key: password
  # FuzeHub backend (Prisma). fuzehub-db-credentials sealed for the fuzeinfra
  # namespace (key `password`) in the same PR as this gate flip, so the
  # PostSync provisioning Job finds it on first sync — no separate follow-up.
  - name: fuzehub
    enabled: true
    role: fuzehub_svc
    database: fuzehub
    passwordSecret:
      name: fuzehub-db-credentials
      key: password
  # GATED: flip to enabled:true in the same PR that commits
  # deploy/sealed-secrets/fuzesocial-db-credentials.yaml (sealed for fuzeinfra
  # namespace, key: password). The provision-fuzesocial workflow does both
  # atomically. See issue #149.
  - name: fuzesocial
    enabled: true
    role: fuzesocial_app
    database: fuzesocial
    passwordSecret:
      name: fuzesocial-db-credentials
      key: password
# Per-service MongoDB provisioning (Helm REPLACES lists, so the full set must be
# declared here — the base values default every entry to enabled: false).
#
# MendysRobotics prod (FuzeInfra #238): the backend reads/writes database
# `robot_catalog` (MONGODB_DATABASE=robot_catalog). Verified against the live
# cluster, the backend's actual MONGODB_URL authenticates as user `mendys_app`
# whose user record lives in — and whose authSource is — the `mendys` database
# (NOT `admin`; that is the only mendys user in the whole deployment). It was
# created out-of-band (#124) with readWrite on `mendys` only, so every
# find/aggregate/createIndexes on `robot_catalog` failed with code 13
# (Unauthorized).
#
# This entry grants that existing `mendys.mendys_app` user readWrite on the
# databases it uses, via the idempotent PostSync provisioning Job
# (grantRolesToUser). managePassword: false — FuzeInfra does not own this user's
# password, so the Job must NOT rotate it (which would break the working auth)
# and mounts no per-service Secret; it only reconciles the role grants. (The
# same grant was applied imperatively to unblock prod immediately; this Job
# re-applies it idempotently and makes it durable across syncs/rebuilds.)
serviceMongoDatabases:
  - name: mendys
    enabled: true
    user: mendys_app
    authDatabase: mendys
    managePassword: false
    database: robot_catalog
    roles:
      - {role: readWrite, db: robot_catalog}
      - {role: readWrite, db: mendys}
  # FuzePicker backend (issue #242). FuzeInfra creates the least-privilege user
  # `fuzepicker_svc` on the shared mongo server with readWrite on its own
  # `fuzepicker` database. managePassword defaults true, so the provisioning Job
  # creates the user (if missing) and syncs its password from the sealed
  # `fuzepicker-db-credentials` secret
  # (deploy/sealed-secrets/fuzepicker-db-credentials.yaml, key `password`).
  - name: fuzepicker
    enabled: true
    database: fuzepicker
    user: fuzepicker_svc
    passwordSecret:
      name: fuzepicker-db-credentials
      key: password
# Chroma allocations are enabled only with a matching strict-scoped
# SealedSecret in deploy/sealed-secrets. Chroma binds each bearer token to the
# declared tenant/database; the NetworkPolicy also admits only the named pods.
serviceChromaCollections:
  - name: fuzeplan-repo-digester
    enabled: true
    tenant: fuzeplan
    database: repo-digester
    credentialSecret:
      name: fuzeplan-repo-digester-chroma-credentials
      key: token
    networkPolicy:
      namespace: fuzeplan
      podLabels:
        app.kubernetes.io/name: repo-digester
    collections:
      - repo_digester_ready
  - name: fuzequality
    enabled: true
    tenant: fuzequality
    database: fuzequality
    credentialSecret:
      name: fuzequality-chroma-credentials
      key: token
    networkPolicy:
      namespace: fuzequality
      podLabels:
        app.kubernetes.io/name: fuzequality
    collections:
      - fuzequality_ready
