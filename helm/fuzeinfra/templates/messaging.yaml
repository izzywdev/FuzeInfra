{{- /* ===================== Kafka (KRaft, no ZooKeeper) ===================== */ -}}
{{- if .Values.kafka.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: fuzeinfra-kafka
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
    {{- include "fuzeinfra.selectorLabels" (dict "component" "kafka" "root" $) | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "fuzeinfra.selectorLabels" (dict "component" "kafka" "root" $) | nindent 4 }}
  ports:
    - name: broker
      port: {{ .Values.kafka.port }}
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
{{- if (dig "externalListener" "enabled" false .Values.kafka) }}
    - name: external
      port: {{ .Values.kafka.externalListener.port }}
      targetPort: {{ .Values.kafka.externalListener.port }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fuzeinfra-kafka
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  serviceName: fuzeinfra-kafka
  replicas: 1
  selector:
    matchLabels:
      {{- include "fuzeinfra.selectorLabels" (dict "component" "kafka" "root" $) | nindent 6 }}
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        {{- include "fuzeinfra.labels" . | nindent 8 }}
        {{- include "fuzeinfra.selectorLabels" (dict "component" "kafka" "root" $) | nindent 8 }}
    spec:
      # Confluent Kafka runs as uid 1000; fsGroup makes k8s chown the fresh
      # Longhorn data volume to gid 1000 on mount (else the ext4 PV is root-owned
      # and Kafka fails its writable preflight and CrashLoops).
      securityContext:
        fsGroup: 1000
      {{- include "fuzeinfra.dbSpread" $ | nindent 6 }}
      initContainers:
        # Fresh Longhorn (ext4) volumes are root-owned and carry a root:root
        # lost+found; Confluent Kafka runs as uid 1000 and fails its "is
        # /var/lib/kafka/data writable" preflight. Chown the data dir and drop
        # lost+found so the broker starts. fsGroup alone is insufficient here.
        - name: init-chown-data
          image: busybox:1.36
          command: ["sh","-c","rm -rf /var/lib/kafka/data/lost+found; chown -R 1000:1000 /var/lib/kafka/data; chmod -R u+rwX /var/lib/kafka/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          env:
            # --- KRaft single-node config (broker + controller in one process) ---
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            # Combined broker+controller in same JVM → use localhost for quorum
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093{{ if (dig "externalListener" "enabled" false .Values.kafka) }},EXTERNAL://0.0.0.0:{{ .Values.kafka.externalListener.port }}{{ end }}"
            # Advertise the cluster-wide FQDN so cross-namespace clients (e.g. the
            # `fuzefront` and `mendys-prod` namespaces) can resolve the broker
            # returned in metadata. A bare service name only resolves inside this
            # chart's own namespace, which broke produce/consume for every external
            # consumer (#104). The FQDN resolves everywhere (including
            # intra-namespace), so a single listener suffices.
            #
            # The namespace segment comes from `fuzeinfra.serviceNamespace`, NOT
            # from `.Release.Namespace` directly: a render without `--namespace`
            # silently yields "default" here, and a broker advertising
            # `fuzeinfra-kafka.default.svc.cluster.local` accepts the bootstrap
            # connection and then fails every produce/consume on the unresolvable
            # metadata address. The helper turns that into a render-time failure.
            {{- /*
              A second, OPTIONAL listener for clients reaching the broker through
              a `kubectl port-forward` — i.e. the pytest smoke suite, which the
              chart otherwise cannot satisfy at all.

              Kafka hands back the advertised address OF THE LISTENER THE CLIENT
              CONNECTED ON, and the client then reconnects to that address for
              every produce/consume. A port-forwarded client bootstrapping on the
              PLAINTEXT listener is therefore told to go to
              fuzeinfra-kafka.<ns>.svc.cluster.local:9092, which does not resolve
              outside the cluster: the bootstrap SUCCEEDS and every subsequent
              operation fails. Correcting the port-forward alone cannot fix that.

              With this listener the port-forwarded client bootstraps on
              localhost:<port> and is told localhost:<port> — consistent, and
              reachable through the same forward. In-cluster clients still arrive
              on 9092 and still get the FQDN, so nothing about their path changes.

              LOCAL ONLY. Advertising `localhost` on a real cluster would hand
              every client an address pointing at its own pod.
            */}}
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://{{ include "fuzeinfra.serviceFqdn" (dict "root" $ "svc" "fuzeinfra-kafka") }}:9092{{ if (dig "externalListener" "enabled" false .Values.kafka) }},EXTERNAL://{{ .Values.kafka.externalListener.advertisedHost }}:{{ .Values.kafka.externalListener.port }}{{ end }}"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT{{ if (dig "externalListener" "enabled" false .Values.kafka) }},EXTERNAL:PLAINTEXT{{ end }}"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            # Single-node replication factors must be 1.
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            # cp-kafka auto-formats KRaft storage when CLUSTER_ID is provided.
            - name: CLUSTER_ID
              value: {{ .Values.kafka.clusterId | quote }}
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
          ports:
            - containerPort: 9092
              name: broker
            - containerPort: 9093
              name: controller
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "fuzeinfra.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.kafka.storage }}
{{- end }}

{{- /* ===================== Kafka UI ===================== */ -}}
{{- if and .Values.kafkaUi.enabled .Values.kafka.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: fuzeinfra-kafka-ui
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
    {{- include "fuzeinfra.selectorLabels" (dict "component" "kafka-ui" "root" $) | nindent 4 }}
spec:
  selector:
    {{- include "fuzeinfra.selectorLabels" (dict "component" "kafka-ui" "root" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.kafkaUi.port }}
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuzeinfra-kafka-ui
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "fuzeinfra.selectorLabels" (dict "component" "kafka-ui" "root" $) | nindent 6 }}
  template:
    metadata:
      {{- if .Values.kafkaUi.oidc.enabled }}
      annotations:
        # Roll the pod whenever the OIDC wiring changes.
        #
        # kafka-ui is Spring Security, which fetches the issuer's discovery
        # document ONCE at startup and caches it for the life of the process. It
        # therefore keeps using whatever endpoints it saw when it booted, even
        # after the IdP starts advertising different ones — and nothing in this
        # Deployment changes, so Argo has no reason to restart it.
        #
        # That is not hypothetical: after the IdP was fixed to advertise https://
        # issuers instead of http://, Grafana recovered immediately (it is
        # configured with explicit URLs, no discovery) while kafka-ui kept failing
        # with "Invalid credentials" because it was still holding the stale http://
        # endpoints from its previous start.
        #
        # Hashing the OIDC block means any future change to the issuer, client id
        # or secret reference forces a fresh discovery fetch.
        checksum/oidc: {{ .Values.kafkaUi.oidc | toYaml | sha256sum }}
      {{- end }}
      labels:
        {{- include "fuzeinfra.labels" . | nindent 8 }}
        {{- include "fuzeinfra.selectorLabels" (dict "component" "kafka-ui" "root" $) | nindent 8 }}
    spec:
      containers:
        - name: kafka-ui
          image: {{ .Values.kafkaUi.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "local"
            # KRaft mode: bootstrap servers only, no ZooKeeper.
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "fuzeinfra-kafka:9092"
            - name: DYNAMIC_CONFIG_ENABLED
              value: "true"
            {{- if .Values.kafkaUi.oidc.enabled }}
            # ---- Authentik SSO -----------------------------------------------
            # Without AUTH_TYPE, provectus kafka-ui defaults to DISABLED: anyone
            # who reaches the pod is an unauthenticated admin, and with
            # DYNAMIC_CONFIG_ENABLED=true that is write-capable. Until this is
            # on, the Cloudflare Access wall is the ONLY thing gating it.
            #
            # NOTE: kafka-ui has no role model configured here, so every user who
            # authenticates is a full admin. Authentication, not authorization.
            - name: AUTH_TYPE
              value: "OAUTH2"
            {{- if .Values.kafkaUi.oidc.debugLogging }}
            # TEMPORARY DIAGNOSTIC — turn back off once the issue is understood.
            #
            # kafka-ui is Spring Security, which reports every OAuth2 failure to
            # the user as the same opaque "Invalid credentials" regardless of
            # cause: bad client secret, unreachable token endpoint, issuer
            # mismatch, rejected scope. The real reason is only in the pod log,
            # and only if this logger is raised.
            #
            # DEBUG, NOT TRACE, deliberately. TRACE on the oauth2 packages logs
            # full token and client-credential values into the pod log — and pod
            # logs ARE readable through the cluster-query workflow, whose job
            # output is public. DEBUG carries the exception and the failing
            # endpoint without the credential. Do not raise this to TRACE to get
            # "a bit more detail"; that turns a diagnostic into a secret leak.
            - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_OAUTH2_CLIENT
              value: "DEBUG"
            - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_WEB
              value: "DEBUG"
            {{- end }}
            - name: AUTH_OAUTH2_CLIENT_AUTHENTIK_CLIENTNAME
              value: {{ .Values.kafkaUi.oidc.displayName | quote }}
            - name: AUTH_OAUTH2_CLIENT_AUTHENTIK_PROVIDER
              value: "oauth"
            - name: AUTH_OAUTH2_CLIENT_AUTHENTIK_CLIENTID
              value: {{ .Values.kafkaUi.oidc.clientId | quote }}
            - name: AUTH_OAUTH2_CLIENT_AUTHENTIK_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaUi.oidc.secretName }}
                  key: {{ .Values.kafkaUi.oidc.secretKey }}
            - name: AUTH_OAUTH2_CLIENT_AUTHENTIK_ISSUERURI
              value: {{ .Values.kafkaUi.oidc.issuer | quote }}
            - name: AUTH_OAUTH2_CLIENT_AUTHENTIK_SCOPE
              value: "openid,email,profile"
            # Must match a redirect_uri on the Authentik provider exactly. The
            # trailing path segment is the registration id ("authentik"), which
            # is derived from the AUTH_OAUTH2_CLIENT_<ID>_ prefix above.
            - name: AUTH_OAUTH2_CLIENT_AUTHENTIK_REDIRECTURI
              value: "https://{{ include "fuzeinfra.host" (dict "root" . "sub" "kafka-ui") }}/login/oauth2/code/authentik"
            {{- end }}
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 10
{{- end }}

{{- /* ===================== RabbitMQ ===================== */ -}}
{{- if .Values.rabbitmq.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: fuzeinfra-rabbitmq
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
    {{- include "fuzeinfra.selectorLabels" (dict "component" "rabbitmq" "root" $) | nindent 4 }}
spec:
  selector:
    {{- include "fuzeinfra.selectorLabels" (dict "component" "rabbitmq" "root" $) | nindent 4 }}
  ports:
    - name: amqp
      port: {{ .Values.rabbitmq.amqpPort }}
      targetPort: 5672
    - name: management
      port: {{ .Values.rabbitmq.managementPort }}
      targetPort: 15672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fuzeinfra-rabbitmq
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  serviceName: fuzeinfra-rabbitmq
  replicas: {{ dig "replicas" 1 .Values.rabbitmq }}
  selector:
    matchLabels:
      {{- include "fuzeinfra.selectorLabels" (dict "component" "rabbitmq" "root" $) | nindent 6 }}
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        {{- include "fuzeinfra.labels" . | nindent 8 }}
        {{- include "fuzeinfra.selectorLabels" (dict "component" "rabbitmq" "root" $) | nindent 8 }}
    spec:
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "fuzeinfra.secretName" . }}
                  key: RABBITMQ_USER
            # Chart default for this is the literal "admin123". Override with a
            # dedicated Secret rather than resealing fuzeinfra-secrets, which also
            # carries the live Postgres/Mongo/Neo4j credentials.
            #
            # CAVEAT, because this is easy to get wrong: RABBITMQ_DEFAULT_PASS is
            # only honoured on FIRST boot against an empty mnesia. Pointing this at
            # a new Secret does NOT rotate an existing broker's user — that needs
            # `rabbitmqctl change_password` or a wiped volume. It does guarantee a
            # strong credential whenever the broker is initialised fresh.
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  {{- with .Values.rabbitmq.passwordSecret }}
                  name: {{ .name | default (include "fuzeinfra.secretName" $) }}
                  key: {{ .key | default "RABBITMQ_PASSWORD" }}
                  {{- else }}
                  name: {{ include "fuzeinfra.secretName" . }}
                  key: RABBITMQ_PASSWORD
                  {{- end }}
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 1Gi }
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "fuzeinfra.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.rabbitmq.storage }}
{{- end }}

{{- /* ===================== Mongo Express ===================== */ -}}
{{- if and .Values.mongoExpress.enabled .Values.mongodb.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: fuzeinfra-mongo-express
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
    {{- include "fuzeinfra.selectorLabels" (dict "component" "mongo-express" "root" $) | nindent 4 }}
spec:
  selector:
    {{- include "fuzeinfra.selectorLabels" (dict "component" "mongo-express" "root" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.mongoExpress.port }}
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuzeinfra-mongo-express
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "fuzeinfra.selectorLabels" (dict "component" "mongo-express" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fuzeinfra.labels" . | nindent 8 }}
        {{- include "fuzeinfra.selectorLabels" (dict "component" "mongo-express" "root" $) | nindent 8 }}
    spec:
      containers:
        - name: mongo-express
          image: {{ .Values.mongoExpress.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          env:
            - name: ME_CONFIG_MONGODB_ADMINUSERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "fuzeinfra.secretName" . }}
                  key: MONGODB_USER
            - name: ME_CONFIG_MONGODB_ADMINPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fuzeinfra.secretName" . }}
                  key: MONGODB_PASSWORD
            - name: ME_CONFIG_MONGODB_URL
              value: "mongodb://$(ME_CONFIG_MONGODB_ADMINUSERNAME):$(ME_CONFIG_MONGODB_ADMINPASSWORD)@fuzeinfra-mongodb:27017/"
            - name: ME_CONFIG_BASICAUTH_USERNAME
              value: "admin"
            - name: ME_CONFIG_BASICAUTH_PASSWORD
              value: "admin"
          ports:
            - containerPort: 8081
              name: http
{{- end }}
