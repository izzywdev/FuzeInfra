{{- /* API VIP keepalived scripts + tables (ConfigMap). Split out of
     api-vip-keepalived.yaml so the DaemonSet can hash THIS file into its pod
     template: with the ConfigMap inline, the checksum only covered vips/nodes/
     authPass, so editing notify.sh / render.sh / check-apiserver.sh changed the
     mounted files but never restarted a pod — and render.sh runs once at start,
     so a script fix silently did not apply. See the DaemonSet's checksum/config. */ -}}
{{- if .Values.apiVip.enabled }}
{{- $vip := .Values.apiVip }}
{{- if not $vip.vips }}{{ fail "apiVip.enabled is true but apiVip.vips is empty" }}{{- end }}
{{- if not $vip.nodes }}{{ fail "apiVip.enabled is true but apiVip.nodes is empty" }}{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fuzeinfra-api-vip-keepalived
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
data:
  # Per-node table (basePriority: monitoring node lowest) and per-VIP table
  # (address + the node that primarily holds it). The entrypoint selects THIS
  # node's row by NODE_NAME and builds one vrrp_instance per VIP.
  nodes.json: |
    {{ toJson $vip.nodes }}
  vips.json: |
    {{ toJson $vip.vips }}
  check-apiserver.sh: |
    #!/bin/sh
    # LIVENESS, NOT AUTHORIZATION. This probe is unauthenticated, and an apiserver
    # with anonymous-auth off answers 401 — which still proves it terminated TLS
    # and served the request, i.e. it is alive. Requiring '200' therefore marked
    # every HEALTHY node unhealthy: on 2026-09-23 all three nodes ran this, got
    # 401, and keepalived docked each one by the track script's weight
    # ("Changing effective priority from 150 to 90", 200->140, 240->180), so the
    # owner could not hold its own VIP and one node ended up with all three.
    # Only a real failure — connection refused, timeout (000) or a 5xx — should
    # lower priority.
    code=$(curl -sk --max-time 2 -o /dev/null -w '%{http_code}' \
      "https://127.0.0.1:{{ $vip.healthCheck.port }}{{ $vip.healthCheck.path }}")
    case "$code" in
      200|401|403) exit 0 ;;
      *)           exit 1 ;;
    esac
  notify.sh: |
    #!/usr/bin/env bash
    # keepalived per-VIP hook: `notify.sh MASTER <vip>`. On MASTER, reassign THAT
    # vip to this node's instance via the Contabo VIP API so the provider routes it
    # here (keepalived has already bound it locally). Mechanics VERIFIED live
    # 2026-09-22 (run 35718868309):
    #   holder = GET /v1/vips/{ip} -> .data[0].resourceId (top-level, not assignments[])
    #   PATH resourceType is PLURAL "instances" (API rejects "instance")
    #   assign POST needs a body: -d '{}' (else 400 "Body cannot be empty")
    #   reassign = unassign(old) DELETE -> assign(self) POST
    set -uo pipefail
    # keepalived forks this script with stdout/stderr that never reach the
    # container log, so every `log` line below was invisible: on 2026-10-14 the
    # logs showed core-2 entering MASTER for .42 and NOTHING about whether the
    # provider-side reassignment ran, which is exactly the question that mattered.
    # Send output to the container's own stdout (PID 1's fd 1). Best-effort: a
    # failure to open it must never stop the reassignment itself.
    { exec >>/proc/1/fd/1 2>&1; } 2>/dev/null || true
    STATE="${1:-}" ; VIP="${2:-}"
    log() { echo "[api-vip notify] $(date -u +%FT%TZ) vip=$VIP $*"; }
    [ "$STATE" = "MASTER" ] || { log "state=$STATE -> no reassignment"; exit 0; }
    [ -n "$VIP" ] || { log "ERROR: no VIP arg"; exit 1; }
    : "${CONTABO_INSTANCE_ID:?}" "${CONTABO_CLIENT_ID:?}" "${CONTABO_CLIENT_SECRET:?}"
    : "${CONTABO_API_USER:?}" "${CONTABO_API_PASSWORD:?}"
    RTYPE="${CONTABO_RESOURCE_TYPE:-instances}"
    API="https://api.contabo.com" ; VIPBASE="$API/v1/vips/$VIP"
    rid() { cat /proc/sys/kernel/random/uuid; }
    TOK=$(curl -sS -X POST -H "Content-Type: application/x-www-form-urlencoded" \
      "https://auth.contabo.com/auth/realms/contabo/protocol/openid-connect/token" \
      --data-urlencode "client_id=${CONTABO_CLIENT_ID}" \
      --data-urlencode "client_secret=${CONTABO_CLIENT_SECRET}" \
      --data-urlencode "username=${CONTABO_API_USER}" \
      --data-urlencode "password=${CONTABO_API_PASSWORD}" \
      --data-urlencode "grant_type=password" | jq -r .access_token)
    [ -n "$TOK" ] && [ "$TOK" != "null" ] || { log "ERROR: no Contabo token"; exit 1; }
    CUR=$(curl -sS -H "Authorization: Bearer $TOK" -H "x-request-id: $(rid)" "$VIPBASE" \
           | jq -r '.data[0].resourceId // empty' 2>/dev/null)
    if [ "$CUR" = "$CONTABO_INSTANCE_ID" ]; then log "already on $CONTABO_INSTANCE_ID"; exit 0; fi
    if [ -n "$CUR" ]; then
      DC=$(curl -sS -o /tmp/vip.out -w '%{http_code}' -X DELETE \
        -H "Authorization: Bearer $TOK" -H "x-request-id: $(rid)" "$VIPBASE/$RTYPE/$CUR")
      log "unassign from $CUR -> HTTP $DC"; sleep 2
    fi
    CODE=$(curl -sS -o /tmp/vip.out -w '%{http_code}' -X POST \
      -H "Authorization: Bearer $TOK" -H "x-request-id: $(rid)" \
      -H "Content-Type: application/json" -d '{}' "$VIPBASE/$RTYPE/$CONTABO_INSTANCE_ID")
    if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]; then
      log "assigned -> $CONTABO_INSTANCE_ID (HTTP $CODE)"
    else
      # keepalived already bound it locally; a provider failure should page, not flap.
      log "WARN: assign HTTP $CODE: $(cat /tmp/vip.out)"
    fi
    exit 0
  render.sh: |
    #!/usr/bin/env bash
    # Build keepalived.conf for THIS node: global header + one vrrp_instance per VIP.
    set -eu
    # keepalived runs with enable_script_security, which refuses any script whose
    # DIRECTORY is writable by non-root — not just the script itself. The emptyDir
    # mounted here lands as 0777, so keepalived logged
    #   "Unsafe permissions found for script '/etc/keepalived/notify.sh' - disabling."
    # and silently dropped the notify hooks while VRRP itself kept working. The
    # effect was subtle and bad: on failover a node still bound the peer's VIP
    # locally, but notify.sh never ran, so the Contabo VIP was never reassigned
    # provider-side and the adopted VIP stayed unreachable (observed in prod
    # 2026-09-23: 13.140.184.164 bound on fuze-core-3, HTTP 000 from outside).
    chmod 0755 /etc/keepalived
    cp /cfg/notify.sh /etc/keepalived/notify.sh
    cp /cfg/check-apiserver.sh /etc/keepalived/check-apiserver.sh
    chmod 0700 /etc/keepalived/notify.sh /etc/keepalived/check-apiserver.sh
    ROW=$(jq -c --arg n "$NODE_NAME" '.[]|select(.name==$n)' /cfg/nodes.json)
    if [ -z "$ROW" ]; then echo "node $NODE_NAME not in apiVip.nodes; idling"; exec sleep infinity; fi
    BASE=$(echo "$ROW" | jq -r '.basePriority')
    THIS_PEER=$(echo "$ROW" | jq -r '.peerIp')
    export CONTABO_INSTANCE_ID=$(echo "$ROW" | jq -r '.instanceId')
    PEERS=$(jq -r --arg n "$NODE_NAME" '.[]|select(.name!=$n)|"        "+.peerIp' /cfg/nodes.json)
    CONF=/etc/keepalived/keepalived.conf
    cat > "$CONF" <<EOF
    global_defs {
        enable_script_security
        script_user root
        router_id $NODE_NAME
    }
    # Hysteresis, not sensitivity. The old values (interval 2 / fall 2) docked a
    # node's priority after ~4s of failing checks, and weight -60 is larger than the
    # whole spread between the nodes' base priorities (150 / 140 / 100), so a
    # single blip REORDERED the election. Measured 2026-10-13: at 22:17 every node's
    # check stalled for a few seconds (":17" is Ubuntu's stock /etc/cron.hourly
    # slot), core-3's own VIP dropped 240 -> 180 and its others 140 -> 80, below the
    # monitoring node's 100, and VIPs moved between nodes for no real fault.
    # A genuinely dead node is caught by VRRP advert loss (~3s) regardless; this
    # script only has to catch "node alive, apiserver dead", which can afford to
    # take ~15s to be sure.
    vrrp_script chk_apiserver {
        script "/etc/keepalived/check-apiserver.sh"
        interval {{ $vip.healthCheck.intervalSeconds | default 3 }}
        timeout {{ $vip.healthCheck.timeoutSeconds | default 5 }}
        rise {{ $vip.healthCheck.rise | default 2 }}
        fall {{ $vip.healthCheck.fall | default 5 }}
        weight -60
    }
    EOF
    i=0
    while read -r VIPROW; do
      [ -n "$VIPROW" ] || continue
      ADDR=$(echo "$VIPROW" | jq -r '.address')
      PRIMARY=$(echo "$VIPROW" | jq -r '.primaryNode')
      RID=$(echo "$VIPROW" | jq -r '.routerId')
      PRIO=$BASE
      [ "$PRIMARY" = "$NODE_NAME" ] && PRIO=$((BASE + {{ $vip.vrrp.ownVipBoost | default 100 }}))
      {
        echo "vrrp_instance API_VIP_$i {"
        echo "    state BACKUP"
        # nopreempt ONLY for a VIP this node does not own. Unconditional nopreempt
        # means an owner can never reclaim its own VIP: whoever wins the election
        # first keeps it forever, so after a rolling restart one node can end up
        # holding EVERY VIP while its peers hold none — all VIPs still answer, but
        # the round-robin sends all three shares of traffic to a single node and
        # the load-balancing half of this design is silently gone (observed
        # 2026-09-23: fuze-core-1 held .164, .42 and .205). Keeping nopreempt for
        # ADOPTED VIPs preserves the anti-flap intent — a recovering peer takes its
        # own VIP back, but nothing bounces a VIP it merely inherited.
        [ "$PRIMARY" = "$NODE_NAME" ] || echo "    nopreempt"
        echo "    interface {{ $vip.vrrp.interface }}"
        echo "    virtual_router_id $RID"
        echo "    priority $PRIO"
        echo "    advert_int 1"
        echo "    unicast_src_ip $THIS_PEER"
        echo "    unicast_peer {"
        echo "$PEERS"
        echo "    }"
        # MUST be multi-line. keepalived's parser reads `authentication {` and then
        # takes its directives from SUBSEQUENT lines, so the one-line brace form
        # registers auth_type but never sees auth_pass, and every instance logs
        #   "Authentication specified but no password given. Ignoring"
        # i.e. VRRP runs UNAUTHENTICATED while the config looks correct and the
        # password is present in the file (observed in prod 2026-09-23; the env var
        # was populated and no truncation warning was emitted, which is what rules
        # out the 8-byte limit as the cause). virtual_ipaddress below tolerates the
        # one-line form, which is why only this block needed changing.
        # Note: VRRPv2 auth_pass is 8 bytes; a longer secret is truncated to 8
        # identically on every node, so peers still agree.
        echo "    authentication {"
        echo "        auth_type PASS"
        echo "        auth_pass $KEEPALIVED_AUTH_PASS"
        echo "    }"
        echo "    virtual_ipaddress { $ADDR/32 dev {{ $vip.interface }} }"
        echo "    track_script { chk_apiserver }"
        echo "    notify_master \"/etc/keepalived/notify.sh MASTER $ADDR\""
        echo "    notify_backup \"/etc/keepalived/notify.sh BACKUP $ADDR\""
        echo "    notify_fault  \"/etc/keepalived/notify.sh FAULT $ADDR\""
        echo "}"
      } >> "$CONF"
      i=$((i+1))
    done < <(jq -c '.[]' /cfg/vips.json)
    echo "== rendered keepalived.conf ($i VIP instances; secrets elided) =="
    sed 's/auth_pass .*/auth_pass ****/' "$CONF"
    exec keepalived -n -l -f "$CONF" --dont-fork
  reconcile.sh: |
    #!/usr/bin/env bash
    # LEVEL-triggered reconciliation of the provider-side VIP assignment.
    #
    # WHY THIS EXISTS. notify.sh reassigns a VIP at the Contabo API only when
    # keepalived TRANSITIONS into MASTER — it is edge-triggered. That is enough while
    # one node at a time wins an election, and silently wrong the moment two do:
    # observed 2026-10-14, when core-1 briefly won core-2's .42 (00:14), its notify
    # moved the provider IP to core-1, and core-2 then re-won the election WITHOUT
    # ever leaving MASTER — so it never ran notify_master again. Contabo now routed
    # .42 to core-1 (where keepalived is BACKUP and the address is not bound) while
    # core-2 held it locally and believed all was well. Every external connection to
    # that share of the round-robin silently failed, for hours, with every pod Ready.
    #
    # WHAT IT DOES. Every INTERVAL seconds, for each VIP that is bound on THIS node's
    # interface — which is keepalived's own statement that it is MASTER — compare the
    # provider's holder with this node's instance id; on STRIKES consecutive
    # mismatches, run notify.sh to reassign. The local address is the source of truth
    # for "who should hold it", the provider API is the thing being brought into line.
    #
    # WHAT IT DELIBERATELY DOES NOT DO.
    #  * Act on a VIP not bound locally: a BACKUP node must never reach for an
    #    address it does not hold.
    #  * Act when it cannot READ the provider state. An API error or an empty holder
    #    is "cannot tell", logged and skipped — never "mismatch".
    #  * Act on a single mismatch. A reassignment already in flight (notify.sh does
    #    unassign -> sleep 2 -> assign) legitimately looks like drift for a moment,
    #    and a one-sample reaction would fight it.
    #
    # Runs as its own container so a crash restarts it independently of keepalived,
    # and so its log is `kubectl logs -c reconciler` — the missing visibility that hid
    # the drift above.
    set -u
    CFG_DIR="${CFG_DIR:-/cfg}"
    INTERVAL="${RECONCILE_INTERVAL:-30}"
    STRIKES="${RECONCILE_STRIKES:-2}"
    IFACE="${VIP_IFACE:-eth0}"
    NOTIFY="${NOTIFY_SCRIPT:-$CFG_DIR/notify.sh}"
    MAX_CYCLES="${RECONCILE_MAX_CYCLES:-0}"   # 0 = run forever; tests set a bound
    API="${CONTABO_API_BASE:-https://api.contabo.com}"
    AUTH_URL="${CONTABO_AUTH_URL:-https://auth.contabo.com/auth/realms/contabo/protocol/openid-connect/token}"
    log() { echo "[vip-reconcile] $(date -u +%FT%TZ) $*"; }
    # A missing tool must be loud and restart the container, not a loop that never
    # finds anything bound and reports healthy.
    for t in ip jq curl; do
      command -v "$t" >/dev/null 2>&1 || { log "ERROR: required tool '$t' missing from the image"; exit 1; }
    done
    ROW=$(jq -c --arg n "${NODE_NAME:-}" '.[]|select(.name==$n)' "$CFG_DIR/nodes.json" 2>/dev/null)
    if [ -z "$ROW" ]; then log "node ${NODE_NAME:-?} not in apiVip.nodes; idling"; exec sleep infinity; fi
    export CONTABO_INSTANCE_ID=$(echo "$ROW" | jq -r '.instanceId')
    token() {
      curl -sS --max-time 10 -X POST -H "Content-Type: application/x-www-form-urlencoded" "$AUTH_URL" \
        --data-urlencode "client_id=${CONTABO_CLIENT_ID:-}" \
        --data-urlencode "client_secret=${CONTABO_CLIENT_SECRET:-}" \
        --data-urlencode "username=${CONTABO_API_USER:-}" \
        --data-urlencode "password=${CONTABO_API_PASSWORD:-}" \
        --data-urlencode "grant_type=password" 2>/dev/null | jq -r '.access_token // empty' 2>/dev/null
    }
    holder() {
      curl -sS --max-time 10 -H "Authorization: Bearer $1" -H "x-request-id: $(cat /proc/sys/kernel/random/uuid)" \
        "$API/v1/vips/$2" 2>/dev/null | jq -r '.data[0].resourceId // empty' 2>/dev/null
    }
    declare -A bad
    cycle=0
    log "started: node=${NODE_NAME:-?} instance=$CONTABO_INSTANCE_ID iface=$IFACE interval=${INTERVAL}s strikes=$STRIKES"
    while :; do
      cycle=$((cycle + 1))
      TOK=""
      for ADDR in $(jq -r '.[].address' "$CFG_DIR/vips.json"); do
        # Bound here == keepalived is MASTER for it. Match " <addr>/" so that
        # 13.140.185.4 can never match inside 13.140.185.42.
        if ! ip -4 -o addr show dev "$IFACE" 2>/dev/null | grep -qF " $ADDR/"; then
          bad[$ADDR]=0
          continue
        fi
        [ -n "$TOK" ] || TOK=$(token)
        if [ -z "$TOK" ]; then log "WARN: no Contabo token; cannot verify $ADDR, not acting"; continue; fi
        H=$(holder "$TOK" "$ADDR")
        if [ -z "$H" ]; then log "WARN: provider holder of $ADDR is unreadable; not acting"; continue; fi
        if [ "$H" = "$CONTABO_INSTANCE_ID" ]; then
          if [ "${bad[$ADDR]:-0}" -gt 0 ]; then log "$ADDR: provider-side holder is $H again; drift cleared"; fi
          bad[$ADDR]=0
          continue
        fi
        bad[$ADDR]=$(( ${bad[$ADDR]:-0} + 1 ))
        log "DRIFT: $ADDR is bound here (keepalived MASTER) but the provider routes it to instance $H, not $CONTABO_INSTANCE_ID (${bad[$ADDR]}/$STRIKES)"
        if [ "${bad[$ADDR]}" -ge "$STRIKES" ]; then
          log "reassigning $ADDR -> instance $CONTABO_INSTANCE_ID"
          bash "$NOTIFY" MASTER "$ADDR"
          bad[$ADDR]=0
        fi
      done
      if [ "$MAX_CYCLES" -gt 0 ] && [ "$cycle" -ge "$MAX_CYCLES" ]; then exit 0; fi
      sleep "$INTERVAL"
    done
{{- end }}
