{{- /* ============= Node Configurator DaemonSet ======================== */ -}}
{{- /* Writes /etc/gai.conf on every cluster node to prefer IPv4 over IPv6 when
       both A and AAAA records exist for a host.  This fixes GHCR image pulls
       being TCP-reset mid-copy on Contabo's IPv6 CDN path (FuzeInfra#616).
       Disabled by default; enable via nodeConfigurator.preferIPv4.enabled. */ -}}
{{- if or .Values.nodeConfigurator.preferIPv4.enabled .Values.nodeConfigurator.multipathBlacklist.enabled .Values.nodeConfigurator.ioPriority.enabled .Values.nodeConfigurator.corednsHA.enabled }}
{{- if .Values.nodeConfigurator.preferIPv4.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fuzeinfra-gai-conf
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
data:
  gai.conf: |
    # Prefer IPv4 (::ffff:x.x.x.x mapped) over native IPv6 when both A and AAAA
    # records exist. Precedence 100 beats the RFC 6724 default of 40 for native
    # IPv6 (::1/128 = 50, 2000::/3 = 40) so getaddrinfo returns IPv4 first.
    # Applied cluster-wide to fix GHCR pulls TCP-reset over Contabo IPv6 CDN.
    # See: FuzeInfra#616, RFC 6724 §10.3.
    precedence ::ffff:0:0/96  100
{{- end }}
{{- if .Values.nodeConfigurator.multipathBlacklist.enabled }}
---
{{- /*
     THE ROOT CAUSE BEHIND THE LONGHORN "STUCK VOLUME" OUTAGES.

     multipathd claims Longhorn's block devices out from under the CSI driver. Longhorn
     reports this itself, as a node condition, on EVERY Longhorn node in prod:

       Multipathd=False MultipathdIsRunning
       multipathd is running with a known issue that affects Longhorn.
       See https://longhorn.io/kb/troubleshooting-volume-with-multipath

     It produces BOTH of the mount signatures that have taken services down:

       already mounted or mount point busy               (fuzeinfra-prometheus-0,
                                                          ContainerCreating for 9 days)
       ... is apparently in use by the system; will not   (mke2fs on the replacement
       make a filesystem here!                            volume, same outage)

     This matters far more since #814 made longhorn the DEFAULT StorageClass: every new
     PVC in the cluster is now exposed to it. Converting a StatefulSet to a Deployment
     with a fresh PVC (#773 for Loki, #816 for Prometheus) only sidesteps it when the new
     device wins the race against multipathd -- which is why Loki recovered and Prometheus
     did not. That is a coin flip, not a fix. This is the fix.

     GATED OFF BY DEFAULT (multipathBlacklist.enabled: false), so merging is a no-op.
     Before enabling fleet-wide a human should enable it and confirm on one node that

         multipath -t | grep -A2 blacklist

     shows the stanza and that the Longhorn node condition flips False -> True.

     The write is idempotent and non-destructive: it backs the original up ONCE to
     /etc/multipath.conf.pre-fuzeinfra and skips entirely if the marker is already
     present, so a node with a hand-tuned multipath.conf is never silently clobbered.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: fuzeinfra-multipath-conf
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
data:
  multipath.conf: |
    # Managed by FuzeInfra (multipath-blacklist v2: vendor/product)
    # Source: helm/fuzeinfra/templates/node-configurator.yaml. The parenthesised
    # version above is LOAD-BEARING: the init container greps for it verbatim to
    # decide whether a node is already up to date. Change the content and you MUST
    # bump the version in both places, or nodes silently keep the old file.
    # Keeps multipathd from grabbing Longhorn's /dev/sd* devices, which makes
    # MountVolume.MountDevice fail with "already mounted or mount point busy" and
    # mke2fs fail with "apparently in use by the system".
    # Source: https://longhorn.io/kb/troubleshooting-volume-with-multipath
    # Narrow by DEVICE IDENTITY, not by devnode. Measured on vmi3383846:
    #     sda  vendor=[QEMU] model=[QEMUHARDDISK]   <- the node ROOT disk
    #     sdb..sde vendor=[IET] model=[VIRTUAL-DISK] <- Longhorn iSCSI
    # The previous rule was devnode "^sd[a-z0-9]+", which also told multipathd
    # to ignore sda -- the host root disk -- on every node including the etcd
    # control plane. Matching vendor/product hits exactly Longhorn's devices
    # and leaves the root disk alone.
    blacklist {
        device {
            vendor "IET"
            product "VIRTUAL-DISK"
        }
    }
{{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fuzeinfra-node-configurator
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "fuzeinfra.selectorLabels" (dict "component" "node-configurator" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fuzeinfra.labels" . | nindent 8 }}
        {{- include "fuzeinfra.selectorLabels" (dict "component" "node-configurator" "root" $) | nindent 8 }}
      annotations:
        # Includes the rollout set: changing WHICH nodes are in it must restart the
        # DaemonSet, or the change reaches nothing.
        checksum/config: {{ printf "%v-%v-%v-%v-%v" .Values.nodeConfigurator.preferIPv4.enabled .Values.nodeConfigurator.multipathBlacklist.enabled (join "," .Values.nodeConfigurator.multipathBlacklist.rolloutNodes) .Values.nodeConfigurator.corednsHA.enabled .Values.nodeConfigurator.corednsHA.replicas | sha256sum }}
    spec:
      # hostPID lets the multipath init container nsenter PID 1 and restart multipathd
      # on the host. Harmless when that feature is gated off.
      hostPID: true
      tolerations:
        - operator: Exists
      initContainers:
        {{- if .Values.nodeConfigurator.ioPriority.enabled }}
        {{- /*
             WHY: etcd was being starved off the disk by pod I/O, and that -- not any
             apiserver bug -- is what took the cluster down on 2026-09-06. The symptom
             in the k3s journal is etcd, not kube:

               apply request took too long  took=100-312ms  expected-duration=100ms
               prefix="read-only range"

             When etcd cannot serve reads inside its budget the apiserver's own
             readiness fails and it stops accepting connections, which presents as
             "connection refused" from every client. Prometheus TSDB compaction, Loki
             chunk flushes and Longhorn replica traffic all share /dev/sda1 with the
             etcd datastore, and with no I/O controller they compete first-come,
             first-served against etcd's latency-critical fsync path.

             WHY iocost AND NOT plain IOWeight= ON THE UNIT. systemd's IOWeight= writes
             cgroup io.weight, which is INERT unless a controller honours it. These
             nodes run scheduler `none` (the Ubuntu default for flash) and have no BFQ
             module, so io.weight silently does nothing -- a fix that looks applied and
             is not. The kernel does ship CONFIG_BLK_CGROUP_IOCOST=y, so enabling
             iocost per-device makes io.weight real with no module install and no
             reboot. iocost is also the right choice over BFQ here because the disks
             are non-rotational (BFQ costs throughput on SSDs).

             k3s.service holds etcd; pod containers live under kubepods.slice, a
             sibling cgroup -- so weighting the two against each other is exactly the
             split we want. ctrl=auto lets the kernel derive the device cost model
             (measured on prod: ~488 MB/s read, ~8.5k random read IOPS).

             Idempotent: re-enabling an already-enabled device is skipped, and the
             weights are simply rewritten. Safe on a node where iocost is unavailable
             -- it logs and exits 0 rather than failing the DaemonSet.
        */}}
        - name: set-etcd-io-priority
          image: {{ .Values.nodeConfigurator.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              set -eu
              DEV_NAME='{{ .Values.nodeConfigurator.ioPriority.device }}'
              CG=/host-cgroup

              if [ ! -f "$CG/io.cost.qos" ]; then
                echo "iocost unavailable on this kernel (no io.cost.qos) - nothing to do"
                exit 0
              fi
              if [ ! -f "/host-sys/block/$DEV_NAME/dev" ]; then
                echo "block device $DEV_NAME not present on this node - skipping"
                exit 0
              fi
              DEV=$(cat "/host-sys/block/$DEV_NAME/dev")

              # Enable the controller for this device unless it already is.
              if grep -q "^$DEV enable=1" "$CG/io.cost.qos"; then
                echo "iocost already enabled for $DEV_NAME ($DEV)"
              else
                echo "$DEV enable=1 ctrl=auto" > "$CG/io.cost.qos"
                echo "iocost enabled for $DEV_NAME ($DEV)"
              fi

              # etcd (inside k3s.service) outranks every pod.
              if [ -f "$CG/system.slice/k3s.service/io.weight" ]; then
                echo '{{ .Values.nodeConfigurator.ioPriority.k3sWeight }}' > "$CG/system.slice/k3s.service/io.weight"
              else
                echo "k3s.service cgroup absent (agent-only node?) - skipping k3s weight"
              fi
              if [ -f "$CG/kubepods.slice/io.weight" ]; then
                echo '{{ .Values.nodeConfigurator.ioPriority.podsWeight }}' > "$CG/kubepods.slice/io.weight"
              fi
              echo "k3s=$(cat "$CG/system.slice/k3s.service/io.weight" 2>/dev/null || echo n/a) pods=$(cat "$CG/kubepods.slice/io.weight" 2>/dev/null || echo n/a)"
          volumeMounts:
            - name: host-sys
              mountPath: /host-sys
              readOnly: true
            - name: host-cgroup
              mountPath: /host-cgroup
        {{- end }}
        {{- if .Values.nodeConfigurator.corednsHA.enabled }}
        {{- /*
             CoreDNS HA (FuzeInfra 2026-09-23 outage). The two CI nodes lost
             flannel-WireGuard peering to the fuze-core-* control-plane nodes --
             the ONLY place CoreDNS's single replica ran -- so every CI pod lost
             ALL cluster DNS and ~300 jobs queued fleet-wide.

             The repo already had a fix attempt (argocd/cluster-bootstrap/
             coredns-ha.yaml, a HelmChartConfig with replicaCount:2) applied to
             the cluster since 2026-07-29 and COMPLETELY INERT the whole time:
             k3s does not deploy CoreDNS via Helm (`kubectl -n kube-system get
             helmchart` returns only traefik/traefik-crd). CoreDNS is a
             "packaged manifest" applied by the k3s deploy-controller from a
             static file, tracked as a k3s.cattle.io/v1 Addon named "coredns"
             (source /var/lib/rancher/k3s/server/manifests/coredns.yaml). A
             HelmChartConfig with no matching HelmChart CR silently does
             nothing -- Git claimed HA for ~2 months while prod ran replicas=1.
             That file is deleted; this is its replacement, using a mechanism
             that actually applies to a deploy-controller-managed component.

             HOW THIS SURVIVES RECONCILIATION. k3s honours a `<name>.yaml.skip`
             sentinel next to a packaged manifest: once present, the
             deploy-controller never re-applies that file's content again, but
             it does NOT delete or touch resources the file already created.
             So:
               1. touch coredns.yaml.skip -- stops k3s from ever reconciling
                  replicas back down to 1.
               2. write coredns-ha.yaml -- an independent manifest in the SAME
                  directory (any file there becomes its own k3s Addon)
                  containing ONLY a replacement Deployment named "coredns" in
                  namespace kube-system. Every other packaged resource
                  (ServiceAccount, RBAC, the "coredns" Corefile ConfigMap, the
                  "kube-dns" Service) is left exactly as the (now-skipped)
                  coredns.yaml created it -- minimising blast radius to just
                  the field that mattered, replica count + scheduling.
             Both files are (re)written on every DaemonSet pod (re)start, and
             the deploy-controller PATCHES the existing live Deployment object
             rather than deleting+recreating it, so there is never a window
             with zero CoreDNS pods, regardless of which file it processes
             first or how many times this runs.

             topologySpreadConstraints below (maxSkew:1, DoNotSchedule,
             topologyKey kubernetes.io/hostname) are cloned verbatim from the
             live packaged Deployment -- REQUIRED spread across nodes, not the
             PREFERRED podAntiAffinity the old inert file used (preferred
             spread does not guarantee a 2nd replica lands on a different node,
             which is exactly the guarantee this outage needed).

             coredns-custom-config-volume/the "coredns-custom" ConfigMap (see
             templates/coredns-split-horizon.yaml) is Corefile-only: k3s
             auto-imports it for rewrite rules, but it has no field for
             replica count or scheduling, so it cannot substitute for this.

             Runs on k3s SERVER nodes only: the init container checks for
             /host-k3s/server locally and exits 0 (no-op) on agent nodes (CI
             runners, elastics), which have no such directory.
        */}}
        - name: coredns-ha
          image: {{ .Values.nodeConfigurator.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              set -eu
              SRV=/host-k3s/server
              if [ ! -d "$SRV" ]; then
                echo "not a k3s server node (no $SRV) - skipping coredns HA override"
                exit 0
              fi
              MANIFESTS="$SRV/manifests"
              mkdir -p "$MANIFESTS"

              touch "$MANIFESTS/coredns.yaml.skip"

              cat > "$MANIFESTS/coredns-ha.yaml" <<EOF
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: coredns
                namespace: kube-system
                labels:
                  k8s-app: kube-dns
                  kubernetes.io/name: CoreDNS
              spec:
                replicas: {{ .Values.nodeConfigurator.corednsHA.replicas }}
                revisionHistoryLimit: 0
                selector:
                  matchLabels:
                    k8s-app: kube-dns
                strategy:
                  rollingUpdate:
                    maxSurge: 25%
                    maxUnavailable: 1
                  type: RollingUpdate
                template:
                  metadata:
                    labels:
                      k8s-app: kube-dns
                  spec:
                    containers:
                    - args:
                      - -conf
                      - /etc/coredns/Corefile
                      image: rancher/mirrored-coredns-coredns:1.14.4
                      imagePullPolicy: IfNotPresent
                      livenessProbe:
                        failureThreshold: 3
                        httpGet:
                          path: /health
                          port: 8080
                          scheme: HTTP
                        initialDelaySeconds: 60
                        periodSeconds: 10
                        successThreshold: 1
                        timeoutSeconds: 1
                      name: coredns
                      ports:
                      - containerPort: 53
                        name: dns
                        protocol: UDP
                      - containerPort: 53
                        name: dns-tcp
                        protocol: TCP
                      - containerPort: 9153
                        name: metrics
                        protocol: TCP
                      readinessProbe:
                        failureThreshold: 3
                        httpGet:
                          path: /ready
                          port: 8181
                          scheme: HTTP
                        periodSeconds: 2
                        successThreshold: 1
                        timeoutSeconds: 1
                      resources:
                        limits:
                          memory: 170Mi
                        requests:
                          cpu: 100m
                          memory: 70Mi
                      securityContext:
                        allowPrivilegeEscalation: false
                        capabilities:
                          add:
                          - NET_BIND_SERVICE
                          drop:
                          - all
                        readOnlyRootFilesystem: true
                      terminationMessagePath: /dev/termination-log
                      terminationMessagePolicy: File
                      volumeMounts:
                      - mountPath: /etc/coredns
                        name: config-volume
                        readOnly: true
                      - mountPath: /etc/coredns/custom
                        name: custom-config-volume
                        readOnly: true
                    dnsPolicy: Default
                    # Cluster DNS must live on the STABLE nodes. The tolerations below
                    # only PERMIT the control-plane/durable nodes; without this affinity
                    # nothing steers CoreDNS toward them, and on 2026-09-23 both replicas
                    # duly landed on autoscaled elastic nodes instead -- which the Contabo
                    # reaper releases on billing boundaries. Cluster DNS following the
                    # autoscaler around is not a trade worth making (the same warning the
                    # since-deleted argocd/cluster-bootstrap/coredns-ha.yaml carried).
                    #
                    # REQUIRED rather than preferred, deliberately: a soft preference is
                    # what we effectively had, and the scheduler ignored it under load.
                    # The two terms are OR'd -- control-plane nodes (fuze-core-*, the only
                    # label that reliably identifies them here; they carry no pool label)
                    # or any future explicitly-durable node. Safe as a hard constraint:
                    # there are 3 control-plane nodes for 2 replicas, so a single node
                    # drain still schedules, and if all 3 were gone the cluster has no
                    # etcd quorum and is down regardless.
                    affinity:
                      nodeAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          nodeSelectorTerms:
                          - matchExpressions:
                            - key: node-role.kubernetes.io/control-plane
                              operator: Exists
                          - matchExpressions:
                            - key: {{ .Values.global.durableNodeTaint.key }}
                              operator: In
                              values: ["{{ .Values.global.durableNodeTaint.value }}"]
                    nodeSelector:
                      kubernetes.io/os: linux
                    priorityClassName: system-cluster-critical
                    restartPolicy: Always
                    schedulerName: default-scheduler
                    serviceAccount: coredns
                    serviceAccountName: coredns
                    terminationGracePeriodSeconds: 30
                    tolerations:
                    - key: CriticalAddonsOnly
                      operator: Exists
                    - effect: NoSchedule
                      key: node-role.kubernetes.io/control-plane
                      operator: Exists
                    - effect: NoSchedule
                      key: {{ .Values.global.durableNodeTaint.key }}
                      operator: Equal
                      value: "{{ .Values.global.durableNodeTaint.value }}"
                    topologySpreadConstraints:
                    - labelSelector:
                        matchLabels:
                          k8s-app: kube-dns
                      maxSkew: 1
                      topologyKey: kubernetes.io/hostname
                      whenUnsatisfiable: DoNotSchedule
                    - labelSelector:
                        matchLabels:
                          k8s-app: kube-dns
                      maxSkew: 1
                      topologyKey: topology.kubernetes.io/zone
                      whenUnsatisfiable: ScheduleAnyway
                    volumes:
                    - configMap:
                        defaultMode: 420
                        items:
                        - key: Corefile
                          path: Corefile
                        - key: NodeHosts
                          path: NodeHosts
                        name: coredns
                      name: config-volume
                    - configMap:
                        defaultMode: 420
                        name: coredns-custom
                        optional: true
                      name: custom-config-volume
              EOF
              echo "coredns-ha.yaml written (replicas={{ .Values.nodeConfigurator.corednsHA.replicas }}) + coredns.yaml.skip present on $SRV"
          volumeMounts:
            - name: host-k3s
              mountPath: /host-k3s
        {{- end }}
        {{- if .Values.nodeConfigurator.preferIPv4.enabled }}
        - name: write-gai-conf
          image: {{ .Values.nodeConfigurator.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - cp /config/gai.conf /host-etc/gai.conf && echo "gai.conf written"
          volumeMounts:
            - name: host-etc
              mountPath: /host-etc
            - name: gai-conf
              mountPath: /config
              readOnly: true
        {{- end }}
        {{- if .Values.nodeConfigurator.multipathBlacklist.enabled }}
        - name: blacklist-longhorn-in-multipath
          image: {{ .Values.nodeConfigurator.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              set -eu
              # STAGED ROLLOUT. rolloutNodes empty => every node. Otherwise only the
              # named nodes are touched, so this can be proven on one non-control-plane
              # node before it goes near the node running etcd. The DaemonSet itself
              # stays fleet-wide so preferIPv4 is unaffected by the staging.
              ROLLOUT="{{ join "," .Values.nodeConfigurator.multipathBlacklist.rolloutNodes }}"
              if [ -n "$ROLLOUT" ]; then
                case ",$ROLLOUT," in
                  *",$NODE_NAME,"*) : ;;
                  *) echo "node $NODE_NAME not in multipath rollout set [$ROLLOUT]; skipping"; exit 0 ;;
                esac
              fi
              # VERSIONED marker. The old guard matched a bare "Managed by FuzeInfra",
              # so once ANY version was written the init container exited 0 forever and
              # a corrected blacklist could never reach a node that already had the old
              # one. vmi3383846 is in exactly that state today: it carries the broad
              # devnode rule, written and never revisited. Bump MARKER whenever the
              # ConfigMap content changes.
              MARKER='Managed by FuzeInfra (multipath-blacklist v2: vendor/product)'
              TARGET=/host-etc/multipath.conf
              if [ -f "$TARGET" ] && grep -q "$MARKER" "$TARGET"; then
                echo "multipath.conf already at $MARKER; nothing to do"
                exit 0
              fi
              if [ -f "$TARGET" ] && [ ! -f "$TARGET.pre-fuzeinfra" ]; then
                # Preserve whatever was there before, exactly once. A node that had a
                # real multipath.conf is a case for a human, not for silent clobbering.
                cp "$TARGET" "$TARGET.pre-fuzeinfra"
                echo "backed up existing multipath.conf -> multipath.conf.pre-fuzeinfra"
              fi
              cp /mp-config/multipath.conf "$TARGET"
              echo "multipath.conf written"
              # Restart the daemon in the HOST namespaces. If multipathd is absent or
              # inactive there is nothing to fix on this node, so do not fail the
              # DaemonSet over it -- the config is staged for whenever it does run.
              if nsenter -t 1 -m -u -i -n -p -- systemctl is-active --quiet multipathd; then
                nsenter -t 1 -m -u -i -n -p -- systemctl restart multipathd
                echo "multipathd restarted"
              else
                echo "multipathd not active on this node; config staged only"
              fi
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: host-etc
              mountPath: /host-etc
            - name: multipath-conf
              mountPath: /mp-config
              readOnly: true
        {{- end }}
      containers:
        - name: pause
          image: {{ .Values.nodeConfigurator.image }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 10m
              memory: 8Mi
      volumes:
        - name: host-etc
          hostPath:
            path: /etc
        {{- if .Values.nodeConfigurator.corednsHA.enabled }}
        {{- /* /var/lib/rancher/k3s exists on EVERY node (server and agent) --
               only server nodes have a "server" subdirectory under it, which is
               what the init container tests for before writing anything. Type
               Directory (not the empty-string default) so a node missing this
               path entirely fails loudly instead of kubelet silently creating
               an empty one. */}}
        - name: host-k3s
          hostPath:
            path: /var/lib/rancher/k3s
            type: Directory
        {{- end }}
        {{- if .Values.nodeConfigurator.preferIPv4.enabled }}
        - name: gai-conf
          configMap:
            name: fuzeinfra-gai-conf
        {{- end }}
        {{- if .Values.nodeConfigurator.multipathBlacklist.enabled }}
        - name: multipath-conf
          configMap:
            name: fuzeinfra-multipath-conf
        {{- end }}
        {{- if .Values.nodeConfigurator.ioPriority.enabled }}
        - name: host-sys
          hostPath:
            path: /sys
        {{- /* cgroup2 is its own mount, so /sys alone does not expose it. */}}
        - name: host-cgroup
          hostPath:
            path: /sys/fs/cgroup
        {{- end }}
{{- end }}
