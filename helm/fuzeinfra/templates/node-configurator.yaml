{{- /* ============= Node Configurator DaemonSet ======================== */ -}}
{{- /* Writes /etc/gai.conf on every cluster node to prefer IPv4 over IPv6 when
       both A and AAAA records exist for a host.  This fixes GHCR image pulls
       being TCP-reset mid-copy on Contabo's IPv6 CDN path (FuzeInfra#616).
       Disabled by default; enable via nodeConfigurator.preferIPv4.enabled. */ -}}
{{- if or .Values.nodeConfigurator.preferIPv4.enabled .Values.nodeConfigurator.multipathBlacklist.enabled .Values.nodeConfigurator.ioPriority.enabled }}
{{- if .Values.nodeConfigurator.preferIPv4.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fuzeinfra-gai-conf
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
data:
  gai.conf: |
    # Prefer IPv4 (::ffff:x.x.x.x mapped) over native IPv6 when both A and AAAA
    # records exist. Precedence 100 beats the RFC 6724 default of 40 for native
    # IPv6 (::1/128 = 50, 2000::/3 = 40) so getaddrinfo returns IPv4 first.
    # Applied cluster-wide to fix GHCR pulls TCP-reset over Contabo IPv6 CDN.
    # See: FuzeInfra#616, RFC 6724 §10.3.
    precedence ::ffff:0:0/96  100
{{- end }}
{{- if .Values.nodeConfigurator.multipathBlacklist.enabled }}
---
{{- /*
     THE ROOT CAUSE BEHIND THE LONGHORN "STUCK VOLUME" OUTAGES.

     multipathd claims Longhorn's block devices out from under the CSI driver. Longhorn
     reports this itself, as a node condition, on EVERY Longhorn node in prod:

       Multipathd=False MultipathdIsRunning
       multipathd is running with a known issue that affects Longhorn.
       See https://longhorn.io/kb/troubleshooting-volume-with-multipath

     It produces BOTH of the mount signatures that have taken services down:

       already mounted or mount point busy               (fuzeinfra-prometheus-0,
                                                          ContainerCreating for 9 days)
       ... is apparently in use by the system; will not   (mke2fs on the replacement
       make a filesystem here!                            volume, same outage)

     This matters far more since #814 made longhorn the DEFAULT StorageClass: every new
     PVC in the cluster is now exposed to it. Converting a StatefulSet to a Deployment
     with a fresh PVC (#773 for Loki, #816 for Prometheus) only sidesteps it when the new
     device wins the race against multipathd -- which is why Loki recovered and Prometheus
     did not. That is a coin flip, not a fix. This is the fix.

     GATED OFF BY DEFAULT (multipathBlacklist.enabled: false), so merging is a no-op.
     Before enabling fleet-wide a human should enable it and confirm on one node that

         multipath -t | grep -A2 blacklist

     shows the stanza and that the Longhorn node condition flips False -> True.

     The write is idempotent and non-destructive: it backs the original up ONCE to
     /etc/multipath.conf.pre-fuzeinfra and skips entirely if the marker is already
     present, so a node with a hand-tuned multipath.conf is never silently clobbered.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: fuzeinfra-multipath-conf
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
data:
  multipath.conf: |
    # Managed by FuzeInfra (multipath-blacklist v2: vendor/product)
    # Source: helm/fuzeinfra/templates/node-configurator.yaml. The parenthesised
    # version above is LOAD-BEARING: the init container greps for it verbatim to
    # decide whether a node is already up to date. Change the content and you MUST
    # bump the version in both places, or nodes silently keep the old file.
    # Keeps multipathd from grabbing Longhorn's /dev/sd* devices, which makes
    # MountVolume.MountDevice fail with "already mounted or mount point busy" and
    # mke2fs fail with "apparently in use by the system".
    # Source: https://longhorn.io/kb/troubleshooting-volume-with-multipath
    # Narrow by DEVICE IDENTITY, not by devnode. Measured on vmi3383846:
    #     sda  vendor=[QEMU] model=[QEMUHARDDISK]   <- the node ROOT disk
    #     sdb..sde vendor=[IET] model=[VIRTUAL-DISK] <- Longhorn iSCSI
    # The previous rule was devnode "^sd[a-z0-9]+", which also told multipathd
    # to ignore sda -- the host root disk -- on every node including the etcd
    # control plane. Matching vendor/product hits exactly Longhorn's devices
    # and leaves the root disk alone.
    blacklist {
        device {
            vendor "IET"
            product "VIRTUAL-DISK"
        }
    }
{{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fuzeinfra-node-configurator
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "fuzeinfra.selectorLabels" (dict "component" "node-configurator" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fuzeinfra.labels" . | nindent 8 }}
        {{- include "fuzeinfra.selectorLabels" (dict "component" "node-configurator" "root" $) | nindent 8 }}
      annotations:
        # Includes the rollout set: changing WHICH nodes are in it must restart the
        # DaemonSet, or the change reaches nothing.
        checksum/config: {{ printf "%v-%v-%v" .Values.nodeConfigurator.preferIPv4.enabled .Values.nodeConfigurator.multipathBlacklist.enabled (join "," .Values.nodeConfigurator.multipathBlacklist.rolloutNodes) | sha256sum }}
    spec:
      # hostPID lets the multipath init container nsenter PID 1 and restart multipathd
      # on the host. Harmless when that feature is gated off.
      hostPID: true
      tolerations:
        - operator: Exists
      initContainers:
        {{- if .Values.nodeConfigurator.ioPriority.enabled }}
        {{- /*
             WHY: etcd was being starved off the disk by pod I/O, and that -- not any
             apiserver bug -- is what took the cluster down on 2026-09-06. The symptom
             in the k3s journal is etcd, not kube:

               apply request took too long  took=100-312ms  expected-duration=100ms
               prefix="read-only range"

             When etcd cannot serve reads inside its budget the apiserver's own
             readiness fails and it stops accepting connections, which presents as
             "connection refused" from every client. Prometheus TSDB compaction, Loki
             chunk flushes and Longhorn replica traffic all share /dev/sda1 with the
             etcd datastore, and with no I/O controller they compete first-come,
             first-served against etcd's latency-critical fsync path.

             WHY iocost AND NOT plain IOWeight= ON THE UNIT. systemd's IOWeight= writes
             cgroup io.weight, which is INERT unless a controller honours it. These
             nodes run scheduler `none` (the Ubuntu default for flash) and have no BFQ
             module, so io.weight silently does nothing -- a fix that looks applied and
             is not. The kernel does ship CONFIG_BLK_CGROUP_IOCOST=y, so enabling
             iocost per-device makes io.weight real with no module install and no
             reboot. iocost is also the right choice over BFQ here because the disks
             are non-rotational (BFQ costs throughput on SSDs).

             k3s.service holds etcd; pod containers live under kubepods.slice, a
             sibling cgroup -- so weighting the two against each other is exactly the
             split we want. ctrl=auto lets the kernel derive the device cost model
             (measured on prod: ~488 MB/s read, ~8.5k random read IOPS).

             Idempotent: re-enabling an already-enabled device is skipped, and the
             weights are simply rewritten. Safe on a node where iocost is unavailable
             -- it logs and exits 0 rather than failing the DaemonSet.
        */}}
        - name: set-etcd-io-priority
          image: {{ .Values.nodeConfigurator.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              set -eu
              DEV_NAME='{{ .Values.nodeConfigurator.ioPriority.device }}'
              CG=/host-cgroup

              if [ ! -f "$CG/io.cost.qos" ]; then
                echo "iocost unavailable on this kernel (no io.cost.qos) - nothing to do"
                exit 0
              fi
              if [ ! -f "/host-sys/block/$DEV_NAME/dev" ]; then
                echo "block device $DEV_NAME not present on this node - skipping"
                exit 0
              fi
              DEV=$(cat "/host-sys/block/$DEV_NAME/dev")

              # Enable the controller for this device unless it already is.
              if grep -q "^$DEV enable=1" "$CG/io.cost.qos"; then
                echo "iocost already enabled for $DEV_NAME ($DEV)"
              else
                echo "$DEV enable=1 ctrl=auto" > "$CG/io.cost.qos"
                echo "iocost enabled for $DEV_NAME ($DEV)"
              fi

              # etcd (inside k3s.service) outranks every pod.
              if [ -f "$CG/system.slice/k3s.service/io.weight" ]; then
                echo '{{ .Values.nodeConfigurator.ioPriority.k3sWeight }}' > "$CG/system.slice/k3s.service/io.weight"
              else
                echo "k3s.service cgroup absent (agent-only node?) - skipping k3s weight"
              fi
              if [ -f "$CG/kubepods.slice/io.weight" ]; then
                echo '{{ .Values.nodeConfigurator.ioPriority.podsWeight }}' > "$CG/kubepods.slice/io.weight"
              fi
              echo "k3s=$(cat "$CG/system.slice/k3s.service/io.weight" 2>/dev/null || echo n/a) pods=$(cat "$CG/kubepods.slice/io.weight" 2>/dev/null || echo n/a)"
          volumeMounts:
            - name: host-sys
              mountPath: /host-sys
              readOnly: true
            - name: host-cgroup
              mountPath: /host-cgroup
        {{- end }}
        {{- if .Values.nodeConfigurator.preferIPv4.enabled }}
        - name: write-gai-conf
          image: {{ .Values.nodeConfigurator.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - cp /config/gai.conf /host-etc/gai.conf && echo "gai.conf written"
          volumeMounts:
            - name: host-etc
              mountPath: /host-etc
            - name: gai-conf
              mountPath: /config
              readOnly: true
        {{- end }}
        {{- if .Values.nodeConfigurator.multipathBlacklist.enabled }}
        - name: blacklist-longhorn-in-multipath
          image: {{ .Values.nodeConfigurator.image }}
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              set -eu
              # STAGED ROLLOUT. rolloutNodes empty => every node. Otherwise only the
              # named nodes are touched, so this can be proven on one non-control-plane
              # node before it goes near the node running etcd. The DaemonSet itself
              # stays fleet-wide so preferIPv4 is unaffected by the staging.
              ROLLOUT="{{ join "," .Values.nodeConfigurator.multipathBlacklist.rolloutNodes }}"
              if [ -n "$ROLLOUT" ]; then
                case ",$ROLLOUT," in
                  *",$NODE_NAME,"*) : ;;
                  *) echo "node $NODE_NAME not in multipath rollout set [$ROLLOUT]; skipping"; exit 0 ;;
                esac
              fi
              # VERSIONED marker. The old guard matched a bare "Managed by FuzeInfra",
              # so once ANY version was written the init container exited 0 forever and
              # a corrected blacklist could never reach a node that already had the old
              # one. vmi3383846 is in exactly that state today: it carries the broad
              # devnode rule, written and never revisited. Bump MARKER whenever the
              # ConfigMap content changes.
              MARKER='Managed by FuzeInfra (multipath-blacklist v2: vendor/product)'
              TARGET=/host-etc/multipath.conf
              if [ -f "$TARGET" ] && grep -q "$MARKER" "$TARGET"; then
                echo "multipath.conf already at $MARKER; nothing to do"
                exit 0
              fi
              if [ -f "$TARGET" ] && [ ! -f "$TARGET.pre-fuzeinfra" ]; then
                # Preserve whatever was there before, exactly once. A node that had a
                # real multipath.conf is a case for a human, not for silent clobbering.
                cp "$TARGET" "$TARGET.pre-fuzeinfra"
                echo "backed up existing multipath.conf -> multipath.conf.pre-fuzeinfra"
              fi
              cp /mp-config/multipath.conf "$TARGET"
              echo "multipath.conf written"
              # Restart the daemon in the HOST namespaces. If multipathd is absent or
              # inactive there is nothing to fix on this node, so do not fail the
              # DaemonSet over it -- the config is staged for whenever it does run.
              if nsenter -t 1 -m -u -i -n -p -- systemctl is-active --quiet multipathd; then
                nsenter -t 1 -m -u -i -n -p -- systemctl restart multipathd
                echo "multipathd restarted"
              else
                echo "multipathd not active on this node; config staged only"
              fi
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: host-etc
              mountPath: /host-etc
            - name: multipath-conf
              mountPath: /mp-config
              readOnly: true
        {{- end }}
      containers:
        - name: pause
          image: {{ .Values.nodeConfigurator.image }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 10m
              memory: 8Mi
      volumes:
        - name: host-etc
          hostPath:
            path: /etc
        {{- if .Values.nodeConfigurator.preferIPv4.enabled }}
        - name: gai-conf
          configMap:
            name: fuzeinfra-gai-conf
        {{- end }}
        {{- if .Values.nodeConfigurator.multipathBlacklist.enabled }}
        - name: multipath-conf
          configMap:
            name: fuzeinfra-multipath-conf
        {{- end }}
        {{- if .Values.nodeConfigurator.ioPriority.enabled }}
        - name: host-sys
          hostPath:
            path: /sys
        {{- /* cgroup2 is its own mount, so /sys alone does not expose it. */}}
        - name: host-cgroup
          hostPath:
            path: /sys/fs/cgroup
        {{- end }}
{{- end }}
