{{- /* ========== API active-active VIP keepalived DaemonSet ============ */ -}}
{{- /*
     ACTIVE-ACTIVE-ACTIVE HA + LOAD BALANCING FOR THE EXTERNAL k3s API ENDPOINT
     (docs/runbooks/api-floating-vip.md).

     THE MODEL. Each durable control plane owns its OWN Contabo additional IP (a
     VIP). In steady state every node holds its own VIP and answers the API on it;
     api.<domain> round-robins A records across all the VIPs (Terraform,
     api-floating-vip.tf) so external kubectl / CD / consumers load-balance across
     all live nodes. keepalived runs ONE vrrp_instance PER VIP on every node: the
     owning node is MASTER for its VIP (base priority + ownVipBoost), the others are
     BACKUP. If a node dies, the highest-priority surviving BACKUP takes over its
     VIP — notify_master reassigns that IP to the survivor via the Contabo VIP API
     (VERIFIED live 2026-09-22, run 35718868309) and keepalived binds it locally —
     so the dead node's round-robin A record now resolves to a live node instead of
     a black hole. HA (failover) + LB (round-robin) at once, using every IP.

     PRIORITY ORDER IS LOAD-BEARING. scripts/label-durable-nodes.sh designates the
     monitoring node (fuzeinfra.io/role=monitoring = fuze-core-2 / vmi3396106) the
     LOWEST base priority, so it is the LAST to adopt a peer's VIP — the node doing
     bulk Prometheus/Loki disk I/O never becomes the busiest API server. Keep the
     apiVip.nodes basePriority order consistent with that script.

     VRRP travels UNICAST over the PRIVATE VLAN (public IPs are not a shared L2
     segment). GATED OFF by default (apiVip.enabled: false) — renders nothing.
*/ -}}
{{- if .Values.apiVip.enabled }}
{{- $vip := .Values.apiVip }}
{{- if not $vip.vips }}{{ fail "apiVip.enabled is true but apiVip.vips is empty" }}{{- end }}
{{- if not $vip.nodes }}{{ fail "apiVip.enabled is true but apiVip.nodes is empty" }}{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fuzeinfra-api-vip-keepalived
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
data:
  # Per-node table (basePriority: monitoring node lowest) and per-VIP table
  # (address + the node that primarily holds it). The entrypoint selects THIS
  # node's row by NODE_NAME and builds one vrrp_instance per VIP.
  nodes.json: |
    {{ toJson $vip.nodes }}
  vips.json: |
    {{ toJson $vip.vips }}
  check-apiserver.sh: |
    #!/bin/sh
    exec curl -sk --max-time 2 -o /dev/null -w '%{http_code}' \
      "https://127.0.0.1:{{ $vip.healthCheck.port }}{{ $vip.healthCheck.path }}" | grep -q '^200$'
  notify.sh: |
    #!/usr/bin/env bash
    # keepalived per-VIP hook: `notify.sh MASTER <vip>`. On MASTER, reassign THAT
    # vip to this node's instance via the Contabo VIP API so the provider routes it
    # here (keepalived has already bound it locally). Mechanics VERIFIED live
    # 2026-09-22 (run 35718868309):
    #   holder = GET /v1/vips/{ip} -> .data[0].resourceId (top-level, not assignments[])
    #   PATH resourceType is PLURAL "instances" (API rejects "instance")
    #   assign POST needs a body: -d '{}' (else 400 "Body cannot be empty")
    #   reassign = unassign(old) DELETE -> assign(self) POST
    set -uo pipefail
    STATE="${1:-}" ; VIP="${2:-}"
    log() { echo "[api-vip notify] $(date -u +%FT%TZ) vip=$VIP $*"; }
    [ "$STATE" = "MASTER" ] || { log "state=$STATE -> no reassignment"; exit 0; }
    [ -n "$VIP" ] || { log "ERROR: no VIP arg"; exit 1; }
    : "${CONTABO_INSTANCE_ID:?}" "${CONTABO_CLIENT_ID:?}" "${CONTABO_CLIENT_SECRET:?}"
    : "${CONTABO_API_USER:?}" "${CONTABO_API_PASSWORD:?}"
    RTYPE="${CONTABO_RESOURCE_TYPE:-instances}"
    API="https://api.contabo.com" ; VIPBASE="$API/v1/vips/$VIP"
    rid() { cat /proc/sys/kernel/random/uuid; }
    TOK=$(curl -sS -X POST -H "Content-Type: application/x-www-form-urlencoded" \
      "https://auth.contabo.com/auth/realms/contabo/protocol/openid-connect/token" \
      --data-urlencode "client_id=${CONTABO_CLIENT_ID}" \
      --data-urlencode "client_secret=${CONTABO_CLIENT_SECRET}" \
      --data-urlencode "username=${CONTABO_API_USER}" \
      --data-urlencode "password=${CONTABO_API_PASSWORD}" \
      --data-urlencode "grant_type=password" | jq -r .access_token)
    [ -n "$TOK" ] && [ "$TOK" != "null" ] || { log "ERROR: no Contabo token"; exit 1; }
    CUR=$(curl -sS -H "Authorization: Bearer $TOK" -H "x-request-id: $(rid)" "$VIPBASE" \
           | jq -r '.data[0].resourceId // empty' 2>/dev/null)
    if [ "$CUR" = "$CONTABO_INSTANCE_ID" ]; then log "already on $CONTABO_INSTANCE_ID"; exit 0; fi
    if [ -n "$CUR" ]; then
      DC=$(curl -sS -o /tmp/vip.out -w '%{http_code}' -X DELETE \
        -H "Authorization: Bearer $TOK" -H "x-request-id: $(rid)" "$VIPBASE/$RTYPE/$CUR")
      log "unassign from $CUR -> HTTP $DC"; sleep 2
    fi
    CODE=$(curl -sS -o /tmp/vip.out -w '%{http_code}' -X POST \
      -H "Authorization: Bearer $TOK" -H "x-request-id: $(rid)" \
      -H "Content-Type: application/json" -d '{}' "$VIPBASE/$RTYPE/$CONTABO_INSTANCE_ID")
    if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]; then
      log "assigned -> $CONTABO_INSTANCE_ID (HTTP $CODE)"
    else
      # keepalived already bound it locally; a provider failure should page, not flap.
      log "WARN: assign HTTP $CODE: $(cat /tmp/vip.out)"
    fi
    exit 0
  render.sh: |
    #!/usr/bin/env bash
    # Build keepalived.conf for THIS node: global header + one vrrp_instance per VIP.
    set -eu
    cp /cfg/notify.sh /etc/keepalived/notify.sh
    cp /cfg/check-apiserver.sh /etc/keepalived/check-apiserver.sh
    chmod 0700 /etc/keepalived/notify.sh /etc/keepalived/check-apiserver.sh
    ROW=$(jq -c --arg n "$NODE_NAME" '.[]|select(.name==$n)' /cfg/nodes.json)
    if [ -z "$ROW" ]; then echo "node $NODE_NAME not in apiVip.nodes; idling"; exec sleep infinity; fi
    BASE=$(echo "$ROW" | jq -r '.basePriority')
    THIS_PEER=$(echo "$ROW" | jq -r '.peerIp')
    export CONTABO_INSTANCE_ID=$(echo "$ROW" | jq -r '.instanceId')
    PEERS=$(jq -r --arg n "$NODE_NAME" '.[]|select(.name!=$n)|"        "+.peerIp' /cfg/nodes.json)
    CONF=/etc/keepalived/keepalived.conf
    cat > "$CONF" <<EOF
    global_defs {
        enable_script_security
        script_user root
        router_id $NODE_NAME
    }
    vrrp_script chk_apiserver {
        script "/etc/keepalived/check-apiserver.sh"
        interval 2
        timeout 3
        rise 2
        fall 2
        weight -60
    }
    EOF
    i=0
    while read -r VIPROW; do
      [ -n "$VIPROW" ] || continue
      ADDR=$(echo "$VIPROW" | jq -r '.address')
      PRIMARY=$(echo "$VIPROW" | jq -r '.primaryNode')
      RID=$(echo "$VIPROW" | jq -r '.routerId')
      PRIO=$BASE
      [ "$PRIMARY" = "$NODE_NAME" ] && PRIO=$((BASE + {{ $vip.vrrp.ownVipBoost | default 100 }}))
      {
        echo "vrrp_instance API_VIP_$i {"
        echo "    state BACKUP"
        echo "    nopreempt"
        echo "    interface {{ $vip.vrrp.interface }}"
        echo "    virtual_router_id $RID"
        echo "    priority $PRIO"
        echo "    advert_int 1"
        echo "    unicast_src_ip $THIS_PEER"
        echo "    unicast_peer {"
        echo "$PEERS"
        echo "    }"
        echo "    authentication { auth_type PASS auth_pass $KEEPALIVED_AUTH_PASS }"
        echo "    virtual_ipaddress { $ADDR/32 dev {{ $vip.interface }} }"
        echo "    track_script { chk_apiserver }"
        echo "    notify_master \"/etc/keepalived/notify.sh MASTER $ADDR\""
        echo "    notify_backup \"/etc/keepalived/notify.sh BACKUP $ADDR\""
        echo "    notify_fault  \"/etc/keepalived/notify.sh FAULT $ADDR\""
        echo "}"
      } >> "$CONF"
      i=$((i+1))
    done < <(jq -c '.[]' /cfg/vips.json)
    echo "== rendered keepalived.conf ($i VIP instances; secrets elided) =="
    sed 's/auth_pass .*/auth_pass ****/' "$CONF"
    exec keepalived -n -l -f "$CONF" --dont-fork
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fuzeinfra-api-vip-keepalived
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "fuzeinfra.selectorLabels" (dict "component" "api-vip-keepalived" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fuzeinfra.labels" . | nindent 8 }}
        {{- include "fuzeinfra.selectorLabels" (dict "component" "api-vip-keepalived" "root" $) | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%v-%v-%v" (toJson $vip.vips) (toJson $vip.nodes) $vip.authPass | sha256sum }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - operator: Exists
      containers:
        - name: keepalived
          image: {{ $vip.keepalived.image | quote }}
          imagePullPolicy: {{ $vip.keepalived.imagePullPolicy | default "IfNotPresent" }}
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN", "NET_BROADCAST", "NET_RAW"]
          command: ["/bin/sh", "-c", "exec /cfg/render.sh"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KEEPALIVED_AUTH_PASS
              {{- if $vip.authPassSecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $vip.authPassSecret.name }}
                  key: {{ $vip.authPassSecret.key }}
              {{- else }}
              value: {{ $vip.authPass | quote }}
              {{- end }}
            - name: CONTABO_CLIENT_ID
              valueFrom:
                secretKeyRef: {name: {{ $vip.contabo.secretName | quote }}, key: {{ $vip.contabo.keys.clientId | quote }}}
            - name: CONTABO_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ $vip.contabo.secretName | quote }}, key: {{ $vip.contabo.keys.clientSecret | quote }}}
            - name: CONTABO_API_USER
              valueFrom:
                secretKeyRef: {name: {{ $vip.contabo.secretName | quote }}, key: {{ $vip.contabo.keys.apiUser | quote }}}
            - name: CONTABO_API_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $vip.contabo.secretName | quote }}, key: {{ $vip.contabo.keys.apiPassword | quote }}}
            {{- if $vip.contabo.resourceType }}
            - name: CONTABO_RESOURCE_TYPE
              value: {{ $vip.contabo.resourceType | quote }}
            {{- end }}
          volumeMounts:
            - name: cfg
              mountPath: /cfg
              readOnly: true
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: cfg
          configMap:
            name: fuzeinfra-api-vip-keepalived
            defaultMode: 0755
{{- end }}
