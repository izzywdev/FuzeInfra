{{- /*
Per-consumer dedicated Neo4j StatefulSets (Community edition).

Community edition supports exactly one database and no RBAC/multi-tenant
isolation. Each consuming product that needs Neo4j gets its own instance:
its own StatefulSet, Service, PVC, and credentials.

Consumer bolt address: bolt://fuzeinfra-neo4j-<name>.fuzeinfra.svc.cluster.local:7687
Provisioned via: serviceNeo4jInstances[] in values.yaml / values-contabo.yaml

Do NOT set enabled:true without first sealing the password secret into the
fuzeinfra namespace — the pod will fail to start if the Secret is absent.
See docs/CONSUMER_ONBOARDING_SHARED_CLUSTER.md §Neo4j.
*/ -}}
{{- range .Values.serviceNeo4jInstances }}
{{- if .enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: fuzeinfra-neo4j-{{ .name }}
  labels:
    {{- include "fuzeinfra.labels" $ | nindent 4 }}
    app.kubernetes.io/component: neo4j-{{ .name }}
spec:
  selector:
    app.kubernetes.io/component: neo4j-{{ .name }}
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fuzeinfra-neo4j-{{ .name }}
  labels:
    {{- include "fuzeinfra.labels" $ | nindent 4 }}
spec:
  serviceName: fuzeinfra-neo4j-{{ .name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: neo4j-{{ .name }}
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        {{- include "fuzeinfra.labels" $ | nindent 8 }}
        app.kubernetes.io/component: neo4j-{{ .name }}
    spec:
      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "fuzeinfra.dbSpread" $ | nindent 6 }}
      containers:
        - name: neo4j
          image: {{ $.Values.neo4j.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" $ }}
          env:
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .passwordSecret.name }}
                  key: {{ .passwordSecret.key }}
            - name: NEO4J_AUTH
              value: "neo4j/$(NEO4J_PASSWORD)"
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
            - name: NEO4J_server_threads_worker__count
              value: "64"
          ports:
            - containerPort: 7474
              name: http
            - containerPort: 7687
              name: bolt
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
          readinessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
          resources:
            {{- toYaml .resources | nindent 12 }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "fuzeinfra.storageClass" $ | nindent 8 }}
        resources:
          requests:
            storage: {{ .storage }}
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: logs
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "fuzeinfra.storageClass" $ | nindent 8 }}
        resources:
          requests:
            storage: 1Gi
{{- end }}
{{- end }}
