{{- /* ===================== RBAC for Prometheus & Promtail SD ===================== */ -}}
{{- if or .Values.prometheus.enabled .Values.promtail.enabled (and .Values.grafana.enabled .Values.grafana.dashboardSidecar.enabled) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fuzeinfra-monitoring
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-fuzeinfra-monitoring
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics", "nodes/stats", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    # list/watch across namespaces is required by the Grafana dashboard and
    # Prometheus rule discovery sidecars (kiwigrid/k8s-sidecar).
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-fuzeinfra-monitoring
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-fuzeinfra-monitoring
subjects:
  - kind: ServiceAccount
    name: fuzeinfra-monitoring
    namespace: {{ .Release.Namespace }}
{{- end }}

{{- /* ===================== Prometheus ===================== */ -}}
{{- if .Values.prometheus.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: fuzeinfra-prometheus
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
    {{- include "fuzeinfra.selectorLabels" (dict "component" "prometheus" "root" $) | nindent 4 }}
spec:
  selector:
    {{- include "fuzeinfra.selectorLabels" (dict "component" "prometheus" "root" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.prometheus.port }}
      targetPort: 9090
---
{{- /*
     Prometheus' TSDB volume is a STANDALONE PersistentVolumeClaim, deliberately NOT a
     StatefulSet volumeClaimTemplate. This mirrors the Loki conversion (#773), for the
     same two reasons plus one that was specific to this outage.

     WHY NOT A StatefulSet:
       1. Nothing here needs one. `replicas` is 1, the volume is ReadWriteOnce, the
          Service is a plain ClusterIP (the `serviceName` headless governance was never
          used), and single-binary Prometheus has no peers, no ordinals and no stable
          network identity requirement. A StatefulSet bought this workload nothing.
       2. A StatefulSet's .spec.volumeClaimTemplates is immutable, AND this chart's Argo
          Application hides that field from the sync entirely (ignoreDifferences +
          RespectIgnoreDifferences, argocd/applications/fuzeinfra-prod.yaml). That made
          `prometheus.storage` INERT — exactly as it had made `loki.storage` inert. A
          standalone PVC's spec.resources.requests.storage IS mutable (the `longhorn`
          class sets allowVolumeExpansion: true), so `prometheus.storage` below is now
          the real, enforced size: change it in Git, Argo applies it, Longhorn expands.

     That STS ignoreDifferences rule is NOT Prometheus-specific — it is keyed on
     `kind: StatefulSet` with no name, and postgres/mongodb/neo4j/kafka/elasticsearch/
     redis/rabbitmq/chromadb/alertmanager all depend on it to protect real data
     (2026-07-24 incident, in which Neo4j was LOST). It is left exactly as-is;
     Prometheus simply stops being a StatefulSet and therefore stops being in its scope.

     MIGRATION (2026-09-01) — WHY A FRESH VOLUME, NOT AN ADOPTION:
     `fuzeinfra-prometheus-0` sat in ContainerCreating for NINE DAYS. The Longhorn
     volume behind `data-fuzeinfra-prometheus-0` was itself healthy the whole time
     (state=attached, robustness=healthy, 3 running replicas) — the failure was one
     level down, a stale kernel mount on the attach node that pinned the block device:

       MountVolume.MountDevice failed for volume "pvc-b9657c07-9224-4a82-bf9a-9dc28c8e543a":
       rpc error: code = Internal desc = mount failed: exit status 32
       mount: .../globalmount: /dev/longhorn/pvc-b9657c07-9224-4a82-bf9a-9dc28c8e543a
       already mounted or mount point busy.      (x4458 over 6d7h)

     A leaked mount is a property of THAT device on THAT node, so it cannot be fixed
     from inside the chart and it does not clear on its own. For Loki, force-detaching
     the volume, restarting the CSI plugin and deleting the pod all failed; declaring a
     new claim — a different Longhorn volume, therefore a different device with no
     leaked mount — is what actually worked, and that pod has run since with 0 restarts.

     The cost is bounded and was worth paying: retention is 15d and the TSDB had already
     been frozen for 9 of those days, so most of what the old volume holds has aged out
     anyway, and the alternative is leaving the ENTIRE monitoring layer dark — with
     Prometheus down there are no endpoints, so every rule in helm/fuzeinfra/rules/ is
     inert, PVCFillingUp included.

     Declaring a fresh PVC also means Git and the cluster can never disagree on a PVC's
     IMMUTABLE fields (storageClassName, accessModes) — Argo creates it from exactly this
     spec, whereas adopting a live claim whose spec differs would wedge the sync
     permanently. The old claim is NOT deleted by this chart and must not be
     auto-deleted: `data-fuzeinfra-prometheus-0` stays Bound (the `longhorn` class is
     reclaimPolicy: Retain) so a human can mount it read-only to recover history, and
     remove it plus its Longhorn volume once the new one is confirmed healthy.

     Deletion protection: `helm.sh/resource-policy: keep` stops a Helm uninstall from
     removing this claim, and Argo's `Prune=false` stops an Argo prune from removing it.
     A chart change can disable Prometheus without destroying its volume. Shrinking
     `storage` is rejected by the API server (expansion only) — that is intended.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fuzeinfra-prometheus-data
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
    {{- include "fuzeinfra.selectorLabels" (dict "component" "prometheus" "root" $) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: ["ReadWriteOnce"]
  {{- include "fuzeinfra.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.prometheus.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuzeinfra-prometheus
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate, NOT RollingUpdate. LOAD-BEARING: the TSDB volume is ReadWriteOnce, so a
  # rolling update deadlocks — the new pod cannot mount the claim while the old pod
  # still holds it, the old pod is never terminated because the new one never becomes
  # Ready, and the rollout hangs until it is manually unstuck. Recreate tears the old
  # pod down first. The cost is a short scrape gap on every restart, which is the
  # correct trade for a single-replica Prometheus that already had exactly one pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "fuzeinfra.selectorLabels" (dict "component" "prometheus" "root" $) | nindent 6 }}
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        {{- include "fuzeinfra.labels" . | nindent 8 }}
        {{- include "fuzeinfra.selectorLabels" (dict "component" "prometheus" "root" $) | nindent 8 }}
    spec:
      serviceAccountName: fuzeinfra-monitoring
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.enable-lifecycle'
            - '--storage.tsdb.retention.time={{ .Values.prometheus.retention.time | default "15d" }}'
            - '--storage.tsdb.retention.size={{ .Values.prometheus.retention.size | default "15GB" }}'
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
            {{- if .Values.prometheus.ruleSidecar.enabled }}
            - name: rules-discovered
              mountPath: /etc/prometheus/rules-discovered
            {{- end }}
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
          {{- with .Values.prometheus.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.prometheus.ruleSidecar.enabled }}
        # k8s-sidecar: watches ConfigMaps labeled `{{ .Values.prometheus.ruleSidecar.label }}={{ .Values.prometheus.ruleSidecar.labelValue }}`
        # in {{ .Values.prometheus.ruleSidecar.searchNamespace }}, writes their rule files into the shared rules-discovered
        # volume, then POSTs to Prometheus /-/reload (enabled via --web.enable-lifecycle).
        - name: rule-sidecar
          image: {{ .Values.prometheus.ruleSidecar.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          env:
            - name: LABEL
              value: {{ .Values.prometheus.ruleSidecar.label | quote }}
            - name: LABEL_VALUE
              value: {{ .Values.prometheus.ruleSidecar.labelValue | quote }}
            - name: FOLDER
              value: /etc/prometheus/rules-discovered
            - name: RESOURCE
              value: configmap
            - name: NAMESPACE
              value: {{ .Values.prometheus.ruleSidecar.searchNamespace | quote }}
            - name: METHOD
              value: WATCH
            - name: REQ_URL
              value: http://localhost:9090/-/reload
            - name: REQ_METHOD
              value: POST
          resources:
            {{- toYaml .Values.prometheus.ruleSidecar.resources | nindent 12 }}
          volumeMounts:
            - name: rules-discovered
              mountPath: /etc/prometheus/rules-discovered
        {{- end }}
      {{- with .Values.prometheus.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.prometheus.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: fuzeinfra-prometheus-config
        - name: rules
          configMap:
            name: fuzeinfra-prometheus-rules
        {{- if .Values.prometheus.ruleSidecar.enabled }}
        - name: rules-discovered
          emptyDir: {}
        {{- end }}
        - name: data
          persistentVolumeClaim:
            claimName: fuzeinfra-prometheus-data
{{- end }}

{{- /* ===================== Alertmanager ===================== */ -}}
{{- if .Values.alertmanager.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: fuzeinfra-alertmanager
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
    {{- include "fuzeinfra.selectorLabels" (dict "component" "alertmanager" "root" $) | nindent 4 }}
spec:
  selector:
    {{- include "fuzeinfra.selectorLabels" (dict "component" "alertmanager" "root" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.alertmanager.port }}
      targetPort: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fuzeinfra-alertmanager
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  serviceName: fuzeinfra-alertmanager
  replicas: 1
  selector:
    matchLabels:
      {{- include "fuzeinfra.selectorLabels" (dict "component" "alertmanager" "root" $) | nindent 6 }}
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        {{- include "fuzeinfra.labels" . | nindent 8 }}
        {{- include "fuzeinfra.selectorLabels" (dict "component" "alertmanager" "root" $) | nindent 8 }}
    spec:
      containers:
        - name: alertmanager
          image: {{ .Values.alertmanager.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          args:
            - '--config.file=/etc/alertmanager/alertmanager.yml'
            - '--storage.path=/alertmanager'
          ports:
            - containerPort: 9093
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: fuzeinfra-alertmanager-config
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "fuzeinfra.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.alertmanager.storage }}
{{- end }}

{{- /* ===================== Grafana ===================== */ -}}
{{- if .Values.grafana.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: fuzeinfra-grafana
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
    {{- include "fuzeinfra.selectorLabels" (dict "component" "grafana" "root" $) | nindent 4 }}
spec:
  selector:
    {{- include "fuzeinfra.selectorLabels" (dict "component" "grafana" "root" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.grafana.port }}
      targetPort: 3000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fuzeinfra-grafana
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  serviceName: fuzeinfra-grafana
  replicas: 1
  selector:
    matchLabels:
      {{- include "fuzeinfra.selectorLabels" (dict "component" "grafana" "root" $) | nindent 6 }}
  template:
    metadata:
      annotations:
        # Grafana provisions datasources/alerting/dashboards from ConfigMaps on
        # STARTUP only (its data dir is emptyDir/stateless). Without this, a
        # provisioning change applies to the ConfigMap but the running pod keeps
        # the stale config until manually restarted — which silently broke the
        # Loki-crit alerting for days. Hashing the config templates rolls the pod
        # whenever they change, so a provisioning edit reloads automatically.
        checksum/monitoring-config: {{ include (print $.Template.BasePath "/configmaps-monitoring.yaml") $ | sha256sum }}
        checksum/dashboards: {{ include (print $.Template.BasePath "/grafana-dashboards.yaml") $ | sha256sum }}
        # Roll when the admin-credential wiring changes, including a reseal.
        # Kubernetes does not restart a pod when a Secret changes (env is read
        # once at start), and the chart cannot hash a SealedSecret's ciphertext
        # because Argo applies it from outside the release. So bumping
        # adminPasswordSecret.rotation is what actually makes a rotated password
        # reach Grafana. Without this, a reseal silently leaves the OLD password
        # live and the new one only takes effect at the next unrelated restart.
        checksum/credentials: {{ .Values.grafana.adminPasswordSecret | toYaml | sha256sum }}
        {{- if .Values.grafana.persistence.enabled }}
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        {{- end }}
      labels:
        {{- include "fuzeinfra.labels" . | nindent 8 }}
        {{- include "fuzeinfra.selectorLabels" (dict "component" "grafana" "root" $) | nindent 8 }}
    spec:
      {{- if .Values.grafana.dashboardSidecar.enabled }}
      serviceAccountName: fuzeinfra-monitoring
      {{- end }}
      securityContext:
        fsGroup: 472
      {{- with .Values.grafana.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grafana.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grafana.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          env:
            # Local break-glass admin password. Sourced from a dedicated Secret
            # when adminPasswordSecret.name is set, else from the chart-managed
            # fuzeinfra-secrets.
            #
            # The override exists because the chart default for this value is the
            # literal string "admin", and no environment overrode it — so prod was
            # rendering GRAFANA_ADMIN_PASSWORD: "admin" behind nothing but the
            # Cloudflare Access wall. Rotating it via fuzeinfra-secrets would mean
            # resealing that whole Secret, which also carries the Postgres, Mongo
            # and Neo4j passwords those live datastores are already using — a
            # coordinated credential rotation, not a config change. A separate
            # Secret keeps this fix contained and reversible.
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- with .Values.grafana.adminPasswordSecret }}
                  name: {{ .name | default (include "fuzeinfra.secretName" $) }}
                  key: {{ .key | default "GRAFANA_ADMIN_PASSWORD" }}
                  {{- else }}
                  name: {{ include "fuzeinfra.secretName" . }}
                  key: GRAFANA_ADMIN_PASSWORD
                  {{- end }}
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_FEATURE_TOGGLES_DASHBOARDNEWLAYOUTS
              value: "false"
            - name: GF_FEATURE_TOGGLES_DASHBOARDDEFAULTLAYOUTSELECTOR
              value: "false"
            - name: GF_UNIFIED_ALERTING_ENABLED
              value: "true"
            - name: CRIT_BRIDGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fuzeinfra-tunnel-secrets
                  key: CRIT_BRIDGE_TOKEN
                  optional: true
            {{- if .Values.grafana.oidc.enabled }}
            # ---- Authentik SSO (generic OAuth) --------------------------------
            # GF_SECURITY_ADMIN_PASSWORD above is deliberately KEPT: /login still
            # accepts the local admin. Authentik depends on this cluster's own
            # Postgres+Redis, so an IdP outage must not lock us out of the
            # dashboards used to diagnose it.
            #
            # ROOT_URL is not optional — Grafana builds the OAuth redirect_uri
            # from it, and without it Authentik rejects the callback.
            - name: GF_SERVER_ROOT_URL
              value: "https://{{ include "fuzeinfra.host" (dict "root" . "sub" "grafana") }}/"
            - name: GF_AUTH_GENERIC_OAUTH_ENABLED
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_NAME
              value: {{ .Values.grafana.oidc.displayName | quote }}
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
              value: {{ .Values.grafana.oidc.clientId | quote }}
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grafana.oidc.secretName }}
                  key: {{ .Values.grafana.oidc.secretKey }}
            # `groups` is a custom scope on the Authentik provider; the role
            # mapping below is a no-op without it.
            - name: GF_AUTH_GENERIC_OAUTH_SCOPES
              value: "openid email profile groups"
            # These come off the GLOBAL /application/o/ base, not the per-app
            # issuer — see the note on grafana.oidc.endpointBase in values.yaml.
            - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
              value: "{{ .Values.grafana.oidc.endpointBase }}/authorize/"
            - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
              value: "{{ .Values.grafana.oidc.endpointBase }}/token/"
            - name: GF_AUTH_GENERIC_OAUTH_API_URL
              value: "{{ .Values.grafana.oidc.endpointBase }}/userinfo/"
            # Grafana's SQLite lives in an emptyDir unless persistence.enabled,
            # so every login must be able to (re)create the user from claims.
            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
              value: {{ .Values.grafana.oidc.roleAttributePath | quote }}
            # Fail closed — but ONLY in combination with a roleAttributePath that
            # has no fallback branch. STRICT rejects a login when the JMESPath
            # yields NO role; it cannot help if the expression always returns
            # something. An earlier `... && 'Admin' || 'Viewer'` path always
            # returned a role, so this flag was inert and a groupless token was
            # auto-provisioned as a Viewer. Keep both halves or neither works.
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT
              value: "true"
            {{- end }}
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provisioning
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: alerting
              mountPath: /etc/grafana/provisioning/alerting
            {{- if .Values.grafana.dashboardSidecar.enabled }}
            - name: sidecar-dashboards
              mountPath: /var/lib/grafana/dashboards-discovered
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
        {{- if .Values.grafana.dashboardSidecar.enabled }}
        # k8s-sidecar: watches ConfigMaps labeled `{{ .Values.grafana.dashboardSidecar.label }}={{ .Values.grafana.dashboardSidecar.labelValue }}`
        # in {{ .Values.grafana.dashboardSidecar.searchNamespace }} and writes their JSON into the shared dashboards-discovered volume.
        - name: dashboard-sidecar
          image: {{ .Values.grafana.dashboardSidecar.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          env:
            - name: LABEL
              value: {{ .Values.grafana.dashboardSidecar.label | quote }}
            - name: LABEL_VALUE
              value: {{ .Values.grafana.dashboardSidecar.labelValue | quote }}
            - name: FOLDER
              value: /var/lib/grafana/dashboards-discovered
            - name: RESOURCE
              value: configmap
            - name: NAMESPACE
              value: {{ .Values.grafana.dashboardSidecar.searchNamespace | quote }}
            - name: METHOD
              value: WATCH
            - name: FOLDER_ANNOTATION
              value: grafana_dashboard_folder
          resources:
            {{- toYaml .Values.grafana.dashboardSidecar.resources | nindent 12 }}
          volumeMounts:
            - name: sidecar-dashboards
              mountPath: /var/lib/grafana/dashboards-discovered
        {{- end }}
      volumes:
        {{- if not .Values.grafana.persistence.enabled }}
        # Stateless by default: Grafana's SQLite DB lives in an emptyDir, so the
        # pod carries no node-pinned state and can be rescheduled freely. All
        # datasources, dashboards and alerting are provisioned from ConfigMaps.
        - name: data
          emptyDir: {}
        {{- end }}
        - name: datasources
          configMap:
            name: fuzeinfra-grafana-datasources
        - name: dashboard-provisioning
          configMap:
            name: fuzeinfra-grafana-dashboard-provisioning
        - name: dashboards
          projected:
            sources:
              - configMap:
                  name: fuzeinfra-grafana-dashboard-cluster-overview
              - configMap:
                  name: fuzeinfra-grafana-dashboard-kubernetes-nodes
              - configMap:
                  name: fuzeinfra-grafana-dashboard-kubernetes-pods
              - configMap:
                  name: fuzeinfra-grafana-dashboard-fuzeinfra-services
              - configMap:
                  name: fuzeinfra-grafana-dashboard-logs-explorer
        - name: alerting
          configMap:
            name: fuzeinfra-grafana-alerting
        {{- if .Values.grafana.dashboardSidecar.enabled }}
        - name: sidecar-dashboards
          emptyDir: {}
        {{- end }}
  {{- if .Values.grafana.persistence.enabled }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "fuzeinfra.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.grafana.storage }}
  {{- end }}
{{- end }}

{{- /* ===================== Loki ===================== */ -}}
{{- if .Values.loki.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: fuzeinfra-loki
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
    {{- include "fuzeinfra.selectorLabels" (dict "component" "loki" "root" $) | nindent 4 }}
spec:
  selector:
    {{- include "fuzeinfra.selectorLabels" (dict "component" "loki" "root" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.loki.port }}
      targetPort: 3100
---
{{- /*
     Loki's data volume is a STANDALONE PersistentVolumeClaim, deliberately NOT a
     StatefulSet volumeClaimTemplate.

     WHY: a StatefulSet's .spec.volumeClaimTemplates is immutable — the API server
     rejects any change to it ("updates to statefulset spec for fields other than
     'replicas', 'ordinals', 'template', ... are forbidden"), and this chart's Argo
     Application additionally hides that field from the sync entirely
     (ignoreDifferences + RespectIgnoreDifferences, argocd/applications/fuzeinfra-prod.yaml).
     The combination made `loki.storage` INERT: raising it 5Gi -> 20Gi in Git changed
     nothing on the running cluster, and the live volume could only be grown by a
     direct `kubectl patch pvc` — precisely the out-of-band mutation GitOps exists to
     eliminate. A standalone PVC's spec.resources.requests.storage IS mutable (the
     `longhorn` class sets allowVolumeExpansion: true), so `loki.storage` below is now
     the real, enforced size: change it in Git, Argo applies it, Longhorn expands.

     That STS ignoreDifferences rule is NOT Loki-specific — it is keyed on
     `kind: StatefulSet` with no name, and postgres/mongodb/neo4j/kafka/elasticsearch/
     redis/rabbitmq/prometheus/alertmanager/chromadb all depend on it to protect real
     data (2026-07-24 incident). It is left exactly as-is; Loki simply stops being a
     StatefulSet and therefore stops being in its scope.

     MIGRATION (2026-08-31): this is a NEW, EMPTY volume, deliberately not an
     adoption of the StatefulSet's old `data-fuzeinfra-loki-0` claim. Loki's content
     is disposable logs, and that old volume still holds the unreplayable WAL that
     produced the crash-loop ("building tsdb from old WAL files" -> "no space left on
     device"), so adopting it would carry the failure forward. Declaring a fresh PVC
     also means Git and the cluster can never disagree on a PVC's IMMUTABLE fields
     (storageClassName, accessModes) — Argo creates it from exactly this spec,
     whereas adopting a live claim whose spec differs would wedge the sync
     permanently. Loki re-ingests from Promtail on start; only historical logs are
     lost. The old claim is NOT deleted by this chart and must not be auto-deleted —
     a human should remove `data-fuzeinfra-loki-0` (and its Longhorn volume) once
     the new one is confirmed healthy.

     Deletion protection: `helm.sh/resource-policy: keep` stops a Helm uninstall from
     removing it, and Argo's `Prune=false` stops an Argo prune from removing it. A
     chart change can disable Loki without destroying its volume. Shrinking `storage`
     is rejected by the API server (expansion only) — that is intended.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fuzeinfra-loki-data
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
    {{- include "fuzeinfra.selectorLabels" (dict "component" "loki" "root" $) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: ["ReadWriteOnce"]
  {{- include "fuzeinfra.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.loki.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuzeinfra-loki
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate, NOT RollingUpdate. LOAD-BEARING: the data volume is ReadWriteOnce, so
  # a rolling update deadlocks — the new pod cannot mount the claim while the old
  # pod still holds it, the old pod is never terminated because the new one never
  # becomes Ready, and the rollout hangs until it is manually unstuck. Recreate
  # tears the old pod down first. The cost is a short logging gap on every restart,
  # which is the correct trade for a single-replica, single-binary Loki.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "fuzeinfra.selectorLabels" (dict "component" "loki" "root" $) | nindent 6 }}
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        {{- include "fuzeinfra.labels" . | nindent 8 }}
        {{- include "fuzeinfra.selectorLabels" (dict "component" "loki" "root" $) | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: loki
          image: {{ .Values.loki.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          args:
            - '-config.file=/etc/loki/loki-config.yaml'
            {{- if .Values.loki.s3.enabled }}
            - '-config.expand-env=true'
            {{- end }}
          {{- if .Values.loki.s3.enabled }}
          env:
            - name: LOKI_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "loki.s3.existingSecret is required when loki.s3.enabled=true" .Values.loki.s3.existingSecret }}
                  key: {{ .Values.loki.s3.accessKeyIdKey }}
            - name: LOKI_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.loki.s3.existingSecret }}
                  key: {{ .Values.loki.s3.secretAccessKeyKey }}
          {{- end }}
          ports:
            - containerPort: 3100
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 20
            periodSeconds: 10
          {{- with .Values.loki.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.loki.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.loki.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: fuzeinfra-loki-config
        - name: data
          persistentVolumeClaim:
            claimName: fuzeinfra-loki-data
{{- end }}

{{- /* ===================== Promtail (DaemonSet) ===================== */ -}}
{{- if .Values.promtail.enabled }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fuzeinfra-promtail
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "fuzeinfra.selectorLabels" (dict "component" "promtail" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fuzeinfra.labels" . | nindent 8 }}
        {{- include "fuzeinfra.selectorLabels" (dict "component" "promtail" "root" $) | nindent 8 }}
    spec:
      serviceAccountName: fuzeinfra-monitoring
      containers:
        - name: promtail
          image: {{ .Values.promtail.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          args: ["-config.file=/etc/promtail/config.yml"]
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: run
              mountPath: /run/promtail
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: containers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: fuzeinfra-promtail-config
        - name: run
          hostPath:
            path: /run/promtail
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: containers
          hostPath:
            path: /var/lib/docker/containers
{{- end }}

{{- /* ===================== Node Exporter (DaemonSet) ===================== */ -}}
{{- if .Values.nodeExporter.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: fuzeinfra-node-exporter
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
    {{- include "fuzeinfra.selectorLabels" (dict "component" "node-exporter" "root" $) | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "fuzeinfra.selectorLabels" (dict "component" "node-exporter" "root" $) | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.nodeExporter.port }}
      targetPort: 9100
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fuzeinfra-node-exporter
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "fuzeinfra.selectorLabels" (dict "component" "node-exporter" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fuzeinfra.labels" . | nindent 8 }}
        {{- include "fuzeinfra.selectorLabels" (dict "component" "node-exporter" "root" $) | nindent 8 }}
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: node-exporter
          image: {{ .Values.nodeExporter.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          args:
            - '--path.procfs=/host/proc'
            - '--path.sysfs=/host/sys'
            - '--path.rootfs=/host/root'
            - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
          ports:
            - containerPort: 9100
              name: metrics
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
{{- end }}
