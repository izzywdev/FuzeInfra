{{- if .Values.ingress.enabled }}
{{- $root := . -}}
{{- /* hostname-subdomain -> { svc: fuzeinfra-<svc>, port, enabled } */ -}}
{{- $routes := dict
  "grafana"           (dict "svc" "fuzeinfra-grafana"           "port" $root.Values.grafana.port           "enabled" $root.Values.grafana.enabled)
  "prometheus"        (dict "svc" "fuzeinfra-prometheus"        "port" $root.Values.prometheus.port        "enabled" $root.Values.prometheus.enabled)
  "alertmanager"      (dict "svc" "fuzeinfra-alertmanager"      "port" $root.Values.alertmanager.port      "enabled" $root.Values.alertmanager.enabled)
  "airflow"           (dict "svc" "fuzeinfra-airflow-webserver" "port" $root.Values.airflow.webPort        "enabled" $root.Values.airflow.enabled)
  "flower"            (dict "svc" "fuzeinfra-airflow-flower"    "port" $root.Values.airflow.flowerPort     "enabled" $root.Values.airflow.enabled)
  "kafka-ui"          (dict "svc" "fuzeinfra-kafka-ui"          "port" $root.Values.kafkaUi.port           "enabled" (and $root.Values.kafkaUi.enabled $root.Values.kafka.enabled))
  "mongo-express"     (dict "svc" "fuzeinfra-mongo-express"     "port" $root.Values.mongoExpress.port      "enabled" (and $root.Values.mongoExpress.enabled $root.Values.mongodb.enabled))
  "rabbitmq"          (dict "svc" "fuzeinfra-rabbitmq"          "port" $root.Values.rabbitmq.managementPort "enabled" $root.Values.rabbitmq.enabled)
-}}
{{- /* elasticsearch and chromadb are deliberately NOT routes here: they are raw
       datastore HTTP APIs, not admin UIs, and publishing them to the internet
       behind only the *.prod Cloudflare Access wildcard was a hardening gap
       (M3-S3). They stay ClusterIP-only — in-cluster service DNS
       (fuzeinfra-elasticsearch:9200, fuzeinfra-chromadb:8000) is unaffected.
       For read-only checks use cluster-query.yml; for a live HTTP connection an
       operator uses kubectl port-forward — see
       docs/runbooks/datastore-port-forward-access.md. Neo4j Browser is the
       deliberate exception (owner decision, M3-S3): it keeps its own Ingress
       in neo4j-ingress.yaml because it is an admin UI, not a raw datastore
       API, and the App Launcher tile is its only access path. */ -}}
{{- /* The Middleware below is a Traefik CRD (traefik.io/v1alpha1). It exists
       only on the Traefik-based ingress (prod / Contabo k3s); on nginx-based
       clusters (kind, Docker Desktop) the CRD is absent, so gate both the
       resource and its annotation on the ingress class — same pattern as
       neo4j-ingress.yaml. */ -}}
{{- $traefik := eq .Values.ingress.className "traefik" }}
{{- if $traefik }}
# Force X-Forwarded-Proto=https for every host on this Ingress.
#
# TLS terminates at the Cloudflare edge and the tunnel reaches Traefik over
# plain HTTP, so Traefik sets X-Forwarded-Proto from ITS OWN entrypoint — which
# is http — overwriting whatever cloudflared sent. Any app that derives its
# external URL from the request then builds http:// links.
#
# This is not hypothetical. Airflow had AIRFLOW__WEBSERVER__BASE_URL=https://…
# AND ENABLE_PROXY_FIX=true and STILL sent Authentik
#   redirect_uri=http://airflow.prod.fuzefront.com/oauth-authorized/authentik
# which Authentik's strict redirect_uri match rejected with "Redirect URI
# Error", making SSO login impossible. ProxyFix was working correctly; it was
# faithfully reporting the http it was handed. BASE_URL does not help, because
# Flask-AppBuilder builds the OAuth redirect_uri from the REQUEST scheme.
#
# FuzeFront hit the identical problem with Authentik's own issuer URLs and
# fixed it the same way (authentik-forwarded-proto in authentik.yaml).
#
# Safe for every host here: all of them are served over HTTPS at the edge, so
# pinning the header states the truth rather than overriding it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forwarded-proto
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
      # X-Forwarded-Port must be pinned TOO, and finding out why cost a round
      # trip. With only the proto pinned, Airflow emitted
      #   redirect_uri=https://airflow.prod.fuzefront.com:80/oauth-authorized/authentik
      # — right scheme, but Traefik still advertised its own entrypoint port (80),
      # Werkzeug's ProxyFix trusts X-Forwarded-Port (x_port=1 by default), and a
      # port that is not the default for the scheme gets written into the URL
      # explicitly. Authentik's strict redirect_uri match rejected that too.
      # 443 is the truth at the edge, same as the proto above.
      X-Forwarded-Port: "443"
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fuzeinfra
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
  {{- if $traefik }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-forwarded-proto@kubernetescrd
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range $sub, $r := $routes }}
        {{- if $r.enabled }}
        - {{ include "fuzeinfra.host" (dict "root" $root "sub" $sub) }}
        {{- end }}
        {{- end }}
      secretName: fuzeinfra-tls
  {{- end }}
  rules:
    {{- range $sub, $r := $routes }}
    {{- if $r.enabled }}
    - host: {{ include "fuzeinfra.host" (dict "root" $root "sub" $sub) }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $r.svc }}
                port:
                  number: {{ $r.port }}
    {{- end }}
    {{- end }}
{{- end }}
