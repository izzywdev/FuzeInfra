{{- /*
Shared Airflow env block. POSTGRES_USER/PASSWORD come from the secret and are
referenced via $(VAR) interpolation to build the SQLAlchemy/Celery URLs.
*/ -}}
{{- define "fuzeinfra.airflowEnv" -}}
- name: POSTGRES_USER
  valueFrom:
    secretKeyRef:
      name: {{ include "fuzeinfra.secretName" . }}
      key: POSTGRES_USER
- name: POSTGRES_PASSWORD
  valueFrom:
    secretKeyRef:
      name: {{ include "fuzeinfra.secretName" . }}
      key: POSTGRES_PASSWORD
- name: AIRFLOW__CORE__EXECUTOR
  value: CeleryExecutor
- name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
  value: "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@fuzeinfra-postgres:5432/airflow"
- name: AIRFLOW__CELERY__RESULT_BACKEND
  value: "db+postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@fuzeinfra-postgres:5432/airflow"
- name: AIRFLOW__CELERY__BROKER_URL
  value: "redis://fuzeinfra-redis:6379/0"
- name: AIRFLOW__CORE__FERNET_KEY
  valueFrom:
    secretKeyRef:
      name: {{ include "fuzeinfra.secretName" . }}
      key: AIRFLOW_FERNET_KEY
- name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
  value: "true"
- name: AIRFLOW__CORE__LOAD_EXAMPLES
  value: {{ .Values.airflow.loadExamples | quote }}
- name: AIRFLOW__API__AUTH_BACKENDS
  value: "airflow.api.auth.backend.basic_auth"
{{- if .Values.airflow.celeryWorkerConcurrency }}
- name: AIRFLOW__CELERY__WORKER_CONCURRENCY
  value: {{ .Values.airflow.celeryWorkerConcurrency | quote }}
{{- end }}
{{- end -}}

{{- /*
  Shared DAG volumes/initContainer block.
  Kubernetes ConfigMap directory mounts create a timestamped directory (e.g.
  ..2026_06_21_17_06_42.3303819634) plus a ..data symlink pointing to it.
  Airflow's list_py_file_paths walks with followlinks=True and tracks
  os.path.realpath per directory; both entries resolve to the same real path,
  triggering "Detected recursive loop when walking DAG directory".
  Fix: copy DAG files from the ConfigMap mount into a plain emptyDir — no
  symlinks, no loop.
*/ -}}
{{- define "fuzeinfra.dagInitContainer" -}}
- name: dag-sync
  image: busybox
  command: ["sh", "-c", "cp /configmap-dags/*.py /dags/ 2>/dev/null || true"]
  volumeMounts:
    - name: dags-cm
      mountPath: /configmap-dags
    - name: dags
      mountPath: /dags
{{- end -}}

{{- /*
  `hook` (default, unchanged) or `inline`. See airflow.init.mode in values.yaml
  for why the hook variant cannot cold-start.
*/ -}}
{{- define "fuzeinfra.airflowInitMode" -}}
{{- dig "init" "mode" "hook" .Values.airflow -}}
{{- end -}}

{{- /*
  Gate for `inline` mode: hold every Airflow pod at Init until the metadata
  database exists AND its migrations have been applied.

  Without it the pods start concurrently with the init Job, die immediately on
  `database "airflow" does not exist`, and CrashLoopBackOff pushes the retry
  interval out to ~5 minutes — so a pod can stay down long after the database is
  ready, which is its own way of blowing helm's --wait budget. Blocking in an
  init container converts that race into a deterministic wait.

  `airflow db check-migrations` is the same readiness check the upstream Airflow
  chart uses. `-t 5` bounds a single attempt so the loop keeps polling rather
  than blocking on one long call; a missing database exits non-zero and retries.
*/ -}}
{{- define "fuzeinfra.airflowWaitForDb" -}}
- name: wait-for-airflow-db
  image: {{ .Values.airflow.image }}
  imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
  env:
    {{- include "fuzeinfra.airflowEnv" . | nindent 4 }}
  command:
    - bash
    - -c
    - |
      # Bounded, not an open-ended poll. An unbounded wait would leave a pod
      # sitting in Init indefinitely if the database never arrives — quiet, and
      # invisible to anything watching restart counts. Failing at the deadline
      # restarts the pod, which is the signal an operator actually sees.
      deadline=$(( $(date +%s) + {{ .Values.airflow.init.waitTimeoutSeconds | default 600 }} ))
      until airflow db check-migrations -t 5 >/dev/null 2>&1; do
        if [ "$(date +%s)" -ge "$deadline" ]; then
          echo "airflow metadata database still not ready after {{ .Values.airflow.init.waitTimeoutSeconds | default 600 }}s — giving up so this surfaces as a restart." >&2
          exit 1
        fi
        echo "waiting for the airflow metadata database to be created and migrated..."
        sleep 5
      done
      echo "airflow metadata database is ready."
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 250m, memory: 512Mi }
{{- end -}}

{{- /*
  Pod template for the init Job, factored out so its hash can name the Job in
  `inline` mode. The body is identical in both modes — only the Job's name,
  annotations and TTL differ.
*/ -}}
{{- define "fuzeinfra.airflowInitPodTemplate" -}}
metadata:
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
    {{- include "fuzeinfra.selectorLabels" (dict "component" "airflow-init" "root" .) | nindent 4 }}
spec:
  restartPolicy: Never
  containers:
    - name: airflow-init
      image: {{ .Values.airflow.image }}
      imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
      env:
        {{- include "fuzeinfra.airflowEnv" . | nindent 8 }}
        - name: AIRFLOW_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "fuzeinfra.secretName" . }}
              key: AIRFLOW_ADMIN_USER
        # Chart default for this is the literal "admin". See the rabbitmq note in
        # messaging.yaml for why this uses a dedicated Secret.
        #
        # CAVEAT: the init below runs `airflow users create ... || true`, which
        # silently succeeds when the user already exists. So changing this does
        # NOT rotate an existing admin — that needs `airflow users reset-password`
        # or a fresh metadata DB. It does set a strong password on first init.
        - name: AIRFLOW_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              {{- with .Values.airflow.adminPasswordSecret }}
              name: {{ .name | default (include "fuzeinfra.secretName" $) }}
              key: {{ .key | default "AIRFLOW_ADMIN_PASSWORD" }}
              {{- else }}
              name: {{ include "fuzeinfra.secretName" . }}
              key: AIRFLOW_ADMIN_PASSWORD
              {{- end }}
      command:
        - bash
        - -c
        - |
          set -e
          echo "Waiting for PostgreSQL..."
          until PGPASSWORD="$POSTGRES_PASSWORD" psql -h fuzeinfra-postgres -U "$POSTGRES_USER" -d postgres -c '\q' 2>/dev/null; do
            sleep 2
          done
          echo "Ensuring 'airflow' database exists..."
          PGPASSWORD="$POSTGRES_PASSWORD" psql -h fuzeinfra-postgres -U "$POSTGRES_USER" -d postgres -tc \
            "SELECT 1 FROM pg_database WHERE datname = 'airflow'" | grep -q 1 || \
            PGPASSWORD="$POSTGRES_PASSWORD" psql -h fuzeinfra-postgres -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE airflow"
          # Pre-create a database matching the role name ("$POSTGRES_USER").
          # Clients/health-probes that connect without naming a database
          # (e.g. `pg_isready -U $POSTGRES_USER`) fall back to a DB named
          # after the role, otherwise spamming
          # `FATAL: database "..." does not exist` on every probe.
          echo "Ensuring role-default '$POSTGRES_USER' database exists..."
          PGPASSWORD="$POSTGRES_PASSWORD" psql -h fuzeinfra-postgres -U "$POSTGRES_USER" -d postgres -tc \
            "SELECT 1 FROM pg_database WHERE datname = '$POSTGRES_USER'" | grep -q 1 || \
            PGPASSWORD="$POSTGRES_PASSWORD" psql -h fuzeinfra-postgres -U "$POSTGRES_USER" -d postgres -c "CREATE DATABASE \"$POSTGRES_USER\""
          echo "Running airflow db migrate..."
          airflow db migrate
          echo "Creating admin user (idempotent)..."
          airflow users create \
            --username "$AIRFLOW_ADMIN_USER" --firstname Admin --lastname User \
            --role Admin --email admin@example.com --password "$AIRFLOW_ADMIN_PASSWORD" || true
{{- end -}}

{{- define "fuzeinfra.dagVolumes" -}}
- name: dags
  emptyDir: {}
- name: dags-cm
  configMap:
    name: fuzeinfra-airflow-dags
{{- end -}}

{{- if .Values.airflow.enabled }}
{{- /* Example DAG shipped as a ConfigMap so the stack works out of the box.
     For production, replace with git-sync or a baked image. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: fuzeinfra-airflow-dags
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
data:
  example_fuzeinfra_dag.py: |
    from datetime import datetime
    from airflow import DAG
    from airflow.operators.bash import BashOperator

    with DAG(
        dag_id="example_fuzeinfra_pipeline",
        start_date=datetime(2024, 1, 1),
        schedule=None,
        catchup=False,
        tags=["fuzeinfra", "example"],
    ) as dag:
        BashOperator(
            task_id="hello",
            bash_command="echo 'FuzeInfra Airflow + Celery is running'",
        )
---
{{- /* ===================== Airflow DB migrate / bootstrap Job ===================== */}}
{{- $initMode := include "fuzeinfra.airflowInitMode" . }}
{{- $initPodTemplate := include "fuzeinfra.airflowInitPodTemplate" . }}
apiVersion: batch/v1
kind: Job
metadata:
{{- if eq $initMode "inline" }}
  {{- /* A plain Job's pod template is immutable, so a fixed name would make the
         next `helm upgrade` fail with "field is immutable" as soon as anything
         here changed. Suffixing with the template's own hash makes each distinct
         spec a distinct Job, and an unchanged spec re-uses the completed one
         instead of re-running it. */}}
  name: fuzeinfra-airflow-init-{{ $initPodTemplate | sha256sum | trunc 8 }}
{{- else }}
  name: fuzeinfra-airflow-init
{{- end }}
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
{{- if eq $initMode "hook" }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation
{{- end }}
spec:
  backoffLimit: 6
{{- /*
  Deliberately NO ttlSecondsAfterFinished in inline mode.

  A TTL would be actively harmful here. The Job is a tracked resource that Argo
  owns, and prod runs `automated: {prune: true, selfHeal: true}` — so the TTL
  controller deletes the completed Job, Argo notices the drift, recreates it, and
  it re-runs `airflow db migrate` against live prod. Every hour. Forever, with
  the app flapping OutOfSync the whole time.

  Without a TTL there is exactly ONE Job per distinct pod-template hash and it
  stays Completed. Superseded hashes stop being rendered, so Helm and Argo prune
  them on the next upgrade/sync. Nothing accumulates.
*/}}
  template:
    {{- $initPodTemplate | nindent 4 }}
---
{{- /* ===================== Airflow Webserver ===================== */}}
apiVersion: v1
kind: Service
metadata:
  name: fuzeinfra-airflow-webserver
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
    {{- include "fuzeinfra.selectorLabels" (dict "component" "airflow-webserver" "root" $) | nindent 4 }}
spec:
  selector:
    {{- include "fuzeinfra.selectorLabels" (dict "component" "airflow-webserver" "root" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.airflow.webPort }}
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuzeinfra-airflow-webserver
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  replicas: {{ dig "replicas" 1 .Values.airflow }}
  selector:
    matchLabels:
      {{- include "fuzeinfra.selectorLabels" (dict "component" "airflow-webserver" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fuzeinfra.labels" . | nindent 8 }}
        {{- include "fuzeinfra.selectorLabels" (dict "component" "airflow-webserver" "root" $) | nindent 8 }}
    spec:
      initContainers:
        {{- include "fuzeinfra.dagInitContainer" . | nindent 8 }}
        {{- if eq (include "fuzeinfra.airflowInitMode" .) "inline" }}
        {{- include "fuzeinfra.airflowWaitForDb" . | nindent 8 }}
        {{- end }}
      containers:
        - name: webserver
          image: {{ .Values.airflow.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          args: ["webserver"]
          env:
            {{- include "fuzeinfra.airflowEnv" . | nindent 12 }}
            - name: AIRFLOW__WEBSERVER__EXPOSE_CONFIG
              value: "true"
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 12
      volumes:
        {{- include "fuzeinfra.dagVolumes" . | nindent 8 }}
---
{{- /* ===================== Airflow Scheduler ===================== */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuzeinfra-airflow-scheduler
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  replicas: {{ dig "replicas" 1 .Values.airflow }}
  selector:
    matchLabels:
      {{- include "fuzeinfra.selectorLabels" (dict "component" "airflow-scheduler" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fuzeinfra.labels" . | nindent 8 }}
        {{- include "fuzeinfra.selectorLabels" (dict "component" "airflow-scheduler" "root" $) | nindent 8 }}
    spec:
      initContainers:
        {{- include "fuzeinfra.dagInitContainer" . | nindent 8 }}
        {{- if eq (include "fuzeinfra.airflowInitMode" .) "inline" }}
        {{- include "fuzeinfra.airflowWaitForDb" . | nindent 8 }}
        {{- end }}
      containers:
        - name: scheduler
          image: {{ .Values.airflow.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          args: ["scheduler"]
          env:
            {{- include "fuzeinfra.airflowEnv" . | nindent 12 }}
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
      volumes:
        {{- include "fuzeinfra.dagVolumes" . | nindent 8 }}
---
{{- /* ===================== Airflow Celery Worker ===================== */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuzeinfra-airflow-worker
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.airflow.workerReplicas }}
  selector:
    matchLabels:
      {{- include "fuzeinfra.selectorLabels" (dict "component" "airflow-worker" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fuzeinfra.labels" . | nindent 8 }}
        {{- include "fuzeinfra.selectorLabels" (dict "component" "airflow-worker" "root" $) | nindent 8 }}
    spec:
      initContainers:
        {{- include "fuzeinfra.dagInitContainer" . | nindent 8 }}
        {{- if eq (include "fuzeinfra.airflowInitMode" .) "inline" }}
        {{- include "fuzeinfra.airflowWaitForDb" . | nindent 8 }}
        {{- end }}
      containers:
        - name: worker
          image: {{ .Values.airflow.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          args: ["celery", "worker"]
          env:
            {{- include "fuzeinfra.airflowEnv" . | nindent 12 }}
          {{- if .Values.airflow.workerResources }}
          resources:
            {{- toYaml .Values.airflow.workerResources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: dags
              mountPath: /opt/airflow/dags
      volumes:
        {{- include "fuzeinfra.dagVolumes" . | nindent 8 }}
---
{{- /* ===================== Airflow Flower (Celery monitoring) ===================== */}}
apiVersion: v1
kind: Service
metadata:
  name: fuzeinfra-airflow-flower
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
    {{- include "fuzeinfra.selectorLabels" (dict "component" "airflow-flower" "root" $) | nindent 4 }}
spec:
  selector:
    {{- include "fuzeinfra.selectorLabels" (dict "component" "airflow-flower" "root" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.airflow.flowerPort }}
      targetPort: 5555
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuzeinfra-airflow-flower
  labels:
    {{- include "fuzeinfra.labels" . | nindent 4 }}
spec:
  replicas: {{ dig "replicas" 1 .Values.airflow }}
  selector:
    matchLabels:
      {{- include "fuzeinfra.selectorLabels" (dict "component" "airflow-flower" "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fuzeinfra.labels" . | nindent 8 }}
        {{- include "fuzeinfra.selectorLabels" (dict "component" "airflow-flower" "root" $) | nindent 8 }}
    spec:
      {{- /* Flower has no DAG sync, so this is its only init container. It
             reads the Celery result backend, which is the same Postgres
             database, so it crashloops on a cold start exactly like the rest. */}}
      {{- if eq (include "fuzeinfra.airflowInitMode" .) "inline" }}
      initContainers:
        {{- include "fuzeinfra.airflowWaitForDb" . | nindent 8 }}
      {{- end }}
      containers:
        - name: flower
          image: {{ .Values.airflow.image }}
          imagePullPolicy: {{ include "fuzeinfra.pullPolicy" . }}
          args: ["celery", "flower"]
          env:
            {{- include "fuzeinfra.airflowEnv" . | nindent 12 }}
          ports:
            - containerPort: 5555
              name: http
{{- end }}
