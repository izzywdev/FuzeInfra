# =============================================================================
# LiteLLM gateway — local kind cluster.
#
# There is no SealedSecret controller story worth the ceremony locally, so the
# expectation is that you create the `litellm-secret` Secret by hand with your
# own throwaway provider keys before enabling:
#
#   kubectl -n fuzeinfra create secret generic litellm-secret \
#     --from-literal=LITELLM_MASTER_KEY=sk-local-dev \
#     --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
#     --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY"
#
#   helm upgrade --install litellm helm/litellm -n fuzeinfra \
#     -f helm/litellm/values-local.yaml --set enabled=true
#
# Then reach it from your machine with:
#   kubectl -n fuzeinfra port-forward svc/litellm 4000:4000
# =============================================================================
enabled: false

replicas: 1

# 768Mi here would have hit the same import-time OOMKill that took prod down at
# 1Gi (exit 137, ~17s in, no logs). Kept at 3Gi so a kind cluster reproduces
# prod's behaviour rather than failing in a way prod does not.
resources:
  requests: { cpu: "100m", memory: "256Mi" }
  limits:   { cpu: "500m", memory: "3Gi" }

# Off locally: kind ships no NetworkPolicy enforcer by default, so a policy here
# is a no-op that only makes local behaviour diverge from prod.
networkPolicy:
  enabled: false
