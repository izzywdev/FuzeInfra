{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "litellm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "litellm.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod when model routing changes. Argo syncs the ConfigMap but
        # will not restart the Deployment on its own, and LiteLLM reads its
        # config once at startup — without this a merged model change appears
        # applied (ConfigMap updated, app Synced) while the running pod still
        # serves the old model list.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.sso.enabled }}
        # checksum/config above hashes the ConfigMap only, so it does not change
        # when litellm-oidc is resealed. Hash the sso block too: bumping
        # sso.secretRotation is then what restarts the pod and loads the new
        # client secret. Without this a reseal leaves the OLD secret live and the
        # token exchange fails with an error that implicates neither side.
        checksum/sso: {{ .Values.sso | toYaml | sha256sum }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.database.enabled }}
      # LiteLLM runs `prisma migrate deploy` against DATABASE_URL at startup, and
      # prisma will NOT create the database itself — it expects to connect to one
      # that exists. So the database has to be there before the main container
      # starts, which is exactly what an initContainer guarantees (a PostSync Job
      # would race the Deployment).
      #
      # Idempotent by construction: it re-runs on every pod start and every
      # rollout, and does nothing when the database already exists.
      initContainers:
        - name: ensure-database
          image: {{ .Values.database.provisionImage | default "postgres:15" }}
          imagePullPolicy: {{ .Values.imagePullPolicy | default "IfNotPresent" }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "Waiting for ${PGHOST}:${PGPORT} ..."
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" >/dev/null 2>&1; do
                sleep 3
              done
              # CREATE DATABASE cannot run inside a transaction or a DO block, so
              # it is guarded by a SELECT rather than an IF NOT EXISTS.
              if psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -tAc \
                   "SELECT 1 FROM pg_database WHERE datname = '${LITELLM_DB}'" | grep -q 1; then
                echo "Database '${LITELLM_DB}' already exists."
              else
                psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres \
                  -c "CREATE DATABASE \"${LITELLM_DB}\""
                echo "Database '${LITELLM_DB}' created."
              fi
          env:
            - name: PGHOST
              value: {{ .Values.database.host | quote }}
            - name: PGPORT
              value: {{ .Values.database.port | quote }}
            - name: LITELLM_DB
              value: {{ .Values.database.name | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.credentialsSecret }}
                  key: {{ .Values.database.userKey }}
            # psql and pg_isready both read PGPASSWORD from the environment, so
            # the password never appears in an argv anyone can read from `ps`.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.credentialsSecret }}
                  key: {{ .Values.database.passwordKey }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits:   { cpu: "250m", memory: "128Mi" }
      {{- end }}
      containers:
        - name: litellm
          image: "{{ .Values.image }}:{{ .Values.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy | default "IfNotPresent" }}
          # The image's ENTRYPOINT is `litellm`; these are its flags. Do NOT set
          # `command` — overriding the entrypoint drops the proxy launcher and
          # the container exits immediately.
          args:
            - --config
            - /etc/litellm/proxy_config.yaml
            - --port
            - {{ .Values.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            # The bearer token consumers present. Required — LiteLLM refuses to
            # start without it, which is the behaviour we want: no master key
            # must never degrade into an open gateway holding provider keys.
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: LITELLM_MASTER_KEY
            {{- range .Values.providerKeys }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: {{ .name }}
                  optional: {{ not .required }}
            {{- end }}
            {{- if .Values.sso.enabled }}
            # ---- Authentik SSO for the admin UI (LiteLLM "generic" provider) --
            # Endpoints are given explicitly rather than discovered: LiteLLM
            # reads these three env vars and does not fetch the discovery
            # document. They live at the /application/o/ ROOT in Authentik, not
            # under the per-application path — see values.yaml.
            - name: GENERIC_CLIENT_ID
              value: {{ .Values.sso.clientId | quote }}
            - name: GENERIC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sso.secretName }}
                  key: {{ .Values.sso.secretKey }}
            - name: GENERIC_AUTHORIZATION_ENDPOINT
              value: "{{ .Values.sso.endpointBase }}/authorize/"
            - name: GENERIC_TOKEN_ENDPOINT
              value: "{{ .Values.sso.endpointBase }}/token/"
            - name: GENERIC_USERINFO_ENDPOINT
              value: "{{ .Values.sso.endpointBase }}/userinfo/"
            - name: GENERIC_SCOPE
              value: {{ .Values.sso.scope | quote }}
            # The redirect_uri LiteLLM sends is "<PROXY_BASE_URL>/sso/callback".
            # Authentik matches it strictly, so this must be the external host
            # the browser sees, and it must match the redirect_uris entry on the
            # "FuzeInfra LiteLLM" provider in izzywdev/FuzeFront exactly —
            # trailing slash included, or rather excluded.
            - name: PROXY_BASE_URL
              value: {{ .Values.sso.proxyBaseUrl | quote }}
            {{- end }}
            {{- if .Values.storeModelInDB }}
            - name: STORE_MODEL_IN_DB
              value: "True"
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            {{- if .Values.redis.db }}
            - name: REDIS_DB
              value: {{ .Values.redis.db | quote }}
            {{- end }}
            {{- if .Values.redis.passwordSecret }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.passwordSecret }}
                  key: {{ .Values.redis.passwordKey | default "REDIS_PASSWORD" }}
            {{- end }}
            {{- end }}
            {{- if .Values.database.enabled }}
            # ORDER IS LOAD-BEARING: Kubernetes only expands $(VAR) references to
            # variables declared EARLIER in this list, so these two must precede
            # DATABASE_URL. Same construction as the Airflow env block
            # (helm/fuzeinfra/templates/airflow.yaml).
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.credentialsSecret }}
                  key: {{ .Values.database.userKey }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.credentialsSecret }}
                  key: {{ .Values.database.passwordKey }}
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
          # Both probe paths are unauthenticated in LiteLLM. Do NOT use bare
          # /health — that one requires the master key AND round-trips every
          # configured model to the provider, so it bills real tokens on every
          # kubelet probe.
          #
          # The startupProbe is load-bearing, not boilerplate. LiteLLM imports
          # its whole provider SDK surface before binding the port, and a cold
          # start measured MINUTES on a 4 vCPU node. Without this, liveness
          # (initialDelay 20s + 3x20s) fired at ~80s and the kubelet killed the
          # container mid-boot — "failed liveness probe, will be restarted",
          # exit 137 reason=Error — an infinite restart loop that looks like a
          # crash but is self-inflicted. Liveness/readiness stay disabled until
          # this succeeds, so 60 x 10s allows a 10-minute cold start (which also
          # covers a slow first image pull on a fresh node) while still catching
          # a genuinely wedged process.
          startupProbe:
            httpGet: { path: /health/liveliness, port: http }
            periodSeconds: 10
            failureThreshold: 60
          # No initialDelaySeconds on either of these: the startupProbe already
          # gates them, and adding a delay on top would only slow recovery from
          # a real hang after the app is up.
          livenessProbe:
            httpGet: { path: /health/liveliness, port: http }
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/readiness, port: http }
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml (.Values.resources | default dict) | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: litellm-config
{{- end }}
