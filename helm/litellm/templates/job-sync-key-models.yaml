{{- if .Values.enabled }}
{{- /*
PostSync hook: ensure every virtual key has access to ALL models in model_list.

WHY THIS EXISTS. LiteLLM virtual keys carry an independent `models` allow-list
stored in the database. Adding a model to model_list (values.yaml) does NOT
automatically grant existing keys access to it — the gateway 403s the request
("key not allowed to access model") before the fallback chain ever runs. This
caused a fleet-wide CI deadlock when `claude-opus-4-8` was added: the FUZE_KEY
was provisioned before that model existed and could not reach it.

Setting `models: []` (empty) on a key means "all models". This hook runs after
every sync to enforce that, so a model-list addition never silently breaks a
consumer.

IMAGE CHOICE IS LOAD-BEARING — do not "simplify" this to alpine.
Two earlier revisions of this hook failed for image reasons alone, each costing
a full deploy cycle to discover:
  1. `alpine:3.20` + `apk add --no-cache curl jq` — apk exited 5 (the node
     cannot reach the Alpine package mirrors), and `set -eu` killed the script.
     Output was redirected to /dev/null, so it failed completely silently.
  2. `ghcr.io/jqlang/jq` — a distroless image with ONLY the jq binary. It has
     no shell at all, so `command: ["/bin/sh","-c"]` cannot even start
     ("exec: sh: executable file not found in $PATH").
Reusing the gateway's own image removes the entire class: it is already present
on the node (the Deployment runs it, so there is no pull), and being a Python
image it is guaranteed to have python3. The script below uses ONLY the standard
library — no pip, no apk, no jq, no curl, nothing to install at runtime.

THIS HOOK MUST NEVER FAIL THE SYNC. It is best-effort reconciliation of a
database row, not a deployment step. An earlier revision could exhaust
backoffLimit and leave the whole litellm Application degraded — a broken
reconciler blocking every unrelated prod change. Every failure path below
therefore logs loudly and exits 0.

NO SECRET IS EVER PRINTED. `/key/list` returns the HASHED token, never the
plaintext key, and only its first 8 characters are logged — enough to correlate
a row across runs, useless as a credential. FuzeInfra job logs are public.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-sync-key-models
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-upgrade,post-install
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded
spec:
  ttlSecondsAfterFinished: 600
  # 0 retries: the script already exits 0 on every failure path, so a non-zero
  # exit means the interpreter itself died and retrying will not help.
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "litellm.selectorLabels" . | nindent 8 }}
        job: sync-key-models
    spec:
      restartPolicy: Never
      containers:
        - name: sync
          image: "{{ .Values.image }}:{{ .Values.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["python3", "-c"]
          args:
            - |
              import json, os, sys, time, urllib.error, urllib.request

              BASE = "http://litellm:{{ .Values.port }}"
              KEY = os.environ.get("LITELLM_MASTER_KEY", "")

              print("=== litellm-sync-key-models PostSync hook ===", flush=True)
              print("Target: " + BASE, flush=True)

              def api(path, payload=None, timeout=30):
                  body = json.dumps(payload).encode() if payload is not None else None
                  req = urllib.request.Request(
                      BASE + path,
                      data=body,
                      method="POST" if payload is not None else "GET",
                  )
                  req.add_header("Authorization", "Bearer " + KEY)
                  req.add_header("Content-Type", "application/json")
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      raw = r.read().decode() or "null"
                  return json.loads(raw)

              def bail(msg):
                  # Best-effort reconciler: never fail the Argo sync.
                  print("SKIP: " + msg, flush=True)
                  print("=== hook complete (skipped) ===", flush=True)
                  sys.exit(0)

              if not KEY:
                  bail("LITELLM_MASTER_KEY is empty")

              # --- wait for readiness -------------------------------------------
              ready = False
              for attempt in range(60):
                  try:
                      urllib.request.urlopen(BASE + "/health/readiness", timeout=5).read()
                      ready = True
                      print("LiteLLM ready after " + str(attempt) + " probes.", flush=True)
                      break
                  except Exception:
                      time.sleep(5)
              if not ready:
                  bail("LiteLLM not ready after 5 minutes (will retry next sync)")

              # --- fetch key list -----------------------------------------------
              print("--- Fetching key list ---", flush=True)
              try:
                  resp = api("/key/list?return_full_object=true&size=100")
              except urllib.error.HTTPError as e:
                  bail("/key/list HTTP " + str(e.code) + ": " + e.read().decode()[:300])
              except Exception as e:
                  bail("/key/list failed: " + repr(e))

              if isinstance(resp, dict):
                  keys = resp.get("keys") or resp.get("data") or []
              else:
                  keys = resp or []
              print("Total keys returned: " + str(len(keys)), flush=True)

              # A key may come back as a bare hashed-token string when
              # return_full_object is not honoured; normalise both shapes.
              norm = []
              for k in keys:
                  if isinstance(k, str):
                      norm.append({"token": k, "models": None, "key_alias": None})
                  elif isinstance(k, dict):
                      norm.append(k)
              if not norm:
                  bail("no keys parsed from /key/list response")

              restricted = []
              for k in norm:
                  tok = k.get("token") or k.get("key") or ""
                  models = k.get("models")
                  alias = k.get("key_alias") or k.get("key_name") or "n/a"
                  count = len(models) if isinstance(models, list) else "unknown"
                  # token is a HASH, and only a prefix — safe for a public log.
                  print("  alias=" + str(alias) + " models=" + str(count) +
                        " token_prefix=" + tok[:8], flush=True)
                  if isinstance(models, list) and len(models) > 0:
                      restricted.append((tok, alias))

              if not restricted:
                  print("No keys carry a model restriction. Nothing to do.", flush=True)
                  print("=== hook complete (no-op) ===", flush=True)
                  sys.exit(0)

              # --- clear restrictions -------------------------------------------
              print("--- Clearing restrictions on " + str(len(restricted)) + " key(s) ---", flush=True)
              failures = 0
              for tok, alias in restricted:
                  if not tok:
                      continue
                  try:
                      api("/key/update", {"key": tok, "models": []})
                      print("  OK  alias=" + str(alias) + " token_prefix=" + tok[:8] +
                            " -> models=[] (all models)", flush=True)
                  except urllib.error.HTTPError as e:
                      failures += 1
                      print("  ERR alias=" + str(alias) + " HTTP " + str(e.code) +
                            ": " + e.read().decode()[:300], flush=True)
                  except Exception as e:
                      failures += 1
                      print("  ERR alias=" + str(alias) + ": " + repr(e), flush=True)

              print("=== hook complete (" + str(len(restricted) - failures) + " updated, " +
                    str(failures) + " failed) ===", flush=True)
              sys.exit(0)
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: LITELLM_MASTER_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "10m", memory: "64Mi" }
            limits:   { cpu: "250m", memory: "256Mi" }
{{- end }}
