{{- if .Values.enabled }}
{{- /*
PostSync hook: ensure every virtual key has access to ALL models in model_list.

WHY THIS EXISTS. LiteLLM virtual keys carry an independent `models` allow-list
stored in the database. Adding a model to model_list (values.yaml) does NOT
automatically grant existing keys access to it — the gateway 403s the request
("key not allowed to access model") before the fallback chain ever runs. This
caused a fleet-wide CI deadlock when `claude-opus-4-8` was added: the FUZE_KEY
was provisioned before that model existed and could not reach it.

Setting `models: []` (empty) on a key means "all models". This hook runs after
every sync to enforce that, so a model-list addition never silently breaks a
consumer.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-sync-key-models
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-upgrade,post-install
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "litellm.selectorLabels" . | nindent 8 }}
        job: sync-key-models
    spec:
      restartPolicy: Never
      containers:
        - name: sync
          image: ghcr.io/jqlang/jq:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              BASE="http://litellm:{{ .Values.port }}"

              echo "=== litellm-sync-key-models PostSync hook ==="
              echo "Target: $BASE"
              echo "Image: ghcr.io/jqlang/jq (curl+jq pre-installed, no apk)"

              echo "Waiting for LiteLLM readiness..."
              attempts=0
              until wget -qO /dev/null "$BASE/health/readiness" 2>/dev/null; do
                attempts=$((attempts + 1))
                if [ "$attempts" -ge 60 ]; then
                  echo "LiteLLM not ready after 5 minutes — skipping (will retry next sync)."
                  exit 0
                fi
                sleep 5
              done
              echo "LiteLLM is ready (after $attempts probes)."

<<<<<<< HEAD
