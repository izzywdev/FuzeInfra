{{- if and .Values.enabled .Values.storeModelInDB .Values.database.enabled (gt (len .Values.seedModels) 0) }}
{{- /*
PostSync hook: seed the full model catalog into LiteLLM's database.

Runs after every Argo sync. Idempotent — queries /model/info for existing
model names and only adds models that are missing. Config.yaml models are
also checked (they appear in /model/info too) so a model in both places
doesn't get double-registered.

Requires:
  - storeModelInDB: true  (STORE_MODEL_IN_DB env var)
  - database.enabled: true (Postgres backing store)
  - seedModels list non-empty

Models use `os.environ/<KEY>` references for API keys — the literal string
goes into the DB and LiteLLM resolves it from the pod's env at runtime.
No secret value is ever written to the database in cleartext.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-seed-models
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-upgrade,post-install
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "litellm.selectorLabels" . | nindent 8 }}
        job: seed-models
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache curl jq >/dev/null 2>&1
              BASE="http://litellm:{{ .Values.port }}"

              echo "=== litellm-seed-models PostSync hook ==="
              echo "Target: $BASE"

              echo "Waiting for LiteLLM readiness..."
              attempts=0
              until curl -sf "$BASE/health/readiness" >/dev/null 2>&1; do
                attempts=$((attempts + 1))
                if [ "$attempts" -ge 60 ]; then
                  echo "LiteLLM not ready after 5 minutes — skipping (will retry next sync)."
                  exit 0
                fi
                sleep 5
              done
              echo "LiteLLM is ready (after $attempts probes)."

              # Fetch current model list (both YAML and DB models).
              MODELS_RESP=$(curl -sf \
                -H "Authorization: Bearer $LITELLM_MASTER_KEY" \
                "$BASE/model/info" 2>/dev/null) || {
                echo "WARN: /model/info failed. Skipping model seeding."
                exit 0
              }

              EXISTING=$(echo "$MODELS_RESP" | jq -r '
                (.data // [])[] | .model_name' 2>/dev/null | sort -u)
              echo "Found $(echo "$EXISTING" | grep -c . || echo 0) existing model(s)."

              added=0
              skipped=0

              {{- range .Values.seedModels }}
              # --- {{ .name }} ---
              if echo "$EXISTING" | grep -qx '{{ .name }}'; then
                skipped=$((skipped + 1))
              else
                HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$BASE/model/new" \
                  -H "Authorization: Bearer $LITELLM_MASTER_KEY" \
                  -H "Content-Type: application/json" \
                  -d '{
                    "model_name": "{{ .name }}",
                    "litellm_params": {
                      "model": "{{ .provider }}",
                      "api_key": "os.environ/{{ .keyEnv }}"
                    }
                  }')
                if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
                  echo "  + {{ .name }} (HTTP $HTTP_CODE)"
                  added=$((added + 1))
                else
                  echo "  ! {{ .name }} failed (HTTP $HTTP_CODE)"
                fi
              fi
              {{- end }}

              echo "Seed complete: $added added, $skipped already present."
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: LITELLM_MASTER_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits:   { cpu: "250m", memory: "128Mi" }
{{- end }}
