# =============================================================================
# LiteLLM gateway — Contabo production (k3s, namespace `fuzeinfra`).
# Synced by argocd/applications/litellm.yaml from main.
#
# GATE OPEN. deploy/sealed-secrets/litellm-secret.yaml landed in the same commit
# that flipped this to true, carrying LITELLM_MASTER_KEY, ANTHROPIC_API_KEY and
# OPENAI_API_KEY. Do NOT flip this back to true/false independently of that file:
# enabling without the Secret CrashLoops the pod with CreateContainerConfigError
# (LITELLM_MASTER_KEY is a required secretKeyRef).
#
# KEY PROVENANCE — read before rotating anything:
#   The provider keys are the SAME VALUES as fuzepicker/fuzepicker-backend-secrets,
#   deliberately reused so the gateway could go live without minting new ones.
#   Two consequences:
#     1. All gateway spend bills to that key's provider account — the gateway's
#        per-consumer cost attribution is NOT meaningful until it has its own key.
#     2. Rotating fuzepicker's key silently breaks the gateway until this
#        SealedSecret is re-sealed. They are coupled; treat them as one rotation.
#   Fix by sealing a dedicated key into this same Secret; nothing else changes.
# =============================================================================
enabled: true

replicas: 1

# 4 vCPU / 8 GB nodes: the gateway is I/O-bound (it proxies, it does not infer),
# so keep it small. Raise limits only if you see throttling under real load.
resources:
  requests: { cpu: "250m", memory: "512Mi" }
  limits:   { cpu: "1", memory: "1Gi" }

# Cluster-internal only. No Ingress, no Cloudflare tunnel route, no CF Access
# app — the gateway holds live provider keys and must stay unreachable from
# outside the cluster by construction.
networkPolicy:
  enabled: true
  allowedNamespaces:
    # FuzeFront chat-service + doc indexer (LITELLM_URL, and the indexer's
    # /embeddings calls).
    - fuzefront

# NOTE ON NODE PINNING: FuzeFront's own values-prod.yaml pins a `litellm`
# affinity to node `fuzefront-node-2`. That node does not exist in this cluster
# (Contabo nodes are vmi* / fuzeinfra-elastic-*), and that block belonged to the
# never-templated litellm stanza in their chart. Deliberately NOT carried over —
# pinning to a nonexistent node leaves the pod Pending forever. The gateway is
# stateless; let the scheduler place it.
