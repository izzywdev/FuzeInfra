# =============================================================================
# LiteLLM gateway — Contabo production (k3s, namespace `fuzeinfra`).
# Synced by argocd/applications/litellm.yaml from main.
#
# GATE OPEN. deploy/sealed-secrets/litellm-secret.yaml landed in the same commit
# that flipped this to true, carrying LITELLM_MASTER_KEY, ANTHROPIC_API_KEY and
# OPENAI_API_KEY. Do NOT flip this back to true/false independently of that file:
# enabling without the Secret CrashLoops the pod with CreateContainerConfigError
# (LITELLM_MASTER_KEY is a required secretKeyRef).
#
# KEY PROVENANCE — read before rotating anything:
#   The provider keys are the SAME VALUES as fuzepicker/fuzepicker-backend-secrets,
#   deliberately reused so the gateway could go live without minting new ones.
#   Two consequences:
#     1. All gateway spend bills to that key's provider account — the gateway's
#        per-consumer cost attribution is NOT meaningful until it has its own key.
#     2. Rotating fuzepicker's key silently breaks the gateway until this
#        SealedSecret is re-sealed. They are coupled; treat them as one rotation.
#   Fix by sealing a dedicated key into this same Secret; nothing else changes.
# =============================================================================
enabled: true

replicas: 1

# The gateway is I/O-bound at runtime (it proxies, it does not infer) but the
# LiteLLM image is NOT cheap to START: it imports the full provider SDK surface
# before it serves anything.
#
# MEASURED, NOT GUESSED: a 1Gi limit OOMKilled the container (exit 137) ~17s
# into startup, before it could emit a single log line — 56 restarts in 4h40m.
# The old "keep it small, raise only under load" note was wrong: the ceiling
# that matters here is the import-time peak, which load testing never reveals
# because the process never reaches serving. 3Gi clears it with headroom.
#
# requests stays 512Mi (steady-state RSS is far below the startup peak), so this
# reserves little on the node — limits are a ceiling, not a reservation. Nodes
# are 8 GB and sat at 10-50% when this was set.
resources:
  requests: { cpu: "250m", memory: "512Mi" }
  limits:   { cpu: "1", memory: "3Gi" }

# Postgres backing store — REQUIRED for the admin UI below to work at all.
#
# Without it the console renders and then hangs on its first session call, which
# Cloudflare surfaces as error 522 (see the long note in values.yaml). The
# gateway's PROXYING path never needed a database, which is why it ran fine for
# weeks and only the UI was broken.
#
# `fuzeinfra-postgres` is the shared server in this namespace and `litellm` is a
# dedicated logical database on it, created idempotently by the ensure-database
# initContainer using the same fuzeinfra-secrets credentials Airflow uses.
#
# WATCH THE FIRST ROLLOUT: LiteLLM runs `prisma migrate deploy` at startup once
# DATABASE_URL is set, so the cold start gets slower and a migration failure
# CrashLoops a gateway that FuzeFront's chat-service depends on. The startupProbe
# (60 x 10s) covers the extra time. If it ever does wedge, setting
# `database.enabled: false` here reverts to the previous behaviour — a working
# gateway with a broken UI — in one commit.
database:
  enabled: true

networkPolicy:
  enabled: true
  allowedNamespaces:
    # FuzeFront chat-service + doc indexer (LITELLM_URL, and the indexer's
    # /embeddings calls).
    - fuzefront
    # ARC self-hosted runner pods (`runs-on: staging`). CI agents talk to the
    # gateway instead of holding a provider key: .github/workflows/a2a-maintain.yml
    # points ANTHROPIC_BASE_URL at this Service. Reaching the gateway from INSIDE
    # the cluster is what lets it stay ClusterIP-only — the alternative was a
    # Cloudflare Access service token fronting a service that holds live provider
    # keys. Remove this and a2a-maintain's preflight times out (and says so).
    - arc-runners
    # kube-system (Traefik) is appended automatically by the template because
    # ingress.enabled is true below — do not add it here as well.

# LiteLLM admin UI at https://litellm.prod.fuzefront.com, reached through the
# Cloudflare tunnel and gated by the *.prod email-OTP Access app. The App
# Launcher tile is declared in terraform/contabo/cloudflare.tf
# (local.launcher_services).
#
# No per-host tunnel rule, CNAME or Access app is needed: litellm.prod lands
# under the existing *.prod wildcard, so the catch-all tunnel rule → Traefik,
# the *.prod CNAME and the *.prod OTP app already cover routing, DNS and gating.
#
# Understand what this exposes before changing it: LiteLLM serves the UI and the
# API from one port, so /chat/completions and /embeddings are reachable at this
# hostname too. The gates are Cloudflare Access OTP (admin allowlist) plus
# LITELLM_MASTER_KEY on every API call. Traefik remains ClusterIP; no host port
# is opened.
ingress:
  enabled: true
  className: traefik
  subdomain: litellm
  domain: prod.fuzefront.com

# Authentik SSO for the LiteLLM admin UI.
#
# DELIBERATELY STILL FALSE. deploy/sealed-secrets/litellm-oidc.yaml does not
# exist yet: the value has to be minted by a human and sealed TWICE
# (fuzefront/fuzefront-secrets key LITELLM_CLIENT_SECRET for the IdP side,
# fuzeinfra/litellm-oidc key CLIENT_SECRET for this side) — see
# deploy/sealed-secrets/authentik-oidc-secrets.yaml.template. Enabling first
# gives the pod CreateContainerConfigError, exactly as documented for
# grafana.oidc and kafkaUi.oidc.
#
# Second precondition, and it is not a technical one: upstream makes SSO free
# only up to FIVE users. Confirm the admin roster is within that before
# flipping, or the sixth person's login is a licence failure, not a bug. Full
# note on the `sso` block in values.yaml.
#
# Unlike airflow, this service IS running (replicas: 1), so once the secret
# lands this one can actually be verified end to end.
sso:
  # PAIRED CHANGE - must merge alongside the matching FuzeFront PR. The OIDC
  # client secret is sealed in halves (fuzefront-secrets LITELLM_CLIENT_SECRET
  # on the IdP side, litellm-oidc CLIENT_SECRET here). Landing one without the
  # other leaves the two ends holding different values, and the token exchange
  # then fails as a generic "Invalid credentials" that implicates neither side.
  #
  # ENABLED 2026-08-20. Preconditions met: deploy/sealed-secrets/litellm-oidc.yaml
  # exists (sealed together with the fuzefront-secrets LITELLM_CLIENT_SECRET half),
  # and the admin roster is within upstream's free five-user SSO cap.
  enabled: true
  # Bump when litellm-oidc.yaml is resealed — hashed into the pod annotation so a
  # rotation actually restarts the pod.
  secretRotation: "2026-08-20"

# NOTE ON NODE PINNING: FuzeFront's own values-prod.yaml pins a `litellm`
# affinity to node `fuzefront-node-2`. That node does not exist in this cluster
# (Contabo nodes are vmi* / fuzeinfra-elastic-*), and that block belonged to the
# never-templated litellm stanza in their chart. Deliberately NOT carried over —
# pinning to a nonexistent node leaves the pod Pending forever. The gateway is
# stateless; let the scheduler place it.
