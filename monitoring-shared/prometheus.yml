global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Tempo self-metrics (ingester/compactor/metrics-generator health)
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']

  # otel-collector self-metrics + its prometheus exporter (OTLP metrics apps
  # sent through it)
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
  - job_name: 'otel-collector-exported'
    static_configs:
      - targets: ['otel-collector:8889']

  # Application-specific targets should be configured in the application's own monitoring setup

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb:27017']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379'] 
